<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitcade</title>
<meta name="description" content="Fourteen classic-style arcade games in your browser. Free, no installs, works on phone and keyboard.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="shared/arcade.css">
<style>
/* Lobby: marquee header, then a floor of cabinets. Each cabinet carries its own game colour. */
body{display:block;overflow-x:hidden;
  background:
    radial-gradient(ellipse at 20% -10%,#3a1450 0%,transparent 50%),
    radial-gradient(ellipse at 90% 10%,#0e3350 0%,transparent 45%),
    var(--bg)}
.lobby{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:36px 64px}
.marquee{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-bottom:36px}
.logo{font-family:"Bungee Shade","Bungee",system-ui,sans-serif;font-weight:400;font-size:clamp(52px,13vw,112px);line-height:.95;margin:0;letter-spacing:.02em;
  background:linear-gradient(180deg,#ffe36a 0%,#ff7a3d 45%,#ff3d9a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,90,140,.35))}
.tag{font-family:var(--f-pixel);color:var(--muted);font-size:14px;letter-spacing:.06em;margin:0}
.coin{font-family:var(--f-pixel);font-size:13px;color:#ffe36a;animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.stats{display:flex;gap:10px 24px;flex-wrap:wrap;justify-content:center;font-family:var(--f-pixel);font-size:12px;color:var(--muted);margin-top:6px}
.stats b{color:var(--ink);font-weight:400}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.cab{--c:#fff;position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--bg2);
  border:1px solid var(--line);border-radius:16px 16px 10px 10px;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.cab:hover,.cab:focus-visible{transform:translateY(-4px);border-color:var(--c);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 30%,transparent);outline:none}
.cab-top{padding:12px 14px 10px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,#140f28),#140f28);border-bottom:2px solid var(--c)}
.cab-top h2{font-family:var(--f-marquee);font-weight:400;font-size:19px;margin:0;color:var(--c);text-shadow:0 0 12px color-mix(in srgb,var(--c) 55%,transparent);line-height:1.1;text-wrap:balance}
.cab-top span{font-family:var(--f-pixel);font-size:11px;color:var(--muted)}
.cab-screen{background:#05040c;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);position:relative}
.cab-screen canvas{width:46%;height:auto;image-rendering:pixelated}
.cab-screen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none}
.cab-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.cab-body p{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
.cab-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-pixel);font-size:11px;color:var(--muted)}
.cab-foot b{color:var(--ink);font-weight:400;font-size:13px}
.cab-world{font-family:var(--f-pixel);font-size:11px;color:var(--muted)}
.cab-world b{color:var(--c);font-weight:400;font-size:13px}
.play{background:var(--c);color:#120a1c;border-radius:7px;padding:5px 10px;font-size:11px}
footer{margin-top:44px;text-align:center;color:var(--muted);font-size:13px}
footer p{margin:4px 0}
.reset{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-family:var(--f-pixel);font-size:11px;color:var(--muted);margin-top:10px}
.reset[data-armed="true"]{border-color:#ff4f6d;color:#ff4f6d}
</style>
</head>
<body>
<div class="lobby">
  <header class="marquee">
    <h1 class="logo">BITCADE</h1>
    <p class="tag">FOURTEEN CLASSIC-STYLE GAMES · NO QUARTERS REQUIRED</p>
    <div class="coin" aria-hidden="true">▶ PICK A CABINET ◀</div>
    <div class="stats" id="stats"></div>
  </header>
  <main class="floor" id="floor"></main>
  <footer>
    <p>Works with a keyboard or touch, and most games with a game controller. High scores are saved in this browser.</p>
    <button class="reset" id="reset">Reset all high scores</button>
  </footer>
</div>
<script>
(() => {
const GAMES = [
  { slug: 'neon-noodle', name: 'Neon Noodle', kind: 'Snake', c: '#3dff8f', blurb: 'Eat, grow, and keep your tail out of the way.',
    px: ['............', '..GGGGGG....', '..G....G....', '..G....GGGG.', '..G.......G.', '..GGGGG..GW.', '......G.....', '....P.G.....'],
    px2: ['............', '..GGGGGG....', '..G....G....', '..G....GGGG.', '..G.......G.', '..GGGGG..GG.', '......G...W.', '....P.......'] },
  { slug: 'wallbuster', name: 'Wallbuster', kind: 'Brick breaker', c: '#ff8a3d', blurb: 'Smash the wall with a paddle, a ball, and power-ups.',
    px: ['RRRRRRRRRRRR', 'OOOOOOOOOOOO', 'YYYY.YYYYYYY', 'GGG...GG.GGG', '............', '......W.....', '............', '...OOOOOO...'],
    px2: ['RRRRRRRRRRRR', 'OOOOOOOOOOOO', 'YYYY.YYYYYYY', 'GGG...GG.GGG', '.....W......', '............', '............', '..OOOOOO....'] },
  { slug: 'star-siege', name: 'Star Siege', kind: 'Alien shooter', c: '#5ee7ff', blurb: 'Hold the line against a marching alien fleet.',
    px: ['....CCCC....', '..CCCCCCCC..', '.CC.CCCC.CC.', '.CCCCCCCCCC.', '..C.C..C.C..', '.....W......', '.....C......', '...CCCCC....'],
    px2: ['....CCCC....', '..CCCCCCCC..', '.CC.CCCC.CC.', '.CCCCCCCCCC.', '.C..C..C..C.', '............', '.....C......', '...CCCCC....'] },
  { slug: 'rock-rift', name: 'Rock Rift', kind: 'Asteroid blaster', c: '#c6ff3d', blurb: 'Spin, thrust, and blast drifting rocks to dust.',
    px: ['.......LLL..', '......L...L.', '......L...L.', '.......LLL..', '..W.........', '.LLL........', 'L.L.L.......', '.....W......'],
    px2: ['......LLL...', '.....L...L..', '.....L...L..', '..W...LLL...', '............', '.LLL........', 'L.L.L.......', '.....W......'] },
  { slug: 'stackdown', name: 'Stackdown', kind: 'Falling blocks', c: '#b48cff', blurb: 'Drop, spin and stack. Clear four rows at once.',
    px: ['....VV......', '....VV......', '............', 'C.......YY..', 'CRR.GGG.YYB.', 'CRRGGVVVOBB.', 'COOVVVVVOOB.', 'CVVVVRRVVOBB'],
    px2: ['............', '....VV......', '....VV......', 'C.......YY..', 'CRR.GGG.YYB.', 'CRRGGVVVOBB.', 'COOVVVVVOOB.', 'CVVVVRRVVOBB'] },
  { slug: 'back-alley-brawl', name: 'Back Alley Brawl', kind: 'Street fighter', c: '#ff5a3d', blurb: 'Two fighters, four rivals, best of three rounds.',
    px: ['..SS....SS..', '..BB....OO..', '.BBBB..OOOO.', 'SBBBBSSOOOO.', '.BBBB..OOOO.', '.B..B..O..O.', '.B..B..O..O.', 'KK..KK.KK.KK'],
    px2: ['..SS....SS..', '..BB....OO..', '.BBBBS.OOOO.', 'SBBBB..OOOO.', '.BBBB..OOOO.', '.B..B..O..O.', '.B..B..O..O.', 'KK..KK.KK.KK'] },
  { slug: 'circuit-chase', name: 'Circuit Chase', kind: 'Maze chase', c: '#4fd8ff', blurb: 'Grab every data bit while four viruses hunt you.',
    px: ['NNNNNNNNNNNN', 'N....N.....N', 'N.NN.N.NNN.N', 'N..W...R.y.N', 'N.NN.N.NNN.N', 'N....N.....N', 'NNNNNNNNNNNN', '............'],
    px2: ['NNNNNNNNNNNN', 'N....N.....N', 'N.NN.N.NNN.N', 'N...W...Ry.N', 'N.NN.N.NNN.N', 'N....N.....N', 'NNNNNNNNNNNN', '............'] },
  { slug: 'highrise-handyman', name: 'Highrise Handyman', kind: 'Fix-it climber', c: '#ffc23d', blurb: 'Hammer the windows back while a rock giant wrecks them.',
    px: ['....AAAA....', '....AAAA....', 'BBBBBBBBBBBB', 'BCB.BCB.BKB.', 'BBBBBBBBBBBB', 'BKB.BCBYBCB.', 'BBBBBBBBBBBB', 'BCB.BKB.BCB.'],
    px2: ['...AAAAAA...', '....AAAA....', 'BBBBBBBBBBBB', 'BCB.BCB.BKB.', 'BBBBBBBBBBBB', 'BCB.BCBYBCB.', 'BBBBBBBBBBBB', 'BCB.BKB.BCB.'] },
  { slug: 'nitro-lane', name: 'Nitro Lane', kind: 'Racing', c: '#ff3d7f', blurb: 'Weave through night traffic and keep the tank full.',
    px: ['P.W....W..P.', 'P..YY.....P.', 'P..YY..W..P.', 'P.W.....CCP.', 'P.......CCP.', 'P..PP..W..P.', 'P..PP.....P.', 'P.W....W..P.'],
    px2: ['P.W....W..P.', 'P.W....W..P.', 'P..YY.....P.', 'P..YY..W..P.', 'P.W.....CCP.', 'P..PP...CCP.', 'P..PP..W..P.', 'P.........P.'] },
  { slug: 'volley-duel', name: 'Volley Duel', kind: 'Paddle duel · 2P', c: '#ff7bf0', blurb: 'Bat the ball past a rival: a CPU ladder or a friend.',
    px: ['M.....A.....', 'M..........C', 'M.....A....C', '...W.......C', '......A.....', '............', '......A.....', '............'],
    px2: ['......A.....', '...........C', 'M.....A....C', 'M..........C', 'MW....A.....', '............', '......A.....', '............'] },
  { slug: 'crater-lander', name: 'Crater Lander', kind: 'Lunar lander', c: '#9fb4ff', blurb: 'Feather the thrust and touch down on a narrow pad.',
    px: ['............', '.....EE.....', '....EEEE....', '....E..E....', '............', '............', 'AA...AA.YYYA', 'AAAAAAAAAAAA'],
    px2: ['............', '............', '......EE....', '.....EEEE...', '.....E..E...', '......OO....', 'AA...AA.YYYA', 'AAAAAAAAAAAA'] },
  { slug: 'sky-shield', name: 'Sky Shield', kind: 'Missile defense', c: '#ffe14d', blurb: 'Burst the falling missiles before they reach your cities.',
    px: ['R.........R.', '.R.......R..', '..R.....R...', '...R...R....', '............', '............', '.BB.BB.BB.B.', 'OOOOOOOOOOOO'],
    px2: ['R.........R.', '.R.......R..', '..R.....R...', '...R...YY...', '....R.YYYY..', '.......YY...', '.BB.BB.BB.B.', 'OOOOOOOOOOOO'] },
  { slug: 'hedge-hop', name: 'Hedge Hop', kind: 'Road crossing', c: '#ffb27a', blurb: 'Hop a hedgehog over traffic and logs to its burrow.',
    px: ['GGGGGGGGGGGG', 'BTTTBBBTTTBB', 'BBTTTBBBBTTT', 'GGGGGGGGGGGG', 'KKRKKKKKKCKK', 'KKKKKYYKKKKK', 'GGGGGHGGGGGG', 'GGGGGGGGGGGG'],
    px2: ['GGGGGGGGGGGG', 'TTTBBBTTTBBB', 'TBBTTTBBBBTT', 'GGGGGGGGGGGG', 'KRKKKKKKCKKK', 'KKKKKHYYKKKK', 'GGGGGGGGGGGG', 'GGGGGGGGGGGG'] },
  { slug: 'blip-sports', name: 'Blip Sports', kind: 'LED football + baseball', c: '#ff3a22', blurb: 'The 1978 handheld feel. Pick your team, beat the CPU.', label: 'WINS',
    px: ['............', '.RR..RR..RR.', '............', '.RR..WW..RR.', '............', '.RR..RR..RR.', '............', '............'],
    px2: ['............', '.RR..RR..RR.', '............', '.RR..RWW.RR.', '............', '.RR..RR..RR.', '............', '............'] }
];
const PAL = { G: '#3dff8f', W: '#ffffff', P: '#ff4fa3', R: '#ff4f6d', O: '#ff8a3d', Y: '#ffd23d', C: '#5ee7ff', L: '#c6ff3d', V: '#b48cff', B: '#3d7bff', S: '#e2a978', K: '#222', N: '#4f6bff', A: '#8a92a8', y: '#ffa23d', M: '#ff7bf0', E: '#9fb4ff', T: '#7a4a24', H: '#ffb27a' };
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const floor = document.getElementById('floor');
const paint = (cx, px) => { cx.clearRect(0, 0, 12, 8); px.forEach((row, y) => [...row].forEach((ch, x) => { if (PAL[ch]) { cx.fillStyle = PAL[ch]; cx.fillRect(x, y, 1, 1); } })); };
/** #1 entry of a game's top-10 table, if it has real initials. */
const leader = slug => { try { const t = JSON.parse(get('arcade:top:' + slug)); return Array.isArray(t) && t[0] && /^[A-Z]{3}$/.test(t[0].n) ? t[0].n : ''; } catch (e) { return ''; } };
let total = 0, played = 0;
const screens = [];
GAMES.forEach(g => {
  const best = +get('arcade:best:' + g.slug) || 0, plays = +get('arcade:plays:' + g.slug) || 0;
  if (plays || best) played++; total += plays;
  const who = best ? leader(g.slug) : '';
  const a = document.createElement('a');
  a.className = 'cab'; a.href = `games/${g.slug}/`; a.style.setProperty('--c', g.c);
  a.innerHTML = `<div class="cab-top"><h2></h2><span></span></div><div class="cab-screen"><canvas width="12" height="8"></canvas></div>
    <div class="cab-body"><p></p><div class="cab-world" hidden>WORLD #1 <b></b></div><div class="cab-foot"><span>${g.label || 'BEST'} <b>${who ? who + ' ' : ''}${best ? best.toLocaleString() : '—'}</b></span><span class="play">PLAY ▶</span></div></div>`;
  a.querySelector('h2').textContent = g.name; a.querySelector('.cab-top span').textContent = g.kind.toUpperCase(); a.querySelector('p').textContent = g.blurb;
  const cx = a.querySelector('canvas').getContext('2d');
  paint(cx, g.px); screens.push({ cx, g, f: 0 });
  floor.appendChild(a);
  g.el = a;
});
// World #1 for each cabinet from the online leaderboard. The lobby works the same without it.
import('./shared/world.js').then(w => GAMES.filter(g => !g.label).forEach(g => w.top(g.slug, 1).then(([e]) => {
  if (!e || !/^[A-Z]{3}$/.test(e.n)) return;
  const row = g.el.querySelector('.cab-world'); row.querySelector('b').textContent = `${e.n} ${(+e.s || 0).toLocaleString()}`; row.hidden = false;
}, () => {})), () => {});
// Attract mode: each cabinet flips between its two frames, out of step with its neighbours.
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => {
  if (document.hidden) return;
  const now = performance.now();
  screens.forEach((s, i) => { const f = Math.floor((now + i * 170) / 520) % 2; if (f !== s.f) { s.f = f; paint(s.cx, f ? s.g.px2 : s.g.px); } });
}, 60);
document.getElementById('stats').innerHTML = `<span>CABINETS <b>${GAMES.length}</b></span><span>TRIED <b>${played}</b></span><span>GAMES PLAYED <b>${total}</b></span>`;
const reset = document.getElementById('reset');
reset.addEventListener('click', () => {
  if (reset.dataset.armed !== 'true') { reset.dataset.armed = 'true'; reset.textContent = 'Click again to erase every score'; setTimeout(() => { reset.dataset.armed = 'false'; reset.textContent = 'Reset all high scores'; }, 4000); return; }
  try { Object.keys(localStorage).filter(k => /^arcade:(best|plays|top|daily):/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  location.reload();
});
})();
</script>
</body>
</html>
