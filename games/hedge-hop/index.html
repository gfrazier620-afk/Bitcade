  <p class="help"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> hop · <kbd>P</kbd> pause · swipe or tap on phones</p>
</main>

<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const COLS = 13, ROWS = 13, T = 40, HUD = 36, W = COLS * T, H = ROWS * T + HUD, LW = COLS + 6, ctx = A.canvas(cv, W, H);
const BURROWS = [2, 4, 6, 8, 10], START = { x: 6, y: 12 }, TIME = 30;
// Rows 1-5 are the stream (ride logs and leaf rafts), row 6 is the verge, rows 7-11 are the road.
const LANES = [
  { row: 1, kind: 'log', dir: 1, sp: 1.3, len: 4, n: 3 }, { row: 2, kind: 'leaf', dir: -1, sp: 1.1, len: 3, n: 3 },
  { row: 3, kind: 'log', dir: 1, sp: 1.6, len: 5, n: 2 }, { row: 4, kind: 'log', dir: 1, sp: 0.9, len: 3, n: 3 },
  { row: 5, kind: 'leaf', dir: -1, sp: 1.0, len: 2, n: 4 },
  { row: 7, kind: 'truck', dir: -1, sp: 1.0, len: 3, n: 2 }, { row: 8, kind: 'van', dir: 1, sp: 1.2, len: 2, n: 3 },
  { row: 9, kind: 'car', dir: -1, sp: 2.2, len: 1, n: 2 }, { row: 10, kind: 'tractor', dir: 1, sp: 0.8, len: 1, n: 3 },

const CARS = ['#ff4f6d', '#5ee7ff', '#ffd23d', '#b48cff', '#3dff8f'];
let state = 'title', hog = { ...START, hop: 0, fx: 6, fy: 12, face: 'up' }, objs = [], homes = [], score = 0, lives = 3, level = 1, timeLeft = TIME, best = 12, deadT = 0, berry = null, berryT = 8, msg = '', msgT = 0, nextLife = 10000;
const isStream = y => y >= 1 && y <= 5, isRoad = y => y >= 7 && y <= 11;

function buildLanes() {

}
buildLanes(); // scenery for the title screen
const speed = l => l.sp * (1 + (level - 1) * 0.12);
function newGame() { score = 0; lives = A.easy ? 5 : 3; level = 1; nextLife = 10000; A.setScore(0); homes = BURROWS.map(() => false); buildLanes(); respawn(); state = 'play'; say('GET HOME!'); A.jingle([392, 523, 659, 784], 0.08); }
function respawn() { hog = { ...START, hop: 0, fx: START.x, fy: START.y, face: 'up' }; timeLeft = TIME; best = START.y; }
function say(t) { msg = t; msgT = 1.6; }
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play' }); }

const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
function hop(d) {
  if (state !== 'play' || hog.hop > 0) return;

  if (ny === 0) arrive();

A.onPress(c => { if (c === 'KeyP' || c === 'Escape') return pause(); if (KEYS[c]) hop(KEYS[c]); });
A.swipe(cv, d => hop(d === 'tap' ? 'up' : d));
A.onHide(pause);

  BURROWS.forEach((b, i) => {

    else if (berry && berry.i === i) { const by = T / 2 + 6 + Math.sin(t / 200) * 2; ctx.fillStyle = '#0a0612'; ctx.beginPath(); ctx.arc(cx, by, 8, 0, 6.29); ctx.fill(); const g = ctx.createRadialGradient(cx - 2, by - 2, 1, cx, by, 7); g.addColorStop(0, '#ffb0c0'); g.addColorStop(1, '#c81a3a'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, by, 6.5, 0, 6.29); ctx.fill(); ctx.fillStyle = '#3dff8f'; ctx.fillRect(cx - 1, by - 11, 2, 5); }
  });

    else if (o.l.kind === 'leaf') {
      const sub = submerged(o, clock), warn = o.dip && ((clock + o.ph) % 6) > 4.1;
      ctx.globalAlpha = sub ? 0.18 : warn && Math.floor(t / 120) % 2 ? 0.55 : 1;
      for (let i = 0; i < o.l.len; i++) drawPad(x + i * T + T / 2, y + T / 2, i + o.ph);

  for (let i = 0; i < 3; i++) { const bx = (i * 173 + t / 18 + Math.sin(t / 700 + i) * 40) % (W + 40) - 20, by = (i === 0 ? 6 : 12) * T + 12 + Math.sin(t / 300 + i * 2) * 8, fl = Math.abs(Math.sin(t / 60 + i)); ctx.fillStyle = ['#ffd23d', '#ff7bf0', '#5ee7ff'][i]; ctx.beginPath(); ctx.ellipse(bx - 3, by, 3 * fl + 0.5, 3, 0, 0, 6.29); ctx.ellipse(bx + 3, by, 3 * fl + 0.5, 3, 0, 0, 6.29); ctx.fill(); ctx.fillStyle = '#0a0612'; ctx.fillRect(bx - 0.5, by - 2, 1, 4); }
  { const dx = W / 2 + Math.sin(t / 1300) * W * 0.4 + Math.sin(t / 210) * 6, dy = 3.5 * T + Math.sin(t / 900) * T * 1.6; ctx.fillStyle = '#3dd6ff'; ctx.fillRect(dx - 6, dy - 1, 12, 2); ctx.fillStyle = 'rgba(220,240,255,.55)'; const fw = Math.sin(t / 25) > 0 ? 3 : 1; ctx.beginPath(); ctx.ellipse(dx - 1, dy - fw, 4, fw, 0.3, 0, 6.29); ctx.ellipse(dx - 1, dy + fw, 4, fw, -0.3, 0, 6.29); ctx.fill(); }
  if (state !== 'title') {
    const k = hog.hop > 0 ? 1 - hog.hop / 0.12 : 1, hx = (hog.fx + (hog.x - hog.fx) * k) * T + T / 2, hy = (hog.fy + (hog.y - hog.fy) * k) * T + T / 2 - Math.sin(k * Math.PI) * 8;
    if (state === 'dying') { ctx.globalAlpha = Math.floor(t / 90) % 2 ? 0.35 : 1; ctx.save(); ctx.translate(hx, hy); ctx.scale(1.3, 0.55); drawHog(0, 0, hog.face, 1); ctx.restore(); ctx.globalAlpha = 1; } // flattened
    else { ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(hx, (hog.fy + (hog.y - hog.fy) * k) * T + T / 2 + 12, 11, 4, 0, 0, 6.29); ctx.fill(); drawHog(hx, hy, hog.face, 1, hog.hop > 0); }
  } else drawHog(6 * T + T / 2, 12 * T + T / 2 - Math.abs(Math.sin(t / 300)) * 8, 'up', 1);
  // HUD

  ctx.font = '13px Silkscreen, monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#f4effd'; ctx.fillText('LEVEL ' + level, 10, hy + 23);
  for (let i = 0; i < lives - 1; i++) drawHog(110 + i * 24, hy + 18, 'up', 0.55);
  if (state !== 'title') { ctx.fillStyle = '#0a0612'; ctx.fillRect(W - 172, hy + 10, 124, 16); ctx.fillStyle = '#2a2148'; ctx.fillRect(W - 170, hy + 12, 120, 12); const tg = ctx.createLinearGradient(0, hy + 12, 0, hy + 24); tg.addColorStop(0, timeLeft < 8 ? '#ff8a9a' : '#ffd0a8'); tg.addColorStop(1, timeLeft < 8 ? '#c81a3a' : '#e07a3a'); ctx.fillStyle = tg; ctx.fillRect(W - 170, hy + 12, 120 * Math.max(0, timeLeft) / TIME, 12); ctx.fillStyle = '#a39bc4'; ctx.textAlign = 'right'; ctx.fillText('TIME', W - 10, hy + 23); }
  if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT * 2); ctx.font = '24px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#0a0612'; ctx.fillText(msg, W / 2 + 2, 6 * T + 32); ctx.fillStyle = '#fff'; ctx.shadowColor = '#ffb27a'; ctx.shadowBlur = 12; ctx.fillText(msg, W / 2, 6 * T + 30); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
});

/* ---------- art ---------- */
/** Lighten (k > 0) or darken (k < 0) a #rgb / #rrggbb colour. */
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;

// everything that doesn't move, drawn once: the hedge with its burrows, the river, the lawn verges and the road
const ground = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  let s = 4; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let row = 0; row < ROWS; row++) {
    const y = row * T;
    if (isStream(row)) { const g = x.createLinearGradient(0, y, 0, y + T); g.addColorStop(0, row === 3 ? '#143e6c' : '#1a4a7e'); g.addColorStop(1, row === 3 ? '#0e2c52' : '#123662'); x.fillStyle = g; x.fillRect(0, y, W, T); x.fillStyle = 'rgba(0,0,0,.08)'; for (let i = 0; i < 12; i++) { x.beginPath(); x.ellipse(r() * W, y + r() * T, 20 + r() * 30, 4, 0, 0, 6.29); x.fill(); } }

      for (let i = 0; i < 60; i++) { x.fillStyle = r() < 0.5 ? '#2e2c38' : '#1e1c26'; x.fillRect(r() * W, y + r() * T, 2, 2); }

      if (row !== 0) for (let i = 0; i < 4; i++) { const px = r() * W, py = y + 8 + r() * (T - 16); x.fillStyle = ['#fff', '#ffd23d', '#ff7bf0'][i % 3]; x.fillRect(px, py, 2, 2); x.fillRect(px + 2, py + 1, 2, 2); }

  }

  x.fillStyle = '#0a0612'; x.fillRect(0, 12 * T + 30, W, 3); x.fillStyle = '#a8885a'; x.fillRect(0, 12 * T + 30, W, 2);
  { const row = 0;
  }
