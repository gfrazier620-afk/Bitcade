<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nitro Lane</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preload" href="../../shared/fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="../../shared/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="nitro-lane" data-pad="0:ArrowUp 1:ArrowDown 2:Space 5:Space 6:ArrowDown 7:ArrowUp" style="--game:#ff3d7f">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>NITRO LANE</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="ab"><button data-k="ArrowLeft" aria-label="Steer left">◀</button><button data-k="ArrowRight" aria-label="Steer right">▶</button></div>
    <div class="ab"><button class="sm" data-k="ArrowDown">BRAKE</button><button class="sm" data-k="Space">NITRO</button><button data-k="ArrowUp">GAS</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>→</kbd> steer · <kbd>↑</kbd> gas · <kbd>↓</kbd> brake · <kbd>Space</kbd> nitro · <kbd>P</kbd> pause</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const W = 400, H = 640, ctx = A.canvas(cv, W, H);
const RL = 50, RR = 350, LANES = 4, LW = (RR - RL) / LANES;
const laneX = l => RL + LW * (l + 0.5);
const CARCOL = ['#3de7ff', '#ffd23d', '#9dff4f', '#b48cff', '#ff8a3d', '#ffffff'];
let state = 'title', car, traffic, items, parts, score, dist, lives, fuel, nitro, scroll, spawnT, itemT, msg, msgT, engT = 0, overT = 0;

function newGame() {
  car = { x: laneX(1.5), y: 520, speed: 260, spin: 0, inv: 1.5, boost: 0 };
  traffic = []; items = []; parts = []; score = 0; dist = 0; lives = A.easy ? 5 : 3; fuel = 100; nitro = 2; scroll = 0; spawnT = 0.8; itemT = 4; overT = 0;
  A.setScore(0); state = 'play'; lastLevel = 1; say('GO!'); A.jingle([392, 392, 784], 0.18);
}
function say(t) { msg = t; msgT = 1.3; }
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play' }); }
let drag = null;
cv.addEventListener('pointerdown', e => { A.unlock(); drag = A.pointer(cv, e).x; });
cv.addEventListener('pointermove', e => { if (drag != null) drag = A.pointer(cv, e).x; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => drag = null));
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();
  if (state === 'play' && (c === 'Space' || c === 'KeyN') && nitro > 0 && car.boost <= 0 && car.spin <= 0) { nitro--; car.boost = 3; A.badge('nitro'); A.tone(200, 0.8, 'sawtooth', 0.05, 0, 900); say('NITRO!'); }
});
A.onHide(pause);
const level = () => 1 + Math.floor(dist / 4000);
function update(dt) {
  if (parts) { parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; }); parts = parts.filter(p => p.t > 0); }
  if (msgT > 0) msgT -= dt;
  if (state !== 'play') { scroll += 120 * dt; return; }
  // final-crash countdown runs on game time, so pausing can't skip it
  if (overT > 0) { overT -= dt; if (overT <= 0) return gameOver('WRECKED'); }
  // speed
  const gas = A.held('ArrowUp', 'KeyW'), brake = A.held('ArrowDown', 'KeyS');
  const top = car.boost > 0 ? 640 : 460;
  if (car.spin > 0) { car.spin -= dt; car.speed = Math.max(60, car.speed - 500 * dt); }
  else if (fuel <= 0) car.speed = Math.max(0, car.speed - 150 * dt);
  else if (car.boost > 0) car.speed = Math.min(top, car.speed + 600 * dt);
  else if (gas) car.speed = Math.min(top, car.speed + 220 * dt);
  else if (brake) car.speed = Math.max(120, car.speed - 380 * dt);
  else car.speed += (260 - car.speed) * Math.min(1, dt * 0.8);
  car.boost = Math.max(0, car.boost - dt); car.inv = Math.max(0, car.inv - dt);
  // steering
  let steer = (A.held('ArrowRight', 'KeyD') ? 1 : 0) - (A.held('ArrowLeft', 'KeyA') ? 1 : 0);
  if (drag != null) steer = A.clamp((drag - car.x) / 30, -1, 1);
  if (car.spin <= 0) car.x += steer * (180 + car.speed * 0.25) * dt;
  car.x = A.clamp(car.x, RL + 16, RR - 16);
  // distance, fuel
  const d = car.speed * dt; dist += d; scroll += d;
  if (dist >= 5000) A.badge('km5');
  if (level() !== lastLevel) { lastLevel = level(); if (lastLevel > 1) say(lastLevel % 2 ? 'DOWNTOWN' : 'COAST ROAD'); }
  fuel = Math.max(0, fuel - dt * (2.2 + car.speed / 300));
  score = Math.floor(dist / 10) + bonus; A.setScore(score);
  if (fuel <= 0 && car.speed <= 1) return gameOver('OUT OF FUEL');
  // spawn traffic
  spawnT -= dt * (car.speed / 260);
  if (spawnT <= 0) {
    spawnT = Math.max(0.35, 1.25 - level() * 0.1) * A.rand(0.6, 1.3);
    const lane = A.rnd(LANES), truck = Math.random() < 0.18;
    if (!traffic.some(t => t.lane === lane && t.y < 60)) traffic.push({ lane, x: laneX(lane), y: -90, v: truck ? A.rand(110, 150) : A.rand(150, 240), truck, col: A.pick(CARCOL), shift: 0, passed: false });
  }
  itemT -= dt;
  if (itemT <= 0) { itemT = A.rand(4, 7); items.push({ x: laneX(A.rnd(LANES)), y: -40, k: fuel < 40 || Math.random() < 0.7 ? 'fuel' : 'nitro' }); }
  // move traffic (relative)
  for (const t of traffic) {
    t.y += (car.speed - t.v) * dt;
    if (Math.random() < dt * 0.15 && !t.shift && level() >= 2) { const nl = t.lane + (Math.random() < 0.5 ? -1 : 1); if (nl >= 0 && nl < LANES) { t.lane = nl; t.shift = 1; } }
    t.x += (laneX(t.lane) - t.x) * Math.min(1, dt * 2.5); if (Math.abs(laneX(t.lane) - t.x) < 1) t.shift = 0;
    const len = t.truck ? 78 : 50;
    if (!t.passed && t.y - len / 2 > car.y + 30) { t.passed = true; const near = Math.abs(t.x - car.x) < 50; if (near) { A.badge('close'); bonus += 50; say('CLOSE CALL +50'); A.tone(1200, 0.06, 'square', 0.03); } }
    if (car.inv <= 0 && car.spin <= 0 && Math.abs(t.x - car.x) < 30 && Math.abs(t.y - car.y) < (len / 2 + 26)) crash(t);
  }
  traffic = traffic.filter(t => t.y < H + 120 && t.y > -300);
  for (const it of items) {
    it.y += car.speed * dt;
    if (Math.abs(it.x - car.x) < 28 && Math.abs(it.y - car.y) < 34) { it.got = true; if (it.k === 'fuel') { fuel = Math.min(100, fuel + 35); say('FUEL +35'); } else { nitro = Math.min(5, nitro + 1); say('+1 NITRO'); } bonus += 25; A.jingle([660, 880, 1100], 0.05); }
  }
  items = items.filter(i => !i.got && i.y < H + 40);
  if (car.boost > 0 || gas) parts.push({ x: car.x + A.rand(-6, 6), y: car.y + 34, vx: A.rand(-20, 20), vy: 160, t: 0.3, c: car.boost > 0 ? '#5ee7ff' : '#ff8a3d' });
  engT -= dt; if (engT <= 0) { engT = 0.09; A.tone(50 + car.speed * 0.25, 0.1, 'sawtooth', 0.012); }
}
let bonus = 0, lastLevel = 1;
function crash(t) {
  lives--; car.spin = 1.2; car.inv = 2.6; car.speed *= 0.4; A.noise(0.6, 0.12); A.tone(120, 0.5, 'square', 0.06, 0, 40);
  t.y -= 40; for (let i = 0; i < 24; i++) { const a = Math.random() * 6.28, s = A.rand(60, 240); parts.push({ x: car.x, y: car.y - 20, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: A.rand(0.3, 0.8), c: A.pick(['#ffd23d', '#ff8a3d', '#fff']) }); }
  if (lives <= 0) overT = 0.9; else say(`${lives} CAR${lives > 1 ? 'S' : ''} LEFT`);
}
function gameOver(why) {
  if (state !== 'play') return; state = 'over'; const rec = A.submit(score);
  A.overlay({ title: why, big: `SCORE ${score} · ${(dist / 1000).toFixed(1)} KM`, sub: rec ? 'New high score!' : `Best: ${A.best()}`, btn: 'Race again', onGo: () => { bonus = 0; newGame(); } });
}
/** Lighten (k > 0) or darken (k < 0) a #rgb / #rrggbb colour. */
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;

/*
 * A car seen from above, front pointing up: headlight beams ahead and taillights behind (it's night), a dark outline,
 * a body shaded round across its width, windshield with a reflection, roof, mirrors and wheels. Long ones are trucks.

function drawCar(x, y, col, len, rot, player) {

  const w = 32, h = len, top = -h / 2, bot = h / 2, truck = len > 60;
  // headlight beams and taillight glow
  const beam = ctx.createLinearGradient(0, top, 0, top - (player ? 110 : 70));
  beam.addColorStop(0, `rgba(255,246,194,${player ? 0.28 : 0.14})`); beam.addColorStop(1, 'rgba(255,246,194,0)');
  ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(-w / 2 + 3, top); ctx.lineTo(w / 2 - 3, top); ctx.lineTo(w / 2 + 16, top - (player ? 110 : 70)); ctx.lineTo(-w / 2 - 16, top - (player ? 110 : 70)); ctx.fill();
  ctx.fillStyle = 'rgba(255,42,42,.22)'; ctx.beginPath(); ctx.ellipse(0, bot + 4, w * 0.6, 8, 0, 0, Math.PI * 2); ctx.fill();
  // shadow, wheels, outline
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.roundRect(-w / 2 + 3, top + 6, w, h, 8); ctx.fill();
  const axles = truck ? [top + 8, top + 30, bot - 18] : [top + 7, bot - 17];
  for (const a of axles) for (const sx of [-w / 2 - 3, w / 2 - 3]) { ctx.fillStyle = '#07050d'; ctx.fillRect(sx, a, 6, 12); ctx.fillStyle = '#5a5866'; ctx.fillRect(sx + 2, a + 3, 2, 6); }
  ctx.fillStyle = '#07050d'; ctx.beginPath(); ctx.roundRect(-w / 2 - 2, top - 2, w + 4, h + 4, 9); ctx.fill();
  // body, shaded round across its width
  const body = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  body.addColorStop(0, shade(col, -0.45)); body.addColorStop(0.22, col); body.addColorStop(0.5, shade(col, 0.22)); body.addColorStop(0.78, col); body.addColorStop(1, shade(col, -0.45));
  if (truck) {
    const trailer = '#d8d2e8', tg = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    tg.addColorStop(0, shade(trailer, -0.4)); tg.addColorStop(0.5, shade(trailer, 0.15)); tg.addColorStop(1, shade(trailer, -0.4));
    ctx.fillStyle = body; ctx.beginPath(); ctx.roundRect(-w / 2, top, w, 22, [7, 7, 2, 2]); ctx.fill();          // cab
    ctx.fillStyle = 'rgba(14,18,40,.92)'; ctx.fillRect(-w / 2 + 5, top + 5, w - 10, 7);                           // cab windshield
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(-w / 2 + 7, top + 6, 8, 2);
    ctx.fillStyle = tg; ctx.fillRect(-w / 2, top + 24, w, h - 24);                                                 // trailer
    ctx.fillStyle = 'rgba(0,0,0,.14)'; for (let ry = top + 30; ry < bot - 2; ry += 7) ctx.fillRect(-w / 2 + 2, ry, w - 4, 1.5);
    ctx.fillStyle = shade(col, -0.2); ctx.fillRect(-w / 2 + 2, top + 26, w - 4, 3);                               // company stripe
  } else {
    if (player) { ctx.shadowColor = col; ctx.shadowBlur = 16; }
    ctx.fillStyle = body; ctx.beginPath(); ctx.roundRect(-w / 2, top, w, h, 7); ctx.fill(); ctx.shadowBlur = 0;
    const ws = top + 12, roofEnd = bot - 13;
    ctx.fillStyle = 'rgba(14,18,40,.92)'; ctx.beginPath(); ctx.moveTo(-w / 2 + 4, ws + 8); ctx.lineTo(-w / 2 + 7, ws); ctx.lineTo(w / 2 - 7, ws); ctx.lineTo(w / 2 - 4, ws + 8); ctx.fill(); // windshield
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.moveTo(-w / 2 + 8, ws + 6); ctx.lineTo(-w / 2 + 11, ws + 1); ctx.lineTo(-w / 2 + 15, ws + 1); ctx.lineTo(-w / 2 + 12, ws + 6); ctx.fill(); // reflection
    ctx.fillStyle = shade(col, 0.1); ctx.fillRect(-w / 2 + 6, ws + 9, w - 12, roofEnd - ws - 12);                // roof
    ctx.fillStyle = 'rgba(14,18,40,.85)'; ctx.fillRect(-w / 2 + 7, roofEnd - 3, w - 14, 5);                        // rear window
    ctx.fillStyle = shade(col, -0.35); ctx.fillRect(-w / 2 - 3, ws + 2, 3, 4); ctx.fillRect(w / 2, ws + 2, 3, 4);   // mirrors
    if (player) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(-4, top + 2, 3, h - 6); ctx.fillRect(2, top + 2, 3, h - 6); } // racing stripes
  }
  // lights
  ctx.fillStyle = '#fff6c2'; ctx.fillRect(-w / 2 + 3, top, 6, 3); ctx.fillRect(w / 2 - 9, top, 6, 3);
  ctx.fillStyle = '#ff2a2a'; ctx.shadowColor = '#ff2a2a'; ctx.shadowBlur = 8; ctx.fillRect(-w / 2 + 3, bot - 3, 6, 3); ctx.fillRect(w / 2 - 9, bot - 3, 6, 3); ctx.shadowBlur = 0;
  ctx.restore();
}
/* ---------- the world: asphalt, the roadsides (downtown rooftops or the coast), streetlights ---------- */
const OUT = '#07050d', SEG = 96;
const sprite = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };
const ASPHALT = sprite(RR - RL, 256, (x, w, h) => {
  x.fillStyle = '#1e1b2a'; x.fillRect(0, 0, w, h);
  let s = 3; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 1400; i++) { x.fillStyle = r() < 0.5 ? 'rgba(255,255,255,.035)' : 'rgba(0,0,0,.18)'; x.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2); }
  for (let l = 0; l < LANES; l++) for (const dx of [-9, 9]) { x.fillStyle = 'rgba(0,0,0,.16)'; x.fillRect(l * LW + LW / 2 + dx - 4, 0, 8, h); } // worn tyre tracks
  for (let i = 0; i < 3; i++) { x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 1.5; x.beginPath(); let px = r() * w, py = r() * h; x.moveTo(px, py); for (let k = 0; k < 4; k++) { px += (r() - 0.5) * 30; py += 10 + r() * 14; x.lineTo(px, py); } x.stroke(); } // cracks
  x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.ellipse(w * 0.63, 170, 11, 11, 0, 0, 6.29); x.fill(); x.strokeStyle = 'rgba(255,255,255,.08)'; x.lineWidth = 1; for (let k = -8; k <= 8; k += 4) { x.beginPath(); x.moveTo(w * 0.63 - 9, 170 + k); x.lineTo(w * 0.63 + 9, 170 + k); x.stroke(); } // a manhole
});
const hash = (k, s) => { let h = (k * 374761393 + s * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const ROOFS = ['#3a2a52', '#2a3550', '#4a2a3a', '#2e3a3a', '#3a3446'], NEON = ['#ff3d7f', '#5ee7ff', '#ffd23d', '#9dff4f', '#b48cff'];
const theme = () => (car ? level() : 1) % 2 ? 'city' : 'coast';
/** One side of the road for segment k: x0..x1 is the strip, toRoad says which edge faces the road. */
function sideSegment(k, side, y, t, th) {
  const x0 = side < 0 ? 0 : RR + 6, x1 = side < 0 ? RL - 6 : W, w = x1 - x0, edge = side < 0 ? x1 : x0, h1 = hash(k, side + 3), h2 = hash(k, side + 11);

  const pw = 9, px = side < 0 ? x1 - pw : x0;
  if (th === 'city') {
    ctx.fillStyle = '#4a4458'; ctx.fillRect(px, y, pw, SEG); ctx.fillStyle = 'rgba(0,0,0,.2)'; for (let j = 0; j < SEG; j += 12) ctx.fillRect(px, y + j, pw, 1);
    const bx = side < 0 ? x0 : x0 + pw, bw = w - pw, alley = h1 < 0.18;
    if (alley) { ctx.fillStyle = '#16121e'; ctx.fillRect(bx, y, bw, SEG); ctx.fillStyle = '#3a6a3a'; ctx.fillRect(bx + 6, y + 30, 10, 14); ctx.fillStyle = '#5a5a6a'; ctx.fillRect(bx + 20, y + 60, 12, 8); return; }

    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, shade(roof, side < 0 ? -0.25 : 0.12)); g.addColorStop(1, shade(roof, side < 0 ? 0.12 : -0.25));
    ctx.fillStyle = g; ctx.fillRect(bx, y + gap, bw, SEG - gap * 2);
    ctx.strokeStyle = shade(roof, 0.3); ctx.lineWidth = 2; ctx.strokeRect(bx + 3, y + gap + 3, bw - 6, SEG - gap * 2 - 6); // the parapet
    // rooftop clutter: AC units, a water tank, a skylight
    if (h1 > 0.5) { ctx.fillStyle = OUT; ctx.fillRect(bx + 8, y + 16, 14, 12); ctx.fillStyle = '#8a8ea0'; ctx.fillRect(bx + 9, y + 17, 12, 10); ctx.strokeStyle = '#4a4e60'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(bx + 15, y + 22, 3.5, 0, 6.29); ctx.stroke(); }

      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; for (let j = 0; j < 3; j++) { const wy = y + j * 32 + ((t / 40) % 32); ctx.beginPath(); ctx.moveTo(bx + bw * 0.55, wy); ctx.quadraticCurveTo(bx + bw * 0.7, wy + 6, bx + bw * 0.72, wy + 14); ctx.stroke(); }
    } else { ctx.fillStyle = '#d8b878'; ctx.fillRect(bx, y, bw, SEG); ctx.fillStyle = 'rgba(160,120,60,.3)'; for (let j = 0; j < 8; j++) ctx.fillRect(bx + hash(k, j) * bw, y + hash(k, j + 9) * SEG, 2, 2); }

      ctx.fillStyle = '#6a4a2a'; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 6.29); ctx.fill();
    } else if (side > 0) { // a beach umbrella
      const cx = bx + bw * 0.5, cy = y + SEG * 0.5; for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? '#fff' : NEON[k % NEON.length]; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, 13, i * Math.PI / 4, (i + 1) * Math.PI / 4); ctx.fill(); } ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, 13, 0, 6.29); ctx.stroke();
    }
  }
}
function world(t) {
  const th = theme();

A.loop(update, draw);
/* Attract demo: pick the lane with the most road ahead (fuel cans welcome), brake if boxed in. */
A.attract({
  start: () => { bonus = 0; newGame(); },
  stop: () => { state = 'title'; },
  bot: () => {
    if (state !== 'play' || !car) return [];
    const clear = l => { const x = laneX(l); let d = 1e9; for (const t of traffic) if (Math.abs(t.x - x) < 34 && t.y < car.y + 40) d = Math.min(d, car.y - t.y); return d; };

      if (v > bv) { bv = v; best = l; }

    if (Math.abs(dx) > 8) keys.push(dx > 0 ? 'ArrowRight' : 'ArrowLeft');
