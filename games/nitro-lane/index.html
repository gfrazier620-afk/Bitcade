<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nitro Lane</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="nitro-lane" data-pad="0:ArrowUp 1:ArrowDown 2:Space 5:Space 6:ArrowDown 7:ArrowUp" style="--game:#ff3d7f">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>NITRO LANE</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="ab"><button data-k="ArrowLeft" aria-label="Steer left">◀</button><button data-k="ArrowRight" aria-label="Steer right">▶</button></div>
    <div class="ab"><button class="sm" data-k="ArrowDown">BRAKE</button><button class="sm" data-k="Space">NITRO</button><button data-k="ArrowUp">GAS</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>→</kbd> steer · <kbd>↑</kbd> gas · <kbd>↓</kbd> brake · <kbd>Space</kbd> nitro · <kbd>P</kbd> pause</p>
</main>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const W = 400, H = 640, ctx = A.canvas(cv, W, H);
const RL = 50, RR = 350, LANES = 4, LW = (RR - RL) / LANES;
const laneX = l => RL + LW * (l + 0.5);
const CARCOL = ['#3de7ff', '#ffd23d', '#9dff4f', '#b48cff', '#ff8a3d', '#ffffff'];
let state = 'title', car, traffic, items, parts, score, dist, lives, fuel, nitro, scroll, spawnT, itemT, msg, msgT, engT = 0, overT = 0;

function newGame() {
  car = { x: laneX(1.5), y: 520, speed: 260, spin: 0, inv: 1.5, boost: 0 };
  traffic = []; items = []; parts = []; score = 0; dist = 0; lives = 3; fuel = 100; nitro = 2; scroll = 0; spawnT = 0.8; itemT = 4; overT = 0;
  A.setScore(0); state = 'play'; say('GO!'); A.jingle([392, 392, 784], 0.18);
}
function say(t) { msg = t; msgT = 1.3; }
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play' }); }
let drag = null;
cv.addEventListener('pointerdown', e => { A.unlock(); drag = A.pointer(cv, e).x; });
cv.addEventListener('pointermove', e => { if (drag != null) drag = A.pointer(cv, e).x; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => drag = null));
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();
  if (state === 'play' && (c === 'Space' || c === 'KeyN') && nitro > 0 && car.boost <= 0 && car.spin <= 0) { nitro--; car.boost = 3; A.tone(200, 0.8, 'sawtooth', 0.05, 0, 900); say('NITRO!'); }
});
A.onHide(pause);
const level = () => 1 + Math.floor(dist / 4000);
function update(dt) {
  if (parts) { parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; }); parts = parts.filter(p => p.t > 0); }
  if (msgT > 0) msgT -= dt;
  if (state !== 'play') { scroll += 120 * dt; return; }
  // final-crash countdown runs on game time, so pausing can't skip it
  if (overT > 0) { overT -= dt; if (overT <= 0) return gameOver('WRECKED'); }
  // speed
  const gas = A.held('ArrowUp', 'KeyW'), brake = A.held('ArrowDown', 'KeyS');
  const top = car.boost > 0 ? 640 : 460;
  if (car.spin > 0) { car.spin -= dt; car.speed = Math.max(60, car.speed - 500 * dt); }
  else if (fuel <= 0) car.speed = Math.max(0, car.speed - 150 * dt);
  else if (car.boost > 0) car.speed = Math.min(top, car.speed + 600 * dt);
  else if (gas) car.speed = Math.min(top, car.speed + 220 * dt);
  else if (brake) car.speed = Math.max(120, car.speed - 380 * dt);
  else car.speed += (260 - car.speed) * Math.min(1, dt * 0.8);
  car.boost = Math.max(0, car.boost - dt); car.inv = Math.max(0, car.inv - dt);
  // steering
  let steer = (A.held('ArrowRight', 'KeyD') ? 1 : 0) - (A.held('ArrowLeft', 'KeyA') ? 1 : 0);
  if (drag != null) steer = A.clamp((drag - car.x) / 30, -1, 1);
  if (car.spin <= 0) car.x += steer * (180 + car.speed * 0.25) * dt;
  car.x = A.clamp(car.x, RL + 16, RR - 16);
  // distance, fuel
  const d = car.speed * dt; dist += d; scroll += d;
  fuel = Math.max(0, fuel - dt * (2.2 + car.speed / 300));
  score = Math.floor(dist / 10) + bonus; A.setScore(score);
  if (fuel <= 0 && car.speed <= 1) return gameOver('OUT OF FUEL');
  // spawn traffic
  spawnT -= dt * (car.speed / 260);
  if (spawnT <= 0) {
    spawnT = Math.max(0.35, 1.25 - level() * 0.1) * A.rand(0.6, 1.3);
    const lane = A.rnd(LANES), truck = Math.random() < 0.18;
    if (!traffic.some(t => t.lane === lane && t.y < 60)) traffic.push({ lane, x: laneX(lane), y: -90, v: truck ? A.rand(110, 150) : A.rand(150, 240), truck, col: A.pick(CARCOL), shift: 0, passed: false });
  }
  itemT -= dt;
  if (itemT <= 0) { itemT = A.rand(4, 7); items.push({ x: laneX(A.rnd(LANES)), y: -40, k: fuel < 40 || Math.random() < 0.7 ? 'fuel' : 'nitro' }); }
  // move traffic (relative)
  for (const t of traffic) {
    t.y += (car.speed - t.v) * dt;
    if (Math.random() < dt * 0.15 && !t.shift && level() >= 2) { const nl = t.lane + (Math.random() < 0.5 ? -1 : 1); if (nl >= 0 && nl < LANES) { t.lane = nl; t.shift = 1; } }
    t.x += (laneX(t.lane) - t.x) * Math.min(1, dt * 2.5); if (Math.abs(laneX(t.lane) - t.x) < 1) t.shift = 0;
    const len = t.truck ? 78 : 50;
    if (!t.passed && t.y - len / 2 > car.y + 30) { t.passed = true; const near = Math.abs(t.x - car.x) < 50; if (near) { bonus += 50; say('CLOSE CALL +50'); A.tone(1200, 0.06, 'square', 0.03); } }
    if (car.inv <= 0 && car.spin <= 0 && Math.abs(t.x - car.x) < 30 && Math.abs(t.y - car.y) < (len / 2 + 26)) crash(t);
  }
  traffic = traffic.filter(t => t.y < H + 120 && t.y > -300);
  for (const it of items) {
    it.y += car.speed * dt;
    if (Math.abs(it.x - car.x) < 28 && Math.abs(it.y - car.y) < 34) { it.got = true; if (it.k === 'fuel') { fuel = Math.min(100, fuel + 35); say('FUEL +35'); } else { nitro = Math.min(5, nitro + 1); say('+1 NITRO'); } bonus += 25; A.jingle([660, 880, 1100], 0.05); }
  }
  items = items.filter(i => !i.got && i.y < H + 40);
  if (car.boost > 0 || gas) parts.push({ x: car.x + A.rand(-6, 6), y: car.y + 34, vx: A.rand(-20, 20), vy: 160, t: 0.3, c: car.boost > 0 ? '#5ee7ff' : '#ff8a3d' });
  engT -= dt; if (engT <= 0) { engT = 0.09; A.tone(50 + car.speed * 0.25, 0.1, 'sawtooth', 0.012); }
}
let bonus = 0;
function crash(t) {
  lives--; car.spin = 1.2; car.inv = 2.6; car.speed *= 0.4; A.noise(0.6, 0.12); A.tone(120, 0.5, 'square', 0.06, 0, 40);
  t.y -= 40; for (let i = 0; i < 24; i++) { const a = Math.random() * 6.28, s = A.rand(60, 240); parts.push({ x: car.x, y: car.y - 20, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: A.rand(0.3, 0.8), c: A.pick(['#ffd23d', '#ff8a3d', '#fff']) }); }
  if (lives <= 0) overT = 0.9; else say(`${lives} CAR${lives > 1 ? 'S' : ''} LEFT`);
}
function gameOver(why) {
  if (state !== 'play') return; state = 'over'; const rec = A.submit(score);
  A.overlay({ title: why, big: `SCORE ${score} · ${(dist / 1000).toFixed(1)} KM`, sub: rec ? 'New high score!' : `Best: ${A.best()}`, btn: 'Race again', onGo: () => { bonus = 0; newGame(); } });
}
function drawCar(x, y, col, len, rot, player) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  const w = 32, h = len;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-w / 2 + 3, -h / 2 + 5, w, h);
  ctx.fillStyle = '#111'; [[-w / 2 - 2, -h / 2 + 7], [w / 2 - 4, -h / 2 + 7], [-w / 2 - 2, h / 2 - 17], [w / 2 - 4, h / 2 - 17]].forEach(([a, b]) => ctx.fillRect(a, b, 6, 11));
  ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 7); ctx.fill();
  if (player) { ctx.shadowColor = col; ctx.shadowBlur = 16; ctx.fill(); ctx.shadowBlur = 0; }
  ctx.fillStyle = 'rgba(20,20,40,.85)'; ctx.fillRect(-w / 2 + 5, -h / 2 + (player ? 12 : h - 22), w - 10, 9); ctx.fillRect(-w / 2 + 6, player ? h / 2 - 16 : -h / 2 + 8, w - 12, 6);
  if (player) { ctx.fillStyle = '#fff'; ctx.fillRect(-w / 2 + 14, -h / 2 + 2, 4, h - 6); }
  if (len > 60) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(-w / 2, -h / 2 + 26, w, 2); }
  ctx.fillStyle = player ? '#fff6c2' : '#ff2a2a'; ctx.fillRect(-w / 2 + 3, player ? -h / 2 : h / 2 - 3, 6, 3); ctx.fillRect(w / 2 - 9, player ? -h / 2 : h / 2 - 3, 6, 3);
  ctx.restore();
}
function draw(t) {
  ctx.fillStyle = '#120a22'; ctx.fillRect(0, 0, W, H);
  // roadside
  const off = scroll % 80;
  for (let y = -80 + off; y < H; y += 80) {
    ctx.fillStyle = '#2a1640'; ctx.fillRect(0, y, RL - 6, 40); ctx.fillRect(RR + 6, y + 40, W - RR, 40);
    ctx.fillStyle = '#ff3d7f'; ctx.shadowColor = '#ff3d7f'; ctx.shadowBlur = 12; ctx.fillRect(RL - 14, y + 10, 4, 4); ctx.fillRect(RR + 10, y + 50, 4, 4); ctx.shadowBlur = 0;
  }
  ctx.fillStyle = '#1b1828'; ctx.fillRect(RL, 0, RR - RL, H);
  ctx.fillStyle = '#ff3d7f'; ctx.fillRect(RL - 4, 0, 4, H); ctx.fillRect(RR, 0, 4, H);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  const dOff = scroll % 60;
  for (let l = 1; l < LANES; l++) for (let y = -60 + dOff; y < H; y += 60) ctx.fillRect(RL + l * LW - 2, y, 4, 30);
  // items
  (items || []).forEach(it => {
    if (it.k === 'fuel') { ctx.fillStyle = '#ff4f4f'; ctx.fillRect(it.x - 10, it.y - 13, 20, 26); ctx.fillStyle = '#fff'; ctx.font = '12px Silkscreen, monospace'; ctx.textAlign = 'center'; ctx.fillText('F', it.x, it.y + 5); ctx.fillStyle = '#222'; ctx.fillRect(it.x - 3, it.y - 17, 6, 4); }
    else { ctx.fillStyle = '#5ee7ff'; ctx.shadowColor = '#5ee7ff'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.moveTo(it.x, it.y - 14); ctx.lineTo(it.x + 11, it.y); ctx.lineTo(it.x, it.y + 14); ctx.lineTo(it.x - 11, it.y); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#04202a'; ctx.font = '11px Silkscreen, monospace'; ctx.textAlign = 'center'; ctx.fillText('N', it.x, it.y + 4); }
  });
  (traffic || []).forEach(c => drawCar(c.x, c.y, c.col, c.truck ? 78 : 50, 0, false));
  (parts || []).forEach(p => { ctx.globalAlpha = Math.min(1, p.t * 3); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }); ctx.globalAlpha = 1;
  if (car) { if (!(car.inv > 0 && car.spin <= 0 && Math.floor(t / 100) % 2)) drawCar(car.x, car.y, '#ff3d7f', 54, car.spin > 0 ? car.spin * 9 : 0, true); }
  else { drawCar(laneX(1) + Math.sin(t / 700) * 30, 520, '#ff3d7f', 54, 0, true); drawCar(laneX(2), 320 + (t / 6) % 500 - 200, '#ffd23d', 50, 0, false); }
  if (car) {
    // HUD
    ctx.fillStyle = 'rgba(10,6,20,.75)'; ctx.fillRect(0, 0, W, 34);
    ctx.font = '12px Silkscreen, monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#f4effd';
    ctx.fillText(`${Math.round(car.speed / 2.4)} KM/H`, 10, 22);
    ctx.fillText('FUEL', 120, 22); ctx.fillStyle = '#2a2148'; ctx.fillRect(160, 13, 80, 10); ctx.fillStyle = fuel < 25 ? (Math.floor(t / 200) % 2 ? '#ff4f4f' : '#7a2020') : '#9dff4f'; ctx.fillRect(160, 13, 80 * fuel / 100, 10);
    ctx.fillStyle = '#5ee7ff'; for (let i = 0; i < nitro; i++) ctx.fillRect(252 + i * 10, 13, 6, 10);
    for (let i = 0; i < lives; i++) { ctx.fillStyle = '#ff3d7f'; ctx.fillRect(W - 18 - i * 16, 12, 10, 14); }
  }
  if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT * 2); ctx.font = '24px Bungee, sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.shadowColor = '#ff3d7f'; ctx.shadowBlur = 14; ctx.fillText(msg, W / 2, 260); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
}
A.loop(update, draw);
A.overlay({ title: 'NITRO LANE', sub: 'Weave through night traffic as far as you can. Grab red fuel cans before the tank runs dry. Blue diamonds are nitro: hit Space (or tap NITRO) for a burst.', btn: 'Start', scores: true, onGo: () => { bonus = 0; newGame(); } });
})();
</script>
</body>
</html>
