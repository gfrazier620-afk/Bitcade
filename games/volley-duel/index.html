<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Volley Duel</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preload" href="../../shared/fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="../../shared/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="volley-duel" style="--game:#ff7bf0">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>VOLLEY DUEL</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="ab"><button data-k="KeyW" aria-label="Left paddle up">▲</button><button data-k="KeyS" aria-label="Left paddle down">▼</button></div>
    <div class="ab"><button data-k="ArrowUp" aria-label="Right paddle up">▲</button><button data-k="ArrowDown" aria-label="Right paddle down">▼</button></div>
  </div>
  <p class="help"><kbd>W</kbd><kbd>S</kbd> left paddle · <kbd>↑</kbd><kbd>↓</kbd> right paddle (2 players) · <kbd>P</kbd> pause · drag on touch screens</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const RAIL = 8, W = 640, H = 400, PX = 24, PW = 10, PH = 70, BR = 7, WIN = 7, PS = 430, ctx = A.canvas(cv, W, H);
// err: the CPU aims within ±err of the ball, so anything past PH / 2 + BR (42) is a miss.
const LC = '#ff7bf0', RC = '#5ee7ff';
const CPUS = [
  { name: 'BLIP', spd: 220, err: 60, wake: 0.55 }, { name: 'ZAP', spd: 270, err: 55, wake: 0.45 }, { name: 'NOVA', spd: 320, err: 51, wake: 0.38 },
  { name: 'VOLT', spd: 380, err: 48, wake: 0.3 }, { name: 'APEX', spd: 460, err: 46, wake: 0.2 }];
let state = 'title', two = false, L = { y: H / 2, s: 0 }, R = { y: H / 2, s: 0 }, ball = null, trail = [], serveT = 0, nextT = 0;
let score = 0, opp = 0, msg = '', msgT = 0;
const touch = new Map(); // pointerId → { side, y }

function newGame(isTwo) { two = isTwo; score = 0; opp = 0; A.setScore(0); startMatch(); }
function startMatch() {
  L = { y: H / 2, s: 0 }; R = { y: H / 2, s: 0 }; trail = []; state = 'play';
  serve(Math.random() < 0.5 ? -1 : 1); say(two ? 'FIRST TO 7' : `VS ${CPUS[opp].name}`); A.jingle([392, 523, 659], 0.08);
}
function serve(dir) { ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, sp: 340, dir, aim: aimError() }; serveT = 1; }
const aimError = () => A.rand(-1, 1) * CPUS[opp].err; // rolled each time the ball heads for the CPU
function say(t) { msg = t; msgT = 1.6; }
function pause() { if (state !== 'play' && state !== 'next') return; const prev = state; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = prev }); }
A.onPress(c => { if (c === 'KeyP' || c === 'Escape') pause(); });
A.onHide(pause);

/* touch: drag anywhere; in 2 players the left half moves the left paddle and the right half the right one */
cv.addEventListener('pointerdown', e => { A.unlock(); const p = A.pointer(cv, e); touch.set(e.pointerId, { side: !two || p.x < W / 2 ? 'L' : 'R', y: p.y }); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { const t = touch.get(e.pointerId); if (t) t.y = A.pointer(cv, e).y; });
['pointerup', 'pointercancel'].forEach(n => cv.addEventListener(n, e => touch.delete(e.pointerId)));
const touchY = side => { for (const t of touch.values()) if (t.side === side) return t.y; return null; };

function steer(p, side, up, down, dt) {
  const ty = touchY(side);
  if (ty != null) p.y += A.clamp(ty - p.y, -PS * 1.6 * dt, PS * 1.6 * dt);
  else p.y += ((down ? 1 : 0) - (up ? 1 : 0)) * PS * dt;
  p.y = A.clamp(p.y, PH / 2 + RAIL, H - PH / 2 - RAIL);
}
/** Where the ball will cross the right paddle, bouncing off top and bottom. */
function predictY() {
  const t = (W - PX - PW / 2 - BR - ball.x) / ball.vx, span = H - 2 * BR;
  let y = ball.y + ball.vy * t - BR; y = ((y % (2 * span)) + 2 * span) % (2 * span);
  return (y > span ? 2 * span - y : y) + BR;
}
function cpu(dt) {
  const c = CPUS[opp];
  let target = H / 2;
  if (ball && serveT <= 0 && ball.vx > 0 && ball.x > W * c.wake) target = predictY() + ball.aim;
  R.y = A.clamp(R.y + A.clamp(target - R.y, -c.spd * dt, c.spd * dt), PH / 2 + RAIL, H - PH / 2 - RAIL);
}
function bat(p, px, dir) {
  if (Math.sign(ball.vx) === dir) return; // already heading away from this paddle
  const face = px + dir * PW / 2;
  const inX = dir > 0 ? ball.x - BR <= face && ball.x > px - PW : ball.x + BR >= face && ball.x < px + PW;
  if (!inX || Math.abs(ball.y - p.y) > PH / 2 + BR) return;
  const ang = A.clamp((ball.y - p.y) / (PH / 2), -1, 1) * 0.95;
  ball.sp = Math.min(760, ball.sp + 18);
  ball.vx = Math.cos(ang) * ball.sp * dir; ball.vy = Math.sin(ang) * ball.sp; ball.x = face + dir * BR; ball.aim = aimError();
  A.tone(dir > 0 ? 520 : 440, 0.05, 'square', 0.05);
  ball.by = dir > 0 ? 'L' : 'R';
  const c = dir > 0 ? LC : RC, k = ball.sp / 760;
  A.burst(face, ball.y, { n: 10 + Math.round(k * 10), colors: [c, '#fff'], speed: 160 + k * 200, angle: dir > 0 ? 0 : Math.PI, spread: 1.6, life: 0.4 });
  A.ring(face, ball.y, c, 26); A.shake(1 + k * 4, 0.12); p.hit = 0.18;
  if (dir > 0 && !two) { score += 10; A.setScore(score); A.pop(face + 18, ball.y - 14, '+10', LC); }
}
function point(side) {
  const p = side === 'L' ? L : R; p.s++; p.pop = 0.5;
  const gx = side === 'L' ? W - 6 : 6, c = side === 'L' ? LC : RC;
  A.burst(gx, ball.y, { n: 36, colors: [c, '#fff', shade(c, -0.3)], speed: 320, angle: side === 'L' ? Math.PI : 0, spread: 2.4, life: 0.8 });
  A.flash(c, 0.22); A.shake(8, 0.35); A.hitstop(0.08);
  if (!two && side === 'L') { score += 100; A.setScore(score); }
  A.tone(side === 'L' || two ? 880 : 220, 0.25, 'triangle', 0.05, 0, side === 'L' || two ? 1320 : 110);
  if (p.s >= WIN) return matchOver(side);
  serve(side === 'L' ? 1 : -1); // serve toward whoever just conceded
}
function matchOver(side) {
  ball = null;
  if (two) {
    state = 'over'; A.jingle([523, 659, 784, 1047], 0.1);
    A.overlay({ title: side === 'L' ? 'LEFT WINS' : 'RIGHT WINS', big: `${L.s} – ${R.s}`, btn: 'Rematch', onGo: () => newGame(true), alt: { btn: '1 Player', onGo: () => newGame(false) } });
    return;
  }
  if (side === 'R') return finish(false);
  score += 1000; A.setScore(score); A.badge('match'); if (R.s === 0) A.badge('shutout');
  if (opp === CPUS.length - 1) { score += 5000; A.setScore(score); A.badge('champ'); return finish(true); }
  opp++; state = 'next'; nextT = 2.2; say(`NEXT: ${CPUS[opp].name}`); A.jingle([523, 659, 784, 1047], 0.1);
}
function finish(champ) {
  state = 'over'; const rec = A.submit(score);
  if (!champ) A.jingle([392, 330, 262], 0.16, 'triangle');
  A.overlay({ title: champ ? 'RALLY CHAMP!' : 'MATCH LOST', big: `SCORE ${score} · BEAT ${champ ? CPUS.length : opp} OF ${CPUS.length}`, sub: rec ? 'New high score!' : `Best: ${A.best()}`,
    btn: 'Play again', onGo: () => newGame(false), alt: { btn: '2 Players', onGo: () => newGame(true) } });
}

A.loop(dt => {
  if (msgT > 0) msgT -= dt;
  if (state === 'next') { nextT -= dt; if (nextT <= 0) startMatch(); return; }
  if (state !== 'play') return;
  if (two) { steer(L, 'L', A.held('KeyW'), A.held('KeyS'), dt); steer(R, 'R', A.held('ArrowUp'), A.held('ArrowDown'), dt); }
  else { steer(L, 'L', A.held('KeyW', 'ArrowUp'), A.held('KeyS', 'ArrowDown'), dt); cpu(dt); }
  if (!ball) return;
  if (serveT > 0) {
    serveT -= dt;
    if (serveT <= 0) { const a = A.rand(-0.45, 0.45); ball.vx = Math.cos(a) * ball.sp * ball.dir; ball.vy = Math.sin(a) * ball.sp; A.tone(330, 0.05); }
    return;
  }
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.y < BR + RAIL) { ball.y = BR + RAIL; ball.vy = Math.abs(ball.vy); A.tone(300, 0.03, 'square', 0.03); A.burst(ball.x, RAIL, { n: 6, color: '#fff', speed: 120, angle: Math.PI / 2, spread: 2, life: 0.25 }); }
  if (ball.y > H - BR - RAIL) { ball.y = H - BR - RAIL; ball.vy = -Math.abs(ball.vy); A.tone(300, 0.03, 'square', 0.03); A.burst(ball.x, H - RAIL, { n: 6, color: '#fff', speed: 120, angle: -Math.PI / 2, spread: 2, life: 0.25 }); }
  bat(L, PX, 1); bat(R, W - PX, -1);
  trail.push({ x: ball.x, y: ball.y }); if (trail.length > 10) trail.shift();
  if (ball.x < -BR * 2) { trail = []; point('R'); }
  else if (ball.x > W + BR * 2) { trail = []; point('L'); }
}, t => {
  ctx.drawImage(court, 0, 0);
  let l = L, r = R, b = ball;
  if (state === 'title') { // attract: a rally that plays itself
    const k = t / 1500, tri = v => Math.abs(((v % 2) + 2) % 2 - 1);
    b = { x: PX + PW + BR + (W - 2 * (PX + PW + BR)) * tri(k), y: RAIL + BR + 30 + (H - 2 * (BR + RAIL) - 60) * tri(k * 1.37), by: Math.floor(k) % 2 ? 'R' : 'L' };
    l = { y: b.y, s: 0 }; r = { y: b.y, s: 0 };
  }
  // goal zones glow brighter as the ball heads their way
  if (b && b.vx) { const zone = (x, c, on) => { const g = ctx.createLinearGradient(x, 0, x + (x ? -60 : 60), 0); g.addColorStop(0, c); g.addColorStop(1, 'transparent'); ctx.globalAlpha = on ? 0.18 + Math.sin(t / 90) * 0.05 : 0.06; ctx.fillStyle = g; ctx.fillRect(x ? x - 60 : 0, RAIL, 60, H - 2 * RAIL); ctx.globalAlpha = 1; };
    zone(0, LC, b.vx < 0); zone(W, RC, b.vx > 0); }
  if (state !== 'title') scoreboard(l, r, t);
  drawBat(PX, l, LC, 1, t); drawBat(W - PX, r, RC, -1, t);
  if (b) drawBall(b, t);
  if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT * 2); ctx.font = '26px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#0a0612'; ctx.fillText(msg, W / 2 + 2, H / 2 + 72); ctx.fillStyle = LC; ctx.shadowColor = LC; ctx.shadowBlur = 14; ctx.fillText(msg, W / 2, H / 2 + 70); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
});

/* ---------- art ---------- */
/** Lighten (k > 0) or darken (k < 0) a #rgb / #rrggbb colour. */
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
// the court, drawn once: a dark floor with a faint grid, glowing lines, a centre circle and lit rails top and bottom
const court = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const g = x.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * 0.7); g.addColorStop(0, '#1a1036'); g.addColorStop(1, '#07040f'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(255,255,255,.035)'; x.lineWidth = 1;
  for (let i = 0; i <= W; i += 32) { x.beginPath(); x.moveTo(i + .5, 0); x.lineTo(i + .5, H); x.stroke(); }
  for (let j = 0; j <= H; j += 32) { x.beginPath(); x.moveTo(0, j + .5); x.lineTo(W, j + .5); x.stroke(); }
  const glow = (c2, f) => { x.shadowColor = c2; x.shadowBlur = 10; x.strokeStyle = c2; f(); x.shadowBlur = 0; };
  x.lineWidth = 2; x.globalAlpha = 0.55;
  glow('#b48cff', () => { x.setLineDash([10, 10]); x.beginPath(); x.moveTo(W / 2, RAIL + 6); x.lineTo(W / 2, H - RAIL - 6); x.stroke(); x.setLineDash([]); x.beginPath(); x.arc(W / 2, H / 2, 52, 0, 6.29); x.stroke(); });
  glow(LC, () => { x.beginPath(); x.moveTo(PX + 30, RAIL + 10); x.lineTo(PX + 30, H - RAIL - 10); x.stroke(); });
  glow(RC, () => { x.beginPath(); x.moveTo(W - PX - 30, RAIL + 10); x.lineTo(W - PX - 30, H - RAIL - 10); x.stroke(); });
  x.globalAlpha = 1;
  x.fillStyle = 'rgba(180,140,255,.25)'; x.beginPath(); x.arc(W / 2, H / 2, 6, 0, 6.29); x.fill();
  for (const y of [0, H - RAIL]) { // rails: dark metal with a bright edge and little lights
    x.fillStyle = '#0a0612'; x.fillRect(0, y - (y ? 2 : 0), W, RAIL + 2);
    const rg = x.createLinearGradient(0, y, 0, y + RAIL); rg.addColorStop(0, '#4a3e78'); rg.addColorStop(1, '#221a40'); x.fillStyle = rg; x.fillRect(0, y, W, RAIL);
    x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(0, y ? y : RAIL - 1, W, 1);
    for (let i = 20; i < W; i += 40) { x.fillStyle = i < W / 2 ? LC : RC; x.globalAlpha = 0.7; x.fillRect(i, y + 3, 4, 2); x.globalAlpha = 1; }
  }
  return c;
})();
/** A hover-bat: outlined, shaded capsule with a bright core, end lights and a thruster glow behind it. */
function drawBat(x, p, c, face, t) {
  const y = p.y, v = p.py == null ? 0 : y - p.py; p.py = y;
  const hit = p.hit > 0 ? (p.hit -= 1 / 60, p.hit / 0.18) : 0;
  // thruster flame behind the bat
  const fl = ctx.createLinearGradient(x - face * 6, 0, x - face * (22 + Math.sin(t / 40) * 4), 0); fl.addColorStop(0, c); fl.addColorStop(1, 'transparent');
  ctx.globalAlpha = 0.5; ctx.fillStyle = fl; ctx.fillRect(Math.min(x - face * 6, x - face * 26), y - PH / 2 + 8, 20, PH - 16); ctx.globalAlpha = 1;
  // motion streak
  if (Math.abs(v) > 2) { ctx.globalAlpha = 0.25; ctx.fillStyle = c; ctx.fillRect(x - PW / 2, y - PH / 2 - Math.max(0, -v) * 3, PW, PH + Math.abs(v) * 3); ctx.globalAlpha = 1; }
  ctx.fillStyle = '#0a0612'; ctx.beginPath(); ctx.roundRect(x - PW / 2 - 2, y - PH / 2 - 2, PW + 4, PH + 4, 7); ctx.fill();
  ctx.shadowColor = c; ctx.shadowBlur = 16 + hit * 20;
  const g = ctx.createLinearGradient(x - PW / 2, 0, x + PW / 2, 0); g.addColorStop(0, shade(c, -0.45)); g.addColorStop(0.45, hit ? '#fff' : c); g.addColorStop(1, shade(c, -0.3));
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x - PW / 2, y - PH / 2, PW, PH, 5); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(x - 1, y - PH / 2 + 8, 2, PH - 16);
  ctx.fillStyle = '#fff'; ctx.fillRect(x - 2, y - PH / 2 + 3, 4, 3); ctx.fillRect(x - 2, y + PH / 2 - 6, 4, 3);
}
/** The ball: a white-hot core in the colour of whoever hit it last, with a tapering trail that grows with speed. */
function drawBall(b, t) {
  const c = b.by === 'R' ? RC : LC;
  if (trail.length > 1) {
    for (let i = 1; i < trail.length; i++) { const k = i / trail.length; ctx.strokeStyle = c; ctx.globalAlpha = k * 0.5; ctx.lineWidth = BR * 2 * k; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = serveT > 0 && Math.floor(t / 120) % 2 ? 0.35 : 1;
  ctx.shadowColor = c; ctx.shadowBlur = 20;
  ctx.fillStyle = '#0a0612'; ctx.beginPath(); ctx.arc(b.x, b.y, BR + 2, 0, 6.29); ctx.fill();
  const g = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, BR); g.addColorStop(0, '#fff'); g.addColorStop(0.5, shade(c, 0.6)); g.addColorStop(1, c);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, BR, 0, 6.29); ctx.fill(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}
/** The scoreboard: a dark panel with each side's score in its colour, and the names under them. */
function scoreboard(l, r, t) {
  const x0 = W / 2 - 110, y0 = RAIL + 10;
  ctx.fillStyle = 'rgba(10,6,18,.78)'; ctx.beginPath(); ctx.roundRect(x0, y0, 220, 62, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(180,140,255,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.textAlign = 'center';
  for (const [p, c, cx, name] of [[l, LC, W / 2 - 55, two ? 'LEFT' : 'YOU'], [r, RC, W / 2 + 55, two ? 'RIGHT' : CPUS[opp].name]]) {
    const pop = p.pop > 0 ? (p.pop -= 1 / 60, 1 + p.pop * 0.8) : 1;
    ctx.save(); ctx.translate(cx, y0 + 34); ctx.scale(pop, pop);
    ctx.font = '34px Bungee, sans-serif'; ctx.fillStyle = '#0a0612'; ctx.fillText(p.s, 2, 2); ctx.shadowColor = c; ctx.shadowBlur = 12; ctx.fillStyle = c; ctx.fillText(p.s, 0, 0); ctx.shadowBlur = 0; ctx.restore();
    ctx.font = '10px Silkscreen, monospace'; ctx.fillStyle = '#a39bc4'; ctx.fillText(name, cx, y0 + 55);
  }
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.font = '18px Bungee, sans-serif'; ctx.fillText('·', W / 2, y0 + 30);
  ctx.font = '9px Silkscreen, monospace'; ctx.fillStyle = '#6a6290'; ctx.fillText(`FIRST TO ${WIN}`, W / 2, y0 + 55);
}
/* Attract demo: the left paddle follows the ball when it's coming, and drifts back to the middle when it isn't. */
A.attract({
  start: () => newGame(false),
  stop: () => { state = 'title'; ball = null; },
  bot: () => {
    if (!ball) return [];
    const d = (ball.vx < 0 ? ball.y : H / 2) - L.y;
    return Math.abs(d) < 14 ? [] : [d > 0 ? 'ArrowDown' : 'ArrowUp'];
  }
});
A.overlay({ title: 'VOLLEY DUEL', sub: 'Bat the ball past your rival. First to 7 wins. <b>1 Player</b> climbs a ladder of five CPU rivals. <b>2 Players</b> share one keyboard or one tablet.',
  btn: '1 Player', scores: true, onGo: () => newGame(false), alt: { btn: '2 Players', onGo: () => newGame(true) } });
})();
</script>
</body>
</html>
