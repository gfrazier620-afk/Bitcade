<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rock Rift</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="rock-rift" data-pad="1:ArrowUp 3:ArrowDown 7:ArrowUp" style="--game:#c6ff3d">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>ROCK RIFT</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="ab"><button data-k="ArrowLeft" aria-label="Rotate left">⟲</button><button data-k="ArrowRight" aria-label="Rotate right">⟳</button></div>
    <div class="ab"><button class="sm" data-k="ArrowDown">WARP</button><button data-k="ArrowUp">THRUST</button><button data-k="Space">FIRE</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>→</kbd> rotate · <kbd>↑</kbd> thrust · <kbd>Space</kbd> fire · <kbd>↓</kbd> warp · <kbd>P</kbd> pause</p>
</main>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const W = 640, H = 480, ctx = A.canvas(cv, W, H);
const SIZES = { 3: { r: 44, pts: 20, v: 50 }, 2: { r: 24, pts: 50, v: 85 }, 1: { r: 12, pts: 100, v: 130 } };
let state = 'title', ship, bullets, rocks, parts, score, lives, wave, nextLife, waveT, saucer, saucerT, sbullets;
const wrap = o => { if (o.x < 0) o.x += W; if (o.x > W) o.x -= W; if (o.y < 0) o.y += H; if (o.y > H) o.y -= H; };
function rock(x, y, size) {
  const s = SIZES[size], a = Math.random() * Math.PI * 2, v = s.v * A.rand(0.6, 1.3) * (1 + wave * 0.05);
  const n = 10 + A.rnd(4), pts = [];
  for (let i = 0; i < n; i++) pts.push(s.r * A.rand(0.7, 1.1));
  return { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, size, r: s.r, pts, rot: 0, spin: A.rand(-1, 1) };
}
function newGame() { score = 0; lives = 3; wave = 0; nextLife = 10000; A.setScore(0); parts = []; resetShip(); nextWave(); state = 'play'; }
function resetShip() { ship = { x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0, inv: 2.5, dead: 0, cool: 0, thrust: false }; bullets = []; }
function nextWave() {
  wave++; if (wave > 1) A.badge('wave'); rocks = []; waveT = 2; saucer = null; saucerT = A.rand(15, 25); sbullets = [];
  for (let i = 0; i < 3 + wave; i++) { let x, y; do { x = Math.random() * W; y = Math.random() * H; } while (Math.hypot(x - ship.x, y - ship.y) < 150); rocks.push(rock(x, y, 3)); }
}
function boom(x, y, n, c = '#c6ff3d', sp = 160) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = A.rand(20, sp); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: A.rand(0.4, 1), c }); } }
function split(r, i) {
  rocks.splice(i, 1); score += SIZES[r.size].pts; boom(r.x, r.y, r.size * 6, '#e8ffd0');
  A.noise(0.12 + r.size * 0.08, 0.06 + r.size * 0.02);
  if (r.size > 1) for (let k = 0; k < 2; k++) { const n = rock(r.x, r.y, r.size - 1); rocks.push(n); }
}
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play' }); }
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();
  if (state !== 'play' || ship.dead > 0) return;
  if (c === 'ArrowDown' || c === 'KeyS') { boom(ship.x, ship.y, 12, '#9ad'); ship.x = Math.random() * W; ship.y = Math.random() * H; ship.vx = ship.vy = 0; A.tone(200, 0.3, 'sine', 0.05, 0, 1600); }
});
A.onHide(pause);
let beatT = 0, beatHi = false, demo = null;
function update(dt) {
  if (parts) { parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; }); parts = parts.filter(p => p.t > 0); }
  if (!rocks) { // title attract
    if (!demo) { wave = 1; demo = Array.from({ length: 7 }, () => rock(Math.random() * W, Math.random() * H, A.pick([1, 2, 3]))); }
    demo.forEach(r => { r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.spin * dt; wrap(r); });
  }
  if (state !== 'play') return;
  if (waveT > 0) waveT -= dt;
  // heartbeat
  beatT -= dt; if (beatT <= 0) { beatT = Math.max(0.3, 1 - (1 - rocks.length / (8 + wave * 3)) * 0.6); beatHi = !beatHi; A.tone(beatHi ? 70 : 60, 0.12, 'triangle', 0.09); }
  // ship
  if (ship.dead > 0) {
    ship.dead -= dt;
    if (ship.dead <= 0) { if (lives <= 0) return gameOver(); resetShip(); }
  } else {
    const rot = (A.held('ArrowRight', 'KeyD') ? 1 : 0) - (A.held('ArrowLeft', 'KeyA') ? 1 : 0);
    ship.a += rot * 4.6 * dt;
    ship.thrust = A.held('ArrowUp', 'KeyW');
    if (ship.thrust) { ship.vx += Math.cos(ship.a) * 300 * dt; ship.vy += Math.sin(ship.a) * 300 * dt; if (Math.random() < 0.6) parts.push({ x: ship.x - Math.cos(ship.a) * 12, y: ship.y - Math.sin(ship.a) * 12, vx: -Math.cos(ship.a + A.rand(-.3, .3)) * 120, vy: -Math.sin(ship.a + A.rand(-.3, .3)) * 120, t: 0.25, c: '#ffb03d' }); }
    const f = Math.pow(0.55, dt); ship.vx *= f; ship.vy *= f;
    const sp = Math.hypot(ship.vx, ship.vy); if (sp > 420) { ship.vx *= 420 / sp; ship.vy *= 420 / sp; }
    ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrap(ship);
    ship.inv = Math.max(0, ship.inv - dt); ship.cool -= dt;
    if (A.held('Space', 'KeyJ') && ship.cool <= 0 && bullets.length < 6) {
      bullets.push({ x: ship.x + Math.cos(ship.a) * 14, y: ship.y + Math.sin(ship.a) * 14, vx: ship.vx + Math.cos(ship.a) * 560, vy: ship.vy + Math.sin(ship.a) * 560, t: 0.85 });
      ship.cool = 0.17; A.tone(900, 0.07, 'square', 0.03, 0, 300);
    }
  }
  bullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; b.t -= dt; wrap(b); });
  bullets = bullets.filter(b => b.t > 0);
  rocks.forEach(r => { r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.spin * dt; wrap(r); });
  // saucer
  saucerT -= dt;
  if (!saucer && saucerT <= 0 && wave >= 2) { const d = Math.random() < 0.5 ? 1 : -1; saucer = { x: d > 0 ? -20 : W + 20, y: A.rand(60, H - 60), d, small: score > 20000 || Math.random() < 0.3, fire: 1 }; }
  if (saucer) {
    saucer.x += saucer.d * 120 * dt; saucer.y += Math.sin(saucer.x / 60) * 60 * dt; saucer.fire -= dt;
    if (saucer.fire <= 0 && ship.dead <= 0) { saucer.fire = 1.1; const a = saucer.small ? Math.atan2(ship.y - saucer.y, ship.x - saucer.x) + A.rand(-.2, .2) : Math.random() * 6.28; sbullets.push({ x: saucer.x, y: saucer.y, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, t: 1.4 }); A.tone(500, 0.08, 'square', 0.03, 0, 900); }
    saucer.humT = (saucer.humT || 0) - dt; if (saucer.humT <= 0) { saucer.humT = 0.24; A.tone(saucer.small ? 1300 : 900, 0.12, 'sine', 0.015); }
    if (saucer.x < -40 || saucer.x > W + 40) { saucer = null; saucerT = A.rand(15, 25); }
  }
  sbullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; b.t -= dt; wrap(b); }); sbullets = sbullets.filter(b => b.t > 0);
  // bullets vs rocks / saucer
  for (const b of bullets) {
    for (let i = rocks.length - 1; i >= 0; i--) { const r = rocks[i]; if (Math.hypot(b.x - r.x, b.y - r.y) < r.r) { b.t = 0; split(r, i); break; } }
    if (b.t > 0 && saucer && Math.abs(b.x - saucer.x) < (saucer.small ? 12 : 20) && Math.abs(b.y - saucer.y) < 10) { b.t = 0; score += saucer.small ? 1000 : 200; boom(saucer.x, saucer.y, 30, '#ff5edb'); A.noise(0.5, 0.09); A.badge('saucer'); saucer = null; saucerT = A.rand(15, 25); }
  }
  bullets = bullets.filter(b => b.t > 0);
  // ship collisions
  if (ship.dead <= 0 && ship.inv <= 0) {
    for (let i = rocks.length - 1; i >= 0; i--) { const r = rocks[i]; if (Math.hypot(ship.x - r.x, ship.y - r.y) < r.r * 0.85 + 9) { split(r, i); crash(); break; } }
    if (ship.dead <= 0) for (const b of sbullets) if (Math.hypot(b.x - ship.x, b.y - ship.y) < 11) { b.t = 0; crash(); break; }
    if (ship.dead <= 0 && saucer && Math.hypot(saucer.x - ship.x, saucer.y - ship.y) < 22) { saucer = null; crash(); }
  }
  if (score >= 10000) A.badge('score');
  if (score >= nextLife) { lives++; nextLife += 10000; A.jingle([660, 880, 1320], 0.08); }
  A.setScore(score);
  if (!rocks.length && !saucer) nextWave();
}
function crash() { lives--; ship.dead = 2; boom(ship.x, ship.y, 40, '#c6ff3d', 220); A.noise(0.9, 0.12); }
function gameOver() { state = 'over'; const rec = A.submit(score); A.overlay({ title: 'SHIP LOST', big: `SCORE ${score} · WAVE ${wave}`, sub: rec ? 'New high score!' : `Best: ${A.best()}`, btn: 'Play again', onGo: newGame }); }

function drawShip(x, y, a, thrust, col = '#c6ff3d') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.shadowColor = col; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-11, -9); ctx.lineTo(-6, 0); ctx.lineTo(-11, 9); ctx.closePath(); ctx.stroke();
  if (thrust && Math.random() < 0.8) { ctx.strokeStyle = '#ffb03d'; ctx.shadowColor = '#ffb03d'; ctx.beginPath(); ctx.moveTo(-7, -4); ctx.lineTo(-17 - Math.random() * 6, 0); ctx.lineTo(-7, 4); ctx.stroke(); }
  ctx.restore();
}
function drawRock(r) {
  ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot); ctx.beginPath();
  r.pts.forEach((d, i) => { const a = i / r.pts.length * Math.PI * 2; i ? ctx.lineTo(Math.cos(a) * d, Math.sin(a) * d) : ctx.moveTo(Math.cos(a) * d, Math.sin(a) * d); });
  ctx.closePath(); ctx.fillStyle = 'rgba(232,255,208,.04)'; ctx.fill(); ctx.stroke(); ctx.restore();
}
function draw(t) {
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#e8ffd0'; ctx.lineWidth = 1.8; ctx.shadowColor = '#e8ffd0'; ctx.shadowBlur = 6;
  if (!rocks) {
    (demo || []).forEach(drawRock);
    ctx.shadowBlur = 0; return;
  }
  rocks.forEach(drawRock);
  ctx.shadowBlur = 0;
  if (ship.dead <= 0 && !(ship.inv > 0 && Math.floor(t / 90) % 2)) drawShip(ship.x, ship.y, ship.a, ship.thrust);
  ctx.fillStyle = '#fff'; bullets.forEach(b => { ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3); });
  ctx.fillStyle = '#ff5edb'; sbullets.forEach(b => ctx.fillRect(b.x - 2, b.y - 2, 4, 4));
  if (saucer) {
    const s = saucer.small ? 0.6 : 1; ctx.save(); ctx.translate(saucer.x, saucer.y); ctx.scale(s, s);
    ctx.strokeStyle = '#ff5edb'; ctx.shadowColor = '#ff5edb'; ctx.shadowBlur = 10; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(22, 0); ctx.lineTo(12, 7); ctx.lineTo(-12, 7); ctx.closePath(); ctx.moveTo(-12, 0); ctx.lineTo(-7, -7); ctx.lineTo(7, -7); ctx.lineTo(12, 0); ctx.stroke(); ctx.restore(); ctx.shadowBlur = 0;
  }
  parts.forEach(p => { ctx.globalAlpha = Math.min(1, p.t * 1.5); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1, p.y - 1, 2.5, 2.5); }); ctx.globalAlpha = 1;
  ctx.font = '14px Silkscreen, monospace'; ctx.fillStyle = '#f4effd'; ctx.textAlign = 'left'; ctx.fillText('WAVE ' + wave, 12, 22);
  for (let i = 0; i < lives; i++) drawShip(W - 20 - i * 22, 18, -Math.PI / 2, false, '#c6ff3d');
  if (waveT > 0) { ctx.globalAlpha = Math.min(1, waveT); ctx.fillStyle = '#c6ff3d'; ctx.font = '30px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('WAVE ' + wave, W / 2, H / 2 - 60); ctx.globalAlpha = 1; }
}
A.loop(update, draw);
A.overlay({ title: 'ROCK RIFT', sub: 'Big rocks split into smaller, faster rocks. Clear the field to warp to the next wave. Watch out for the pink saucer.', btn: 'Start', scores: true, onGo: newGame });
})();
</script>
</body>
</html>
