<!doctype html>
<html lang="en">

<body data-game="circuit-chase" style="--game:#4fd8ff">

  </div>
  <p class="help"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> steer · <kbd>P</kbd> pause · swipe on phones</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>

function die() { state = 'dying'; phaseT = 1.6; A.tone(880, 1.2, 'square', 0.05, 0, 80); }

});

      for (const [name, d] of Object.entries(DIRS)) { const nx = wrap(x + d.x), ny = y + d.y, k = nx + ',' + ny; if (seen.has(k) || !passable(nx, ny) || danger(nx, ny)) continue; seen.set(k, [x, y, name]); q.push([nx, ny]); }
    }
    let first = null;
    if (goal) for (let k = goal[0] + ',' + goal[1]; ;) { const prev = seen.get(k); if (!prev) break; if (prev[0] === sx && prev[1] === sy) { first = prev[2]; break; } k = prev[0] + ',' + prev[1]; }
    if (!first) { let bs = -1; for (const [name, d] of Object.entries(DIRS)) { const nx = wrap(sx + d.x), ny = sy + d.y; if (!passable(nx, ny)) continue; const s = Math.min(...viruses.map(v => Math.abs(v.tx - nx) + Math.abs(v.ty - ny))); if (s > bs) { bs = s; first = name; } } }
    return first ? ['!' + DEMO_KEYS[first]] : [];
  }
});
