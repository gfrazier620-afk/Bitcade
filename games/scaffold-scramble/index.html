<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scaffold Scramble</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="scaffold-scramble" style="--game:#ff6f61">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>SCAFFOLD SCRAMBLE</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="dp"><button class="u" data-k="ArrowUp" aria-label="Climb up">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button><button class="d" data-k="ArrowDown" aria-label="Climb down">▼</button></div>
    <div class="ab"><button data-k="Space">JUMP</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>→</kbd> walk · <kbd>↑</kbd><kbd>↓</kbd> climb ladders · <kbd>Space</kbd> jump · <kbd>P</kbd> pause</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const W = 480, H = 560, ctx = A.canvas(cv, W, H);
// Girders from the ground (0) up. Each slopes toward its open end, so paint cans roll downhill and drop to the girder below.
const GIRDERS = [{ x0: 0, x1: 480, yl: 533, yr: 527 }];
for (let i = 1; i <= 5; i++) { const b = 530 - i * 82; GIRDERS.push(i % 2 ? { x0: 0, x1: 440, yl: b - 8, yr: b + 8 } : { x0: 40, x1: 480, yl: b + 8, yr: b - 8 }); }
GIRDERS.push({ x0: 180, x1: 300, yl: 46, yr: 46 }); // the finish platform
const TOP = GIRDERS.length - 1;
// [lower girder, x, broken] — a broken ladder only goes halfway
const LADDERS = [[0, 380], [0, 180, 1], [1, 110], [1, 260], [2, 360], [2, 200, 1], [3, 90], [3, 300], [4, 400], [4, 230, 1], [5, 240]].map(([i, x, b]) => ({ i, x, broken: !!b }));
const HAMMER_SPOTS = [[2, 440], [4, 100]];
const gy = (g, x) => { const G = GIRDERS[g]; return G.yl + (G.yr - G.yl) * (x - G.x0) / (G.x1 - G.x0); };
const downhill = g => GIRDERS[g].yr > GIRDERS[g].yl ? 1 : -1;
const CAN_COLS = ['#3d7bff', '#3dff8f', '#ffd23d', '#ff4fd8'];
let state = 'title', p = null, cans = [], hammers = [], pops = [], parts = [], score = 0, lives = 3, level = 1, bonus = 5000, bonusT = 0, throwT = 0, craneT = 0, phaseT = 0, msg = '', msgT = 0, nextLife = 20000;

function resetRun() {
  p = { x: 100, y: gy(0, 100), g: 0, st: 'walk', vx: 0, vy: 0, y0: 0, face: 1, lad: null, hammer: 0, walkT: 0 };
  cans = []; pops = []; throwT = 1.4; bonus = 5000; bonusT = 0;
  hammers = HAMMER_SPOTS.map(([g, x]) => ({ g, x, taken: false }));
}
function newGame() { score = 0; lives = A.easy ? 5 : 3; level = 1; nextLife = 20000; A.setScore(0); resetRun(); state = 'play'; say('CLIMB TO THE FLAG!'); A.jingle([392, 523, 659, 784], 0.09); }
function say(t) { msg = t; msgT = 1.8; }
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play' }); }
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();
  if (state === 'play' && c === 'Space' && p.st === 'walk' && !p.hammer) {
    const dir = (A.held('ArrowRight', 'KeyD') ? 1 : 0) - (A.held('ArrowLeft', 'KeyA') ? 1 : 0);
    p.st = 'jump'; p.vy = -232; p.vx = dir * 95; p.y0 = p.y; A.tone(520, 0.08, 'square', 0.03, 0, 780);
  }
});
A.onHide(pause);

const ladderAt = (g, x, goingUp) => LADDERS.find(L => (goingUp ? L.i === g : L.i + 1 === g && !L.broken) && Math.abs(L.x - x) < 8);
function updatePlayer(dt) {
  p.hammer = Math.max(0, p.hammer - dt);
  const dir = (A.held('ArrowRight', 'KeyD') ? 1 : 0) - (A.held('ArrowLeft', 'KeyA') ? 1 : 0);
  const up = A.held('ArrowUp', 'KeyW'), down = A.held('ArrowDown', 'KeyS');
  if (p.st === 'walk') {
    if (dir) { p.face = dir; p.walkT += dt; }
    const G = GIRDERS[p.g];
    p.x = A.clamp(p.x + dir * 95 * dt, G.x0 + 8, G.x1 - 8); p.y = gy(p.g, p.x);
    if (!p.hammer) { // no climbing with a hammer in hand
      const L = up ? ladderAt(p.g, p.x, true) : down ? ladderAt(p.g, p.x, false) : null;
      if (L) { p.st = 'climb'; p.lad = L; p.x = L.x; }
    }
  } else if (p.st === 'climb') {
    const L = p.lad, bot = gy(L.i, L.x), topY = gy(L.i + 1, L.x), lim = L.broken ? bot - (bot - topY) * 0.5 : topY;
    const v = (down ? 1 : 0) - (up ? 1 : 0); p.y += v * 62 * dt; if (v) p.walkT += dt;
    if (p.y <= lim) { if (L.broken) p.y = lim; else { p.g = L.i + 1; p.y = topY; p.st = 'walk'; if (p.g === TOP) clearLevel(); } }
    else if (p.y >= bot) { p.g = L.i; p.y = bot; p.st = 'walk'; }
  } else if (p.st === 'jump') {
    const before = p.y; p.x += p.vx * dt; p.vy += 760 * dt; p.y += p.vy * dt;
    if (p.x < 6 || p.x > W - 6) { p.x = A.clamp(p.x, 6, W - 6); p.vx = 0; }
    if (p.vy > 0) {
      for (let g = 0; g < GIRDERS.length; g++) {
        const G = GIRDERS[g]; if (p.x < G.x0 || p.x > G.x1) continue;
        const top = gy(g, p.x);
        if (before <= top && p.y >= top) {
          if (top - p.y0 > 36) return die('TOO FAR TO FALL');
          p.st = 'walk'; p.g = g; p.y = top; if (g === TOP) clearLevel(); return;
        }
      }
      if (p.y > H + 20) die('TOO FAR TO FALL');
    }
  }
}
function updateCans(dt) {
  const sp = 100 + level * 12;
  for (const c of cans) {
    if (c.st === 'roll') {
      const d = downhill(c.g), G = GIRDERS[c.g], ox = c.x;
      c.x += d * sp * dt; c.rot += d * sp * dt / 9;
      if (c.g > 0) for (const L of LADDERS) if (L.i + 1 === c.g && (ox - L.x) * (c.x - L.x) <= 0 && c.lastL !== L) {
        c.lastL = L; // decide once per ladder
        if (Math.random() < 0.25 + level * 0.03) { c.st = 'ladder'; c.lad = L; c.x = L.x; }
        break;
      }
      if (c.st !== 'roll') continue;
      if (c.x < G.x0 - 4 || c.x > G.x1 + 4) { if (c.g === 0) c.gone = true; else { c.st = 'fall'; c.vy = 40; c.dx = d; } }
      else c.y = gy(c.g, c.x) - 9;
    } else if (c.st === 'fall') {
      c.vy += 900 * dt; c.y += c.vy * dt; c.x += c.dx * 30 * dt;
      const g = c.g - 1, G = GIRDERS[g];
      if (c.x >= G.x0 && c.x <= G.x1 && c.y >= gy(g, c.x) - 9) { c.g = g; c.st = 'roll'; c.y = gy(g, c.x) - 9; A.tone(90, 0.06, 'square', 0.03); }
      if (c.y > H + 30) c.gone = true;
    } else { // down a ladder
      c.y += 95 * dt; c.rot += dt * 4;
      const by = gy(c.lad.i, c.lad.x) - 9;
      if (c.y >= by) { c.y = by; c.g = c.lad.i; c.st = 'roll'; c.lastL = c.lad; }
    }
  }
  cans = cans.filter(c => !c.gone);
}
function collide() {
  const py = p.y - 14; // middle of the worker
  for (const c of cans) {
    if (p.hammer > 0 && Math.abs(c.y - py) < 22 && (c.x - p.x) * p.face > -8 && (c.x - p.x) * p.face < 36) {
      c.gone = true; score += 300; pop(c.x, c.y, 300); burst(c.x, c.y, c.col); A.noise(0.15, 0.06); A.badge('smash');
      A.burst(c.x, c.y, { n: 16, colors: [c.col, shade(c.col, 0.4), '#fff'], speed: 220, gravity: 500, life: 0.6, size: 4 }); A.ring(c.x, c.y, c.col, 36); A.shake(3, 0.12); continue;
    }
    if (Math.abs(c.x - p.x) < 11 && Math.abs(c.y - py) < 13) return die('SPLAT!');
    if (p.st === 'jump' && !c.jumped && Math.abs(c.x - p.x) < 12 && c.y > p.y - 2 && c.y - p.y < 44) {
      c.jumped = true; score += 100; pop(p.x, p.y - 30, 100); A.tone(880, 0.06, 'square', 0.03); A.badge('jump');
    }
  }
  cans = cans.filter(c => !c.gone);
  for (const h of hammers) if (!h.taken && h.g === p.g && p.st === 'walk' && Math.abs(h.x - p.x) < 14) { h.taken = true; p.hammer = 9; A.jingle([523, 784, 1047], 0.06); say('HAMMER TIME!'); }
}
function pop(x, y, n) { pops.push({ x, y, n, t: 1 }); }
function burst(x, y, c) { for (let i = 0; i < 12; i++) { const a = Math.random() * 6.28, s = A.rand(40, 160); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, t: A.rand(0.3, 0.7), c }); } }
function die(why) {
  if (state !== 'play') return;
  state = 'dying'; phaseT = 1.6; lives--; say(why); burst(p.x, p.y - 14, '#ffd23d');
  A.burst(p.x, p.y - 14, { n: 10, kind: 'debris', colors: ['#ffd23d', '#2b4a8a', '#e3a877'], speed: 180, angle: -Math.PI / 2, spread: 2.2, life: 0.9 }); A.shake(8, 0.35); A.flash('#ff4f6d', 0.2); A.hitstop(0.1);
  A.noise(0.4, 0.07); A.tone(400, 0.7, 'sawtooth', 0.05, 0, 60);
}
function clearLevel() {
  state = 'clear'; phaseT = 2.6; score += bonus; A.setScore(score); A.badge('top');
  A.flash('#fff', 0.25); A.burst(p.x, p.y - 20, { n: 26, colors: ['#3dff8f', '#ffd23d', '#ff4fd8', '#4fd8ff'], speed: 240, gravity: 300, life: 1, size: 3 });
  say(`TOPPED OUT! +${bonus}`); A.jingle([523, 659, 784, 1047, 784, 1047], 0.1);
}
function gameOver() { state = 'over'; const rec = A.submit(score); A.overlay({ title: 'SITE CLOSED', big: `SCORE ${score} · LEVEL ${level}`, sub: rec ? 'New high score!' : `Best: ${A.best()}`, btn: 'Clock in again', onGo: newGame }); }

A.loop(dt => {
  parts.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 500 * dt; q.t -= dt; }); parts = parts.filter(q => q.t > 0);
  pops.forEach(q => { q.t -= dt; q.y -= 30 * dt; }); pops = pops.filter(q => q.t > 0);
  if (msgT > 0) msgT -= dt;
  craneT = Math.max(0, craneT - dt);
  if (state === 'dying') { phaseT -= dt; if (phaseT <= 0) { if (lives <= 0) return gameOver(); resetRun(); state = 'play'; } return; }
  if (state === 'clear') { phaseT -= dt; if (phaseT <= 0) { level++; resetRun(); state = 'play'; say(`LEVEL ${level}`); } return; }
  if (state !== 'play') return;
  bonusT += dt; if (bonusT >= 2) { bonusT -= 2; bonus -= 100; if (bonus <= 0) { bonus = 0; return die('OUT OF TIME'); } }
  throwT -= dt;
  if (throwT <= 0) { throwT = Math.max(0.95, 2.5 - level * 0.22) * A.rand(0.75, 1.25); craneT = 0.4; cans.push({ x: 74, y: gy(5, 74) - 9, g: 5, st: 'roll', rot: 0, col: A.pick(CAN_COLS) }); }
  updatePlayer(dt); if (state !== 'play') return;
  updateCans(dt);
  collide();
  if (score >= nextLife) { lives++; nextLife += 20000; A.jingle([660, 880, 1320], 0.08); }
  A.setScore(score);
}, t => {
  ctx.drawImage(city, 0, 0);
  drawCrane(t);
  LADDERS.forEach(drawLadder);
  GIRDERS.forEach(drawGirder);
  // finish flag
  ctx.fillStyle = '#0a0612'; ctx.fillRect(285, 5, 5, 42); ctx.fillStyle = '#e8ecf4'; ctx.fillRect(286, 6, 3, 40);
  const wave = k => 13 + Math.sin(t / 200 + k) * 3;
  ctx.fillStyle = '#0a0612'; ctx.beginPath(); ctx.moveTo(289, 5); ctx.lineTo(318, wave(0) - 1); ctx.lineTo(289, 21); ctx.fill();
  ctx.fillStyle = '#3dff8f'; ctx.beginPath(); ctx.moveTo(289, 6); ctx.quadraticCurveTo(302, wave(1) - 6, 316, wave(0)); ctx.quadraticCurveTo(302, wave(1) + 2, 289, 20); ctx.fill();
  ctx.font = '10px Silkscreen, monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#0a0612'; ctx.fillText('FINISH', 226, 39); ctx.fillStyle = '#3dff8f'; ctx.fillText('FINISH', 225, 38);
  hammers.forEach(h => { if (!h.taken) drawHammer(h.x, gy(h.g, h.x) - 30, Math.sin(t / 300) * 0.3); });
  const list = state === 'title' ? [{ x: 74 + ((t / 8) % 360), y: gy(5, 74 + ((t / 8) % 360)) - 9, rot: t / 80, col: '#3d7bff' }] : cans;
  list.forEach(drawCan);
  if (p && !(state === 'dying' && Math.floor(t / 100) % 2)) drawWorker(t);
  parts.forEach(q => { ctx.globalAlpha = Math.min(1, q.t * 2); ctx.fillStyle = q.c; ctx.fillRect(q.x - 2, q.y - 2, 4, 4); }); ctx.globalAlpha = 1;
  ctx.font = '12px Silkscreen, monospace'; ctx.textAlign = 'center'; pops.forEach(q => { ctx.fillStyle = '#0a0612'; ctx.fillText(q.n, q.x + 1, q.y + 1); ctx.fillStyle = '#ffd23d'; ctx.fillText(q.n, q.x, q.y); });
  if (p) {
    // top-left belongs to the crane, so the HUD sits on the right and under the ground girder
    ctx.font = '13px Silkscreen, monospace'; ctx.textAlign = 'right';
    ctx.fillStyle = bonus < 1000 && Math.floor(t / 250) % 2 ? '#ff4f6d' : '#ffd23d'; ctx.fillText('BONUS ' + bonus, W - 12, 20);
    ctx.fillStyle = '#f4effd'; ctx.fillText('LEVEL ' + level, W - 12, 38);
    for (let i = 0; i < lives - 1; i++) { ctx.fillStyle = '#ffd23d'; ctx.beginPath(); ctx.arc(W - 20 - i * 20, 54, 7, Math.PI, 0); ctx.fill(); ctx.fillRect(W - 29 - i * 20, 53, 18, 3); }
    if (p.hammer > 0) { ctx.textAlign = 'left'; ctx.fillStyle = '#ff6f61'; ctx.fillText('HAMMER ' + Math.ceil(p.hammer), 12, H - 8); }
  }
  if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT * 2); ctx.font = '22px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#0a0612'; ctx.fillText(msg, W / 2 + 2, 292); ctx.fillStyle = '#ff6f61'; ctx.shadowColor = '#ff6f61'; ctx.shadowBlur = 12; ctx.fillText(msg, W / 2, 290); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
});
/* ---------- art ---------- */
/** Lighten (k > 0) or darken (k < 0) a #rgb / #rrggbb colour. */
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
// the night city behind the site, drawn once: a moon, two rows of towers with lit windows, and a work light's glow
const city = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#08061c'); g.addColorStop(1, '#2a1030'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  let s = 13; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) { x.fillStyle = `rgba(255,255,255,${0.2 + r() * 0.5})`; x.fillRect(r() * W, r() * H * 0.5, 1, 1); }
  x.fillStyle = '#f0e6d0'; x.beginPath(); x.arc(400, 90, 20, 0, 6.29); x.fill(); x.fillStyle = 'rgba(200,180,150,.4)'; x.beginPath(); x.arc(394, 86, 4, 0, 6.29); x.arc(406, 96, 3, 0, 6.29); x.fill();
  for (const [col, base, win] of [['#140c28', 190, 'rgba(255,233,138,.25)'], ['#1c1236', 130, 'rgba(255,233,138,.45)']]) {
    for (let i = 0; i < 10; i++) { const bw = 36 + r() * 30, bx = i * 52 - 10 + r() * 10, bh = base + r() * 120; x.fillStyle = col; x.fillRect(bx, H - bh, bw, bh);
      for (let wy = H - bh + 8; wy < H - 10; wy += 12) for (let wx = bx + 5; wx < bx + bw - 5; wx += 9) if (r() < 0.35) { x.fillStyle = win; x.fillRect(wx, wy, 4, 5); } }
  }
  const lg = x.createRadialGradient(240, 0, 10, 240, 0, 300); lg.addColorStop(0, 'rgba(255,240,200,.08)'); lg.addColorStop(1, 'rgba(255,240,200,0)'); x.fillStyle = lg; x.fillRect(0, 0, W, H);
  return c;
})();
/** A girder: an outlined steel beam shaded top to bottom, a lit truss zig-zag, and rivets. The top one is gold. */
function drawGirder(G, i) {
  const th = 8, col = i === TOP ? '#ffd23d' : '#ff6f61', at = x => G.yl + (G.yr - G.yl) * (x - G.x0) / (G.x1 - G.x0);
  ctx.fillStyle = '#0a0612'; ctx.beginPath(); ctx.moveTo(G.x0 - 1, G.yl - 2); ctx.lineTo(G.x1 + 1, G.yr - 2); ctx.lineTo(G.x1 + 1, G.yr + th + 2); ctx.lineTo(G.x0 - 1, G.yl + th + 2); ctx.closePath(); ctx.fill();
  const mid = (G.yl + G.yr) / 2, g = ctx.createLinearGradient(0, mid, 0, mid + th); g.addColorStop(0, shade(col, 0.35)); g.addColorStop(1, shade(col, -0.4));
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(G.x0, G.yl); ctx.lineTo(G.x1, G.yr); ctx.lineTo(G.x1, G.yr + th); ctx.lineTo(G.x0, G.yl + th); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(col, 0.6); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(G.x0, G.yl + 0.5); ctx.lineTo(G.x1, G.yr + 0.5); ctx.stroke();
  ctx.strokeStyle = shade(col, -0.5); ctx.lineWidth = 1.5; ctx.beginPath();
  for (let x = G.x0; x < G.x1; x += 16) { ctx.moveTo(x, at(x) + 1.5); ctx.lineTo(x + 8, at(x + 8) + th - 1.5); ctx.lineTo(x + 16, at(x + 16) + 1.5); }
  ctx.stroke();
  ctx.fillStyle = shade(col, 0.55); for (let x = G.x0 + 8; x < G.x1; x += 16) ctx.fillRect(x - 0.5, at(x) + th / 2 - 0.5, 1.5, 1.5);
}
/** A ladder: outlined rails and rungs in cyan with a highlight; broken ones are missing their middle. */
function drawLadder(L) {
  const bot = gy(L.i, L.x) + 2, top = gy(L.i + 1, L.x) + 8, x = L.x, mid = bot - (bot - top) * 0.55;
  const path = () => { ctx.beginPath();
    const seg = (y0, y1) => { ctx.moveTo(x - 7, y0); ctx.lineTo(x - 7, y1); ctx.moveTo(x + 7, y0); ctx.lineTo(x + 7, y1); for (let y = y0 - 6; y > y1; y -= 9) { ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y); } };
    if (L.broken) { seg(bot, mid); seg(top + 10, top); } else seg(bot, top); };
  path(); ctx.strokeStyle = '#0a0612'; ctx.lineWidth = 4.5; ctx.stroke();
  path(); ctx.strokeStyle = '#2a8ab0'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.save(); ctx.translate(-0.7, -0.7); path(); ctx.strokeStyle = '#a0f0ff'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
}
/** A rolling paint can: outlined, shaded round, a white label band, a lid rim and a drip of its paint. */
function drawCan(c) {
  const col = c.col || '#3d7bff';
  ctx.save(); ctx.translate(c.x, c.y);
  ctx.fillStyle = '#0a0612'; ctx.beginPath(); ctx.arc(0, 0, 10.5, 0, 6.29); ctx.fill();
  ctx.rotate(c.rot || 0);
  const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, 10); g.addColorStop(0, shade(col, 0.5)); g.addColorStop(0.6, col); g.addColorStop(1, shade(col, -0.45));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 9, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#f4f0e8'; ctx.fillRect(-9, -3, 18, 6); ctx.fillStyle = col; ctx.fillRect(-4, -1.5, 8, 3);
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, 7, 3.6, 5.2); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(6, 7, 2, 3.5, 0.6, 0, 6.29); ctx.fill();
  ctx.restore();
}
/** A hammer: an outlined wooden handle and a steel head, lit from above. */
function drawHammer(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = '#0a0612'; ctx.fillRect(-3, -3, 6, 21); ctx.fillRect(-10, -9, 20, 10);
  ctx.fillStyle = '#c8905a'; ctx.fillRect(-2, -2, 4, 18); ctx.fillStyle = '#e8b880'; ctx.fillRect(-2, -2, 1, 18);

/** The crane: an outlined yellow lattice tower and jib, a cab with a lit window, a swinging hook, and its stack of cans. */
function drawCrane(t) {
  const base = gy(5, 30), swing = craneT > 0 ? 1 : 0;
  const lattice = () => { ctx.beginPath(); ctx.moveTo(18, base); ctx.lineTo(18, 14); ctx.moveTo(42, base); ctx.lineTo(42, 14);
    for (let y = base; y > 18; y -= 14) { ctx.moveTo(18, y); ctx.lineTo(42, y - 14); ctx.moveTo(18, y - 14); ctx.lineTo(42, y); }
    ctx.moveTo(10, 14); ctx.lineTo(130, 14); ctx.moveTo(42, 14); ctx.lineTo(130, 20); };
  lattice(); ctx.strokeStyle = '#0a0612'; ctx.lineWidth = 4.5; ctx.stroke(); lattice(); ctx.strokeStyle = '#ffd23d'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#0a0612'; ctx.fillRect(10, 6, 38, 14); const cg = ctx.createLinearGradient(0, 8, 0, 18); cg.addColorStop(0, '#ffe98a'); cg.addColorStop(1, '#c89a10'); ctx.fillStyle = cg; ctx.fillRect(12, 8, 34, 10);
  ctx.fillStyle = '#1a2450'; ctx.fillRect(16, 10, 10, 6); ctx.fillStyle = 'rgba(255,233,138,.7)'; ctx.fillRect(17, 11, 3, 2);
  const hx = 70 + swing * 6, hy = 40 + Math.sin(t / 300) * 3;
  ctx.strokeStyle = '#c0c6d0'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(hx, 14); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.strokeStyle = '#0a0612'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(hx, hy + 3, 3, 0, Math.PI); ctx.stroke(); ctx.strokeStyle = '#c0c6d0'; ctx.lineWidth = 1.5; ctx.stroke();

}
/** The worker: parts queued and painted the house way (dark outline pass, then fills lit from above), then the face. */
function drawWorker(t) {
  const x = Math.round(p.x), y = Math.round(p.y), f = p.face, climb = p.st === 'climb', step = Math.floor(p.walkT * 10) % 2;
  ctx.save(); ctx.translate(x, y); ctx.scale(climb ? 1 : f, 1);
  const parts = [], P = (px, py, w, h, c, flat) => parts.push([px, py, w, h, c, flat]);
  if (climb) { P(-6, -10 - step * 3, 4, 10, '#2b4a8a'); P(2, -10 - (1 - step) * 3, 4, 10, '#2b4a8a'); }
  else if (p.st === 'jump') { P(-6, -10, 4, 7, '#2b4a8a'); P(3, -9, 4, 7, '#2b4a8a'); }
  else { P(-6 + step * 2, -10, 4, 10, '#2b4a8a'); P(2 - step * 2, -10, 4, 10, '#2b4a8a'); }
  P(-7, -3, 6, 3, '#3a2414', true); P(1, -3, 6, 3, '#3a2414', true);
  P(-7, -22, 14, 13, '#3a5aa8'); P(-7, -22, 14, 4, '#ff6f61', true);
  P(-5, -31, 10, 9, '#e3a877'); P(-7, -34, 14, 4, '#ffd23d'); P(-5, -37, 10, 3, '#ffd23d', true);
  if (!(p.hammer > 0)) P(5, -19 + (climb ? -6 * step : 0), 4, 4, '#e3a877', true);
  ctx.fillStyle = '#0a0612'; for (const [px, py, w, h] of parts) ctx.fillRect(px - 1.5, py - 1.5, w + 3, h + 3);
  for (const [px, py, w, h, c, flat] of parts) {
    ctx.fillStyle = c; ctx.fillRect(px, py, w, h);
    if (flat || w < 5 || h < 5) continue;
    const e = Math.max(1, Math.round(Math.min(w, h) * 0.22)); ctx.fillStyle = shade(c, 0.3); ctx.fillRect(px, py, w, e); ctx.fillStyle = shade(c, -0.32); ctx.fillRect(px, py + h - e, w, e);
  }
  ctx.fillStyle = '#ffd23d'; ctx.fillRect(-5, -21, 2, 11); ctx.fillRect(3, -21, 2, 11);            // overall straps
  ctx.fillStyle = '#fff'; ctx.fillRect(0, -29, 3, 3); ctx.fillStyle = '#1a1010'; ctx.fillRect(1.5, -28.5, 1.5, 2); // eye
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(-4, -36, 4, 1.5);                            // shine on the hard hat
  if (p.hammer > 0) { const up = Math.floor(t / 110) % 2; ctx.save(); ctx.translate(6, -18); ctx.rotate(up ? -1.4 : 0.2);
    ctx.fillStyle = '#0a0612'; ctx.fillRect(-1, -3, 18, 5); ctx.fillRect(13, -8, 9, 15); ctx.fillStyle = '#c8905a'; ctx.fillRect(0, -2, 16, 3); ctx.fillStyle = '#c0c6d0'; ctx.fillRect(14, -7, 7, 13); ctx.fillStyle = '#f0f2f8'; ctx.fillRect(14, -7, 7, 2); ctx.restore(); }
  ctx.restore();
}
/* Attract demo: walk to the next good ladder and climb, jumping cans that roll your way. */
A.attract({
  start: newGame,
  stop: () => { state = 'title'; },
  bot: () => {
    if (state !== 'play' || !p) return [];
    if (p.st === 'climb') return ['ArrowUp'];
    if (p.st !== 'walk') return [];
    const L = LADDERS.filter(l => l.i === p.g && !l.broken).sort((a, b) => Math.abs(a.x - p.x) - Math.abs(b.x - p.x))[0];
    if (!L) return [];
    const dx = L.x - p.x, dir = dx > 0 ? 'ArrowRight' : 'ArrowLeft';
    const can = cans.find(c => c.g === p.g && c.st === 'roll' && Math.abs(c.x - p.x) < 46 && Math.sign(p.x - c.x) === downhill(c.g));
    if (can && !p.hammer) return [dir, '!Space'];
    return Math.abs(dx) < 4 ? ['ArrowUp'] : [dir];
  }
});
A.overlay({ title: 'SCAFFOLD SCRAMBLE', sub: 'A runaway crane is rolling paint cans down the building site. Climb the ladders to the finish flag. Jump the cans for points, and grab a hammer to smash them. Broken ladders only go halfway.', btn: 'Clock in', scores: true, onGo: newGame });
