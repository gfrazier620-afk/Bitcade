<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Knockout Kings</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preload" href="../../shared/fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="../../shared/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="knockout-kings" data-pad="0:KeyJ 1:KeyK 2:Space 3:Space" style="--game:#ff4a4a">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>KNOCKOUT KINGS</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="dp"><button class="u" data-k="ArrowUp" aria-label="Block">▲</button><button class="l" data-k="ArrowLeft" aria-label="Dodge left">◀</button><button class="r" data-k="ArrowRight" aria-label="Dodge right">▶</button><button class="d" data-k="ArrowDown" aria-label="Duck">▼</button></div>
    <div class="ab"><button class="sm" data-k="Space">★ STAR</button><button class="sm" data-k="KeyK">BODY</button><button data-k="KeyJ">JAB</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>→</kbd> dodge · <kbd>↓</kbd> duck · hold <kbd>↑</kbd> block · <kbd>J</kbd> jab (head) · <kbd>K</kbd> body blow · <kbd>Space</kbd> star punch when you've earned a ★ · <kbd>P</kbd> pause · gamepad: A jab, B body, X/Y star, d-pad dodge, duck and block</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script src="../../shared/story.js"></script>
<script>
(() => {
/*
 * Knockout Kings: cartoon boxing seen from behind your boxer, Kid Comet. Each opponent telegraphs every attack (a
 * wind-up, a flash, a sound): dodge left or right, duck, or block, depending on the punch. Make them miss and they're
 * open for a moment: punches land double, and a clean counter earns a star. Spend a star on a star punch (Space).
 * Jabs go to the head, body blows low; punch into their guard and you lose a heart, and with no hearts left you're
 * too tired to punch for a bit. Knock them down three times for a KO. Five opponents up to the champion, the Iron Duke.
 * Story mode (shared/story.js): From the Bottom, a seven-fight career from a back-alley bout to the world title, with
 * training bought with prize purses, then HARD and the Gauntlet (every fighter back to back on one health bar).
 */
const A = Arcade, cv = document.getElementById('cv');
const W = 480, H = 360, ctx = A.canvas(cv, W, H), OUT = '#0a0612', CX = W / 2;
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
const sprite = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };
/** A blob drawn the house way: an outline, then a fill lit from the top-left. */
function blob(x, y, rx, ry, c, rot = 0) {
  ctx.fillStyle = OUT; ctx.beginPath(); ctx.ellipse(x, y, rx + 2.5, ry + 2.5, rot, 0, 6.29); ctx.fill();
  const g = ctx.createRadialGradient(x - rx * 0.35, y - ry * 0.4, 1, x, y, Math.max(rx, ry)); g.addColorStop(0, shade(c, 0.35)); g.addColorStop(0.6, c); g.addColorStop(1, shade(c, -0.3));
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 6.29); ctx.fill();
}

/* ---------- the arena: a dark hall, the crowd, the ring (drawn once) ---------- */
const ARENA = sprite(W, H, x => {
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a0614'); g.addColorStop(1, '#2a1030'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 5; i++) { const lg = x.createRadialGradient(60 + i * 90, -20, 4, 60 + i * 90, -20, 160); lg.addColorStop(0, 'rgba(255,240,200,.18)'); lg.addColorStop(1, 'rgba(255,240,200,0)'); x.fillStyle = lg; x.fillRect(0, 0, W, 200); }
  let s = 5; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let row = 0; row < 5; row++) for (let i = 0; i < 26; i++) { const px = i * 19 + (row % 2) * 9 + r() * 4, py = 120 + row * 16; x.fillStyle = `rgb(${30 + row * 8},${18 + row * 6},${40 + row * 8})`; x.beginPath(); x.arc(px, py, 7, 0, 6.29); x.fill(); x.fillRect(px - 8, py + 4, 16, 14); }
  // the canvas floor and the ring posts
  x.fillStyle = '#c8c4d8'; x.beginPath(); x.moveTo(-40, H); x.lineTo(60, 214); x.lineTo(W - 60, 214); x.lineTo(W + 40, H); x.fill();
  x.fillStyle = 'rgba(0,0,0,.08)'; for (let i = 0; i < 12; i++) x.fillRect(0, 220 + i * 12, W, 1);
  x.fillStyle = '#e8203a'; x.font = '22px Bungee, sans-serif'; x.textAlign = 'center'; x.globalAlpha = 0.18; x.fillText('KNOCKOUT KINGS', CX, 300); x.globalAlpha = 1;
  [[46, 120], [W - 46, 120]].forEach(([px, py]) => { x.fillStyle = OUT; x.fillRect(px - 7, py - 2, 14, 104); x.fillStyle = '#c8c8d8'; x.fillRect(px - 5, py, 10, 100); });
});
function ropes() { [['#e8203a', 150], ['#f4f4f4', 168], ['#3d6aff', 186]].forEach(([c, y]) => { ctx.fillStyle = OUT; ctx.fillRect(0, y - 2, W, 6); ctx.fillStyle = c; ctx.fillRect(0, y - 1, W, 4); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(0, y - 1, W, 1); }); }

/* ---------- five opponents ---------- */
const FOES = [
  { name: 'TUBBY THUNDER', skin: '#f0b080', trunks: '#3d9aff', glove: '#c8203a', hair: '#3a2414', girth: 1.35, hp: 90, speed: 1.0, moves: ['jab', 'jab', 'hookL', 'hookR', 'belly'], style: 'tubby', blurb: 'All belly, no brakes.' },
  { name: 'PROFESSOR JAB', skin: '#e0a878', trunks: '#5a3aa8', glove: '#3a3a4a', hair: '#e8e8f0', girth: 1.0, hp: 100, speed: 1.15, moves: ['jab', 'jab', 'flurry', 'hookL', 'hookR', 'upper'], style: 'prof', blurb: 'Has studied every punch ever thrown.' },
  { name: 'GLACIER GLENN', skin: '#b8d8f0', trunks: '#e8f4ff', glove: '#5ee7ff', hair: '#ffffff', girth: 1.15, hp: 120, speed: 1.2, moves: ['jab', 'hookL', 'hookR', 'upper', 'freeze'], style: 'ice', blurb: 'Cool as ice. Hits like a glacier.' },
  { name: 'ROCKET RITA', skin: '#c8885a', trunks: '#ff4fd1', glove: '#ffd23d', hair: '#1a1018', girth: 0.95, hp: 120, speed: 1.4, moves: ['jab', 'jab', 'hookL', 'hookR', 'upper', 'rocket', 'flurry'], style: 'rita', blurb: 'Zero to knockout in half a second.' },
  { name: 'THE IRON DUKE', skin: '#a8704a', trunks: '#ffd23d', glove: '#2a2a34', hair: '#1a1018', girth: 1.2, hp: 160, speed: 1.55, moves: ['jab', 'hookL', 'hookR', 'upper', 'rocket', 'flurry', 'belly'], style: 'duke', blurb: 'The champion. Never lost a title fight.' }];
// the story's career: two fighters you only meet there, round the five from the ladder
const SAM = { name: 'SLUGGER SAM', skin: '#f0c090', trunks: '#8a5a3a', glove: '#a8703a', hair: '#c8203a', girth: 1.05, hp: 70, speed: 0.85, moves: ['jab', 'jab', 'hookL', 'hookR'], style: 'sam', blurb: 'Fights in the alley behind the laundromat. Swings wild.' };
const MAX = { name: 'MEGA MAULER MAX', skin: '#c08050', trunks: '#16161e', glove: '#ff4a4a', hair: '#3dff8f', girth: 1.5, hp: 170, speed: 1.35, moves: ['upper', 'belly', 'rocket', 'hookL', 'hookR', 'freeze', 'jab'], style: 'max', blurb: 'Undefeated. Unstoppable. Unbelievably large.' };
const CAREER = [SAM, FOES[0], FOES[1], FOES[2], FOES[3], MAX, FOES[4]];
// how each attack is beaten: dodge either way (L/R), duck, or block
const AVOID = { jab: ['L', 'R', 'D', 'B'], hookL: ['R', 'D'], hookR: ['L', 'D'], upper: ['L', 'R'], belly: ['L', 'R'], rocket: ['D'], flurry: ['B'], freeze: ['L', 'R'] };
const DMG = { jab: 8, hookL: 14, hookR: 14, upper: 20, belly: 16, rocket: 18, flurry: 5, freeze: 22 };
const TELL = { jab: 0.65, hookL: 0.85, hookR: 0.85, upper: 0.95, belly: 1.0, rocket: 0.9, flurry: 0.6, freeze: 1.1 };
const HINT = { jab: 'DODGE, DUCK OR BLOCK', hookL: 'DODGE RIGHT OR DUCK', hookR: 'DODGE LEFT OR DUCK', upper: 'DODGE!', belly: 'DODGE!', rocket: 'DUCK!', flurry: 'BLOCK!', freeze: 'DODGE!' };

/* ---------- state ---------- */
let state = 'title', fight = 0, loop = 0, score = 0, lives = 3, msg = '', msgT = 0, clock = 0, perfect = true;
let S = null, gauntlet = false, beaten = 0, list = FOES; // story runs: the career, or the Gauntlet
const up = id => S ? S.lv(id) : 0;
const me = { max: 100, hp: 100, hearts: 20, stars: 0, act: null, actT: 0, tired: 0, down: 0, mash: 0, downs: 0, flash: 0, punchHand: 0 };
const op = { hp: 100, max: 100, act: 'guard', t: 0, next: 1.5, move: null, guard: 'high', open: 0, flash: 0, downs: 0, count: 0, sway: 0, hitT: 0, flurryN: 0, face: 'calm' };
const F = () => list[fight];
const say = (t, s = 1.4) => { msg = t; msgT = s; };
function startFight() {
  const f = F(), k = 1 + loop * 0.35;
  Object.assign(op, { hp: Math.round(f.hp * k), max: Math.round(f.hp * k), act: 'intro', t: 0, next: 1.4, move: null, guard: 'high', open: 0, flash: 0, downs: 0, count: 0, face: 'calm' });
  const keep = gauntlet && fight > 0 ? Math.min(me.max, me.hp + 30) : null; // the Gauntlet: one health bar, a breather between fights
  me.max = 100 + up('health') * 15;
  Object.assign(me, { hp: keep || me.max, hearts: 20 + up('stamina') * 5, stars: up('star'), act: null, actT: 0, tired: 0, down: 0, mash: 0, downs: 0, flash: 0 });
  clock = 180; perfect = true;
  if (S && S.run && !gauntlet) { S.reach(fight); say(`${S.stageName(fight).toUpperCase()} · ${f.name}`, 2.4); }
  else say(gauntlet ? `GAUNTLET ${fight + 1}/${list.length} · ${f.name}` : `FIGHT ${fight + 1 + loop * 5} · ${f.name}`, 2.2);
  A.jingle([392, 523, 659, 784], 0.1);
}
function newGame() { S.run = null; list = FOES; gauntlet = false; fight = 0; loop = 0; score = 0; A.setScore(0); lives = A.easy ? 5 : 3; startFight(); state = 'play'; }
/** A story run: a fight of the career (then the next), or the Gauntlet. */
function storyGame(run) { list = CAREER; gauntlet = run.mode === 'gauntlet'; loop = run.hard ? 1 : 0; fight = gauntlet ? 0 : run.stage; beaten = 0; score = 0; A.setScore(0); lives = 1; me.hp = 0; startFight(); state = 'play'; }
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play', alt: S.quit() }); }
A.onHide(pause);
const add = (n, x, y, c = '#ffd23d') => { score += n; A.setScore(score); if (x !== undefined) A.pop(x, y, '+' + n, c); };

/* ---------- you ---------- */
const busy = () => me.down || (me.act && me.actT > 0);
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();
  if (state !== 'play') return;
  if (me.down) { if (['KeyJ', 'KeyK', 'Space', 'KeyZ', 'KeyX'].includes(c)) { me.mash += 1; A.tone(300 + me.mash * 20, 0.04, 'square', 0.03); } return; }
  if (busy() || op.act === 'down' || op.act === 'intro') return;
  const dodge = 0.42 + up('speed') * 0.07; // speed bag work: a longer dodge
  if (c === 'ArrowLeft' || c === 'KeyA') act('L', dodge); else if (c === 'ArrowRight' || c === 'KeyD') act('R', dodge);
  else if (c === 'ArrowDown' || c === 'KeyS') act('D', dodge);
  else if (c === 'KeyJ' || c === 'KeyZ') punch('jab'); else if (c === 'KeyK' || c === 'KeyX') punch('body');
  else if (c === 'Space' || c === 'KeyL' || c === 'Enter') punch('star');
});
function act(a, t) { me.act = a; me.actT = t; A.tone(a === 'D' ? 180 : 240, 0.06, 'triangle', 0.03, 0, a === 'D' ? 120 : 420); }
function punch(kind) {
  if (me.tired > 0) { A.tone(120, 0.1, 'square', 0.03); return; }
  if (kind === 'star' && me.stars <= 0) return;
  me.act = kind; me.actT = kind === 'star' ? 0.55 : 0.24; me.punchHand = kind === 'jab' ? 0 : kind === 'body' ? 1 : 2;
  setTimeout(() => land(kind), kind === 'star' ? 300 : 110);
}
function land(kind) {
  if (state !== 'play' || op.act === 'down' || me.down) return;
  const attacking = op.act === 'tell' || op.act === 'strike';
  if (kind === 'star') { me.stars--; }
  const blocked = kind !== 'star' && !op.open && !attacking && ((kind === 'jab' && op.guard === 'high') || (kind === 'body' && op.guard === 'low'));
  if (blocked) { me.hearts = Math.max(0, me.hearts - 1); A.tone(140, 0.08, 'square', 0.04); A.pop(CX, 120, 'BLOCKED', '#a39bc4'); if (!me.hearts) tire(); op.guard = op.guard === 'high' ? 'low' : 'high'; return; }
  const open = op.open > 0, dmg = Math.round((kind === 'star' ? (open ? 34 : 24) : (kind === 'jab' ? 4 : 5) * (open ? 2 : 1)) * (1 + up('power') * 0.25));
  op.hp -= dmg; op.flash = 0.12; op.hitT = 0.25; op.face = 'hurt'; op.sway = kind === 'body' ? 0 : (me.punchHand ? 1 : -1) * 10;
  if (attacking && kind !== 'star') { op.act = 'guard'; op.t = 0; op.next = 1.2; op.open = 0.8; say('COUNTER!', 0.9); } // a punch during the wind-up interrupts it
  const pts = kind === 'star' ? 300 : open ? 40 : 10; add(pts, CX + A.rand(-30, 30), 110);
  if (open && kind !== 'star' && Math.random() < 0.25 && me.stars < 3) { me.stars++; A.pop(CX, 70, '★ STAR!', '#ffd23d'); A.jingle([988, 1319], 0.06, 'square'); }
  A.hitstop(kind === 'star' ? 0.2 : 0.05); A.shake(kind === 'star' ? 12 : open ? 5 : 3, 0.2);
  A.burst(CX + A.rand(-20, 20), kind === 'body' ? 200 : 110, { n: kind === 'star' ? 30 : 8, colors: kind === 'star' ? ['#ffd23d', '#fff', '#ff4fd1'] : ['#fff', '#ffd23d'], speed: kind === 'star' ? 240 : 120, life: 0.35 });
  A.tone(kind === 'star' ? 90 : 160, kind === 'star' ? 0.3 : 0.08, 'square', 0.06, 0, 50); if (kind === 'star') { A.badge('star'); A.flash('#fff', 0.3); }
  if (op.hp <= 0) knockdown();
}
function tire() { me.tired = 2.5; say('TIRED!', 1.2); A.tone(200, 0.4, 'triangle', 0.04, 0, 90); }

/* ---------- the opponent: guard, then a tell, then the punch; open after a miss ---------- */
function pickMove() {
  const f = F(), m = f.moves[Math.floor(Math.random() * f.moves.length)];
  op.move = m; op.act = 'tell'; op.t = 0; op.face = 'angry'; op.flurryN = m === 'flurry' ? 4 : 0;
  op.tellT = TELL[m] / (f.speed * (1 + loop * 0.15)); A.tone(m === 'upper' || m === 'rocket' ? 520 : 300, 0.12, 'square', 0.035, 0, m === 'upper' ? 900 : 200);
}
function strike() {
  const m = op.move, ok = me.act && (me.act === 'B' || me.actT > 0) && AVOID[m].includes(me.act) && !(m === 'flurry' && me.act !== 'B');
  op.act = 'strike'; op.t = 0;
  if (ok) { // a miss: they're open
    if (m !== 'flurry' || --op.flurryN <= 0) { op.open = 1.3 / (1 + loop * 0.1); op.face = 'dizzy'; add(20, CX, 90, '#5ee7ff'); A.tone(880, 0.06, 'triangle', 0.03); say(m === 'flurry' ? 'BLOCKED THEM ALL!' : 'MISSED! HIT THEM!', 0.9); }
    else { A.tone(600, 0.05, 'square', 0.02); op.act = 'tell'; op.t = op.tellT * 0.55; }
    return;
  }
  // a hit on you
  const dmg = Math.round(DMG[m] * (1 + loop * 0.2)); me.hp -= dmg; me.flash = 0.25; me.hearts = Math.max(0, me.hearts - 3); perfect = false;
  A.shake(m === 'upper' || m === 'freeze' ? 12 : 7, 0.3); A.flash('#ff4f6d', 0.18); A.sfx('hurt'); A.tone(80, 0.25, 'sawtooth', 0.06, 0, 40); A.hitstop(0.08);
  if (!me.hearts) tire();
  if (m === 'flurry' && --op.flurryN > 0) { op.act = 'tell'; op.t = op.tellT * 0.55; }
  if (me.hp <= 0) { me.hp = 0; me.down = 1; me.mash = 0; me.downs++; op.act = 'guard'; op.next = 9; say('YOU\'RE DOWN! MASH TO GET UP!', 2); A.tone(60, 0.8, 'sawtooth', 0.06, 0, 30); }
}
function knockdown() {
  op.hp = 0; op.act = 'down'; op.t = 0; op.downs++; op.count = 0; op.getUp = 2 + Math.floor(Math.random() * 3) + op.downs * 2; op.open = 0; op.face = 'ko'; add(1000, CX, 100);
  A.shake(14, 0.6); A.flash('#fff', 0.3); A.sfx('boom'); say(op.downs >= 3 ? 'KNOCKOUT!' : 'DOWN!', 1.6);
}
function winFight() {
  const bonus = 3000 * (fight + 1 + loop * 5) + Math.round(clock) * 20; add(bonus); say(`YOU WIN! +${bonus}`, 2.6);
  A.jingle([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.1, 'square');
  if (perfect) A.badge('perfect');
  if (F() === FOES[4]) A.badge('champ');
  S.bank([60, 80, 100, 120, 140, 170, 220][fight] || 100); // the prize purse
  if (S.run) { state = 'between';
    setTimeout(() => { if (state !== 'between') return;
      if (gauntlet) { beaten++; if (++fight >= list.length) { state = 'over'; return S.modeEnd(beaten, { title: 'GAUNTLET CLEARED!', big: `ALL ${beaten} FIGHTERS` }); } startFight(); state = 'play'; return; }
      if (S.clear(fight)) { state = 'over'; return S.win(); }
      fight++; startFight(); state = 'play'; }, 2800);
    return; }
  state = 'between'; setTimeout(() => { if (state !== 'between') return; fight++; if (fight >= FOES.length) { fight = 0; loop++; say('TITLE DEFENSE!', 2); } startFight(); state = 'play'; }, 2800);
}
function loseFight(why) {
  if (S.run) { state = 'between'; say(why, 2.2); A.jingle([392, 330, 262, 196], 0.16, 'triangle');
    setTimeout(() => { if (state !== 'between') return; state = 'over'; if (gauntlet) return S.modeEnd(beaten, { title: 'OUT OF THE GAUNTLET', big: `${beaten} FIGHTER${beaten === 1 ? '' : 'S'} BEATEN` }); S.run.stage = fight; S.fail({ title: why, big: `${S.stageName(fight).toUpperCase()} · ${F().name}`, sub: 'Train up with your prize money, then try again' }); }, 2400);
    return; }
  lives--; say(why, 2.2); A.jingle([392, 330, 262, 196], 0.16, 'triangle');
  state = 'between'; setTimeout(() => { if (state !== 'between') return; if (lives <= 0) return gameOver(); startFight(); state = 'play'; say(`REMATCH! ${lives} LEFT`, 1.8); }, 2600);
}
function gameOver() {
  state = 'over'; const rec = A.submit(score);
  A.overlay({ title: 'DOWN AND OUT', big: `SCORE ${score.toLocaleString()} · FIGHT ${fight + 1 + loop * 5}`, sub: rec ? 'New high score!' : `Best: ${A.best().toLocaleString()}`, btn: 'Back in the ring', onGo: newGame });
}

/* ---------- update ---------- */
function update(dt) {
  if (msgT > 0) msgT -= dt;
  if (state !== 'play') return;
  if (me.flash > 0) me.flash -= dt; if (op.flash > 0) op.flash -= dt; if (op.hitT > 0) op.hitT -= dt; else if (op.face === 'hurt') op.face = 'calm';
  op.sway *= 1 - dt * 8;
  if (me.actT > 0) { me.actT -= dt; if (me.actT <= 0 && me.act !== 'B') me.act = null; }
  const blocking = A.held('ArrowUp', 'KeyW') && !me.down && !(me.act && me.act !== 'B' && me.actT > 0);
  if (blocking) { me.act = 'B'; me.actT = 0.05; } else if (me.act === 'B') me.act = null; // holding up blocks
  if (me.tired > 0 && (me.tired -= dt) <= 0) { me.hearts = 10; say('SECOND WIND', 1); }
  if (op.act !== 'down' && !me.down) { clock -= dt; if (clock <= 0) { clock = 0; return op.hp / op.max < me.hp / me.max ? (add(500), winFight()) : loseFight('THE JUDGES SAY NO'); } }
  // you, getting up
  if (me.down) {
    me.down += dt; const need = Math.max(4, 8 + me.downs * 6 - up('chin') * 3);
    if (me.mash >= need) { me.down = 0; me.hp = Math.round(me.max * 0.45) - me.downs * 8; op.next = 1.2; op.act = 'guard'; say('BACK UP!', 1); A.jingle([523, 659, 784], 0.08); }
    else if (me.down > 10 || me.downs >= 3) { me.down = 0; return loseFight(me.downs >= 3 ? 'THREE KNOCKDOWNS · TKO' : 'COUNTED OUT'); }
    return;
  }
  // them
  op.t += dt;
  if (op.open > 0) { op.open -= dt; if (op.open <= 0) { op.face = 'calm'; op.act = 'guard'; op.t = 0; op.next = 0.6 + Math.random() * 0.8; } return; }
  if (op.act === 'intro') { if (op.t > 1.4) { op.act = 'guard'; op.t = 0; op.next = 0.8; } return; }
  if (op.act === 'down') {
    if (op.downs >= 3) { if (op.t > 1.2) return winFight(); return; }
    const getUp = op.getUp;

function drawYou(t) {
