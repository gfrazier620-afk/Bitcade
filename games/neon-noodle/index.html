<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Noodle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="neon-noodle" style="--game:#3dff8f">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>NEON NOODLE</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="dp"><button class="u" data-k="ArrowUp" aria-label="Up">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button><button class="d" data-k="ArrowDown" aria-label="Down">▼</button></div>
    <div class="ab"><button class="sm" data-k="KeyP">PAUSE</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> steer · <kbd>P</kbd> pause · swipe on phones</p>
</main>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const N = 24, CS = 20, ctx = A.canvas(cv, N * CS, N * CS);
let snake, dir, queue, food, bonus, score, state = 'title', stepT, speed, grow, eaten, deathT = 0;
const DV = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };

function reset() {
  snake = [{ x: 8, y: 12 }, { x: 7, y: 12 }, { x: 6, y: 12 }];
  dir = DV.right; queue = []; score = 0; speed = 0.13; stepT = 0; grow = 0; eaten = 0; bonus = null; food = null;
  food = free(); A.setScore(0);
}
function free() {
  let p;
  do { p = { x: A.rnd(N), y: A.rnd(N) }; }
  while (snake.some(s => s.x === p.x && s.y === p.y) || (food && food.x === p.x && food.y === p.y) || (bonus && bonus.x === p.x && bonus.y === p.y));
  return p;
}
function turn(d) {
  const v = DV[d]; if (!v) return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  if ((v.x === -last.x && v.y === -last.y) || (v.x === last.x && v.y === last.y)) return;
  if (queue.length < 3) queue.push(v);
}
function start() { reset(); state = 'play'; A.jingle([523, 659, 784], 0.07); }
function pause() {
  if (state !== 'play') return; state = 'paused';
  A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => { state = 'play'; } });
}
function die() {
  state = 'dying'; deathT = 0.9; A.noise(0.5, 0.08); A.tone(300, 0.5, 'sawtooth', 0.05, 0, 60);
  setTimeout(() => {
    state = 'over';
    const rec = A.submit(score);
    A.overlay({ title: 'GAME OVER', big: `SCORE ${score} · LENGTH ${snake.length}`, sub: rec ? 'New high score!' : `Best: ${A.best()}`, btn: 'Play again', onGo: start });
  }, 900);
}
function step() {
  if (queue.length) dir = queue.shift();
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const body = grow ? snake.length : snake.length - 1;
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.slice(0, body).some(s => s.x === h.x && s.y === h.y)) return die();
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) {
    score += 10; grow += 2; eaten++;
    A.tone(660, 0.05); A.tone(990, 0.06, 'square', 0.04, 0.05);
    food = free(); speed = Math.max(0.055, speed - 0.0024);
    if (!bonus && eaten % 5 === 0) bonus = { ...free(), t: 6 };
  } else if (bonus && h.x === bonus.x && h.y === bonus.y) {
    const pts = 20 + Math.ceil(bonus.t) * 10; score += pts; grow += 4; bonus = null;
    A.jingle([784, 988, 1175, 1568], 0.05);
  }
  if (grow > 0) grow--; else snake.pop();
  A.setScore(score);
}
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();
  if (state === 'play' && KEYS[c]) turn(KEYS[c]);
});
A.swipe(cv, d => { if (state === 'play') turn(d); });
A.onHide(pause);

A.loop(dt => {
  if (state === 'dying') deathT -= dt;
  if (state !== 'play') return;
  if (bonus) { bonus.t -= dt; if (bonus.t <= 0) bonus = null; }
  stepT += dt;
  while (stepT >= speed && state === 'play') { stepT -= speed; step(); }
}, t => {
  ctx.fillStyle = '#060a10'; ctx.fillRect(0, 0, N * CS, N * CS);
  ctx.fillStyle = 'rgba(61,255,143,.07)';
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) ctx.fillRect(x * CS + CS / 2 - 1, y * CS + CS / 2 - 1, 2, 2);
  if (!snake) { // title attract
    const k = Math.floor(t / 120);
    for (let i = 0; i < 10; i++) { const x = (k - i + N * 4) % (N + 10) - 5; seg(x, 12 + Math.round(Math.sin((k - i) / 3) * 2), 1 - i / 12, i === 0); }
    return;
  }
  // food
  const pulse = 0.7 + Math.sin(t / 160) * 0.3;
  ctx.shadowColor = '#ff4fa3'; ctx.shadowBlur = 14 * pulse; ctx.fillStyle = '#ff4fa3';
  ctx.beginPath(); ctx.arc(food.x * CS + CS / 2, food.y * CS + CS / 2, 5 + pulse * 1.5, 0, Math.PI * 2); ctx.fill();
  if (bonus) {
    const cx = bonus.x * CS + CS / 2, cy = bonus.y * CS + CS / 2;
    ctx.shadowColor = '#ffd23d'; ctx.shadowBlur = 16; ctx.fillStyle = '#ffd23d';
    ctx.beginPath(); ctx.moveTo(cx, cy - 8); ctx.lineTo(cx + 7, cy); ctx.lineTo(cx, cy + 8); ctx.lineTo(cx - 7, cy); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,210,61,.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 13, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (bonus.t / 6)); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  const dead = state === 'dying' || state === 'over';
  const flicker = state === 'dying' && Math.floor(t / 90) % 2;
  if (!flicker) snake.forEach((s, i) => seg(s.x, s.y, 1 - (i / snake.length) * 0.65, i === 0, dead));
});
function seg(x, y, a, head, dead) {
  const px = x * CS, py = y * CS;
  ctx.shadowColor = dead ? '#ff3b3b' : '#3dff8f'; ctx.shadowBlur = head ? 16 : 8;
  ctx.fillStyle = dead ? `rgba(255,80,80,${a})` : `rgba(61,255,143,${a})`;
  ctx.beginPath(); ctx.roundRect(px + 2, py + 2, CS - 4, CS - 4, head ? 7 : 5); ctx.fill(); ctx.shadowBlur = 0;
  if (head && dir) {
    ctx.fillStyle = '#04120a';
    const ex = dir.x ? [dir.x * 4, dir.x * 4] : [-4, 4], ey = dir.y ? [dir.y * 4, dir.y * 4] : [-4, 4];
    for (let k = 0; k < 2; k++) { ctx.beginPath(); ctx.arc(px + CS / 2 + ex[k], py + CS / 2 + ey[k], 2.2, 0, Math.PI * 2); ctx.fill(); }
  }
}
A.overlay({ title: 'NEON NOODLE', sub: 'Eat the pink pellets to grow. Grab gold gems before they fade. Don’t hit the walls or your own tail.', btn: 'Start', onGo: start });
})();
</script>
</body>
</html>
