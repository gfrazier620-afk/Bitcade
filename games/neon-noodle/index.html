<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Noodle</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="neon-noodle" style="--game:#3dff8f">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>NEON NOODLE</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="dp"><button class="u" data-k="ArrowUp" aria-label="Up">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button><button class="d" data-k="ArrowDown" aria-label="Down">▼</button></div>
    <div class="ab"><button class="sm" data-k="KeyP">PAUSE</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> steer · <kbd>P</kbd> pause · swipe on phones</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const N = 24, CS = 20, ctx = A.canvas(cv, N * CS, N * CS);
let snake, prev = [], dir, queue, food, bonus, score, state = 'title', stepT = 0, speed = 0.13, grow, eaten, deathT = 0;
const DV = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };

function reset() {
  snake = [{ x: 8, y: 12 }, { x: 7, y: 12 }, { x: 6, y: 12 }]; prev = snake.map(p => ({ ...p }));
  dir = DV.right; queue = []; score = 0; speed = 0.13; stepT = 0; grow = 0; eaten = 0; bonus = null; food = null;
  food = free(); A.setScore(0);
}
function free() {
  let p;
  do { p = { x: A.rnd(N), y: A.rnd(N) }; }
  while (snake.some(s => s.x === p.x && s.y === p.y) || (food && food.x === p.x && food.y === p.y) || (bonus && bonus.x === p.x && bonus.y === p.y));
  return p;
}
function turn(d) {
  const v = DV[d]; if (!v) return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  if ((v.x === -last.x && v.y === -last.y) || (v.x === last.x && v.y === last.y)) return;
  if (queue.length < 3) queue.push(v);
}
function start() { reset(); state = 'play'; A.jingle([523, 659, 784], 0.07); }
function pause() {
  if (state !== 'play') return; state = 'paused';
  A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => { state = 'play'; } });
}
function die() {
  state = 'dying'; deathT = 0.9; A.noise(0.5, 0.08); A.tone(300, 0.5, 'sawtooth', 0.05, 0, 60);
  A.hitstop(0.12); A.shake(10, 0.45); A.flash('#ff3b3b', 0.25);
  snake.forEach((s, i) => { if (i % 2 === 0) A.burst(s.x * CS + CS / 2, s.y * CS + CS / 2, { n: 4, kind: 'debris', colors: ['#3dff8f', '#1f9a55'], speed: 160, life: 0.9 }); });
  setTimeout(() => {
    if (state !== 'dying') return; // a demo that was stopped mid-crash
    state = 'over';
    const rec = A.submit(score);
    A.overlay({ title: 'GAME OVER', big: `SCORE ${score} · LENGTH ${snake.length}`, sub: rec ? 'New high score!' : `Best: ${A.best()}`, btn: 'Play again', onGo: start });
  }, 900);
}
function step() {
  prev = snake.map(p => ({ ...p }));
  if (queue.length) dir = queue.shift();
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const body = grow ? snake.length : snake.length - 1;
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.slice(0, body).some(s => s.x === h.x && s.y === h.y)) return die();
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) {
    score += 10; grow += 2; eaten++;
    A.tone(660, 0.05); A.tone(990, 0.06, 'square', 0.04, 0.05);
    A.burst(h.x * CS + CS / 2, h.y * CS + CS / 2, { n: 12, colors: ['#ff4fa3', '#ffd0e8'], speed: 180, life: 0.45 }); A.pop(h.x * CS + CS / 2, h.y * CS - 4, '+10', '#ffb0d8'); A.shake(2, 0.1);
    food = free(); speed = Math.max(0.055, speed - 0.0024);
    if (!bonus && eaten % 5 === 0) bonus = { ...free(), t: 6 };
  } else if (bonus && h.x === bonus.x && h.y === bonus.y) {
    const pts = 20 + Math.ceil(bonus.t) * 10; score += pts; grow += 4; bonus = null; A.badge('gem');
    A.jingle([784, 988, 1175, 1568], 0.05);
    A.burst(h.x * CS + CS / 2, h.y * CS + CS / 2, { n: 22, colors: ['#ffd23d', '#fff6c2'], speed: 240, life: 0.6 }); A.ring(h.x * CS + CS / 2, h.y * CS + CS / 2, '#ffd23d', 40); A.pop(h.x * CS + CS / 2, h.y * CS - 4, '+' + pts, '#ffd23d'); A.shake(4, 0.15);
  }
  if (grow > 0) grow--; else snake.pop();
  A.setScore(score);
  if (snake.length >= 30) A.badge('long');
  if (score >= 1000) A.badge('score');
}
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();
  if (state === 'play' && KEYS[c]) turn(KEYS[c]);
});
A.swipe(cv, d => { if (state === 'play') turn(d); });
A.onHide(pause);

A.loop(dt => {
  if (state === 'dying') deathT -= dt;
  if (state !== 'play') return;
  if (bonus) { bonus.t -= dt; if (bonus.t <= 0) bonus = null; }
  stepT += dt;
  while (stepT >= speed && state === 'play') { stepT -= speed; step(); }
}, t => {
  ctx.drawImage(arena, 0, 0);
  if (!snake) { // title attract: a noodle weaving across the floor
    const k = t / 120, body = [];
    for (let i = 0; i < 12; i++) body.push({ x: ((k - i) % (N + 12) + N + 12) % (N + 12) - 6, y: 12 + Math.sin((k - i) / 3) * 2 });
    drawSnake(body, { x: 1, y: 0 }, false, t);
    return;
  }
  drawFood(food.x * CS + CS / 2, food.y * CS + CS / 2, t);
  if (bonus) drawGem(bonus.x * CS + CS / 2, bonus.y * CS + CS / 2, t, bonus.t);
  const dead = state === 'dying' || state === 'over';
  if (state === 'dying' && Math.floor(t / 90) % 2) return;
  // glide: each segment slides from where it was to where it is
  const u = state === 'play' ? Math.min(1, stepT / speed) : 1;
  const body = snake.map((p, i) => { const q = prev[i] || p; return { x: q.x + (p.x - q.x) * u, y: q.y + (p.y - q.y) * u }; });
  drawSnake(body, dir, dead, t);
});

/* ---------- art ---------- */
/** Lighten (k > 0) or darken (k < 0) a #rgb / #rrggbb colour. */
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
// the arena: two-tone floor tiles, soft vignette and a glowing neon border, drawn once
const arena = (() => {
  const c = document.createElement('canvas'), S = N * CS; c.width = S; c.height = S; const x = c.getContext('2d');
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    x.fillStyle = (i + j) % 2 ? '#07120c' : '#091710'; x.fillRect(i * CS, j * CS, CS, CS);
    x.fillStyle = 'rgba(61,255,143,.05)'; x.fillRect(i * CS, j * CS, CS, 1); x.fillRect(i * CS, j * CS, 1, CS);
  }
  const v = x.createRadialGradient(S / 2, S / 2, S * 0.2, S / 2, S / 2, S * 0.75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  x.fillStyle = v; x.fillRect(0, 0, S, S);
  x.shadowColor = '#3dff8f'; x.shadowBlur = 14; x.strokeStyle = '#3dff8f'; x.lineWidth = 3; x.strokeRect(2.5, 2.5, S - 5, S - 5);
  x.shadowBlur = 0; x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 1; x.strokeRect(2.5, 2.5, S - 5, S - 5);
  return c;
})();
/** The noodle: one shaded tube (outline, body, belly stripe, scale bands), then a head with eyes and a flicking tongue. */
function drawSnake(body, d, dead, t) {
  if (!body.length) return;
  const pts = body.map(p => [p.x * CS + CS / 2, p.y * CS + CS / 2]), col = dead ? '#ff5a5a' : '#3dff8f';
  const path = () => { ctx.beginPath(); pts.forEach(([x, y], i) => { if (i && Math.hypot(x - pts[i - 1][0], y - pts[i - 1][1]) > CS * 1.5) ctx.moveTo(x, y); else if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // drop shadow, outline, body, belly highlight
  ctx.save(); ctx.translate(2, 4); path(); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = CS - 4; ctx.stroke(); ctx.restore();
  path(); ctx.strokeStyle = '#04120a'; ctx.lineWidth = CS + 2; ctx.stroke();
  if (!dead) { ctx.shadowColor = col; ctx.shadowBlur = 12; }
  path(); ctx.strokeStyle = shade(col, -0.4); ctx.lineWidth = CS - 2; ctx.stroke(); ctx.shadowBlur = 0;
  path(); ctx.strokeStyle = col; ctx.lineWidth = CS - 7; ctx.stroke();
  ctx.save(); ctx.translate(-2, -3); path(); ctx.strokeStyle = shade(col, 0.6); ctx.lineWidth = 3.5; ctx.stroke(); ctx.restore();
  // scale bands: a darker diamond on every other segment, shrinking toward the tail
  for (let i = 2; i < pts.length; i += 2) { const [x, y] = pts[i], r = 5 * (1 - i / pts.length * 0.5); ctx.fillStyle = shade(col, -0.5); ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.fill(); }
  // head
  const [hx, hy] = pts[0], dx = d ? d.x : 1, dy = d ? d.y : 0;
  ctx.fillStyle = '#04120a'; ctx.beginPath(); ctx.arc(hx, hy, CS / 2 + 2, 0, 6.29); ctx.fill();
  const g = ctx.createRadialGradient(hx - 3, hy - 4, 1, hx, hy, CS / 2 + 1); g.addColorStop(0, shade(col, 0.6)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -0.4));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, CS / 2, 0, 6.29); ctx.fill();
  if (!dead && Math.floor(t / 260) % 5 === 0) { // tongue
    ctx.strokeStyle = '#ff4f6d'; ctx.lineWidth = 2; ctx.beginPath(); const tx = hx + dx * (CS / 2 + 7), ty = hy + dy * (CS / 2 + 7);
    ctx.moveTo(hx + dx * CS / 2, hy + dy * CS / 2); ctx.lineTo(tx, ty); ctx.lineTo(tx + dx * 3 - dy * 3, ty + dy * 3 - dx * 3); ctx.moveTo(tx, ty); ctx.lineTo(tx + dx * 3 + dy * 3, ty + dy * 3 + dx * 3); ctx.stroke();
  }
  for (const side of [-1, 1]) { // eyes look where it's going
    const ex = hx + dx * 3 + (dy ? side * 4.5 : 0), ey = hy + dy * 3 + (dx ? side * 4.5 : 0);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 3.4, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#04120a'; if (dead) { ctx.fillRect(ex - 2, ey - 0.6, 4, 1.2); } else { ctx.beginPath(); ctx.arc(ex + dx * 1.3, ey + dy * 1.3, 1.8, 0, 6.29); ctx.fill(); }
  }
}
/** A glossy berry that bobs and glows. */
function drawFood(x, y, t) {
  const b = Math.sin(t / 220) * 1.5, p = 0.7 + Math.sin(t / 160) * 0.3;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y + 8, 6, 2, 0, 0, 6.29); ctx.fill();
  ctx.shadowColor = '#ff4fa3'; ctx.shadowBlur = 12 * p;
  ctx.fillStyle = '#2a0618'; ctx.beginPath(); ctx.arc(x, y + b, 9.5, 0, 6.29); ctx.fill(); ctx.shadowBlur = 0;
  const g = ctx.createRadialGradient(x - 2.5, y - 3 + b, 1, x, y + b, 7); g.addColorStop(0, '#ffd0e8'); g.addColorStop(0.35, '#ff4fa3'); g.addColorStop(1, '#a01a5a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y + b, 8, 0, 6.29); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.ellipse(x - 2.5, y - 3 + b, 2, 1.3, -0.6, 0, 6.29); ctx.fill();
  ctx.strokeStyle = '#2f9a48'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - 6 + b); ctx.quadraticCurveTo(x + 2, y - 10 + b, x + 5, y - 9 + b); ctx.stroke();
}
/** A faceted gold gem with a shine that sweeps across, and a ring that runs down as it fades. */
function drawGem(x, y, t, left) {
  const b = Math.sin(t / 180) * 2;
  ctx.shadowColor = '#ffd23d'; ctx.shadowBlur = 16;
  ctx.fillStyle = '#3a2400'; ctx.beginPath(); ctx.moveTo(x, y - 11 + b); ctx.lineTo(x + 10, y - 2 + b); ctx.lineTo(x, y + 11 + b); ctx.lineTo(x - 10, y - 2 + b); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
  const f = (pts, c) => { ctx.fillStyle = c; ctx.beginPath(); pts.forEach(([px, py], i) => i ? ctx.lineTo(x + px, y + py + b) : ctx.moveTo(x + px, y + py + b)); ctx.fill(); };
  f([[0, -9], [8, -2], [0, -2]], '#fff0a8'); f([[0, -9], [-8, -2], [0, -2]], '#ffd23d');
  f([[-8, -2], [0, -2], [0, 9]], '#e0a820'); f([[8, -2], [0, -2], [0, 9]], '#b8860b');
  const sweep = ((t / 600) % 2) - 0.5; if (sweep < 1) { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(x - 8 + sweep * 16, y - 6 + b, 2, 8); }
  ctx.strokeStyle = 'rgba(255,210,61,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y + b, 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (left / 6)); ctx.stroke();
}
const DEMO_KEYS = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
/* Attract demo: head for the pellet (or the gem), never into a wall or the tail, keeping the most room to move. */
let demoHead = null;
A.attract({
  start: () => { demoHead = null; start(); },
  stop: () => { state = 'title'; deathT = 0; },
  bot: () => {
    if (state !== 'play' || queue.length) return [];
    const h = snake[0]; if (demoHead && demoHead.x === h.x && demoHead.y === h.y) return []; demoHead = { ...h };
    const blocked = (x, y) => x < 0 || y < 0 || x >= N || y >= N || snake.slice(0, -1).some(s => s.x === x && s.y === y);
    const room = (x, y) => { const seen = new Set([x + ',' + y]), q = [[x, y]]; let n = 0; while (q.length && n < 120) { const [a, b] = q.shift(); n++; for (const v of Object.values(DV)) { const k = (a + v.x) + ',' + (b + v.y); if (!seen.has(k) && !blocked(a + v.x, b + v.y)) { seen.add(k); q.push([a + v.x, b + v.y]); } } } return n; };
    let best = null, bs = -1e9;
    for (const [name, v] of Object.entries(DV)) {
      if (v.x === -dir.x && v.y === -dir.y) continue;
      const x = h.x + v.x, y = h.y + v.y; if (blocked(x, y)) continue;
      const goal = bonus || food, sc = Math.min(room(x, y), snake.length + 10) * 10 - (Math.abs(goal.x - x) + Math.abs(goal.y - y));
      if (sc > bs) { bs = sc; best = name; }
    }
    return best && DV[best] !== dir ? ['!' + DEMO_KEYS[best]] : [];
  }
});
A.overlay({ title: 'NEON NOODLE', sub: 'Eat the pink pellets to grow. Grab gold gems before they fade. Don’t hit the walls or your own tail.', btn: 'Start', scores: true, onGo: start });
})();
</script>
</body>
</html>
