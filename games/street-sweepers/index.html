<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Street Sweepers</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preload" href="../../shared/fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="../../shared/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="street-sweepers" data-pad="0:KeyJ 1:KeyK 2:KeyL 3:KeyK" style="--game:#ff6fae">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>STREET SWEEPERS</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="dp"><button class="u" data-k="ArrowUp" aria-label="Up">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button><button class="d" data-k="ArrowDown" aria-label="Down">▼</button></div>
    <div class="ab"><button class="sm" data-k="KeyL">SPIN</button><button class="sm" data-k="KeyK">JUMP</button><button data-k="KeyJ">PUNCH</button></div>
  </div>
  <p class="help"><b>1 player:</b> arrows or WASD walk · <kbd>J</kbd>/<kbd>Space</kbd> punch (tap for a combo) · <kbd>K</kbd> jump (punch in the air to kick) · <kbd>L</kbd> spin attack (costs a little health) · <b>2 players:</b> Dash on WASD + <kbd>F</kbd> <kbd>G</kbd> <kbd>H</kbd>, Rosa on arrows + <kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd> · <kbd>P</kbd> pause · gamepad: A punch, B jump, X spin</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
/*
 * Street Sweepers: the city clean-up crew against the Rust Gang, walking right down three streets (downtown, the docks,
 * the rooftops). The screen stops at each block until the gang there is beaten. Punch combos (the third hit knocks
 * down), jump kicks, and a spin attack that hits all round you for a little of your own health. Smash bins and crates
 * for pizza (health) and pipes (a heavier swing for a few hits). Each street ends with a boss: Big Rusty, Chainlink
 * Cass, then the Foreman. One player, or two on one keyboard (Dash on WASD, Rosa on the arrows).
 */
const A = Arcade, cv = document.getElementById('cv');
const W = 480, H = 270, ctx = A.canvas(cv, W, H), OUT = '#0a0612', TOPY = 170, BOTY = 258;
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
/** Boxes [x, y, w, h, colour]: an outline pass, then fills lit from above. */
function paint(x, list) {
  x.fillStyle = OUT; for (const q of list) x.fillRect(q[0] - 1, q[1] - 1, q[2] + 2, q[3] + 2);
  for (const [px, py, w, h, c] of list) { x.fillStyle = c; x.fillRect(px, py, w, h); if (w > 2 && h > 2) { x.fillStyle = shade(c, 0.3); x.fillRect(px, py, w, 1); x.fillStyle = shade(c, -0.3); x.fillRect(px, py + h - 1, w, 1); } }
}
const sprite = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };

/* ---------- three streets, their walls drawn once ---------- */
const STREETS = [
  { name: 'DOWNTOWN', sky: ['#2a1a4a', '#c86a7a'], wall: '#6a3a3a', ground: '#4a4a56', curb: '#8a8a96', kind: 'town' },
  { name: 'THE DOCKS', sky: ['#1a3a5a', '#e8a86a'], wall: '#3a4a5a', ground: '#6a5a46', curb: '#8a7a5a', kind: 'docks' },
  { name: 'THE ROOFTOPS', sky: ['#0a0a24', '#3a2a5a'], wall: '#2a2a3a', ground: '#4a4652', curb: '#6a6672', kind: 'roof' }
];
const LEN = 2600;
function backdrop(st, seed) {
  let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return sprite(LEN + W, TOPY, x => {
    const g = x.createLinearGradient(0, 0, 0, TOPY); g.addColorStop(0, st.sky[0]); g.addColorStop(1, st.sky[1]); x.fillStyle = g; x.fillRect(0, 0, LEN + W, TOPY);
    if (st.kind === 'roof') { for (let i = 0; i < 160; i++) { x.fillStyle = `rgba(255,255,255,${r() * 0.7})`; x.fillRect(r() * (LEN + W), r() * 80, 1, 1); } for (let bx = 0; bx < LEN + W; bx += 26 + r() * 30) { const bh = 40 + r() * 70; x.fillStyle = '#16142a'; x.fillRect(bx, TOPY - 30 - bh, 24 + r() * 20, bh + 30); x.fillStyle = 'rgba(255,220,120,.5)'; for (let k = 0; k < 6; k++) if (r() < 0.4) x.fillRect(bx + 4 + r() * 16, TOPY - 26 - r() * bh, 2, 3); } }
    if (st.kind === 'docks') { x.fillStyle = '#2a5a7a'; x.fillRect(0, TOPY - 50, LEN + W, 50); x.fillStyle = 'rgba(255,255,255,.2)'; for (let i = 0; i < 120; i++) x.fillRect(r() * (LEN + W), TOPY - 46 + r() * 40, 10, 1); }
    for (let bx = 0; bx < LEN + W;) { // the wall behind the street: shopfronts, warehouses or rooftop clutter
      const bw = 90 + r() * 80;
      if (st.kind === 'town') {
        const bh = 110 + r() * 40, col = ['#6a3a3a', '#5a4a6a', '#4a5a6a', '#7a5a3a'][Math.floor(r() * 4)];
        paint(x, [[bx, TOPY - bh, bw - 4, bh, col]]); x.fillStyle = 'rgba(0,0,0,.25)'; for (let yy = TOPY - bh + 8; yy < TOPY - 40; yy += 7) x.fillRect(bx, yy, bw - 4, 1);
        for (let wy = TOPY - bh + 12; wy < TOPY - 50; wy += 24) for (let wx = bx + 10; wx < bx + bw - 20; wx += 22) paint(x, [[wx, wy, 12, 14, r() < 0.4 ? '#ffd88a' : '#2a2a40']]);
        const sc = ['#ff4fd1', '#5ee7ff', '#ffd23d', '#3dff8f'][Math.floor(r() * 4)]; paint(x, [[bx + 8, TOPY - 40, bw - 20, 34, '#1a1428']]);
        x.fillStyle = sc; x.font = '9px Bungee, sans-serif'; x.textAlign = 'center'; x.shadowColor = sc; x.shadowBlur = 8; x.fillText(['PIZZA', 'ARCADE', 'DINER', 'LAUNDRY', 'RECORDS', 'NOODLES'][Math.floor(r() * 6)], bx + bw / 2 - 6, TOPY - 50); x.shadowBlur = 0;
      } else if (st.kind === 'docks') {
        const bh = 50 + r() * 50, col = ['#c8402a', '#3a7ac8', '#e8a83a', '#3a9a5a'][Math.floor(r() * 4)];
        paint(x, [[bx, TOPY - bh, bw - 8, bh, col]]); x.fillStyle = 'rgba(0,0,0,.2)'; for (let k = bx + 6; k < bx + bw - 8; k += 8) x.fillRect(k, TOPY - bh + 4, 2, bh - 8);
        if (r() < 0.3) { x.fillStyle = '#d8a83a'; x.fillRect(bx + 30, TOPY - bh - 80, 6, 80); x.fillRect(bx + 30, TOPY - bh - 80, 70, 6); x.fillRect(bx + 94, TOPY - bh - 74, 2, 40); }
      } else {
        paint(x, [[bx, TOPY - 26, bw - 2, 26, '#3a3648']]);
        if (r() < 0.4) paint(x, [[bx + 20, TOPY - 70, 40, 44, '#6a5a4a'], [bx + 14, TOPY - 78, 52, 10, '#5a4a3a']]); // a water tower
        if (r() < 0.5) paint(x, [[bx + 60, TOPY - 44, 18, 18, '#8a8a96']]);
      }
      bx += bw;
    }
  });
}
const BACKS = STREETS.map((st, i) => backdrop(st, 11 + i * 17));

/* ---------- fighters ---------- */
const CREW = [{ name: 'DASH', skin: '#f0c090', hair: '#3a2414', top: '#ff8a3d', legs: '#ff8a3d', shoe: '#2a2a34', hat: '#ffd23d', c: '#ff8a3d' },
  { name: 'ROSA', skin: '#c8885a', hair: '#1a1018', top: '#3ac8b8', legs: '#3ac8b8', shoe: '#2a2a34', tail: true, c: '#3ac8b8' }];
const GANG = { punk: { skin: '#e0a878', hair: '#ff4fd1', top: '#3a3a4a', legs: '#2a3a6a', shoe: '#16161e', hp: 30, sp: 52 },
  knifer: { skin: '#f0c090', hair: '#5ee7ff', top: '#5a2a6a', legs: '#2a2a34', shoe: '#16161e', hp: 22, sp: 70 },
  brute: { skin: '#c08050', hair: '#3a2414', top: '#6a4a2a', legs: '#3a3030', shoe: '#16161e', hp: 70, sp: 36, big: 1.25 },
  rusty: { skin: '#d8906a', hair: '#c84a1a', top: '#8a3a1a', legs: '#4a2a1a', shoe: '#16161e', hp: 260, sp: 46, big: 1.5 },
  cass: { skin: '#f0c090', hair: '#e8e8f0', top: '#2a2a34', legs: '#5a1a3a', shoe: '#16161e', hp: 240, sp: 60, big: 1.25 },
  foreman: { skin: '#a8704a', hair: '#ffd23d', top: '#e8a83a', legs: '#3a4a6a', shoe: '#16161e', hp: 300, sp: 44, big: 1.5 } };
/** A fighter from the side, feet at (x, y), z up in the air; pose decides arms and legs. */
function drawFighter(f, t) {
  const p = f.pal, big = p.big || 1, X = Math.round(f.x - cam), Y = Math.round(f.y - f.z);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(f.x - cam, f.y, 14 * big, 4, 0, 0, 6.29); ctx.fill();
  if (f.blink && Math.floor(t / 60) % 2) return;
  ctx.save(); ctx.translate(X, Y); ctx.scale(f.face * big, big);
  const pose = f.pose, walk = f.walk || 0, s = pose === 'walk' ? Math.sin(walk) : 0, hit = f.flash > 0;
  if (pose === 'down') { ctx.rotate(-Math.PI / 2); ctx.translate(-4, -10); }
  const C = c => hit ? '#ffffff' : c;
  // legs
  if (pose === 'jump' || pose === 'kick') paint(ctx, pose === 'kick' ? [[-6, -16, 7, 9, C(p.legs)], [0, -14, 18, 6, C(p.legs)], [17, -15, 5, 7, p.shoe]] : [[-6, -16, 6, 10, C(p.legs)], [1, -14, 6, 9, C(p.legs)]]);
  else paint(ctx, [[-6 + s * 4, -18, 6, 18, C(p.legs)], [1 - s * 4, -18, 6, 18, C(shade(p.legs, -0.15))], [-7 + s * 4, -2, 8, 3, p.shoe], [0 - s * 4, -2, 8, 3, p.shoe]]);
  // body, head, hair
  const lean = pose === 'hurt' ? -3 : pose === 'punch3' ? 3 : 0;
  paint(ctx, [[-8 + lean, -36, 16, 19, C(p.top)], [-6 + lean, -48, 12, 12, C(p.skin)], [-7 + lean, -50, 14, 5, p.hair]]);
  if (p.tail) paint(ctx, [[-10 + lean, -48, 4, 10, p.hair]]);
  if (p.hat) paint(ctx, [[-7 + lean, -52, 14, 4, p.hat], [5 + lean, -50, 6, 2, p.hat]]);
  ctx.fillStyle = OUT; ctx.fillRect(2 + lean, -45, 2, 2);
  // arms
  const arm = (x0, y0, len, c) => paint(ctx, [[x0, y0, len, 5, C(c)], [x0 + len - 1, y0 - 1, 6, 7, C(p.skin)]]);
  if (pose === 'punch1' || pose === 'punch2') arm(2 + lean, -33 + (pose === 'punch2' ? 3 : 0), 16, p.top);
  else if (pose === 'punch3') { arm(2 + lean, -38, 20, p.top); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(18, -44, 8, 2); }
  else if (pose === 'windup') arm(-14, -34, 10, p.top);
  else if (pose === 'spin') { const a = (t / 40) % 6.28; ctx.save(); ctx.translate(0, -30); ctx.rotate(a); paint(ctx, [[-22, -2, 44, 5, C(p.top)]]); ctx.restore(); }
  else if (pose === 'hurt') arm(-12, -38, 8, p.top);
  else paint(ctx, [[-2 + s * 3, -34, 5, 14, C(shade(p.top, -0.1))], [-2 + s * 3, -21, 5, 4, C(p.skin)]]);
  if (f.weapon && pose !== 'down') { ctx.save(); ctx.translate(pose.startsWith('punch') ? 22 : 2, -30); ctx.rotate(pose.startsWith('punch') ? 0.1 : -1.2); paint(ctx, [[0, -2, 26, 4, '#8a8ea0']]); ctx.restore(); }
  ctx.restore();
}

/* ---------- state ---------- */
let state = 'title', two = false, street = 0, round = 0, score = 0, cam = 0, lockX = null, zones = [], zoneI = 0, go = 0, players = [], foes = [], props = [], items = [], msg = '', msgT = 0, livesLost = 0, bossT = 0;
const say = (t, s = 2) => { msg = t; msgT = s; };
const lv = () => street + round * 3;
function mkPlayer(i) { return { i, pal: CREW[i], x: 60 + i * 30, y: 214 + i * 20, z: 0, vz: 0, face: 1, hp: 100, lives: A.easy ? 5 : 3, pose: 'idle', walk: 0, act: null, actT: 0, combo: 0, comboT: 0, inv: 1.5, flash: 0, weapon: 0, out: false, hitList: [] }; }
function newStreet() {
  cam = 0; lockX = null; zoneI = 0; foes = []; items = []; livesLost = 0; go = 0;
  const z0 = [420, 860, 1300, 1720, 2140]; zones = z0.map((x, i) => ({ x, n: 3 + Math.min(4, Math.floor(lv() / 2)) + (i > 2 ? 1 : 0), done: false }));
  zones.push({ x: LEN - W + 10, boss: true, done: false });
  props = []; for (let x = 300; x < LEN - 200; x += 180 + Math.random() * 160) props.push({ kind: Math.random() < 0.5 ? 'bin' : 'crate', x, y: A.rand(TOPY + 14, BOTY - 10), hp: 2 });
  players.forEach((p, i) => Object.assign(p, { x: 60 + i * 30, y: 214 + i * 20, z: 0, inv: 1.5, act: null }));
  say(`STREET ${street + 1 + round * 3} · ${STREETS[street].name}`, 2.4); A.jingle([392, 523, 659, 784], 0.09);
}
function newGame(twoP) {
  two = twoP; street = 0; round = 0; score = 0; A.setScore(0);
  players = two ? [mkPlayer(0), mkPlayer(1)] : [mkPlayer(0)];
  newStreet(); state = 'play';
}
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play' }); }
// keys: in one-player mode every set works; in two-player mode Dash has WASD + F G H and Rosa the arrows + J K L
const SETS = [{ L: ['KeyA'], R: ['KeyD'], U: ['KeyW'], D: ['KeyS'], punch: ['KeyF'], jump: ['KeyG'], spin: ['KeyH'] }, { L: ['ArrowLeft'], R: ['ArrowRight'], U: ['ArrowUp'], D: ['ArrowDown'], punch: ['KeyJ'], jump: ['KeyK'], spin: ['KeyL'] }];
const ONE = { L: ['KeyA', 'ArrowLeft'], R: ['KeyD', 'ArrowRight'], U: ['KeyW', 'ArrowUp'], D: ['KeyS', 'ArrowDown'], punch: ['KeyF', 'KeyJ', 'Space', 'KeyZ'], jump: ['KeyG', 'KeyK', 'KeyX'], spin: ['KeyH', 'KeyL', 'KeyC'] };
const keysOf = p => two ? SETS[p.i] : ONE;
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();
  if (state !== 'play') return;
  for (const p of players) { const k = keysOf(p); if (k.punch.includes(c)) punch(p); if (k.jump.includes(c)) jump(p); if (k.spin.includes(c)) spin(p); }
});
A.onHide(pause);
const add = (n, x, y, c = '#ffd23d') => { score += n; A.setScore(score); if (x !== undefined) A.pop(x - cam, y, '+' + n, c); };

/* ---------- your moves ---------- */
const free = p => !p.out && !p.dead && (!p.act || p.act === 'walk');
function punch(p) {
  if (p.out || p.dead || p.down) return;
  if (p.z > 0 && p.act === 'jump') { p.act = 'kick'; p.actT = 0.35; p.hitList = []; A.tone(500, 0.06, 'square', 0.03, 0, 200); return; }
  if (p.act && p.act.startsWith('punch')) { if (p.actT < 0.12 && p.combo < 3) p.queued = true; return; }
  if (!free(p)) return;
  p.combo = p.comboT > 0 ? Math.min(3, p.combo + 1) : 1; startPunch(p);
}
function startPunch(p) { p.act = 'punch' + p.combo; p.actT = p.combo === 3 ? 0.3 : 0.2; p.hitList = []; p.comboT = 0.5; A.tone(260 + p.combo * 80, 0.05, 'square', 0.03, 0, 120); }
function jump(p) { if (!free(p) || p.z > 0) return; p.act = 'jump'; p.vz = 300; p.actT = 9; A.sfx('jump'); }
function spin(p) { if (!free(p) || p.z > 0) return; if (p.hp > 10) p.hp -= 6; p.act = 'spin'; p.actT = 0.5; p.hitList = []; p.inv = Math.max(p.inv, 0.5); A.tone(300, 0.4, 'sawtooth', 0.04, 0, 900); }
/** Your hits: a box in front of you (all round for the spin) against every gang member at your depth. */
function hits(p) {
  const kind = p.act, active = kind === 'spin' || kind === 'kick' || (kind && kind.startsWith('punch') && p.actT < (p.combo === 3 ? 0.22 : 0.15) && p.actT > 0.04);
  if (!active) return;
  const reach = kind === 'spin' ? 42 : kind === 'kick' ? 36 : p.weapon ? 42 : 34;
  for (const f of foes) {
    if (f.dead || f.down || p.hitList.includes(f)) continue;
    const dx = (f.x - p.x) * (kind === 'spin' ? 1 : p.face), dy = Math.abs(f.y - p.y);
    if ((kind === 'spin' ? Math.abs(dx) < reach : dx > 0 && dx < reach) && dy < 14 && p.z < 30) {
      p.hitList.push(f);
      const dmg = kind === 'spin' ? 16 : kind === 'kick' ? 14 : p.weapon ? 14 : p.combo === 3 ? 12 : 6, knock = kind !== 'punch1' && kind !== 'punch2';
      if (p.weapon && kind.startsWith('punch')) { p.weapon--; if (!p.weapon) say('THE PIPE BROKE', 1); }
      hurtFoe(f, dmg, knock, p.face === 1 ? (f.x > p.x ? 1 : -1) : (f.x > p.x ? 1 : -1));
    }
  }
  for (const pr of props) if (!pr.broken && !p.hitList.includes(pr) && Math.abs(pr.y - p.y) < 14 && Math.abs(pr.x - (p.x + p.face * 20)) < 22) { p.hitList.push(pr); if (--pr.hp <= 0) smash(pr); else A.tone(180, 0.06, 'square', 0.04); }
}
function smash(pr) {
  pr.broken = true; A.burst(pr.x - cam, pr.y - 14, { n: 14, kind: 'debris', colors: pr.kind === 'bin' ? ['#8a8ea0', '#5a5e70'] : ['#c8904a', '#8a5a2a'], speed: 140, life: 0.6 }); A.sfx('boom'); add(50);
  const r = Math.random(); items.push({ kind: r < 0.45 ? 'pizza' : r < 0.75 ? 'pipe' : 'cash', x: pr.x, y: pr.y });
}
function hurtFoe(f, dmg, knock, dir) {
  f.hp -= dmg; f.flash = 0.1; A.hitstop(knock ? 0.07 : 0.04); A.shake(knock ? 4 : 2, 0.12);
  A.burst(f.x - cam, f.y - 30 * (f.pal.big || 1), { n: 6, colors: ['#fff', '#ffd23d'], speed: 120, life: 0.25 }); A.tone(knock ? 120 : 180, 0.08, 'square', 0.05, 0, 60);
  add(10, f.x, f.y - 50);
  if (f.boss && f.hp > 0 && !knock) { f.stun = Math.max(f.stun || 0, 0.12); return; }
  if (f.hp <= 0 || (knock && !(f.kind === 'brute' && f.hp > 30) && !f.boss) || (f.boss && knock && Math.random() < 0.25)) { f.down = 1.0; f.vx = dir * 160; f.z = 0; f.vz = 160; f.act = null; }
  else { f.stun = 0.3; f.act = null; f.x += dir * 3; }
  if (f.hp <= 0) { f.dying = true; const pts = f.boss ? 3000 * (lv() + 1) : { punk: 100, knifer: 120, brute: 300 }[f.kind]; add(pts, f.x, f.y - 60); A.sfx('hurt');
    if (f.boss) { A.badge('boss'); A.flash('#fff', 0.4); A.shake(10, 0.8); A.jingle([523, 659, 784, 1047, 1319, 1568], 0.09, 'square'); } }
}
function hurtPlayer(p, dmg, knock, from) {
  if (p.inv > 0 || p.out || p.down) return;
  p.hp -= dmg; p.flash = 0.12; p.act = null; p.inv = 0.3; A.shake(knock ? 6 : 3, 0.2); A.sfx('hurt'); A.flash('#ff4f6d', 0.1);
  if (knock || p.hp <= 0) { p.down = 1.1; p.vx = (p.x > from ? 1 : -1) * 140; p.vz = 150; }
  else p.stun = 0.3;
  if (p.hp <= 0) { p.hp = 0; p.dead = true; }
}

/* ---------- the Rust Gang ---------- */
function spawn(kind, side) {
  const pal = GANG[kind], k = 1 + lv() * 0.12;
  foes.push({ kind, pal, x: side < 0 ? cam - 30 : cam + W + 30, y: A.rand(TOPY + 12, BOTY - 6), z: 0, vz: 0, face: -side, hp: Math.round(pal.hp * k), max: Math.round(pal.hp * k), sp: pal.sp * (1 + lv() * 0.05), atkT: A.rand(0.6, 1.6), act: null, actT: 0, walk: 0, flash: 0, pose: 'idle' });
}
function spawnBoss() {
  const kind = ['rusty', 'cass', 'foreman'][street], pal = GANG[kind], hp = Math.round(pal.hp * (1 + lv() * 0.3));
  foes.push({ kind, boss: true, pal, x: cam + W + 40, y: (TOPY + BOTY) / 2, z: 0, vz: 0, face: -1, hp, max: hp, sp: pal.sp, atkT: 1.5, act: null, actT: 0, walk: 0, flash: 0, pose: 'idle' });
  say({ rusty: 'BIG RUSTY!', cass: 'CHAINLINK CASS!', foreman: 'THE FOREMAN!' }[kind], 2.4); A.tone(70, 1, 'sawtooth', 0.06, 0, 40);
  if (street === 0) { spawn('punk', -1); spawn('punk', 1); }
}
function foeAI(f, dt) {

      const reach = f.kind === 'cass' ? 90 : f.boss ? 46 : f.kind === 'brute' ? 34 : 28, dmg = f.boss ? 16 : f.kind === 'brute' ? 15 : 8;
      for (const p of alive) if (Math.abs(p.y - f.y) < (f.kind === 'foreman' ? 30 : 14) && (p.x - f.x) * f.face > -6 && (p.x - f.x) * f.face < reach && p.z < 30) hurtPlayer(p, dmg, f.boss || f.kind === 'brute', f.x);

      for (const p of alive) if (Math.abs(p.y - f.y) < 14 && Math.abs(p.x - f.x) < 18 && p.z < 30) hurtPlayer(p, f.boss ? 20 : 10, true, f.x);
      if (f.actT <= 0 || f.x < cam - 20 || f.x > cam + W + 20) { f.act = null; f.x = A.clamp(f.x, cam + 10, cam + W - 10); }

/* ---------- update ---------- */
function update(dt) {
  if (msgT > 0) msgT -= dt; go += dt;
  if (state !== 'play') return;

  const lead = Math.max(...players.filter(p => !p.out).map(p => p.x), cam + 100);
  const zone = zones[zoneI];
  if (lockX === null && zone && lead - W * 0.55 >= zone.x - 40) { lockX = zone.x; if (zone.boss) spawnBoss(); else { zone.left = zone.n; zone.spawnT = 0; } }
  const target = lockX !== null ? lockX : Math.max(cam, Math.min(lead - W * 0.45, LEN - W));
  cam += (target - cam) * Math.min(1, dt * 4);
  if (lockX !== null && zone && !zone.boss && zone.left > 0) { zone.spawnT -= dt; if (zone.spawnT <= 0 && foes.filter(f => !f.dying).length < 3 + Math.min(2, lv())) { zone.spawnT = 0.9; zone.left--; const r = Math.random(); spawn(lv() >= 1 && r < 0.2 ? 'brute' : r < 0.45 ? 'knifer' : 'punk', Math.random() < 0.5 ? -1 : 1); } }
  if (lockX !== null && zone && (zone.boss ? !foes.some(f => f.boss) && bossT > 0 : zone.left === 0) && !foes.length) {
    zone.done = true; zoneI++; lockX = null; go = 0;
    if (zone.boss) return streetClear();
    say('GO →', 1.4); A.jingle([659, 784], 0.08);
  }
  if (zone && zone.boss && foes.some(f => f.boss)) bossT = 1;
  // the crew
  for (const p of players) {
    if (p.out) continue;
    if (p.flash > 0) p.flash -= dt; if (p.inv > 0) p.inv -= dt; if (p.comboT > 0) p.comboT -= dt; if (p.stun > 0) p.stun -= dt;
    p.blink = p.inv > 0.35;
    if (p.down) { p.down -= dt; p.x += p.vx * dt; p.vx *= 0.9; p.vz -= 700 * dt; p.z = Math.max(0, p.z + p.vz * dt); p.pose = 'down';
      if (p.down <= 0) { p.down = 0; if (p.dead) { p.lives--; livesLost++; if (p.lives <= 0) { p.out = true; if (players.every(q => q.out)) return gameOver(); continue; } Object.assign(p, { dead: false, hp: 100, inv: 2, weapon: 0, z: 0 }); say(`${p.pal.name} IS BACK!`, 1.2); } else p.inv = 0.6; }
      continue; }
    const k = keysOf(p), held = l => l.some(c => A.held(c)), mx = (held(k.R) ? 1 : 0) - (held(k.L) ? 1 : 0), my = (held(k.D) ? 1 : 0) - (held(k.U) ? 1 : 0);
    if (p.act === 'jump' || p.act === 'kick') { p.vz -= 900 * dt; p.z += p.vz * dt; p.x += mx * 90 * dt; if (p.z <= 0) { p.z = 0; p.act = null; } }
    else if (p.act === 'spin') { p.actT -= dt; p.x += p.face * 40 * dt; if (p.actT <= 0) p.act = null; }
    else if (p.act && p.act.startsWith('punch')) { p.actT -= dt; if (p.actT <= 0) { if (p.queued && p.combo < 3) { p.queued = false; p.combo++; startPunch(p); } else { p.queued = false; p.act = null; if (p.combo === 3) p.comboT = 0; } } }
    else if (!p.stun || p.stun <= 0) { if (mx || my) { p.x += mx * 92 * dt; p.y += my * 62 * dt; p.walk += dt * 11; if (mx) p.face = mx; p.act = 'walk'; } else p.act = null; }

    for (const it of items) if (!it.got && Math.abs(it.x - p.x) < 16 && Math.abs(it.y - p.y) < 12 && p.z === 0) {
      it.got = true; A.sfx('pickup');
      if (it.kind === 'pizza') { p.hp = Math.min(100, p.hp + 40); A.pop(p.x - cam, p.y - 60, 'PIZZA! +40', '#3dff8f'); }
      if (it.kind === 'pipe') { p.weapon = 8; A.pop(p.x - cam, p.y - 60, 'PIPE!', '#5ee7ff'); }
      if (it.kind === 'cash') add(500, p.x, p.y - 60);

    if (f.down) { f.down -= dt; f.x += f.vx * dt; f.vx *= 0.9; f.vz -= 700 * dt; f.z = Math.max(0, f.z + f.vz * dt); f.pose = 'down';
      if (f.down <= 0) { if (f.dying) f.gone = true; else { f.down = 0; f.atkT = 0.8; } } continue; }

}
function streetClear() {
  const bonus = 2000 + street * 1000; add(bonus); say(`STREET CLEAR! +${bonus}`, 2.6); A.jingle([523, 659, 784, 1047, 1319], 0.09, 'square');

}
function gameOver() {
  state = 'over'; const rec = A.submit(score);
  A.overlay({ title: 'SWEPT AWAY', big: `SCORE ${score.toLocaleString()} · STREET ${street + 1 + round * 3}`, sub: rec ? 'New high score!' : `Best: ${A.best().toLocaleString()}`, btn: two ? 'Again (2P)' : 'Again', onGo: () => newGame(two), alt: { btn: two ? '1 player' : '2 players', onGo: () => newGame(!two) } });
}

/* ---------- drawing ---------- */
function render(t) {
  const st = STREETS[street];
  ctx.drawImage(BACKS[street], Math.round(cam), 0, W, TOPY, 0, 0, W, TOPY);
  // the street: curb, then pavement, scrolling with the camera
  ctx.fillStyle = st.curb; ctx.fillRect(0, TOPY, W, 6); ctx.fillStyle = OUT; ctx.fillRect(0, TOPY + 6, W, 1);
  ctx.fillStyle = st.ground; ctx.fillRect(0, TOPY + 7, W, H - TOPY - 7);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; const off = -(cam % 48); for (let x = off; x < W; x += 48) ctx.fillRect(x, TOPY + 7, 1, H - TOPY);
  for (let y = TOPY + 30; y < H; y += 30) ctx.fillRect(0, y, W, 1);
  if (st.kind === 'docks') { ctx.fillStyle = 'rgba(0,0,0,.25)'; for (let x = -(cam % 24); x < W; x += 24) ctx.fillRect(x, TOPY + 7, 2, H - TOPY); }
  // everything standing, back to front
  const list = [];
  for (const pr of props) if (!pr.broken && pr.x - cam > -30 && pr.x - cam < W + 30) list.push([pr.y, () => drawProp(pr)]);
  for (const it of items) list.push([it.y - 1, () => drawItem(it, t)]);
  for (const f of foes) list.push([f.y, () => { drawFighter(f, t); if (f.boss) bossBar(f); else if (f.act === 'windup') { ctx.fillStyle = '#ff4f6d'; ctx.font = '12px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('!', f.x - cam, f.y - 62 * (f.pal.big || 1)); } }]);
  if (state !== 'title') for (const p of players) if (!p.out) list.push([p.y, () => drawFighter(p, t)]);
  list.sort((a, b) => a[0] - b[0]).forEach(d => d[1]());
  // the hud: each player's health and lives
  if (state !== 'title') {
    players.forEach((p, i) => {
      const X = 8 + i * 170; ctx.font = '10px Silkscreen, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = OUT; ctx.fillRect(X - 1, 5, 132, 20); ctx.fillStyle = p.pal.c; ctx.fillText(`${p.pal.name} ×${Math.max(0, p.lives)}`, X + 3, 11);
      ctx.fillStyle = '#2a2040'; ctx.fillRect(X + 2, 17, 126, 6); ctx.fillStyle = p.hp > 30 ? '#3dff8f' : '#ff4f6d'; ctx.fillRect(X + 2, 17, 126 * Math.max(0, p.hp) / 100, 6);
      if (p.weapon) { ctx.fillStyle = '#5ee7ff'; ctx.fillText(`PIPE ${p.weapon}`, X + 84, 11); }
    });
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = '10px Silkscreen, monospace'; ctx.fillText(`STREET ${street + 1 + round * 3}`, W - 8, 11);
    if (lockX === null && go < 3 && zoneI > 0 && Math.floor(t / 300) % 2) { ctx.font = '22px Bungee, sans-serif'; ctx.fillStyle = OUT; ctx.fillText('GO →', W - 18, 82); ctx.fillStyle = '#ffd23d'; ctx.fillText('GO →', W - 20, 80); }
  }
  if (msgT > 0 && state !== 'title' && msg !== 'GO →') { ctx.globalAlpha = Math.min(1, msgT * 2); ctx.font = '20px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = OUT; ctx.fillText(msg, W / 2 + 2, 72); ctx.fillStyle = '#ff6fae'; ctx.fillText(msg, W / 2, 70); ctx.globalAlpha = 1; }
}
function drawProp(pr) {
  const X = Math.round(pr.x - cam), Y = Math.round(pr.y);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(X, Y, 14, 4, 0, 0, 6.29); ctx.fill();
  if (pr.kind === 'bin') { paint(ctx, [[X - 11, Y - 30, 22, 30, '#7a7e90'], [X - 13, Y - 34, 26, 6, '#8a8ea0']]); ctx.fillStyle = 'rgba(0,0,0,.25)'; for (let i = -6; i <= 6; i += 6) ctx.fillRect(X + i, Y - 27, 2, 24); }
  else { paint(ctx, [[X - 14, Y - 26, 28, 26, '#b8803a']]); ctx.strokeStyle = '#6a4a20'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X - 12, Y - 24); ctx.lineTo(X + 12, Y - 2); ctx.moveTo(X + 12, Y - 24); ctx.lineTo(X - 12, Y - 2); ctx.stroke(); }
  if (pr.hp < 2) { ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(X - 4, Y - 26); ctx.lineTo(X + 2, Y - 16); ctx.lineTo(X - 2, Y - 8); ctx.stroke(); }
}
function drawItem(it, t) {
  const X = Math.round(it.x - cam), Y = Math.round(it.y) - 6 + Math.sin(t / 200) * 2;
  if (it.kind === 'pizza') { ctx.fillStyle = OUT; ctx.beginPath(); ctx.moveTo(X - 10, Y - 4); ctx.lineTo(X + 10, Y - 4); ctx.lineTo(X, Y + 10); ctx.fill(); ctx.fillStyle = '#ffc84a'; ctx.beginPath(); ctx.moveTo(X - 8, Y - 3); ctx.lineTo(X + 8, Y - 3); ctx.lineTo(X, Y + 8); ctx.fill(); ctx.fillStyle = '#c8203a'; ctx.fillRect(X - 3, Y - 1, 3, 3); ctx.fillRect(X + 2, Y + 2, 2, 2); ctx.fillStyle = '#c8803a'; ctx.fillRect(X - 9, Y - 5, 18, 3); }
  if (it.kind === 'pipe') { ctx.save(); ctx.translate(X, Y); ctx.rotate(-0.4); paint(ctx, [[-13, -2, 26, 5, '#8a8ea0']]); ctx.restore(); }
  if (it.kind === 'cash') { paint(ctx, [[X - 9, Y - 5, 18, 10, '#3a9a5a']]); ctx.fillStyle = '#c8ffd0'; ctx.font = '8px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('$', X, Y + 3); }
}
function bossBar(f) {
  const nm = { rusty: 'BIG RUSTY', cass: 'CHAINLINK CASS', foreman: 'THE FOREMAN' }[f.kind];
  ctx.font = '10px Silkscreen, monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#ff6fae'; ctx.fillText(nm, W - 8, 28);
  ctx.fillStyle = OUT; ctx.fillRect(W - 168, 34, 162, 8); ctx.fillStyle = '#ff4f6d'; ctx.fillRect(W - 167, 35, 160 * Math.max(0, f.hp) / f.max, 6);

A.loop(dt => { if (state === 'between') { if (msgT > 0) msgT -= dt; return; } update(dt); }, render);

/* Attract demo: line up with the nearest gang member and punch; spin when crowded; walk right when it's clear. */
A.attract({
  start: () => newGame(false),
  stop: () => { state = 'title'; foes = []; items = []; players = []; cam = 0; },
  bot: () => {
    const p = players[0]; if (state !== 'play' || !p || p.out || p.down) return [];
    const keys = [], live = foes.filter(f => !f.down && !f.dying);
    const pz = items.find(it => it.kind === 'pizza' && p.hp < 50) || items.find(it => it.kind === 'pipe' && !p.weapon);
    let tx, ty;
    if (pz) { tx = pz.x; ty = pz.y; }
    else if (live.length) { const f = live.reduce((a, b) => Math.hypot(a.x - p.x, a.y - p.y) < Math.hypot(b.x - p.x, b.y - p.y) ? a : b); tx = f.x + (p.x < f.x ? -24 : 24); ty = f.y;

  }
});
A.overlay({ title: 'STREET SWEEPERS', sub: 'The Rust Gang has trashed the city. Dash and Rosa from the clean-up crew walk three streets to sweep them out: punch combos, jump kicks and a spin attack. Smash bins for pizza and pipes. Bring a friend with 2 PLAYERS (one keyboard, WASD and the arrows).', btn: '1 player', scores: true, onGo: () => newGame(false), alt: { btn: '2 players', onGo: () => newGame(true) } });
})();
