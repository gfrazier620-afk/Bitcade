<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cube Hopper</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="cube-hopper" style="--game:#6fb7ff">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>CUBE HOPPER</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="dp">
      <button data-k="ArrowLeft" style="grid-column:1;grid-row:1" aria-label="Hop up and left">↖</button>
      <button data-k="ArrowUp" style="grid-column:3;grid-row:1" aria-label="Hop up and right">↗</button>
      <button data-k="ArrowDown" style="grid-column:1;grid-row:3" aria-label="Hop down and left">↙</button>
      <button data-k="ArrowRight" style="grid-column:3;grid-row:3" aria-label="Hop down and right">↘</button>
    </div>
    <div class="ab"><button class="sm" data-k="KeyP">PAUSE</button></div>
  </div>
  <p class="help">Hop diagonally: <kbd>↑</kbd> up-right · <kbd>→</kbd> down-right · <kbd>↓</kbd> down-left · <kbd>←</kbd> up-left (or <kbd>W</kbd><kbd>D</kbd><kbd>S</kbd><kbd>A</kbd>) · click or tap the way you want to go · <kbd>P</kbd> pause</p>
</main>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const W = 480, H = 500, N = 7, TOPY = 96, DX = 28, DY = 44, ctx = A.canvas(cv, W, H);
// The arrow keys are turned 45°, the usual way to play this style of game on a keyboard.
const MOVES = { ul: [-1, -1], ur: [-1, 0], dl: [1, 0], dr: [1, 1] };
const KEYS = { ArrowUp: 'ur', KeyW: 'ur', ArrowRight: 'dr', KeyD: 'dr', ArrowDown: 'dl', KeyS: 'dl', ArrowLeft: 'ul', KeyA: 'ul' };
const PALETTES = [['#3d4f8a', '#ffd23d', '#ff7bf0'], ['#2f6b4a', '#5ee7ff', '#ffd23d'], ['#6b2f4a', '#ff8a3d', '#c6ff3d'], ['#4a3d8a', '#ff4f6d', '#5ee7ff']];
const pos = (r, c) => ({ x: W / 2 + (c - r / 2) * DX * 2, y: TOPY + r * DY });
const onPyramid = (r, c) => r >= 0 && r < N && c >= 0 && c <= r;
let state = 'title', round = 1, score = 0, lives = 3, nextLife = 8000, cubes = [], discs = [], foes = [], parts = [], pops = [];
let me = null, spawnT = 0, freezeT = 0, phaseT = 0, msg = '', msgT = 0, clock = 0;
const mode = () => round <= 2 ? 'single' : round <= 4 ? 'double' : 'toggle';
const goal = () => mode() === 'double' ? 2 : 1;
const palette = () => PALETTES[(round - 1) % PALETTES.length];
const hopEvery = () => Math.max(0.42, 0.8 - round * 0.04);

function setupRound() {
  cubes = []; for (let r = 0; r < N; r++) for (let c = 0; c <= r; c++) cubes.push({ r, c, s: 0 });
  const rows = [2, 3, 4, 5].sort(() => Math.random() - 0.5).slice(0, 2);
  discs = rows.map(r => ({ r, c: Math.random() < 0.5 ? -1 : r + 1, used: false }));
  foes = []; spawnT = 2.5; freezeT = 0;
  me = { r: 0, c: 0, hop: null, queued: null, face: 1, ride: null, fall: null };
  say({ single: 'ONE HOP CHANGES A CUBE', double: 'TWO HOPS PER CUBE', toggle: 'HOPS FLIP CUBES BACK' }[mode()]);
}
setupRound(); me = null; msgT = 0; // scenery for the title screen
function newGame() { score = 0; lives = 3; round = 1; nextLife = 8000; A.setScore(0); setupRound(); state = 'play'; A.jingle([392, 523, 659, 784], 0.08); }
function say(t) { msg = t; msgT = 1.8; }
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play' }); }
A.onPress(c => { if (c === 'KeyP' || c === 'Escape') return pause(); if (KEYS[c]) hop(KEYS[c]); });
A.onHide(pause);
// tap or swipe toward where you want to hop
let down = null;
cv.addEventListener('pointerdown', e => { A.unlock(); down = A.pointer(cv, e); });
cv.addEventListener('pointerup', e => {
  if (!down || !me) return; const up = A.pointer(cv, e); let dx = up.x - down.x, dy = up.y - down.y;
  if (Math.hypot(dx, dy) < 18) { const p = drawPos(me); dx = up.x - p.x; dy = up.y - p.y; } // a tap: aim from the hopper
  down = null; hop(dy < 0 ? (dx < 0 ? 'ul' : 'ur') : (dx < 0 ? 'dl' : 'dr'));
});

function hop(d) {
  if (state !== 'play' || !me || me.ride || me.fall) return;
  if (me.hop) { me.queued = d; return; }
  const [dr, dc] = MOVES[d];
  me.hop = { fr: me.r, fc: me.c, tr: me.r + dr, tc: me.c + dc, t: 0, dur: 0.26 };
  me.face = d === 'ul' || d === 'dl' ? -1 : 1;
  A.tone(dr < 0 ? 620 : 480, 0.05, 'square', 0.03, 0, dr < 0 ? 820 : 360);
}
function landPlayer() {
  const { tr, tc } = me.hop; me.hop = null;
  if (onPyramid(tr, tc)) { me.r = tr; me.c = tc; paint(tr, tc); if (me.queued) { const q = me.queued; me.queued = null; hop(q); } return; }
  const disc = discs.find(d => !d.used && d.r === tr && d.c === tc);
  if (disc) { disc.used = true; me.ride = { t: 0, from: pos(tr, tc), last: { r: me.r, c: me.c }, spot: { r: tr, c: tc } }; A.jingle([523, 659, 784, 1047, 1319], 0.07); return; }
  me.fall = { t: 0, x: pos(tr, tc).x, y: pos(tr, tc).y }; A.tone(700, 0.9, 'sine', 0.05, 0, 80);
}
function paint(r, c) {
  const cube = cubes.find(q => q.r === r && q.c === c), g = goal();
  if (mode() === 'toggle') { cube.s = cube.s ? 0 : 1; if (cube.s) { score += 25; A.tone(880, 0.05, 'triangle', 0.04); } }
  else if (cube.s < g) { cube.s++; score += 25; A.tone(760 + cube.s * 120, 0.05, 'triangle', 0.04); }
  if (cubes.every(q => q.s === g)) roundClear();
}
function roundClear() {
  const bonus = 1000 + 250 * round + discs.filter(d => !d.used).length * 50;
  score += bonus; state = 'clear'; phaseT = 2.4; say(`ROUND CLEAR! +${bonus}`); A.badge('round'); A.jingle([523, 659, 784, 1047, 784, 1047, 1319], 0.08);
}
function spawn() {
  const max = 2 + Math.floor(round / 2);
  if (foes.length >= max) return;
  const roll = Math.random(), hasCoil = foes.some(f => f.kind === 'coil' || f.kind === 'purple');
  const kind = !hasCoil && roll < 0.3 ? 'purple' : roll < 0.42 ? 'green' : round >= 2 && roll < 0.55 ? 'smudge' : 'red';
  foes.push({ kind, r: 1, c: A.rnd(2), hop: null, t: 0.6, drop: 0.5 });
}
/* enemies hop on their own timer: balls bounce down, the coil chases you */
function foeHop(f) {
  let d;
  if (f.kind === 'coil') {
    // head for the hopper; if it just rode a disc away, follow it off the edge
    const tgt = me.ride ? me.ride.spot : me.hop ? { r: me.hop.tr, c: me.hop.tc } : me;
    let best = null, bd = 1e9;
    for (const k in MOVES) {
      const r = f.r + MOVES[k][0], c = f.c + MOVES[k][1];
      if (!onPyramid(r, c) && !(me.ride && r === tgt.r && c === tgt.c)) continue;
      const a = pos(r, c), b = pos(tgt.r, tgt.c), dd = Math.hypot(a.x - b.x, a.y - b.y);
      if (dd < bd) { bd = dd; best = k; }
    }
    d = best || 'dl';
  } else d = Math.random() < 0.5 ? 'dl' : 'dr';
  const [dr, dc] = MOVES[d];
  f.hop = { fr: f.r, fc: f.c, tr: f.r + dr, tc: f.c + dc, t: 0, dur: f.kind === 'coil' ? 0.3 : 0.24 };
}
function landFoe(f) {
  const { tr, tc } = f.hop; f.hop = null;
  if (!onPyramid(tr, tc)) {
    f.gone = true;
    if (f.kind === 'coil') { score += 500; pops.push({ ...pos(tr, tc), n: 500, t: 1.4 }); say('LURED OFF! +500'); A.badge('lure'); A.jingle([1047, 784, 523, 262], 0.1, 'triangle'); }
    return;
  }
  f.r = tr; f.c = tc; A.tone(f.kind === 'coil' ? 180 : 240, 0.04, 'square', 0.025);
  if (f.kind === 'purple' && f.r === N - 1) f.kind = 'coil'; // hatches at the bottom
  if (f.kind === 'smudge') { const cube = cubes.find(q => q.r === tr && q.c === tc); if (cube.s > 0) cube.s--; }
}
const drawPos = o => {
  if (o.hop) { const k = Math.min(1, o.hop.t / o.hop.dur), a = pos(o.hop.fr, o.hop.fc), b = pos(o.hop.tr, o.hop.tc); return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k - Math.sin(k * Math.PI) * 22 }; }
  return pos(o.r, o.c);
};
function die(fromFall) {
  state = 'dying'; phaseT = 1.6; lives--; A.noise(0.5, 0.07); A.tone(300, 0.7, 'sawtooth', 0.05, 0, 60);
  foes = []; spawnT = 2; if (fromFall) { me.r = 0; me.c = 0; }
  me.hop = null; me.fall = null; me.queued = null;
}
function burst(x, y, c) { for (let i = 0; i < 14; i++) { const a = Math.random() * 6.28, s = A.rand(40, 170); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: A.rand(0.3, 0.7), c }); } }
function gameOver() { state = 'over'; const rec = A.submit(score); A.overlay({ title: 'SPRUNG OUT', big: `SCORE ${score} · ROUND ${round}`, sub: rec ? 'New high score!' : `Best: ${A.best()}`, btn: 'Hop again', onGo: newGame }); }

A.loop(dt => {
  clock += dt;
  parts.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.t -= dt; }); parts = parts.filter(q => q.t > 0);
  pops.forEach(q => q.t -= dt); pops = pops.filter(q => q.t > 0);
  if (msgT > 0) msgT -= dt;
  if (state === 'dying') { phaseT -= dt; if (phaseT <= 0) { if (lives <= 0) return gameOver(); state = 'play'; } return; }
  if (state === 'clear') { phaseT -= dt; if (phaseT <= 0) { round++; if (round >= 5) A.badge('r5'); setupRound(); state = 'play'; } return; }
  if (state !== 'play') return;
  // the hopper
  if (me.hop) { me.hop.t += dt; if (me.hop.t >= me.hop.dur) landPlayer(); }
  if (me.ride) {
    me.ride.t += dt;
    if (me.ride.t > 1.8) { me.ride = null; me.r = 0; me.c = 0; paint(0, 0); }
  }
  if (me.fall) { me.fall.t += dt; me.fall.y += 480 * me.fall.t * dt; if (me.fall.t > 1) return die(true); }
  if (state !== 'play') return;
  // enemies
  if (freezeT > 0) freezeT -= dt;
  else {
    spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(1.6, 3.6 - round * 0.2) * A.rand(0.8, 1.2); }
    for (const f of foes) {
      if (f.drop > 0) { f.drop -= dt; continue; }
      if (f.hop) { f.hop.t += dt; if (f.hop.t >= f.hop.dur) landFoe(f); continue; }
      f.t -= dt; if (f.t <= 0) { f.t = f.kind === 'coil' ? hopEvery() * 0.9 : hopEvery(); foeHop(f); }
    }
    foes = foes.filter(f => !f.gone);
  }
  // collisions, judged on screen position so mid-hop crossings count
  if (!me.ride && !me.fall) {
    const p = drawPos(me);
    for (const f of foes) {
      if (f.drop > 0) continue;
      const q = drawPos(f); if (Math.hypot(p.x - q.x, p.y - q.y) > 18) continue;
      if (f.kind === 'green') { f.gone = true; freezeT = 3; score += 100; pops.push({ ...q, n: 100, t: 1 }); say('FREEZE!'); A.jingle([1319, 1047, 1319], 0.06); }
      else if (f.kind === 'smudge') { f.gone = true; score += 300; pops.push({ ...q, n: 300, t: 1 }); A.jingle([784, 988], 0.06); }
      else { burst(p.x, p.y - 10, '#6fb7ff'); say('BONK!'); return die(false); }
    }
    foes = foes.filter(f => !f.gone);
  }
  if (score >= nextLife) { lives++; nextLife += 8000; A.jingle([660, 880, 1320], 0.08); }
  A.setScore(score);
}, t => {
  const g = ctx.createRadialGradient(W / 2, 0, 40, W / 2, 0, H); g.addColorStop(0, '#1b1640'); g.addColorStop(1, '#07060f'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const pal = palette(), flash = state === 'clear' && Math.floor(t / 140) % 2;
  for (const q of cubes) drawCube(pos(q.r, q.c), flash ? '#ffffff' : q.s === 0 ? pal[0] : q.s >= goal() ? pal[2] : pal[1]);
  discs.forEach(d => { if (!d.used) drawDisc(pos(d.r, d.c), t); });
  if (me && me.ride) { const k = Math.min(1, me.ride.t / 1.5), a = me.ride.from, b = { x: W / 2, y: TOPY - 60 }, x = a.x + (b.x - a.x) * k, y = a.y + (b.y - a.y) * k; drawDisc({ x, y }, t); drawHopper(x, y - 10, me.face); }
  foes.forEach(f => { const p = drawPos(f); drawFoe(f, p.x, p.y - (f.drop > 0 ? f.drop * 120 : 0), t); });
  if (state === 'title') { const k = (t / 700) % 1, r = Math.floor(t / 700) % N, a = pos(r, 0), b = pos(r + 1, 0); drawHopper(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k - Math.sin(k * Math.PI) * 22 - 10, -1); }
  else if (me && !me.ride) {
    if (me.fall) { ctx.globalAlpha = Math.max(0, 1 - me.fall.t); drawHopper(me.fall.x, me.fall.y - 10, me.face); ctx.globalAlpha = 1; }
    else if (!(state === 'dying' && Math.floor(t / 100) % 2)) { const p = drawPos(me); drawHopper(p.x, p.y - 10, me.face); }
  }
  parts.forEach(q => { ctx.globalAlpha = Math.min(1, q.t * 2); ctx.fillStyle = q.c; ctx.fillRect(q.x - 2, q.y - 2, 4, 4); }); ctx.globalAlpha = 1;
  ctx.font = '13px Silkscreen, monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffd23d'; pops.forEach(q => ctx.fillText(q.n, q.x, q.y - 30 - (1 - q.t) * 20));
  if (state !== 'title') {
    ctx.textAlign = 'left'; ctx.fillStyle = '#f4effd'; ctx.font = '13px Silkscreen, monospace'; ctx.fillText('ROUND ' + round, 12, 22);
    ctx.fillStyle = '#a39bc4'; ctx.font = '11px Silkscreen, monospace'; ctx.fillText('CHANGE TO', 12, 40); drawCube({ x: 106, y: 34 }, pal[2], 0.45);
    for (let i = 0; i < lives - 1; i++) { ctx.save(); ctx.translate(W - 20 - i * 24, 24); ctx.scale(0.6, 0.6); drawHopper(0, 0, -1); ctx.restore(); }
    if (freezeT > 0) { ctx.textAlign = 'right'; ctx.fillStyle = '#3dff8f'; ctx.fillText('FROZEN ' + Math.ceil(freezeT), W - 12, 50); }
  }
  if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT * 2); ctx.font = '20px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#6fb7ff'; ctx.shadowColor = '#000'; ctx.shadowBlur = 8; ctx.fillText(msg, W / 2, H - 28); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
});
function drawCube(p, top, s = 1) {
  const x = p.x, y = p.y, hw = DX * s, hh = 14 * s, side = 30 * s;
  ctx.fillStyle = top; ctx.beginPath(); ctx.moveTo(x, y - hh); ctx.lineTo(x + hw, y); ctx.lineTo(x, y + hh); ctx.lineTo(x - hw, y); ctx.closePath(); ctx.fill();
  if (s < 1) return;
  ctx.fillStyle = '#231a4a'; ctx.beginPath(); ctx.moveTo(x - hw, y); ctx.lineTo(x, y + hh); ctx.lineTo(x, y + hh + side); ctx.lineTo(x - hw, y + side); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#352a6b'; ctx.beginPath(); ctx.moveTo(x + hw, y); ctx.lineTo(x, y + hh); ctx.lineTo(x, y + hh + side); ctx.lineTo(x + hw, y + side); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y + hh); ctx.lineTo(x, y + hh + side); ctx.stroke();
}
function drawDisc(p, t) {
  const hue = (t / 6) % 360;
  ctx.fillStyle = `hsl(${hue},90%,62%)`; ctx.beginPath(); ctx.ellipse(p.x, p.y, 18, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `hsl(${(hue + 120) % 360},90%,70%)`; ctx.beginPath(); ctx.ellipse(p.x, p.y, 9, 3.5, 0, 0, Math.PI * 2); ctx.fill();
}
function drawHopper(x, y, face) {
  ctx.save(); ctx.translate(x, y); ctx.scale(face, 1);
  ctx.strokeStyle = '#c0c6d0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-4, 6); ctx.lineTo(-6, 9); ctx.lineTo(-2, 12); ctx.lineTo(-6, 15); ctx.moveTo(4, 6); ctx.lineTo(6, 9); ctx.lineTo(2, 12); ctx.lineTo(6, 15); ctx.stroke();
  ctx.fillStyle = '#6fb7ff'; ctx.beginPath(); ctx.roundRect(-10, -12, 20, 19, 6); ctx.fill();
  ctx.fillStyle = '#0b1a33'; ctx.beginPath(); ctx.roundRect(-6, -8, 15, 8, 3); ctx.fill();
  ctx.fillStyle = '#5ee7ff'; ctx.fillRect(1, -6, 3, 3); ctx.fillRect(5, -6, 3, 3);
  ctx.strokeStyle = '#6fb7ff'; ctx.beginPath(); ctx.moveTo(-3, -12); ctx.lineTo(-5, -19); ctx.stroke(); ctx.fillStyle = '#ff7bf0'; ctx.beginPath(); ctx.arc(-5, -20, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawFoe(f, x, y, t) {
  if (f.kind === 'coil') {
    ctx.strokeStyle = '#b48cff'; ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(x, y - 2 - i * 6, 9, 3.5, 0, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = '#b48cff'; ctx.beginPath(); ctx.arc(x, y - 30, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 5, y - 33, 4, 4); ctx.fillRect(x + 1, y - 33, 4, 4); ctx.fillStyle = '#120a1c'; ctx.fillRect(x - 4, y - 32, 2, 2); ctx.fillRect(x + 2, y - 32, 2, 2);
    return;
  }
  if (f.kind === 'smudge') {
    ctx.fillStyle = '#8a92a8'; ctx.beginPath(); ctx.ellipse(x, y - 8, 9, 8 + Math.sin(t / 90) * 1.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 5, y - 11, 3, 3); ctx.fillRect(x + 2, y - 11, 3, 3);
    return;
  }
  const c = { red: '#ff4f6d', purple: '#b48cff', green: '#3dff8f' }[f.kind];
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y - 8, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(x - 3, y - 11, 2.5, 0, Math.PI * 2); ctx.fill();
}
A.overlay({ title: 'CUBE HOPPER', sub: 'Hop on every cube to change it to the target colour. Dodge the red balls and the spring that hatches from the purple one. Green balls freeze everything. Ride a spinning disc back to the top, and the spring may jump after you.', btn: 'Start', scores: true, onGo: newGame });
})();
</script>
</body>
</html>
