<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skyline Smash</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preload" href="../../shared/fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="../../shared/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/arcade.css">
<style>
.mons{display:flex;justify-content:center;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.mons button{font:11px Silkscreen,monospace;letter-spacing:.06em;color:#d8d0f0;background:rgba(20,12,36,.85);border:2px solid #3a2f5a;border-radius:8px;padding:6px 10px;cursor:pointer}
.mons button.on{color:#120a1c;background:var(--mc);border-color:var(--mc)}
</style>
</head>
<body data-game="skyline-smash" data-pad="0:Space 1:KeyK 2:KeyK" style="--game:#ff5a4a">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>SKYLINE SMASH</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="dp"><button class="u" data-k="ArrowUp" aria-label="Climb up">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button><button class="d" data-k="ArrowDown" aria-label="Climb down">▼</button></div>
    <div class="ab"><button class="sm" data-k="KeyK">JUMP</button><button data-k="Space">PUNCH</button></div>
  </div>
  <p class="help"><b>1 player:</b> arrows or WASD walk and climb (▲ in front of a building) · <kbd>Space</kbd>/<kbd>J</kbd> punch · <kbd>K</kbd> jump or let go · <b>2 players:</b> WASD + <kbd>F</kbd> punch + <kbd>G</kbd> jump, arrows + <kbd>L</kbd> punch + <kbd>K</kbd> jump · <kbd>P</kbd> pause · gamepad: d-pad, A punch, B jump</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script src="../../shared/story.js"></script>
<script>
(() => {
/*
 * Skyline Smash: a giant monster in a little city. Climb the front of a building, punch its windows in, and once more
 * than half of it is smashed it comes down. Windows hide snacks (health), gems (points) and live wires (ouch), and
 * soldiers lean out of them to shoot. Soldiers and tanks come along the street and helicopters buzz round your head;
 * punch them. You get hungrier as you go, so keep eating. Flatten every building to clear the city. Three monsters
 * (Clawdia hits hardest, Burrowbo climbs and punches fastest, Rustbolt takes the most), one player or two.
 * Story mode (shared/story.js): The Big Stomp, six cities up to Titan-X, Dr. Gearwright's giant robot. Snacks buy
 * upgrades (one is a CPU monster friend). Beating it opens DEMOLITION DERBY: 90 seconds, buildings keep coming.
 */
const A = Arcade, cv = document.getElementById('cv');
const W = 640, H = 400, GROUND = 344, ctx = A.canvas(cv, W, H), OUT = '#0a0612';
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function paint(x, list) {
  x.fillStyle = OUT; for (const q of list) x.fillRect(q[0] - 2, q[1] - 2, q[2] + 4, q[3] + 4);
  for (const [px, py, w, h, c] of list) { x.fillStyle = c; x.fillRect(px, py, w, h); if (w > 3 && h > 3) { x.fillStyle = shade(c, 0.3); x.fillRect(px, py, w, Math.max(1, h * 0.2)); x.fillStyle = shade(c, -0.3); x.fillRect(px, py + h - Math.max(1, h * 0.2), w, Math.max(1, h * 0.2)); } }
}

/* ---------- monsters, cities ---------- */
const MON = {
  claw: { name: 'CLAWDIA', c: '#ff5a4a', hp: 100, pow: 2, cd: 0.3, walk: 105, climb: 80 },
  mole: { name: 'BURROWBO', c: '#b07a48', hp: 100, pow: 1, cd: 0.15, walk: 120, climb: 130 },
  bolt: { name: 'RUSTBOLT', c: '#7aa6c8', hp: 140, pow: 1, cd: 0.24, walk: 92, climb: 95 }
};
const CITIES = [
  { name: 'HARBOR TOWN', sky: ['#2a3a7a', '#f0956a'], sun: '#ffd27a', far: '#3a3466', walls: ['#c8644a', '#8a6a5a', '#4a8a9a', '#a8885a'], win: '#ffe08a', water: true },
  { name: 'SUNNYVALE', sky: ['#3a9ae8', '#bfe8ff'], sun: '#fff4b0', far: '#7ab0d8', walls: ['#e8c06a', '#7ac08a', '#e88a8a', '#8aa8e8'], win: '#cfefff' },
  { name: 'NEON DOWNTOWN', sky: ['#0a0620', '#3a1450'], sun: '#e8e8ff', far: '#1e1440', walls: ['#3a3a5a', '#2a4a5a', '#4a2a5a', '#3a4a3a'], win: '#ff5ac8', night: true },
  { name: 'DUSTY GULCH', sky: ['#e88a3a', '#ffd88a'], sun: '#fff0c0', far: '#c86a3a', walls: ['#c8a070', '#a87a4a', '#d8b888', '#9a6a4a'], win: '#ffe8a8' },
  { name: 'SNOWPEAK CITY', sky: ['#6a8ac8', '#e8f0ff'], sun: '#ffffff', far: '#a8bce0', walls: ['#7a8aa8', '#a86a6a', '#6a9a8a', '#9a8ab8'], win: '#fff0b0', snow: true },
  { name: 'GEARWRIGHT TOWER', sky: ['#1a0a1a', '#6a1a2a'], sun: '#ff6a4a', far: '#2a1020', walls: ['#4a4a5a', '#5a4a4a'], win: '#ff7a3a', night: true }
];
const CW = 22, CH = 24; // a window cell

let S = null, derby = false, derbyT = 0, smashed = 0, titan = null;
const up = id => S ? S.lv(id) : 0;
let state = 'title', two = false, level = 1, score = 0, city = CITIES[0], bg = null, players = [], blds = [], foes = [], shots = [], loot = [], debris = [], spawn = {}, msg = '', msgT = 0, lost = false, swats = 0, botMem = new Map();
const say = (t, s = 2) => { msg = t; msgT = s; };
const add = (n, x, y, c = '#ffd23d') => { score += n; A.setScore(score); if (x !== undefined) A.pop(x, y, '+' + n, c); };
const live = () => players.filter(p => !p.ko);

/* ---------- the city ---------- */
function drawBg() {
  bg = document.createElement('canvas'); bg.width = W; bg.height = H; const b = bg.getContext('2d'), c = city, r = A.seeded('skyline:bg:' + c.name);
  const g = b.createLinearGradient(0, 0, 0, GROUND); g.addColorStop(0, c.sky[0]); g.addColorStop(1, c.sky[1]); b.fillStyle = g; b.fillRect(0, 0, W, GROUND);
  if (c.night) { b.fillStyle = 'rgba(255,255,255,.8)'; for (let k = 0; k < 60; k++) b.fillRect(Math.floor(r() * W), Math.floor(r() * 200), 1, 1); }
  b.fillStyle = c.sun; b.beginPath(); b.arc(520, c.night ? 70 : 110, c.night ? 22 : 34, 0, 6.29); b.fill();
  b.fillStyle = 'rgba(255,255,255,.18)'; b.beginPath(); b.arc(520, c.night ? 70 : 110, c.night ? 34 : 50, 0, 6.29); b.fill();
  for (let x = 0; x < W;) { const w = 20 + r() * 40, h = 40 + r() * 110; b.fillStyle = c.far; b.fillRect(x, GROUND - 40 - h, w, h + 40); b.fillStyle = c.night ? 'rgba(255,90,200,.35)' : 'rgba(255,255,255,.12)'; for (let y = GROUND - 30 - h; y < GROUND - 50; y += 12) for (let k = x + 4; k < x + w - 6; k += 10) if (r() < 0.4) b.fillRect(k, y, 4, 5); x += w + 4; }
  if (c.water) { b.fillStyle = '#2a5a9a'; b.fillRect(0, GROUND - 26, W, 26); b.fillStyle = 'rgba(255,255,255,.3)'; for (let k = 0; k < 30; k++) b.fillRect(Math.floor(r() * W), GROUND - 22 + Math.floor(r() * 18), 10, 1); }
  if (c.snow) { b.fillStyle = '#f4f8ff'; for (let k = 0; k < 90; k++) b.fillRect(Math.floor(r() * W), Math.floor(r() * GROUND), 2, 2); }
  // the street
  b.fillStyle = '#4a4458'; b.fillRect(0, GROUND, W, 12); b.fillStyle = '#6a6478'; b.fillRect(0, GROUND, W, 3);
  b.fillStyle = '#2a2632'; b.fillRect(0, GROUND + 12, W, H - GROUND - 12);
  b.fillStyle = '#ffd23d'; for (let x = 10; x < W; x += 48) b.fillRect(x, GROUND + 32, 24, 3);
  if (c.snow) { b.fillStyle = '#e8f0ff'; b.fillRect(0, GROUND, W, 4); }
}
function mkBuilding(x, cols, rows, k) {
  const r = A.seeded('skyline:b:' + level + ':' + x)(), cells = [];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) cells.push({ hp: 2, item: null, peek: 0 });
  return { x, cols, rows, w: cols * CW + 8, top: GROUND - rows * CH - 8, cells, c: city.walls[k % city.walls.length], roof: Math.floor(r * 3), sink: 0, falling: false, gone: false, broken: 0 };
}
const cellRect = (b, i, j) => ({ x: b.x + 4 + i * CW, y: GROUND - (j + 1) * CH - 2 + b.sink, w: CW, h: CH });
function cellAt(b, x, y) { if (b.falling || b.gone) return null; const i = Math.floor((x - b.x - 4) / CW), j = Math.floor((GROUND - 2 - y) / CH); return i >= 0 && i < b.cols && j >= 0 && j < b.rows ? { i, j, c: b.cells[j * b.cols + i] } : null; }
const inside = (b, x) => !b.falling && !b.gone && x > b.x + 6 && x < b.x + b.w - 6;
function newCity() {
  const sto = S && S.run, si = sto && !derby ? S.run.stage : (level - 1) % 5;
  city = CITIES[sto && !derby ? si : (level - 1) % 5]; drawBg();
  blds = []; foes = []; shots = []; loot = []; debris = []; titan = null;
  const r = A.seeded('skyline:city:' + level + (sto ? ':s' + si : ''));
  if (sto && !derby && si === 5) { // Titan-X's yard: two tall towers to climb
    blds = [mkBuilding(40, 4, 9, 0), mkBuilding(210, 3, 8, 1)];
    titan = { x: 500, hp: S.run.hard ? 90 : 60, max: S.run.hard ? 90 : 60, dir: -1, rocketT: 2.5, laserT: 6, laser: null, hit: 0, step: 0, dead: 0, swatT: 3, swing: 0 };
  } else {
    const n = derby ? 4 : Math.min(5, 3 + Math.floor((level - 1) / 2)), slot = (W - 40) / n;
    for (let k = 0; k < n; k++) { const cols = 3 + Math.floor(r() * 3), rows = Math.min(10, 4 + Math.floor(r() * 3) + Math.min(4, Math.floor(level / 2))); blds.push(mkBuilding(Math.round(20 + k * slot + (slot - (cols * CW + 8)) / 2), cols, rows, k)); }
  }
  spawn = { sold: 2.5, heli: 7, tank: 10, peek: 3 };
  players.forEach((p, k) => { if (p.ko && p.hp <= 0 && !p.out) { p.ko = false; p.hp = Math.round(p.max / 2); } Object.assign(p, { x: 70 + k * 500, y: GROUND, vx: 0, vy: 0, st: 'ground', b: null, face: k ? -1 : 1 }); });
  say(derby ? 'DEMOLITION DERBY' : sto ? `${si + 1} · ${city.name}` : `CITY ${level} · ${city.name}`, 2.2); A.jingle([392, 523, 659, 784], 0.08, 'square');
  if (sto && !derby) S.reach(si);
}

/* ---------- players ---------- */
const SETS = [{ L: ['KeyA'], R: ['KeyD'], U: ['KeyW'], D: ['KeyS'], P: ['KeyF'], J: ['KeyG'] }, { L: ['ArrowLeft'], R: ['ArrowRight'], U: ['ArrowUp'], D: ['ArrowDown'], P: ['KeyL', 'Enter'], J: ['KeyK'] }];
const ONE = { L: ['ArrowLeft', 'KeyA'], R: ['ArrowRight', 'KeyD'], U: ['ArrowUp', 'KeyW'], D: ['ArrowDown', 'KeyS'], P: ['Space', 'KeyJ', 'KeyZ'], J: ['KeyK', 'KeyX'] };
function mkMon(i, kind, ai = false) {
  const m = MON[kind], max = Math.round(m.hp * (A.easy ? 1.5 : 1)) + up('hide') * 25;
  return { i, kind, m, ai, keys: ai ? null : two ? SETS[i] : ONE, x: 70 + i * 500, y: GROUND, vx: 0, vy: 0, st: 'ground', b: null, face: i ? -1 : 1, hp: max, max, cool: 0, punchT: 0, hurtT: 0, ko: false, out: false, anim: 0, climbAnim: 0, pow: m.pow + up('fist'), spd: 1 + up('climb') * 0.25, intent: {} };
}
function input(p) {
  if (p.ai) return p.intent;
  const k = p.keys; return { L: A.held(...k.L), R: A.held(...k.R), U: A.held(...k.U), D: A.held(...k.D) };
}
const fist = p => ({ x: p.x + p.face * 24, y: p.y - (p.st === 'climb' ? 40 : p.st === 'ground' ? 24 : 34) }); // from the street you reach the bottom row
function jump(p) {
  if (p.ko || state !== 'play') return;
  if (p.st === 'ground' || p.st === 'roof') { p.vy = -340; p.st = 'air'; p.b = null; A.sfx('jump'); }
  else if (p.st === 'climb') { p.st = 'air'; p.vy = -120; p.vx = -p.face * 90; p.b = null; }
}
function punch(p) {
  if (p.ko || state !== 'play' || p.cool > 0) return;
  p.cool = p.m.cd; p.punchT = 0.14; const f = fist(p);
  A.tone(140 + Math.random() * 40, 0.06, 'square', 0.035, 0, 70);
  // a foe in reach?
  for (const e of foes) if (!e.dead && Math.abs(e.x - f.x) < 28 && Math.abs(e.y - e.h / 2 - f.y) < e.h / 2 + 20) return hitFoe(e, p);
  if (titan && titan.hp > 0) { const head = f.y < GROUND - 196 && f.y > GROUND - 250, body = f.y >= GROUND - 196 && f.y < GROUND - 10; if (Math.abs(f.x - titan.x) < (head ? 34 : 38) && (head || body)) return hitTitan(head ? 2 : 1, f.x, f.y); }
  // a building: the window under the fist (on a roof, the top row under you)
  for (const b of blds) {
    let hit = cellAt(b, f.x, f.y);
    if (!hit && p.st === 'roof' && p.b === b) hit = cellAt(b, Math.min(b.x + b.w - 8, Math.max(b.x + 8, f.x)), b.top + 14);
    if (hit) return hitCell(b, hit, p);
  }
  A.burst(f.x, f.y, { n: 4, color: '#fff', speed: 60, life: 0.2, size: 2 });
}
function hitCell(b, { i, j, c }, p) {
  const r = cellRect(b, i, j), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  if (c.hp <= 0) { // already a hole: grab what's inside
    if (c.item) take(b, c, p, cx, cy); else A.burst(cx, cy, { n: 5, color: shade(b.c, -0.3), speed: 70, life: 0.3, size: 2, kind: 'debris' });
    return;
  }
  c.hp -= p.pow; A.shake(2, 0.1); A.burst(cx, cy, { n: 8, colors: ['#cfefff', '#fff', shade(b.c, -0.2)], speed: 120, life: 0.4, size: 2, kind: 'debris' });
  if (c.peek > 0) { c.peek = 0; add(200, cx, cy - 10, '#5ee7ff'); A.sfx('hurt'); A.burst(cx, cy, { n: 10, color: '#7a8a5a', speed: 140, life: 0.5 }); }
  if (c.hp > 0) return;
  b.broken++; add(50); A.noise(0.12, 0.04);
  const r2 = Math.random();
  c.item = r2 < 0.14 ? 'snack' : r2 < 0.2 ? 'gem' : r2 < 0.26 ? 'wire' : null;
  if (c.item === 'wire') { c.item = null; zap(p, cx, cy); }
  if (b.broken >= Math.ceil(b.cells.length * 0.55)) collapse(b);
}
function take(b, c, p, x, y) {
  if (c.item === 'snack') { const heal = 20 * (1 + up('belly')); p.hp = Math.min(p.max, p.hp + heal); add(100, x, y - 12, '#3dff8f'); A.sfx('powerup'); A.burst(x, y, { n: 10, colors: ['#ffd23d', '#ff8a3d', '#3dff8f'], speed: 90, life: 0.4 }); if (S && S.run) S.bank(3); }
  if (c.item === 'gem') { add(1000, x, y - 12, '#5ee7ff'); A.sfx('pickup'); A.ring(x, y, '#5ee7ff', 30); if (S && S.run) S.bank(8); }
  c.item = null;
}
function zap(p, x, y) { A.burst(x, y, { n: 18, colors: ['#ffff8a', '#5ee7ff', '#fff'], speed: 200, life: 0.35, kind: 'spark' }); A.flash('#ffff8a', 0.1); A.tone(1200, 0.2, 'sawtooth', 0.04, 0, 200); hurt(p, 8, true); }
function collapse(b) {
  if (b.falling) return; b.falling = true; smashed++;
  add(250 * b.rows, b.x + b.w / 2, b.top + 20, '#ffd23d');
  A.shake(9, 0.9); A.hitstop(0.06); A.noise(1.2, 0.09); A.sfx('boom');
  for (const p of players) if (p.b === b) { p.st = 'air'; p.b = null; p.vy = -80; }
  if (S && S.run) S.bank(10 + b.rows);
}
function hurt(p, n, force) {
  if (p.ko || (!force && p.hurtT > 0) || state !== 'play') return;
  p.hp -= n; p.hurtT = 0.5; A.sfx('hurt'); A.shake(4, 0.2); A.burst(p.x, p.y - 30, { n: 8, color: '#fff', speed: 120, life: 0.3 });
  if (p.hp <= 0) { p.hp = 0; p.ko = true; p.st = 'air'; p.b = null; p.vy = -200; A.shake(10, 0.6); A.flash('#ff4f6d', 0.2); say(`${p.m.name} IS DOWN!`, 1.8); if (!players.some(q => !q.ko && !q.ai)) gameOver(); }
}

/* ---------- the army ---------- */
const FOE = { sold: { hp: 1, h: 20, pts: 100 }, tank: { hp: 3, h: 26, pts: 600 }, heli: { hp: 2, h: 22, pts: 400 } };
function addFoe(k) {
  const side = Math.random() < 0.5 ? -1 : 1, x = side < 0 ? -20 : W + 20;
  const e = { k, ...FOE[k], x, y: k === 'heli' ? 80 + Math.random() * 150 : GROUND, dir: -side, t: Math.random() * 2, shoot: 1.5 + Math.random(), dead: false, hit: 0 };
  if (S && S.run && S.run.hard) e.hp++;
  foes.push(e);
}
function hitFoe(e, p) {
  e.hp -= p.pow; e.hit = 0.12; A.hitstop(0.04); A.burst(e.x, e.y - e.h / 2, { n: 8, color: '#fff', speed: 110, life: 0.3 });
  if (e.hp > 0) { A.tone(300, 0.05, 'square', 0.03); return; }
  e.dead = true; add(e.pts, e.x, e.y - e.h); if (S && S.run) S.bank(e.k === 'sold' ? 1 : 5);
  A.sfx('boom'); A.burst(e.x, e.y - e.h / 2, { n: e.k === 'sold' ? 10 : 22, colors: ['#ffd23d', '#ff8a3d', '#555'], speed: 170, life: 0.6, kind: e.k === 'sold' ? 'spark' : 'debris' });
  if (e.k !== 'sold') { A.shake(5, 0.3); A.ring(e.x, e.y - e.h / 2, '#ff8a3d', 40); }
  if (e.k === 'heli') { debris.push({ x: e.x, y: e.y, vx: p.face * 120, vy: -60, r: 0, vr: 6 }); if (++swats >= 10) A.badge('swatter'); }
}
function fire(x, y, p, sp = 190, dmg = 4, g = 0, c = '#ffd23d') {
  const tx = p.x, ty = p.y - 30, d = Math.hypot(tx - x, ty - y) || 1;
  shots.push({ x, y, vx: (tx - x) / d * sp, vy: (ty - y) / d * sp - (g ? 180 : 0), g, dmg, c, t: 4 });
}
const nearest = (x, y) => live().sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y))[0];
function hitTitan(n, x, y) {
  titan.hp -= n; titan.hit = 0.15; add(n * 150, x, y, '#ff4f6d'); A.hitstop(0.05); A.shake(4, 0.2); A.burst(x, y, { n: 12, colors: ['#ffd23d', '#c8d0e0', '#fff'], speed: 160, life: 0.4, kind: 'spark' }); A.tone(180, 0.08, 'square', 0.05);
  if (titan.hp > 0) return;
  titan.hp = 0; titan.dead = 0.01; titan.laser = null; add(20000, titan.x, GROUND - 240, '#ffd23d'); if (S && S.run) S.bank(200);
  say('TITAN-X GOES DOWN!', 3); A.flash('#fff', 0.3); A.shake(14, 1.4); A.noise(1.6, 0.1);
  for (let k = 0; k < 8; k++) setTimeout(() => A.burst(titan.x - 40 + Math.random() * 80, GROUND - Math.random() * 230, { n: 20, colors: ['#ffd23d', '#ff8a3d', '#555'], speed: 200, life: 0.7 }), k * 180);
  setTimeout(() => cityClear(), 2200);
}

/* ---------- the game ---------- */
function newGame(twoP, kind = pick()) {
  if (S) S.run = null; derby = false; two = twoP; level = 1; score = 0; swats = 0; A.setScore(0); lost = false;
  players = two ? [mkMon(0, 'claw'), mkMon(1, 'bolt')] : [mkMon(0, kind)];
  newCity(); state = 'play';
}
function pick() { const k = A.store.get('arcade:skyline:mon'); return MON[k] ? k : 'claw'; }
function choose() {
  A.overlay({ title: 'PICK A MONSTER', sub: '<b>Clawdia</b> punches hardest (a window in one hit). <b>Burrowbo</b> climbs and punches fastest. <b>Rustbolt</b> takes the most punishment.', btn: 'CLAWDIA', onGo: () => go('claw'), alt: { btn: 'BURROWBO', onGo: () => go('mole') }, alt2: { btn: 'RUSTBOLT', onGo: () => go('bolt') } });
  function go(k) { A.store.set('arcade:skyline:mon', k); newGame(false, k); }
}
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play', alt: S && S.quit() }); }
A.onHide(pause);
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();

/*
 * The brain, for the attract demo and the CPU friend: punch whatever's in reach, eat when hungry, otherwise climb the

function brain(p, dt) {
