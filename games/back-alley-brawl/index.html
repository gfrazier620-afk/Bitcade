<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Back Alley Brawl</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">

<style>
  .pick{display:flex;gap:10px;justify-content:center;margin-top:6px}

</head>
<body data-game="back-alley-brawl" data-pad="0:KeyK 1:KeyL 2:KeyJ 3:KeyJ" style="--game:#ff5a3d;--chrome:220px">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>BACK ALLEY BRAWL</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="dp"><button class="u" data-k="ArrowUp" aria-label="Jump">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button><button class="d" data-k="ArrowDown" aria-label="Crouch">▼</button></div>
    <div class="ab"><button class="sm" data-k="KeyL">SPEC</button><button data-k="KeyJ">PUNCH</button><button data-k="KeyK">KICK</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>→</kbd> walk (hold back to block) · <kbd>↑</kbd> jump · <kbd>↓</kbd> crouch · <kbd>J</kbd> punch · <kbd>K</kbd> kick · <kbd>L</kbd> special · <kbd>P</kbd> pause</p>
</main>
<script src="../../shared/arcade.js"></script>
<script>
(() => {

  { name: 'KAI', gi: '#3d7bff', trim: '#1c3c8a', band: '#ff4f6d', skin: '#e2a978', hair: '#22150e', spd: 1, pow: 1, desc: 'Balanced' },
  { name: 'ROXY', gi: '#ff4fd8', trim: '#8a1f74', band: '#ffd23d', skin: '#b97e55', hair: '#5a2310', spd: 1.18, pow: 0.86, desc: 'Fast, lighter hits' }
];
const LADDER = [
  { name: 'RAZOR', gi: '#3dcf7a', trim: '#1a5e36', band: '#111', skin: '#d79a6a', hair: '#111', spd: 0.92, pow: 0.8, ai: { aggr: 0.32, block: 0.2, react: 0.36 } },
  { name: 'BRICK', gi: '#8b6b4b', trim: '#4a3624', band: '#ff8a3d', skin: '#a96f48', hair: '#2b1a10', spd: 0.78, pow: 1.3, ai: { aggr: 0.45, block: 0.3, react: 0.3 } },
  { name: 'VIPER', gi: '#9a7bff', trim: '#3f2c8a', band: '#3dff8f', skin: '#efc39a', hair: '#e8e0d0', spd: 1.24, pow: 0.92, ai: { aggr: 0.58, block: 0.42, react: 0.22 } },
  { name: 'TITAN', gi: '#ff8a3d', trim: '#7a3a0c', band: '#fff', skin: '#8c5a3a', hair: '#0e0a08', spd: 1.04, pow: 1.22, ai: { aggr: 0.7, block: 0.58, react: 0.16 } }

const MOVES = {

  kick: { start: 0.13, act: 0.1, rec: 0.24, dmg: 10, reach: 66, h: 48, kb: 170 },

let heroIdx = 0, state = 'title', P, C, projs = [], sparks = [], match, score, roundT, phaseT, banner, shake = 0, pressed = new Set();

/* background details, generated once */

function fighter(def, x, face) { return { def, x, y: 0, vx: 0, vy: 0, face, hp: 100, st: 'idle', t: 0, mv: null, hitDone: false, fired: false, stun: 0, cool: 0, block: false, crouch: false, flash: 0, walk: 0 }; }

function startRound() {

function pause() { if (state !== 'fight' && state !== 'intro') return; const prev = state; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = prev }); }

}
function aiIntent(c, p, dt) {

}
function attack(f, mv) { f.st = 'attack'; f.mv = mv; f.t = 0; f.hitDone = false; f.fired = false; if (!MOVES[mv].air) f.vx = 0; A.tone(mv === 'kick' || mv === 'sweep' ? 260 : 340, 0.05, 'triangle', 0.04); }
const grounded = f => f.y <= 0 && f.vy <= 0;
function updateF(f, o, it, dt) {

    f.x = A.clamp(f.x, 28, W - 28);

  if (f.st === 'ko') { physics(); return; }
  if (f.st === 'down') { f.t -= dt; physics(); if (f.t <= 0) f.st = 'idle'; return; }
  if (f.stun > 0) { f.stun -= dt; physics(); if (f.stun <= 0) f.st = 'idle'; return; }

    if (it.s && f.cool <= 0 && !f.crouch) { f.cool = 1.6; attack(f, 'special'); }

    else {

function hurtTop(f) { return f.st === 'down' || f.st === 'ko' ? 18 : f.crouch && grounded(f) ? 54 : 88; }
function canBlock(o, m) {

}
function tryHit(f, o, m) {
  if (o.st === 'ko' || o.st === 'down') return;

  const lo = Math.min(tip, near), hi = Math.max(tip, near);

function land(att, o, dmg, kb, down, m, sx, sy) {
  if (canBlock(o, m)) {
    o.hp -= dmg * 0.12; o.vx = att.face * kb * 0.7; o.st = 'block'; o.stun = 0.14; spark(sx, sy, '#9ad', 6); A.tone(900, 0.04, 'square', 0.03);
  } else {
    o.hp -= dmg; o.vx = att.face * kb; o.flash = 0.12; spark(sx, sy, '#ffd23d', 14); shake = 0.12;
    A.noise(0.08, 0.08); A.tone(140, 0.12, 'square', 0.05);
    if (down && grounded(o)) { o.st = 'down'; o.t = 0.75; o.stun = 0; } else { o.st = 'hit'; o.stun = 0.3; if (!grounded(o)) o.vy = 200; }
    if (att === P) { score += Math.round(dmg * 10); A.setScore(score); }
  }
  if (o.hp <= 0) { o.hp = 0; o.st = 'ko'; o.vy = 380; o.vx = att.face * 240; o.stun = 0; A.tone(400, 0.8, 'sawtooth', 0.06, 0, 50); }
}
function spark(x, y, c, n) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = A.rand(60, 260); sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: A.rand(0.15, 0.35), c }); } }
function separate() {
  const d = C.x - P.x, min = 38;
  if (Math.abs(d) < min && Math.abs(P.y - C.y) < 70) { const push = (min - Math.abs(d)) / 2 * Math.sign(d || 1); P.x -= push; C.x += push; P.x = A.clamp(P.x, 28, W - 28); C.x = A.clamp(C.x, 28, W - 28); }
}
function endRound(winner) {
  state = 'roundEnd'; phaseT = 2.6;
  if (winner === P) { match.pw++; const bonus = 1000 + Math.round(P.hp) * 10 + Math.ceil(roundT) * 10 + (P.hp >= 100 ? 2000 : 0); score += bonus; A.setScore(score); banner = P.hp >= 100 ? 'PERFECT!' : `${P.def.name} WINS`; A.jingle([523, 659, 784, 1047], 0.12); }
  else if (winner === C) { match.cw++; banner = `${C.def.name} WINS`; A.jingle([392, 330, 262, 196], 0.16, 'triangle'); }
  else banner = 'DRAW';
}
function afterRound() {
  if (match.pw >= 2) {
    if (match.opp === LADDER.length - 1) { score += 5000; A.setScore(score); return finish(true); }
    match.opp++; match.round = 1; match.pw = 0; match.cw = 0; state = 'next'; phaseT = 2.2; banner = `NEXT: ${LADDER[match.opp].name}`; return;
  }
  if (match.cw >= 2) return finish(false);
  match.round++; startRound();
}
function finish(champ) {
  state = 'over'; const rec = A.submit(score);
  A.overlay({ title: champ ? 'ALLEY CHAMP!' : 'K.O.', big: `SCORE ${score} · BEAT ${champ ? 4 : match.opp} OF 4`, sub: (rec ? 'New high score! ' : `Best: ${A.best()}. `) + pickerHTML(), btn: champ ? 'Play again' : 'Try again', onGo: newGame });
  bindPicker();
}
A.loop(dt => {
  sparks.forEach(s => { s.x += s.vx * dt; s.y += s.vy * dt; s.t -= dt; }); sparks = sparks.filter(s => s.t > 0);
  shake = Math.max(0, shake - dt);
  if (!P || state === 'paused' || state === 'over' || state === 'title') return;
  if (state === 'intro') { phaseT -= dt; if (phaseT < 0.6) banner = 'FIGHT!'; if (phaseT <= 0) state = 'fight'; updateF(P, C, {}, dt); updateF(C, P, {}, dt); return; }
  if (state === 'roundEnd' || state === 'next') { phaseT -= dt; updateF(P, C, {}, dt); updateF(C, P, {}, dt); if (phaseT <= 0) { if (state === 'next') startRound(); else afterRound(); } return; }
  roundT -= dt;
  updateF(P, C, playerIntent(), dt); updateF(C, P, aiIntent(C, P, dt), dt); separate();
  for (const j of projs) {
    j.x += j.vx * dt; j.t += dt;
    const o = j.owner === P ? C : P;
    if (!j.dead && Math.abs(j.x - o.x) < 20 && j.h > o.y - 4 && j.h < o.y + hurtTop(o) && o.st !== 'ko' && o.st !== 'down') { j.dead = true; land(j.owner, o, j.dmg, 160, false, { low: false, over: false }, j.x, GROUND - j.h); }
    if (j.x < -20 || j.x > W + 20) j.dead = true;
  }
  for (const a of projs) for (const b of projs) if (a !== b && a.owner !== b.owner && !a.dead && !b.dead && Math.abs(a.x - b.x) < 16) { a.dead = b.dead = true; spark(a.x, GROUND - a.h, '#fff', 16); A.noise(0.15, 0.06); }
  projs = projs.filter(j => !j.dead);
  if (P.hp <= 0 || C.hp <= 0) endRound(P.hp <= 0 && C.hp <= 0 ? null : P.hp <= 0 ? C : P);
  else if (roundT <= 0) { roundT = 0; endRound(P.hp === C.hp ? null : P.hp > C.hp ? P : C); }
}, t => {
  ctx.save(); if (shake > 0) ctx.translate(A.rand(-3, 3), A.rand(-3, 3));
  drawStage(t);
  if (P) {
    drawF(P, t); drawF(C, t);
    projs.forEach(j => { const c = j.owner.def.band === '#111' ? '#3dff8f' : j.owner.def.band; ctx.shadowColor = c; ctx.shadowBlur = 20; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(j.x, GROUND - j.h, 11 + Math.sin(j.t * 30) * 2, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(j.x, GROUND - j.h, 5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; });
  } else drawTitle(t);
  sparks.forEach(s => { ctx.globalAlpha = s.t * 3; ctx.fillStyle = s.c; ctx.fillRect(s.x - 2, s.y - 2, 4, 4); }); ctx.globalAlpha = 1;
  ctx.restore();
  if (P) drawHUD(t);
});
function drawStage(t) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND); g.addColorStop(0, '#1a0f33'); g.addColorStop(1, '#3a1636'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffe9c2'; ctx.shadowColor = '#ffe9c2'; ctx.shadowBlur = 30; ctx.beginPath(); ctx.arc(520, 60, 22, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  towers.forEach(b => { ctx.fillStyle = '#140b26'; ctx.fillRect(b.x, GROUND - 60 - b.h, b.w, b.h + 60);
    ctx.fillStyle = 'rgba(255,200,110,.55)'; b.win.forEach((on, i) => { if (on) ctx.fillRect(b.x + 6 + (i % 4) * 13, GROUND - 50 - b.h + Math.floor(i / 4) * 15, 6, 8); }); });

  ctx.fillStyle = '#4a1f22'; ctx.fillRect(0, 150, W, GROUND - 150);
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1;
  for (let y = 150; y < GROUND; y += 14) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); for (let x = ((y / 14) % 2) * 15; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 14); ctx.stroke(); } }

  ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(0, GROUND, W, 2);
}
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function drawF(f, t) {
  const d = f.def;
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(f.x, GROUND + 4, 26 - Math.min(f.y, 120) / 10, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.translate(Math.round(f.x), Math.round(GROUND - f.y)); ctx.scale(f.face, 1);
