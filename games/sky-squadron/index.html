<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky Squadron</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preload" href="../../shared/fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="../../shared/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="sky-squadron" data-pad="2:KeyX 1:KeyC" style="--game:#4fa8ff">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>SKY SQUADRON</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="dp"><button class="u" data-k="ArrowUp" aria-label="Up">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button><button class="d" data-k="ArrowDown" aria-label="Down">▼</button></div>
    <div class="ab"><button class="sm" data-k="KeyC">LOOP</button><button class="sm" data-k="KeyX">BOMB</button><button data-k="Space">FIRE</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or WASD fly · hold <kbd>Space</kbd> or <kbd>Z</kbd> to fire · <kbd>X</kbd> bomb · <kbd>C</kbd> loop-the-loop (dodges everything) · <kbd>P</kbd> pause · on touch, drag to fly (it fires by itself) · gamepad: A fire, X bomb, B loop</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script src="../../shared/story.js"></script>
<script>
(() => {
/*
 * Sky Squadron: a propeller fighter over the ocean, the screen scrolling up. Formations of fighters, bombers and
 * gunboats come at you; wipe out a whole formation for a P (more guns, up to a five-way spread), bombers drop bombs (B)
 * and gunboats medals (★ 500). X drops a bomb that wipes the sky of bullets and hurts everything; C flies a loop-the-loop
 * that nothing can touch. Each stage ends with a boss: a battleship with turrets, or a giant bomber with four engines.
 * One hit and you lose a plane (and a level of guns). Every sixth stage the boss is the Sky Leviathan, a huge airship.
 * Story mode (shared/story.js): Wings Over the World, six regions to free from the Iron Armada, with hangar upgrades
 * bought with medals (a wingman among them), then HARD and a Boss Rush.
 */
const A = Arcade, cv = document.getElementById('cv');
const W = 360, H = 540, ctx = A.canvas(cv, W, H), OUT = '#0a0612';
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
/** Boxes [x, y, w, h, colour]: an outline pass, then fills lit from above. */
function paint(x, list) {
  x.fillStyle = OUT; for (const q of list) x.fillRect(q[0] - 1, q[1] - 1, q[2] + 2, q[3] + 2);
  for (const [px, py, w, h, c] of list) { x.fillStyle = c; x.fillRect(px, py, w, h); if (w > 2 && h > 2) { x.fillStyle = shade(c, 0.32); x.fillRect(px, py, w, 1); x.fillStyle = shade(c, -0.3); x.fillRect(px, py + h - 1, w, 1); } }
}
const sprite = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };

/* ---------- sprites, drawn once ---------- */
const HERO = sprite(36, 34, x => paint(x, [[3, 13, 30, 7, '#4fa8ff'], [12, 26, 12, 4, '#3d86d8'], [15, 4, 6, 26, '#6ab8ff'], [16, 2, 4, 3, '#ff4f6d'], [16, 10, 4, 5, '#bfe8ff'], [3, 13, 4, 7, '#ff4f6d'], [29, 13, 4, 7, '#ff4f6d']]));
const FIGHTER = sprite(28, 26, x => paint(x, [[2, 6, 24, 6, '#6a7a4a'], [9, 1, 10, 3, '#5a6a3a'], [11, 2, 6, 20, '#7a8a5a'], [12, 20, 4, 3, '#c8203a'], [12, 9, 4, 4, '#2a3a4a'], [2, 6, 3, 6, '#c8203a'], [23, 6, 3, 6, '#c8203a']]));
const BOMBER = sprite(78, 56, x => { paint(x, [[2, 16, 74, 12, '#6a6a7a'], [30, 2, 18, 50, '#7a7a8a'], [24, 46, 30, 6, '#5a5a6a'], [10, 12, 8, 14, '#4a4a58'], [24, 12, 8, 14, '#4a4a58'], [46, 12, 8, 14, '#4a4a58'], [60, 12, 8, 14, '#4a4a58'], [34, 36, 10, 8, '#2a3a4a'], [36, 50, 6, 4, '#c8203a']]); });
const BOAT = sprite(26, 50, x => { paint(x, [[4, 4, 18, 42, '#5a6070'], [8, 14, 10, 14, '#7a8090'], [10, 30, 6, 8, '#3a4050']]); x.fillStyle = OUT; x.beginPath(); x.moveTo(4, 46); x.lineTo(13, 50); x.lineTo(22, 46); x.fill(); });

/* ---------- the sea below: water, wave lines, islands; clouds above ---------- */
const THEMES = [{ name: 'OPEN SEA', sea: ['#1a5aa8', '#2a7ac8'], foam: 'rgba(255,255,255,.18)', isle: '#4fa860', sand: '#e8d090' },
  { name: 'DESERT COAST', sea: ['#1a8a9a', '#3ab8b0'], foam: 'rgba(255,255,255,.2)', isle: '#d8a858', sand: '#f0d8a0', dunes: true },
  { name: 'SUNSET STRAIT', sea: ['#7a3a6a', '#d8784a'], foam: 'rgba(255,230,180,.22)', isle: '#6a8a4a', sand: '#e8b070' },
  { name: 'FROZEN NORTH', sea: ['#2a5a8a', '#5a8ab8'], foam: 'rgba(255,255,255,.3)', isle: '#e8f4ff', sand: '#b8d8f0', ice: true },
  { name: 'VOLCANO ISLES', sea: ['#2a1420', '#5a2228'], foam: 'rgba(255,140,80,.18)', isle: '#3a2a2a', sand: '#ff6a2a', lava: true },
  { name: 'NIGHT RAID', sea: ['#0a1a3a', '#1a3060'], foam: 'rgba(160,200,255,.14)', isle: '#2a5a4a', sand: '#8a8a70' }];
let theme = THEMES[0], bgY = 0, islands = [], clouds = [];
const seaTile = THEMES.map(t => sprite(W, 180, x => {
  const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, t.sea[0]); g.addColorStop(0.5, t.sea[1]); g.addColorStop(1, t.sea[0]); /* sideways only, so the tiles meet without a seam */ x.fillStyle = g; x.fillRect(0, 0, W, 180);
  x.strokeStyle = t.foam; x.lineWidth = 2; let s = 3; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) { const wx = r() * W, wy = r() * 180, wl = 12 + r() * 20; x.beginPath(); x.moveTo(wx, wy); x.quadraticCurveTo(wx + wl / 2, wy - 4, wx + wl, wy); x.stroke(); }
}));
function island() {
  const pts = [], n = 9, rx = A.rand(30, 70), ry = A.rand(24, 54);
  for (let i = 0; i < n; i++) { const a = i / n * 6.283, k = A.rand(0.75, 1.15); pts.push([Math.cos(a) * rx * k, Math.sin(a) * ry * k]); }
  return { x: A.rand(20, W - 20), y: -120, pts, palms: Array.from({ length: 3 + (Math.random() * 4 | 0) }, () => [A.rand(-rx * 0.5, rx * 0.5), A.rand(-ry * 0.5, ry * 0.5)]) };
}
function drawIsland(x, s) {
  const path = (k) => { x.beginPath(); s.pts.forEach(([px, py], i) => { const X = s.x + px * k, Y = s.y + py * k; i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.closePath(); };
  x.fillStyle = 'rgba(255,255,255,.25)'; path(1.22); x.fill();
  x.fillStyle = OUT; path(1.1); x.fill(); x.fillStyle = theme.sand; path(1.06); x.fill();
  x.fillStyle = theme.isle; path(0.86); x.fill(); x.fillStyle = shade(theme.isle, 0.25); path(0.5); x.fill();
  if (theme.lava) { const g = x.createRadialGradient(s.x, s.y, 2, s.x, s.y, 18); g.addColorStop(0, '#fff0a0'); g.addColorStop(0.4, '#ff8a2a'); g.addColorStop(1, 'rgba(255,60,20,0)'); x.fillStyle = g; x.beginPath(); x.arc(s.x, s.y, 18, 0, 6.29); x.fill(); return; } // a crater, glowing
  if (theme.ice) return; // ice floes: no trees
  for (const [px, py] of s.palms) { x.fillStyle = OUT; x.beginPath(); x.arc(s.x + px, s.y + py, 6, 0, 6.29); x.fill(); x.fillStyle = shade(theme.isle, -0.25); x.beginPath(); x.arc(s.x + px, s.y + py, 4.5, 0, 6.29); x.fill(); }
}

/* ---------- state ---------- */
let state = 'title', stage = 1, score = 0, lives = 3, stageT = 0, waveT = 0, boss = null, clearT = 0, nextLife = 50000, msg = '', msgT = 0, formations = 0;
let shots = [], foes = [], bad = [], items = [], bombFx = [];
const me = { x: W / 2, y: H - 80, inv: 0, power: 1, bombs: 3, loop: 0, loopCD: 0, fireT: 0, dead: 0, tilt: 0, armor: 0 };
let S = null, hard = false, rush = false, rushI = 0, rushT = 0; const RUSH = [1, 2, 3, 4, 6]; // story runs; the boss rush (by stage)
const up = id => S ? S.lv(id) : 0;
const wing = { x: W / 2 - 30, y: H - 60, fireT: 0 };
const say = (t, s = 2) => { msg = t; msgT = s; };
const lv = () => stage - 1 + (hard ? 2 : 0);
function newStage() {
  theme = THEMES[(stage - 1) % THEMES.length]; stageT = 0; waveT = 1.2; boss = null; bad = []; islands = [island()]; islands[0].y = 160;
  if (rush) say(`BOSS ${rushI + 1} OF ${RUSH.length}`, 2);
  else if (S.run) { S.reach(stage - 1); say(`${S.stageName(stage - 1).toUpperCase()}`, 2.6); }
  else say(`STAGE ${stage} · ${theme.name}`, 2.4);
  A.jingle([392, 523, 659, 784], 0.09);
}
function reset() {
  score = 0; A.setScore(0); lives = A.easy ? 5 : 3; nextLife = 50000; formations = 0;
  Object.assign(me, { x: W / 2, y: H - 80, inv: 2, power: 1 + up('guns'), bombs: 3 + up('bombs'), loop: 0, loopCD: 0, fireT: 0, dead: 0, armor: up('armor') });
  Object.assign(wing, { x: W / 2 - 30, y: H - 60 });
  shots = []; foes = []; bad = []; items = []; bombFx = []; clouds = [];
}
function newGame() { S.run = null; hard = false; rush = false; stage = 1; reset(); newStage(); state = 'play'; }
/** A story run: a region of Wings Over the World (then on to the next), or the Boss Rush. */
function storyGame(run) { hard = run.hard; rush = run.mode === 'rush'; rushI = 0; rushT = 0; stage = rush ? RUSH[0] : run.stage + 1; reset(); newStage(); state = 'play'; }
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play', alt: S.quit() }); }
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();
  if (state !== 'play' || me.dead) return;
  if (c === 'KeyX' || c === 'KeyB') bomb();
  if (c === 'KeyC' || c === 'ShiftLeft' || c === 'ShiftRight') loopTheLoop();
});
A.onHide(pause);
const add = (n, x, y, c = '#ffd23d') => {
  score += n; A.setScore(score); if (x !== undefined) A.pop(x, y, '+' + n, c);
  if (score >= nextLife) { nextLife += 50000; lives++; say('EXTRA PLANE!', 1.6); A.jingle([784, 988, 1319, 1568], 0.08); }
};

/* ---------- waves: formations of fighters, bombers and gunboats; then the boss ---------- */
function formation(kind) {
  const id = ++formations, n = { vee: 5, sine: 6, swoop: 4 }[kind], side = Math.random() < 0.5 ? -1 : 1, cx = A.rand(80, W - 80);
  for (let i = 0; i < n; i++) {
    const f = { kind: 'fighter', id, hp: 1 + Math.floor(lv() / 2), r: 11, t: -i * (kind === 'vee' ? 0 : 0.28), fireT: A.rand(0.8, 2.6), path: kind, i, side, cx, x: -50, y: -50 };
    if (kind === 'vee') { f.ox = (i - 2) * 30; f.oy = -Math.abs(i - 2) * 26; }
    foes.push(f);
  }
  foes.filter(f => f.id === id).forEach(f => { f.left = n; f.group = foes.filter(g => g.id === id); });
}
function spawnWave() {
  const r = Math.random(), late = stageT > 18;
  if (r < 0.26) formation('vee'); else if (r < 0.5) formation('sine'); else if (r < 0.68) formation('swoop');
  else if (r < 0.84 && late) foes.push({ kind: 'bomber', hp: 14 + lv() * 4, r: 30, x: A.rand(70, W - 70), y: -60, t: 0, fireT: 1.5 });
  else { for (let i = 0; i < 2; i++) foes.push({ kind: 'boat', hp: 5 + lv() * 2, r: 14, x: A.rand(40, W - 40), y: -60 - i * 70, t: 0, fireT: A.rand(1, 2) }); }
}
function spawnBoss() {
  const ship = stage % 2 === 1, k = 1 + lv() * 0.35;
  if (stage % 6 === 0) { // the Sky Leviathan: a giant airship, four turrets, two engines and the bridge underneath
    boss = { kind: 'leviathan', x: W / 2, y: -200, vx: 26, t: 0, parts: [[-58, -80, 'turret'], [58, -80, 'turret'], [-58, 40, 'turret'], [58, 40, 'turret'], [-34, -150, 'engine'], [34, -150, 'engine'], [0, 70, 'core']].map(([ox, oy, k2]) => ({ ox, oy, kind: k2, hp: Math.round((k2 === 'core' ? 90 : k2 === 'engine' ? 16 : 12) * k), max: Math.round((k2 === 'core' ? 90 : k2 === 'engine' ? 16 : 12) * k), r: k2 === 'core' ? 24 : 15, fireT: A.rand(0.6, 1.6), ang: Math.PI / 2, hit: 0 })) };
    say('THE SKY LEVIATHAN!', 2.6); A.tone(50, 1.6, 'sawtooth', 0.07, 0, 30); A.shake(8, 1.2); return;
  }
  boss = ship
    ? { kind: 'ship', x: W / 2, y: -170, vx: 34, t: 0, parts: [[-44, -60, 'turret'], [44, -60, 'turret'], [-44, 40, 'turret'], [44, 40, 'turret'], [0, -10, 'core']].map(([ox, oy, k2]) => ({ ox, oy, kind: k2, hp: Math.round((k2 === 'core' ? 46 : 10) * k), max: Math.round((k2 === 'core' ? 46 : 10) * k), r: k2 === 'core' ? 22 : 15, fireT: A.rand(0.6, 1.6), ang: Math.PI / 2, hit: 0 })) }
    : { kind: 'fortress', x: W / 2, y: -110, vx: 46, t: 0, parts: [[-86, -4, 'engine'], [-48, -6, 'engine'], [48, -6, 'engine'], [86, -4, 'engine'], [0, 6, 'core']].map(([ox, oy, k2]) => ({ ox, oy, kind: k2, hp: Math.round((k2 === 'core' ? 50 : 9) * k), max: Math.round((k2 === 'core' ? 50 : 9) * k), r: k2 === 'core' ? 24 : 14, fireT: A.rand(0.8, 2), ang: Math.PI / 2, hit: 0 })) };
  say(ship ? 'BATTLESHIP AHEAD!' : 'SKY FORTRESS!', 2.4); A.tone(70, 1.2, 'sawtooth', 0.06, 0, 40); A.shake(5, 0.8);
}
function aimShot(x, y, sp, spread = 0) { const a = Math.atan2(me.y - y, me.x - x) + spread; bad.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 4 }); }

/* ---------- you: guns, bombs, the loop ---------- */
function fire() {
  const p = me.power, y = me.y - 16, sp = -620;
  const mk = (dx, ang) => shots.push({ x: me.x + dx, y, vx: Math.sin(ang) * 620, vy: sp * Math.cos(ang) });
  if (p === 1) mk(0, 0);
  if (p === 2) { mk(-6, 0); mk(6, 0); }
  if (p === 3) { mk(0, 0); mk(-8, -0.12); mk(8, 0.12); }
  if (p === 4) { mk(-5, 0); mk(5, 0); mk(-10, -0.16); mk(10, 0.16); }
  if (p >= 5) { mk(0, 0); mk(-6, -0.08); mk(6, 0.08); mk(-12, -0.22); mk(12, 0.22); }
  A.tone(1100 + p * 40, 0.04, 'square', 0.018, 0, 700);
}
function bomb() {
  if (me.bombs <= 0 || me.loop > 0) return;
  me.bombs--; me.inv = Math.max(me.inv, 1.6); bombFx.push({ x: me.x, y: me.y - 60, t: 0 });
  bad = []; A.flash('#fff6c2', 0.4); A.shake(10, 0.6); A.sfx('boom'); A.hitstop(0.08);
  for (const f of foes) hurt(f, 12);
  if (boss) for (const p of boss.parts) if (p.hp > 0) hurtPart(p, 8);
}
function loopTheLoop() { if (me.loopCD > 0 || me.loop > 0) return; me.loop = 0.9; me.loopCD = 2.6 - up('loop') * 0.6; A.tone(500, 0.5, 'triangle', 0.04, 0, 1300); }
function die() {
  if (me.inv > 0 || me.loop > 0 || me.dead) return;
  if (me.armor > 0) { me.armor--; me.inv = 1.4; A.flash('#5ee7ff', 0.2); A.tone(200, 0.2, 'square', 0.05, 0, 600); say('ARMOR HIT!', 1); return; }
  me.dead = 1.6; lives--; A.shake(9, 0.5); A.sfx('boom'); A.flash('#ff4f6d', 0.2); A.hitstop(0.1);
  A.burst(me.x, me.y, { n: 30, colors: ['#ffd23d', '#ff8a3d', '#fff'], speed: 220, life: 0.8 }); A.burst(me.x, me.y, { n: 10, kind: 'smoke', color: '#5a5048', speed: 60, life: 1.2, size: 10 });
  bad = bad.filter(b => Math.hypot(b.x - me.x, b.y - me.y) > 120);
}
function hurt(f, n) {
  if (f.dead) return; f.hp -= n; f.hit = 0.06;
  if (f.hp > 0) return;
  f.dead = true;
  const pts = { fighter: 100, bomber: 1000, boat: 300 }[f.kind];
  add(pts, f.x, f.y - 10);
  A.burst(f.x, f.y, { n: f.kind === 'fighter' ? 12 : 26, colors: ['#ffd23d', '#ff8a3d', '#fff'], speed: 160, life: 0.5 }); A.burst(f.x, f.y, { n: 4, kind: 'smoke', color: '#4a4048', speed: 40, life: 0.9, size: 8 });
  A.shake(f.kind === 'fighter' ? 2 : 6, 0.25); A.sfx('boom');
  if (f.kind === 'fighter' && f.group && f.group.every(g => g.dead)) { items.push({ kind: 'P', x: f.x, y: f.y, vy: 50 }); A.pop(f.x, f.y - 26, 'FORMATION!', '#5ee7ff'); add(500); S.bank(1); }
  if (f.kind === 'bomber') S.bank(2);
  if (f.kind === 'bomber') items.push({ kind: Math.random() < 0.5 ? 'B' : 'P', x: f.x, y: f.y, vy: 50 });
  if (f.kind === 'boat') items.push({ kind: 'M', x: f.x, y: f.y, vy: 30 });
}
function hurtPart(p, n) {
  p.hp -= n; p.hit = 0.06; if (p.hp > 0) return;
  const px = boss.x + p.ox, py = boss.y + p.oy;
  A.burst(px, py, { n: 26, colors: ['#ffd23d', '#ff8a3d', '#fff'], speed: 180, life: 0.6 }); A.shake(7, 0.4); A.sfx('boom'); add(p.kind === 'core' ? 0 : 800, px, py);
  if (p.kind === 'core') bossDown();
}
function bossDown() {
  const b = boss; add(10000 * stage, b.x, b.y); A.badge('boss'); S.bank(b.kind === 'leviathan' ? 40 : 15); A.flash('#fff', 0.5); A.hitstop(0.2); A.shake(14, 1.2);
  for (let i = 0; i < 10; i++) setTimeout(() => { A.burst(b.x + A.rand(-90, 90), b.y + A.rand(-80, 80), { n: 24, colors: ['#ffd23d', '#ff8a3d', '#fff'], speed: 200, life: 0.7 }); A.sfx('boom'); }, i * 120);
  b.dying = 1.6; bad = []; A.jingle([523, 659, 784, 1047, 1319, 1568], 0.1, 'square');
}

/* ---------- update ---------- */
function update(dt) {
  if (msgT > 0) msgT -= dt;
  const scroll = 46 + lv() * 4;
  bgY = (bgY + scroll * dt) % 180;
  for (const s of islands) s.y += scroll * dt; islands = islands.filter(s => s.y < H + 140);
  if (Math.random() < dt * 0.25) islands.push(island());
  for (const c of clouds) c.y += c.v * dt; clouds = clouds.filter(c => c.y < H + 80);
  if (Math.random() < dt * 0.5) clouds.push({ x: A.rand(-40, W + 40), y: -70, v: A.rand(90, 160), s: A.rand(0.7, 1.4), hi: Math.random() < 0.3 });
  for (const b of bombFx) b.t += dt; bombFx = bombFx.filter(b => b.t < 0.8);
  if (state !== 'play') return;
  // you
  if (me.dead) { me.dead -= dt; if (me.dead <= 0) { if (lives <= 0) return gameOver(); Object.assign(me, { dead: 0, x: W / 2, y: H - 80, inv: 2.4, power: Math.max(1, me.power - 1), bombs: Math.max(me.bombs, 2), loop: 0 }); } }
  else {
    let dx = (A.held('ArrowRight', 'KeyD') ? 1 : 0) - (A.held('ArrowLeft', 'KeyA') ? 1 : 0), dy = (A.held('ArrowDown', 'KeyS') ? 1 : 0) - (A.held('ArrowUp', 'KeyW') ? 1 : 0);
    const l = Math.hypot(dx, dy) || 1; me.x += dx / l * 210 * dt; me.y += dy / l * 210 * dt;
    if (drag) { me.x += (drag.tx - me.x) * Math.min(1, dt * 14); me.y += (drag.ty - me.y) * Math.min(1, dt * 14); }
    me.x = A.clamp(me.x, 16, W - 16); me.y = A.clamp(me.y, 40, H - 24);
    me.tilt += ((dx || (drag ? Math.sign(drag.tx - me.x) * 0.6 : 0)) - me.tilt) * Math.min(1, dt * 8);
    if (me.inv > 0) me.inv -= dt; if (me.loop > 0) { me.loop -= dt; me.y -= 30 * dt; } if (me.loopCD > 0) me.loopCD -= dt;
