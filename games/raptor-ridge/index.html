<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raptor Ridge</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">

</head>
<body data-game="raptor-ridge" data-pad="1:KeyR" style="--game:#7dd63d">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>RAPTOR RIDGE</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="ab"><button class="sm" data-k="KeyR">RELOAD</button></div>
  </div>
  <p class="help">Aim with the mouse and click to fire · or <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> aim, <kbd>Space</kbd> fire · <kbd>R</kbd> reload · <kbd>P</kbd> pause · tap to shoot on touch screens</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const W = 640, H = 400, ctx = A.canvas(cv, W, H), OUT = '#0a0612';
// A simple 3D: things sit at (x, z) on the ground ahead of the jeep and are projected with F / z.
const HZ = 168, F = 320, CAMH = 1.6, CLIP = 8;
/** Lighten (k > 0) or darken (k < 0) a #rgb / #rrggbb colour. */
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
const sprite = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };
/** Draw a shape twice: a dark outline (thicker), then filled with a vertical gradient lit from above. */
function blob(x, path, top, bot, col, pad = 4) {
  x.save(); path(); x.lineWidth = pad * 2; x.lineJoin = 'round'; x.strokeStyle = OUT; x.stroke(); x.restore();
  const g = x.createLinearGradient(0, top, 0, bot); g.addColorStop(0, shade(col, 0.35)); g.addColorStop(0.55, col); g.addColorStop(1, shade(col, -0.4));
  path(); x.fillStyle = g; x.fill();
}

/* ---------- dinosaurs: side views facing left, two running frames each (drawn once) ---------- */
function raptorFrame(f, col, stripe, small) {
  return sprite(200, 140, (x) => {
    const legA = f ? [[86, 92], [70, 128]] : [[92, 92], [104, 128]], legB = f ? [[110, 92], [124, 128]] : [[104, 92], [86, 128]];
    for (const [[hx, hy], [fx, fy]] of [legB, legA]) { x.strokeStyle = OUT; x.lineWidth = 14; x.lineCap = 'round'; x.beginPath(); x.moveTo(hx, hy); x.lineTo((hx + fx) / 2 + 6, hy + 18); x.lineTo(fx, fy); x.stroke(); x.strokeStyle = shade(col, -0.2); x.lineWidth = 8; x.stroke(); x.fillStyle = OUT; x.fillRect(fx - 10, fy - 3, 16, 6); }
    blob(x, () => { x.beginPath(); x.moveTo(196, 58); x.quadraticCurveTo(150, 54, 120, 70); x.lineTo(124, 90); x.quadraticCurveTo(160, 80, 196, 66); x.closePath(); }, 54, 90, col);  // tail
    blob(x, () => { x.beginPath(); x.ellipse(100, 82, 34, 20, -0.15, 0, 6.29); }, 62, 102, col); // body
    blob(x, () => { x.beginPath(); x.moveTo(78, 74); x.quadraticCurveTo(64, 50, 52, 40); x.lineTo(66, 34); x.quadraticCurveTo(82, 52, 96, 70); x.closePath(); }, 34, 74, col); // neck
    blob(x, () => { x.beginPath(); x.moveTo(70, 30); x.quadraticCurveTo(52, 22, 20, 34); x.lineTo(18, 42); x.quadraticCurveTo(40, 44, 58, 50); x.quadraticCurveTo(72, 48, 76, 38); x.closePath(); }, 22, 50, col); // head
    x.fillStyle = shade(col, -0.45); for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(90 + i * 12, 66); x.lineTo(96 + i * 12, 66); x.lineTo(92 + i * 12, 84); x.fill(); } // stripes
    x.fillStyle = stripe; x.fillRect(30, 41, 22, 3);
    x.fillStyle = '#fff'; x.fillRect(22, 40, 6, 2); x.fillRect(30, 40, 4, 2); // teeth
    x.fillStyle = '#ffd23d'; x.beginPath(); x.arc(56, 34, 4, 0, 6.29); x.fill(); x.fillStyle = OUT; x.fillRect(55, 31, 2, 6);
    x.strokeStyle = OUT; x.lineWidth = 6; x.beginPath(); x.moveTo(74, 84); x.lineTo(62, 96); x.lineTo(56, 92); x.stroke(); x.strokeStyle = shade(col, -0.2); x.lineWidth = 3; x.stroke(); // arm and claw
    if (small) { x.fillStyle = 'rgba(255,255,255,.25)'; x.beginPath(); x.ellipse(98, 72, 18, 5, -0.2, 0, 6.29); x.fill(); }
  });
}
function diloFrame(open) {
  const col = '#4fb8a0';
  return sprite(200, 150, (x) => {
    for (const [hx, fx] of [[110, 124], [92, 84]]) { x.strokeStyle = OUT; x.lineWidth = 16; x.lineCap = 'round'; x.beginPath(); x.moveTo(hx, 98); x.lineTo(hx + 6, 118); x.lineTo(fx, 138); x.stroke(); x.strokeStyle = shade(col, -0.25); x.lineWidth = 9; x.stroke(); }
    blob(x, () => { x.beginPath(); x.moveTo(196, 70); x.quadraticCurveTo(150, 62, 122, 80); x.lineTo(126, 100); x.quadraticCurveTo(162, 88, 196, 78); x.closePath(); }, 62, 100, col);
    blob(x, () => { x.beginPath(); x.ellipse(102, 92, 38, 24, -0.1, 0, 6.29); }, 68, 116, col);
    blob(x, () => { x.beginPath(); x.moveTo(80, 82); x.quadraticCurveTo(66, 60, 58, 46); x.lineTo(72, 40); x.quadraticCurveTo(86, 60, 98, 78); x.closePath(); }, 40, 82, col);
    if (open) { // the frill fans out
      x.fillStyle = OUT; x.beginPath(); x.arc(64, 44, 34, 0, 6.29); x.fill();
      const g = x.createRadialGradient(64, 44, 6, 64, 44, 32); g.addColorStop(0, '#ffd23d'); g.addColorStop(0.6, '#ff4f6d'); g.addColorStop(1, '#8a1a4a'); x.fillStyle = g; x.beginPath(); x.arc(64, 44, 30, 0, 6.29); x.fill();
      x.strokeStyle = 'rgba(10,6,18,.4)'; x.lineWidth = 2; for (let a = 0; a < 6.28; a += 0.5) { x.beginPath(); x.moveTo(64, 44); x.lineTo(64 + Math.cos(a) * 30, 44 + Math.sin(a) * 30); x.stroke(); }
    }
    blob(x, () => { x.beginPath(); x.moveTo(74, 36); x.quadraticCurveTo(52, 26, 28, 38); x.lineTo(28, 48); x.quadraticCurveTo(48, 50, 64, 54); x.quadraticCurveTo(78, 52, 80, 42); x.closePath(); }, 26, 54, col);
    x.fillStyle = '#ff4f6d'; x.beginPath(); x.moveTo(44, 30); x.lineTo(54, 18); x.lineTo(60, 30); x.moveTo(56, 30); x.lineTo(66, 16); x.lineTo(72, 32); x.fill(); // crests
    x.fillStyle = OUT; x.fillRect(28, 44, 26, open ? 6 : 2);
    x.fillStyle = '#ffd23d'; x.beginPath(); x.arc(58, 38, 4, 0, 6.29); x.fill(); x.fillStyle = OUT; x.fillRect(57, 35, 2, 6);
    x.fillStyle = shade(col, -0.45); for (let i = 0; i < 5; i++) x.fillRect(84 + i * 10, 74, 5, 14);
  });
}
function pteroFrame(up) {
  const col = '#c8805a';
  return sprite(220, 120, (x) => {
    const wing = s => { x.beginPath(); x.moveTo(110, 60); x.quadraticCurveTo(110 + s * 50, up ? -10 : 70, 110 + s * 104, up ? 10 : 100); x.quadraticCurveTo(110 + s * 60, up ? 40 : 74, 110, 74); x.closePath(); };
    blob(x, () => wing(-1), 0, 100, '#a05a3a'); blob(x, () => wing(1), 0, 100, '#a05a3a');
    blob(x, () => { x.beginPath(); x.ellipse(110, 66, 16, 12, 0, 0, 6.29); }, 54, 78, col);
    blob(x, () => { x.beginPath(); x.moveTo(98, 60); x.lineTo(56, 70); x.lineTo(98, 72); x.closePath(); }, 60, 72, '#ffd23d', 3); // beak
    blob(x, () => { x.beginPath(); x.moveTo(110, 56); x.lineTo(140, 36); x.lineTo(118, 60); x.closePath(); }, 36, 60, col, 3);   // crest
    x.fillStyle = '#ffd23d'; x.fillRect(100, 60, 4, 4); x.fillStyle = OUT; x.fillRect(101, 61, 2, 2);
  });
}
function rexFrame(open) {
  const col = '#7a6a4a';
  return sprite(300, 300, (x) => {
    for (const lx of [100, 200]) blob(x, () => { x.beginPath(); x.roundRect(lx - 26, 190, 52, 96, 18); }, 190, 290, col);
    x.fillStyle = OUT; for (const lx of [100, 200]) x.fillRect(lx - 32, 280, 64, 16); x.fillStyle = '#e8dcc0'; for (const lx of [100, 200]) for (let k = 0; k < 3; k++) x.fillRect(lx - 26 + k * 20, 286, 10, 8);
    blob(x, () => { x.beginPath(); x.ellipse(150, 190, 92, 74, 0, 0, 6.29); }, 116, 264, col);
    x.fillStyle = '#c8b890'; x.beginPath(); x.ellipse(150, 210, 54, 50, 0, 0, 6.29); x.fill(); // belly
    x.strokeStyle = 'rgba(80,60,30,.35)'; x.lineWidth = 3; for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(108, 184 + i * 18); x.quadraticCurveTo(150, 196 + i * 18, 192, 184 + i * 18); x.stroke(); }
    for (const s of [-1, 1]) { x.strokeStyle = OUT; x.lineWidth = 12; x.lineCap = 'round'; x.beginPath(); x.moveTo(150 + s * 48, 168); x.lineTo(150 + s * 62, 196); x.stroke(); x.strokeStyle = col; x.lineWidth = 6; x.stroke(); }
    const jaw = open ? 46 : 14;
    blob(x, () => { x.beginPath(); x.roundRect(86, 46 + jaw, 128, 46, 18); }, 46 + jaw, 92 + jaw, shade(col, -0.1)); // lower jaw
    if (open) { x.fillStyle = '#5a1a2a'; x.fillRect(96, 74, 108, jaw + 20); x.fillStyle = '#ff6a7a'; x.beginPath(); x.ellipse(150, 76 + jaw, 30, 10, 0, 0, 6.29); x.fill(); }
    blob(x, () => { x.beginPath(); x.roundRect(76, 12, 148, 70, 26); }, 12, 82, col); // head
    x.fillStyle = '#f4f0e8'; for (let i = 0; i < 9; i++) { x.beginPath(); x.moveTo(92 + i * 13, 78); x.lineTo(98 + i * 13, 92); x.lineTo(104 + i * 13, 78); x.fill(); }
    if (open) for (let i = 0; i < 8; i++) { x.beginPath(); x.moveTo(98 + i * 13, 46 + jaw + 8); x.lineTo(104 + i * 13, 46 + jaw - 6); x.lineTo(110 + i * 13, 46 + jaw + 8); x.fill(); }
    for (const s of [-1, 1]) { x.fillStyle = OUT; x.beginPath(); x.ellipse(150 + s * 46, 36, 14, 11, 0, 0, 6.29); x.fill(); x.fillStyle = '#ffd23d'; x.beginPath(); x.ellipse(150 + s * 46, 36, 10, 8, 0, 0, 6.29); x.fill(); x.fillStyle = OUT; x.fillRect(148 + s * 46, 28, 4, 16); }
    x.fillStyle = shade(col, -0.35); x.fillRect(120, 20, 60, 6); x.fillStyle = 'rgba(255,255,255,.25)'; x.fillRect(96, 18, 30, 5);
    x.fillStyle = OUT; x.beginPath(); x.arc(134, 58, 3, 0, 6.29); x.arc(166, 58, 3, 0, 6.29); x.fill(); // nostrils
  });
}
const SPR = {
  compy: [raptorFrame(0, '#7dd63d', '#2a6a1a', true), raptorFrame(1, '#7dd63d', '#2a6a1a', true)],
  raptor: [raptorFrame(0, '#c8904a', '#ff4f6d'), raptorFrame(1, '#c8904a', '#ff4f6d')],
  dilo: [diloFrame(false), diloFrame(true)],
  ptero: [pteroFrame(true), pteroFrame(false)],
  rex: [rexFrame(false), rexFrame(true)]
};
// what each kind is like: h = height in world units, hp, speed toward you, points
const KIND = {
  compy: { h: 1.05, hp: 1, v: 6.5, pts: 100 }, raptor: { h: 2.6, hp: 2, v: 8, pts: 300 }, dilo: { h: 2.6, hp: 3, v: 4.5, pts: 500 },
  ptero: { h: 1.7, hp: 1, v: 6, pts: 400 }, rex: { h: 6.4, hp: 24, v: 1.2, pts: 5000 }
};

/* ---------- scenery ---------- */
const TREE = {
  palm: sprite(160, 260, (x) => {
    x.lineCap = 'round'; for (const [c, w] of [[OUT, 22], ['#6a4a2a', 14]]) { x.strokeStyle = c; x.lineWidth = w; x.beginPath(); x.moveTo(80, 258); x.quadraticCurveTo(66, 150, 84, 60); x.stroke(); }
    for (const [c, k] of [[OUT, 1.08], ['#2f9a48', 1], ['#5ad870', 0.6]]) for (let i = 0; i < 7; i++) { const a = -Math.PI + i * Math.PI / 6; x.save(); x.translate(84, 60); x.rotate(a); x.fillStyle = c; x.beginPath(); x.ellipse(36 * k, 0, 40 * k, 10 * k, 0, 0, 6.29); x.fill(); x.restore(); }
  }),
  fern: sprite(140, 80, (x) => { for (const [c, k] of [[OUT, 1.1], ['#2a7a3a', 1], ['#4fb85a', 0.7]]) for (let i = 0; i < 7; i++) { const a = -Math.PI + 0.2 + i * 0.45; x.save(); x.translate(70, 78); x.rotate(a); x.fillStyle = c; x.beginPath(); x.ellipse(32 * k, 0, 34 * k, 7 * k, 0, 0, 6.29); x.fill(); x.restore(); } }),
  dead: sprite(160, 260, (x) => {
    x.lineCap = 'round'; for (const [c, w] of [[OUT, 18], ['#5a5048', 11]]) { x.strokeStyle = c; x.lineWidth = w; x.beginPath(); x.moveTo(80, 258); x.lineTo(78, 90); x.moveTo(79, 150); x.lineTo(40, 100); x.lineTo(30, 60); x.moveTo(78, 120); x.lineTo(120, 80); x.lineTo(126, 40); x.moveTo(78, 90); x.lineTo(70, 30); x.stroke(); }
    x.fillStyle = 'rgba(120,160,120,.6)'; for (const [px, py] of [[34, 70], [124, 50], [72, 36]]) { x.fillRect(px - 2, py, 4, 26); }
  }),
  charred: sprite(160, 260, (x) => {
    x.lineCap = 'round'; for (const [c, w] of [[OUT, 18], ['#2a1a1a', 11]]) { x.strokeStyle = c; x.lineWidth = w; x.beginPath(); x.moveTo(80, 258); x.lineTo(84, 70); x.moveTo(82, 140); x.lineTo(46, 96); x.moveTo(83, 110); x.lineTo(118, 76); x.stroke(); }
    x.fillStyle = '#ff6a1f'; for (const [px, py] of [[84, 200], [60, 118], [104, 96]]) { x.fillRect(px, py, 4, 3); }
  }),
  rock: sprite(160, 100, (x) => { blob(x, () => { x.beginPath(); x.moveTo(6, 98); x.lineTo(24, 36); x.lineTo(80, 10); x.lineTo(134, 30); x.lineTo(156, 98); x.closePath(); }, 10, 98, '#8a7a6a'); })
};
const AREAS = [
  { name: 'JUNGLE', sky: ['#4a9ae8', '#c8f0d0'], ground: ['#3a7a2a', '#1f4a1a'], far: '#4a8a6a', canopy: '#2a5a2a', trees: ['palm', 'palm', 'fern', 'fern', 'rock'], mist: 0 },
  { name: 'SWAMP', sky: ['#5a7a7a', '#c8d8c0'], ground: ['#4a5a3a', '#26301e'], far: '#6a7a6a', canopy: '#3a4a3a', trees: ['dead', 'dead', 'fern', 'rock'], mist: 0.35 },
  { name: 'VOLCANO', sky: ['#2a0a1a', '#ff6a3a'], ground: ['#4a2a22', '#1a0a0a'], far: '#3a1a1a', canopy: '#2a1414', trees: ['charred', 'charred', 'rock', 'rock'], mist: 0, ash: true }
];
AREAS.forEach(a => {
  a.bg = sprite(W, H, (x) => {
    const g = x.createLinearGradient(0, 0, 0, HZ); g.addColorStop(0, a.sky[0]); g.addColorStop(1, a.sky[1]); x.fillStyle = g; x.fillRect(0, 0, W, H);
    if (a.ash) { x.fillStyle = '#3a1a1a'; x.beginPath(); x.moveTo(330, HZ); x.lineTo(410, 40); x.lineTo(450, 40); x.lineTo(540, HZ); x.fill(); x.fillStyle = '#ff6a1f'; x.beginPath(); x.moveTo(410, 40); x.lineTo(450, 40); x.lineTo(470, 80); x.lineTo(392, 80); x.fill(); }
    else { x.fillStyle = 'rgba(255,250,220,.9)'; x.beginPath(); x.arc(520, 50, 22, 0, 6.29); x.fill(); }
    let s = 9; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    x.fillStyle = a.far; x.beginPath(); x.moveTo(0, HZ); for (let i = 0; i <= W; i += 12) x.lineTo(i, HZ - 30 - Math.abs(Math.sin(i * 0.011 + 2)) * 46 - r() * 6); x.lineTo(W, HZ); x.fill();
    x.fillStyle = a.canopy; x.beginPath(); x.moveTo(0, HZ + 2); for (let i = 0; i <= W; i += 18) { x.lineTo(i, HZ - 8 - r() * 16); x.lineTo(i + 9, HZ - 2); } x.lineTo(W, HZ + 2); x.fill();
  });
});

/* ---------- state ---------- */
let state = 'title', area = 0, loop = 0, areaT = 0, spawnT = 0, boss = null, dinos = [], spits = [], props = [], crates = [], score = 0, hp = 5, ammo = 8, reloadT = 0, fireT = 0;
let shots = 0, hits = 0, travel = 0, camX = 0, hurtT = 0, msg = '', msgT = 0, darts = [], cross = { x: W / 2, y: H / 2 - 20 }, slept = 0, clearT = 0;
const CLIP_N = 8;
function say(t) { msg = t; msgT = 2; }
function spawnProp(z) { const a = AREAS[area % 3], side = Math.random() < 0.5 ? -1 : 1, t = A.pick(a.trees); props.push({ t, x: camX + side * A.rand(t === 'fern' ? 2 : 4, 15), z: z || A.rand(30, 46) }); }
function newGame() {
  area = 0; loop = 0; score = 0; hp = A.easy ? 8 : 5; ammo = CLIP_N; slept = 0; A.setScore(0); state = 'play'; startArea();
}
function startArea() {
  areaT = 0; spawnT = 2; boss = null; dinos = []; spits = []; crates = []; shots = 0; hits = 0; clearT = 0;
  props = []; for (let i = 0; i < 26; i++) spawnProp(A.rand(3, 46));
  say(`AREA ${area + 1} · ${AREAS[area % 3].name}${loop ? ' · ROUND ' + (loop + 1) : ''}`);
}
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play' }); }
function reload() { if (reloadT > 0 || ammo === CLIP_N) return; reloadT = 0.9; A.tone(300, 0.06, 'square', 0.03); A.tone(500, 0.06, 'square', 0.03, 0.4); A.tone(700, 0.08, 'square', 0.03, 0.8); }
A.onPress(c => { if (c === 'KeyP' || c === 'Escape') return pause(); if (state === 'play' && c === 'KeyR') reload(); });
A.onHide(pause);
let mouseFire = false;
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') Object.assign(cross, A.pointer(cv, e)); });
cv.addEventListener('pointerdown', e => { A.unlock(); Object.assign(cross, A.pointer(cv, e)); if (state === 'play') { fire(); mouseFire = e.pointerType === 'mouse'; } });
addEventListener('pointerup', () => { mouseFire = false; });

/* ---------- projection and hit tests ---------- */
const proj = (x, z, alt = 0) => { const s = F / z; return { x: W / 2 + (x - camX) * s, y: HZ + (CAMH - alt) * s, s }; };
function dinoBox(d) {
  const K = KIND[d.kind], p = proj(d.x, d.z, d.alt || 0), img = SPR[d.kind][0], h = K.h * p.s * (d.kind === 'ptero' ? 0.6 : 1), w = h * img.width / img.height;
  return { x: p.x - w / 2, y: p.y - h - (d.jump || 0) * p.s, w, h, p };
}
function fire() {
  if (fireT > 0 || reloadT > 0) return;
  if (ammo <= 0) { reload(); return; }
  ammo--; fireT = 0.16; shots++;
  A.tone(900, 0.06, 'square', 0.035, 0, 300); A.noise(0.05, 0.05);
  darts.push({ x: cross.x, y: cross.y, t: 0.12 });
  // spit first (it's coming at you), then the nearest dinosaur, then crates
  for (const s of spits) { const p = proj(s.x, s.z, s.alt), r = 0.35 * p.s + 8; if (Math.hypot(cross.x - p.x, cross.y - p.y) < r) { s.dead = true; hits++; score += 50; A.burst(p.x, p.y, { n: 10, colors: ['#9aff6a', '#fff'], speed: 120, life: 0.4 }); A.pop(p.x, p.y - 10, 50, '#9aff6a'); return; } }
  const order = dinos.filter(d => d.state !== 'sleep').sort((a, b) => a.z - b.z);
  for (const d of order) {
    const b = dinoBox(d);
    if (cross.x < b.x || cross.x > b.x + b.w || cross.y < b.y || cross.y > b.y + b.h) continue;
    const head = d.kind === 'rex' ? cross.y < b.y + b.h * 0.3 : cross.y < b.y + b.h * 0.42 && (d.face < 0 ? cross.x < b.x + b.w * 0.45 : cross.x > b.x + b.w * 0.55);
    hits++; d.hp -= head ? 2 : 1; d.flash = 0.1;
    A.burst(cross.x, cross.y, { n: head ? 12 : 7, colors: head ? ['#ffd23d', '#fff'] : ['#bfe8ff', '#fff'], speed: 150, life: 0.35 });
    if (head) A.pop(cross.x, cross.y - 16, 'CRITICAL', '#ffd23d');
    if (d.kind === 'rex') { d.z = Math.min(16, d.z + 0.35); d.stun = (d.stun || 0) + 1; A.tone(140, 0.08, 'square', 0.04); }
    if (d.hp <= 0) sleep(d);
    return;
  }
