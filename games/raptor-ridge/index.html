<body data-game="raptor-ridge" data-pad="1:KeyR" style="--game:#7dd63d">

</main>

<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const W = 640, H = 400, ctx = A.canvas(cv, W, H), OUT = '#0a0612';
// A simple 3D: things sit at (x, z) on the ground ahead of the jeep and are projected with F / z.
const HZ = 168, F = 320, CAMH = 1.6, CLIP = 8;
/** Lighten (k > 0) or darken (k < 0) a #rgb / #rrggbb colour. */
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
const sprite = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };
/** Draw a shape twice: a dark outline (thicker), then filled with a vertical gradient lit from above. */
function blob(x, path, top, bot, col, pad = 4) {
  x.save(); path(); x.lineWidth = pad * 2; x.lineJoin = 'round'; x.strokeStyle = OUT; x.stroke(); x.restore();
  const g = x.createLinearGradient(0, top, 0, bot); g.addColorStop(0, shade(col, 0.35)); g.addColorStop(0.55, col); g.addColorStop(1, shade(col, -0.4));
  path(); x.fillStyle = g; x.fill();
}

/* ---------- dinosaurs: side views facing left, four running frames each (drawn once) ---------- */
// where each foot is in the four frames of the run: [front leg, back leg] as [dx, lift]
const RUN = [[[-20, 0], [16, 0]], [[-6, 10], [6, 0]], [[16, 0], [-20, 0]], [[6, 0], [-6, 10]]];
function leg(x, hx, hy, dx, lift, col, w, claw) {
  const kx = hx + dx * 0.35 + 8, ky = hy + 22 - lift * 0.4, fx = hx + dx, fy = 128 - lift;
  for (const [c, lw] of [[OUT, w + 6], [shade(col, -0.25), w], [shade(col, 0.05), w * 0.45]]) { x.strokeStyle = c; x.lineWidth = lw; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); x.moveTo(hx, hy); x.lineTo(kx, ky); x.lineTo(fx + 4, fy - 6); x.lineTo(fx, fy); x.stroke(); }
  x.fillStyle = OUT; x.beginPath(); x.ellipse(fx - 2, fy, 11, 4, 0, 0, 6.29); x.fill();
  x.fillStyle = '#f4ecd8'; for (let i = 0; i < 3; i++) { x.beginPath(); x.moveTo(fx - 12 + i * 5, fy - 1); x.lineTo(fx - 15 + i * 5, fy + 3); x.lineTo(fx - 9 + i * 5, fy + 2); x.fill(); }
  if (claw) { x.fillStyle = OUT; x.beginPath(); x.moveTo(fx - 4, fy - 6); x.quadraticCurveTo(fx - 14, fy - 18, fx - 8, fy - 22); x.lineTo(fx - 2, fy - 8); x.fill(); x.fillStyle = '#f4ecd8'; x.beginPath(); x.moveTo(fx - 4, fy - 7); x.quadraticCurveTo(fx - 12, fy - 17, fx - 8, fy - 20); x.lineTo(fx - 3, fy - 9); x.fill(); }
}
/** Belly lighter, back darker: a soft light from above on any body path. */
function belly(x, path, col, top, bot) {
  x.save(); path(); x.clip();
  const g = x.createLinearGradient(0, top, 0, bot); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.62, 'rgba(255,255,255,0)'); g.addColorStop(0.7, shade(col, 0.45)); g.addColorStop(1, shade(col, 0.3));
  x.fillStyle = g; x.fillRect(0, top, 300, bot - top);
  x.restore();
}
function eye(x, ex, ey, r, col = '#ffd23d') {
  x.fillStyle = OUT; x.beginPath(); x.arc(ex, ey, r + 1.5, 0, 6.29); x.fill();
  x.fillStyle = col; x.beginPath(); x.arc(ex, ey, r, 0, 6.29); x.fill();
  x.fillStyle = OUT; x.fillRect(ex - 1, ey - r + 1, 2, r * 2 - 2);
  x.fillStyle = '#fff'; x.fillRect(ex - r * 0.6, ey - r * 0.6, 2, 2);
}
function raptorFrame(f, col, accent, small) {
  return sprite(200, 140, (x) => {
    const [front, back] = RUN[f], bob = f % 2 ? -3 : 0;
    leg(x, 106, 88 + bob, back[0], back[1], shade(col, -0.15), 9, !small);
    x.save(); x.translate(0, bob);
    const tail = () => { x.beginPath(); x.moveTo(198, 50); x.quadraticCurveTo(150, 52, 118, 70); x.lineTo(124, 92); x.quadraticCurveTo(162, 78, 198, 58); x.closePath(); };
    blob(x, tail, 50, 92, col);
    const body = () => { x.beginPath(); x.ellipse(100, 80, 36, 21, -0.15, 0, 6.29); };
    blob(x, body, 58, 102, col); belly(x, body, col, 58, 102);
    const neck = () => { x.beginPath(); x.moveTo(78, 72); x.quadraticCurveTo(62, 48, 52, 38); x.lineTo(68, 32); x.quadraticCurveTo(84, 50, 98, 68); x.closePath(); };
    blob(x, neck, 32, 72, col); belly(x, neck, col, 32, 80);
    const head = () => { x.beginPath(); x.moveTo(72, 28); x.quadraticCurveTo(52, 18, 16, 32); x.lineTo(14, 42); x.quadraticCurveTo(38, 46, 58, 50); x.quadraticCurveTo(74, 48, 78, 36); x.closePath(); };
    blob(x, head, 18, 50, col);
    // markings: dark stripes down the back, a line of accent spots, a crest of quills
    x.fillStyle = shade(col, -0.45); for (let i = 0; i < 5; i++) { x.beginPath(); x.moveTo(84 + i * 11, 62 - i * 0.5); x.lineTo(92 + i * 11, 61); x.lineTo(87 + i * 11, 80); x.fill(); }
    x.fillStyle = accent; for (let i = 0; i < 6; i++) { x.beginPath(); x.arc(126 + i * 12, 64 - i * 1.4, 2.4, 0, 6.29); x.fill(); }
    if (!small) { x.fillStyle = accent; for (let i = 0; i < 6; i++) { x.beginPath(); x.moveTo(60 + i * 5, 32 + i * 5); x.lineTo(66 + i * 5, 22 + i * 5); x.lineTo(68 + i * 5, 36 + i * 5); x.fill(); } }
    // the jaw, teeth, nostril, eye
    x.strokeStyle = OUT; x.lineWidth = 2; x.beginPath(); x.moveTo(16, 40); x.quadraticCurveTo(36, 44, 54, 44); x.stroke();
    x.fillStyle = '#f4ecd8'; for (let i = 0; i < 6; i++) { x.beginPath(); x.moveTo(20 + i * 6, 40); x.lineTo(22 + i * 6, 44); x.lineTo(24 + i * 6, 40); x.fill(); }
    x.fillStyle = OUT; x.fillRect(20, 31, 3, 2);
    eye(x, 54, 32, 4);
    // the near arm with its claws
    for (const [c, w] of [[OUT, 7], [shade(col, -0.15), 4]]) { x.strokeStyle = c; x.lineWidth = w; x.beginPath(); x.moveTo(76, 82); x.lineTo(64, 94); x.lineTo(58, 90); x.stroke(); }
    x.fillStyle = '#f4ecd8'; x.beginPath(); x.moveTo(58, 90); x.lineTo(52, 96); x.lineTo(57, 94); x.fill();
    x.restore();
    leg(x, 98, 88 + bob, front[0], front[1], col, 10, !small);
  });
}
function diloFrame(f, open) {
  const col = '#3fae96', accent = '#ffd23d';
  return sprite(200, 150, (x) => {
    const [front, back] = RUN[f], bob = f % 2 ? -3 : 0;
    x.save(); x.translate(0, 8); leg(x, 112, 92 + bob, back[0], back[1], shade(col, -0.15), 11, false); x.restore();
    x.save(); x.translate(0, bob);
    blob(x, () => { x.beginPath(); x.moveTo(198, 66); x.quadraticCurveTo(150, 60, 122, 80); x.lineTo(126, 102); x.quadraticCurveTo(162, 88, 198, 76); x.closePath(); }, 60, 102, col);
    const body = () => { x.beginPath(); x.ellipse(104, 92, 40, 25, -0.1, 0, 6.29); };
    blob(x, body, 67, 117, col); belly(x, body, col, 67, 117);
    blob(x, () => { x.beginPath(); x.moveTo(80, 82); x.quadraticCurveTo(66, 60, 58, 46); x.lineTo(74, 40); x.quadraticCurveTo(88, 60, 100, 78); x.closePath(); }, 40, 82, col);
    x.fillStyle = shade(col, -0.4); for (let i = 0; i < 7; i++) { x.beginPath(); x.arc(90 + i * 11, 78 + (i % 2) * 6, 3.5, 0, 6.29); x.fill(); }
    if (open) { // the frill fans out, ribbed and glowing
      x.fillStyle = OUT; x.beginPath(); x.arc(66, 44, 36, 0, 6.29); x.fill();
      const g = x.createRadialGradient(66, 44, 6, 66, 44, 34); g.addColorStop(0, '#fff6a0'); g.addColorStop(0.35, '#ffd23d'); g.addColorStop(0.7, '#ff4f6d'); g.addColorStop(1, '#7a1a4a'); x.fillStyle = g; x.beginPath(); x.arc(66, 44, 32, 0, 6.29); x.fill();
      x.strokeStyle = 'rgba(10,6,18,.45)'; x.lineWidth = 2; for (let a = 0; a < 6.28; a += 0.45) { x.beginPath(); x.moveTo(66, 44); x.lineTo(66 + Math.cos(a) * 32, 44 + Math.sin(a) * 32); x.stroke(); }
      x.fillStyle = '#ff4f6d'; for (let a = 0; a < 6.28; a += 0.9) { x.beginPath(); x.arc(66 + Math.cos(a) * 22, 44 + Math.sin(a) * 22, 3, 0, 6.29); x.fill(); }
    }
    blob(x, () => { x.beginPath(); x.moveTo(76, 34); x.quadraticCurveTo(52, 24, 26, 36); x.lineTo(26, 48); x.quadraticCurveTo(48, 50, 66, 54); x.quadraticCurveTo(80, 52, 82, 42); x.closePath(); }, 24, 54, col);
    for (const [cx, h] of [[48, 18], [62, 22]]) { x.fillStyle = OUT; x.beginPath(); x.moveTo(cx - 8, 32); x.lineTo(cx, 32 - h); x.lineTo(cx + 8, 32); x.fill(); x.fillStyle = '#ff4f6d'; x.beginPath(); x.moveTo(cx - 6, 32); x.lineTo(cx, 34 - h); x.lineTo(cx + 6, 32); x.fill(); x.fillStyle = accent; x.fillRect(cx - 1, 34 - h + 4, 2, h - 8); }
    x.fillStyle = OUT; x.fillRect(28, 44, 28, open ? 7 : 2); if (open) { x.fillStyle = '#9aff6a'; x.fillRect(30, 46, 10, 3); }
    eye(x, 58, 38, 4.5, '#9aff6a');
    x.restore();
    x.save(); x.translate(0, 8); leg(x, 96, 92 + bob, front[0], front[1], col, 12, false); x.restore();
  });
}
function pteroFrame(up) {
  const col = '#c8805a', mem = '#a85a3a';
  return sprite(220, 120, (x) => {
    const wing = s => { x.beginPath(); x.moveTo(110, 60); x.quadraticCurveTo(110 + s * 50, up ? -10 : 70, 110 + s * 106, up ? 8 : 102); x.quadraticCurveTo(110 + s * 62, up ? 44 : 78, 110, 76); x.closePath(); };
    for (const s of [-1, 1]) {
      blob(x, () => wing(s), 0, 100, mem);
      x.strokeStyle = shade(mem, -0.35); x.lineWidth = 2; for (let k = 1; k <= 3; k++) { x.beginPath(); x.moveTo(110, 66); x.quadraticCurveTo(110 + s * (20 + k * 12), up ? 30 - k * 6 : 70, 110 + s * (34 + k * 22), up ? 30 - k * 6 + k * 8 : 80 + k * 6); x.stroke(); }
      x.strokeStyle = OUT; x.lineWidth = 4; x.beginPath(); x.moveTo(110, 60); x.quadraticCurveTo(110 + s * 50, up ? -10 : 70, 110 + s * 106, up ? 8 : 102); x.stroke(); x.strokeStyle = col; x.lineWidth = 2; x.stroke();
    }
    blob(x, () => { x.beginPath(); x.ellipse(110, 66, 17, 13, 0, 0, 6.29); }, 53, 79, col);
    blob(x, () => { x.beginPath(); x.moveTo(98, 60); x.lineTo(50, 70); x.lineTo(98, 73); x.closePath(); }, 60, 73, '#ffd23d', 3);
    blob(x, () => { x.beginPath(); x.moveTo(110, 56); x.lineTo(146, 30); x.lineTo(120, 60); x.closePath(); }, 30, 60, '#ff6a3d', 3);
    eye(x, 103, 62, 3);
  });
}
function rexFrame(open, f) {
  const col = '#7a6a4a';
  return sprite(300, 300, (x) => {
    const lift = f ? [0, 10] : [10, 0];
    [100, 200].forEach((lx, i) => { blob(x, () => { x.beginPath(); x.roundRect(lx - 28, 186 - lift[i], 56, 100, 18); }, 186, 290, col); x.fillStyle = OUT; x.fillRect(lx - 34, 278 - lift[i], 68, 18); x.fillStyle = '#e8dcc0'; for (let k = 0; k < 3; k++) { x.beginPath(); x.moveTo(lx - 28 + k * 20, 284 - lift[i]); x.lineTo(lx - 22 + k * 20, 296 - lift[i]); x.lineTo(lx - 16 + k * 20, 284 - lift[i]); x.fill(); } });
    const body = () => { x.beginPath(); x.ellipse(150, 188, 96, 76, 0, 0, 6.29); };
    blob(x, body, 112, 264, col);
    x.fillStyle = '#c8b890'; x.beginPath(); x.ellipse(150, 212, 56, 52, 0, 0, 6.29); x.fill();
    x.strokeStyle = 'rgba(80,60,30,.35)'; x.lineWidth = 3; for (let i = 0; i < 5; i++) { x.beginPath(); x.moveTo(104, 176 + i * 16); x.quadraticCurveTo(150, 190 + i * 16, 196, 176 + i * 16); x.stroke(); }
    x.fillStyle = shade(col, -0.35); for (let i = 0; i < 18; i++) { const a = -2.6 + i * 0.12, r = 84; x.beginPath(); x.arc(150 + Math.cos(a) * r * 0.9, 188 + Math.sin(a) * r * 0.75, 3 + (i % 3), 0, 6.29); x.fill(); }
    x.strokeStyle = '#c87a6a'; x.lineWidth = 3; x.beginPath(); x.moveTo(86, 150); x.lineTo(110, 170); x.moveTo(92, 146); x.lineTo(116, 166); x.stroke(); // an old scar
    for (const s of [-1, 1]) { for (const [c, w] of [[OUT, 13], [col, 7]]) { x.strokeStyle = c; x.lineWidth = w; x.lineCap = 'round'; x.beginPath(); x.moveTo(150 + s * 50, 166); x.lineTo(150 + s * 64, 196); x.lineTo(150 + s * 56, 206); x.stroke(); } }
    const jaw = open ? 50 : 14;
    blob(x, () => { x.beginPath(); x.roundRect(86, 46 + jaw, 128, 46, 18); }, 46 + jaw, 92 + jaw, shade(col, -0.1));
    if (open) { x.fillStyle = '#4a1020'; x.fillRect(96, 74, 108, jaw + 20); x.fillStyle = '#ff6a7a'; x.beginPath(); x.ellipse(150, 78 + jaw, 30, 10, 0, 0, 6.29); x.fill(); x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 2; for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(110 + i * 25, 92); x.lineTo(112 + i * 25, 92 + jaw); x.stroke(); } }
    blob(x, () => { x.beginPath(); x.roundRect(74, 10, 152, 72, 26); }, 10, 82, col);
    x.fillStyle = '#f4f0e8'; for (let i = 0; i < 9; i++) { x.beginPath(); x.moveTo(92 + i * 13, 78); x.lineTo(98 + i * 13, 94); x.lineTo(104 + i * 13, 78); x.fill(); }
    if (open) for (let i = 0; i < 8; i++) { x.beginPath(); x.moveTo(98 + i * 13, 46 + jaw + 8); x.lineTo(104 + i * 13, 46 + jaw - 8); x.lineTo(110 + i * 13, 46 + jaw + 8); x.fill(); }
    x.fillStyle = shade(col, -0.35); x.beginPath(); x.moveTo(104, 22); x.lineTo(126, 16); x.lineTo(124, 26); x.fill(); x.beginPath(); x.moveTo(196, 22); x.lineTo(174, 16); x.lineTo(176, 26); x.fill(); // brows
    for (const s of [-1, 1]) eye(x, 150 + s * 46, 36, 10, open ? '#ff4f2a' : '#ffd23d');
    x.fillStyle = 'rgba(255,255,255,.22)'; x.fillRect(96, 16, 34, 5);
    x.fillStyle = OUT; x.beginPath(); x.arc(134, 58, 3.5, 0, 6.29); x.arc(166, 58, 3.5, 0, 6.29); x.fill();
  });
}
const SPR = {
  compy: [0, 1, 2, 3].map(f => raptorFrame(f, '#7dd63d', '#ffd23d', true)),
  raptor: [0, 1, 2, 3].map(f => raptorFrame(f, '#c8904a', '#ff4f6d')),
  dilo: [diloFrame(0, false), diloFrame(1, false), diloFrame(2, false), diloFrame(3, false), diloFrame(0, true)],
  ptero: [pteroFrame(true), pteroFrame(false)],
  rex: [rexFrame(false, 0), rexFrame(false, 1), rexFrame(true, 0)]
};
const DART = sprite(40, 12, (x) => { x.fillStyle = OUT; x.fillRect(4, 3, 30, 6); x.fillStyle = '#c0c6d0'; x.fillRect(5, 4, 22, 4); x.fillStyle = '#7dd63d'; x.fillRect(18, 4, 7, 4); x.fillStyle = '#ff4f6d'; x.beginPath(); x.moveTo(26, 6); x.lineTo(38, 0); x.lineTo(36, 6); x.lineTo(38, 12); x.fill(); x.fillStyle = '#e8ecf4'; x.beginPath(); x.moveTo(5, 6); x.lineTo(0, 4); x.lineTo(0, 8); x.fill(); });
// what each kind is like: h = height in world units, hp, speed toward you, points
const KIND = {
  compy: { h: 1.05, hp: 1, v: 6.5, pts: 100 }, raptor: { h: 2.6, hp: 2, v: 8, pts: 300 }, dilo: { h: 2.6, hp: 3, v: 4.5, pts: 500 },
  ptero: { h: 1.7, hp: 1, v: 6, pts: 400 }, rex: { h: 6.4, hp: 24, v: 1.2, pts: 5000 }
};

/* ---------- scenery ---------- */
const leaves = (x, cx, cy, n, len, wid, cols, spread = Math.PI, start = -Math.PI) => { for (const [c, k] of cols) for (let i = 0; i < n; i++) { const a = start + i * spread / (n - 1); x.save(); x.translate(cx, cy); x.rotate(a); x.fillStyle = c; x.beginPath(); x.ellipse(len * 0.5 * k, 0, len * 0.55 * k, wid * k, 0, 0, 6.29); x.fill(); x.restore(); } };
const TREE = {
  palm: sprite(180, 280, (x) => {
    x.lineCap = 'round'; for (const [c, w] of [[OUT, 22], ['#6a4a2a', 14], ['#8a6a3a', 5]]) { x.strokeStyle = c; x.lineWidth = w; x.beginPath(); x.moveTo(90, 278); x.quadraticCurveTo(74, 160, 94, 66); x.stroke(); }
    x.strokeStyle = 'rgba(0,0,0,.25)'; x.lineWidth = 2; for (let y = 90; y < 270; y += 14) { x.beginPath(); x.moveTo(80, y); x.lineTo(96, y - 3); x.stroke(); }
    leaves(x, 94, 66, 8, 92, 12, [[OUT, 1.08], ['#2f9a48', 1], ['#5ad870', 0.55]], Math.PI * 1.1, -Math.PI * 1.05);
    x.fillStyle = '#6a4a2a'; for (const [dx, dy] of [[-6, 70], [6, 72], [0, 76]]) { x.beginPath(); x.arc(94 + dx, dy, 6, 0, 6.29); x.fill(); }
  }),
  broad: sprite(220, 260, (x) => {
    x.lineCap = 'round'; for (const [c, w] of [[OUT, 26], ['#5a3a1e', 18]]) { x.strokeStyle = c; x.lineWidth = w; x.beginPath(); x.moveTo(110, 258); x.lineTo(108, 110); x.moveTo(108, 160); x.lineTo(70, 120); x.moveTo(108, 140); x.lineTo(150, 104); x.stroke(); }
    for (const [cx, cy, r, c] of [[110, 80, 70, '#2a7a3a'], [60, 110, 46, '#2f8a40'], [160, 96, 52, '#2f8a40'], [110, 60, 52, '#3a9a4a']]) { x.fillStyle = OUT; x.beginPath(); x.arc(cx, cy, r + 3, 0, 6.29); x.fill(); }
    for (const [cx, cy, r, c] of [[110, 80, 70, '#2a7a3a'], [60, 110, 46, '#2f8a40'], [160, 96, 52, '#2f8a40'], [110, 60, 52, '#3a9a4a']]) { const g = x.createRadialGradient(cx - r * 0.3, cy - r * 0.4, 4, cx, cy, r); g.addColorStop(0, shade(c, 0.35)); g.addColorStop(1, shade(c, -0.3)); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, 6.29); x.fill(); }
    x.fillStyle = 'rgba(10,40,20,.35)'; for (let i = 0; i < 14; i++) { x.beginPath(); x.ellipse(50 + (i * 37) % 130, 50 + (i * 23) % 90, 9, 4, i, 0, 6.29); x.fill(); }
    x.strokeStyle = '#3a6a2a'; x.lineWidth = 2; for (const vx of [70, 150]) { x.beginPath(); x.moveTo(vx, 100); x.quadraticCurveTo(vx + 6, 150, vx - 2, 190); x.stroke(); }
  }),
  fern: sprite(160, 90, (x) => { leaves(x, 80, 88, 9, 70, 8, [[OUT, 1.1], ['#2a7a3a', 1], ['#4fb85a', 0.65]], Math.PI * 0.9, -Math.PI * 0.95); }),
  bush: sprite(140, 80, (x) => {
