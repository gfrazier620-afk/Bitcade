<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Star Siege</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preload" href="../../shared/fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="../../shared/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="star-siege" style="--game:#5ee7ff">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>STAR SIEGE</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="ab"><button data-k="ArrowLeft" aria-label="Left">◀</button><button data-k="ArrowRight" aria-label="Right">▶</button></div>
    <div class="ab"><button data-k="Space">FIRE</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>→</kbd> move · <kbd>Space</kbd> fire · <kbd>P</kbd> pause</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const W = 480, H = 640, ctx = A.canvas(cv, W, H);
// Original creature sprites, 11×8, two frames each
const SPR = {
  jelly: [[
    '...XXXXX...', '..XXXXXXX..', '.XX.XXX.XX.', '.XXXXXXXXX.', '..XXXXXXX..', '..X.X.X.X..', '.X..X.X..X.', '..X.....X..'
  ], [
    '...XXXXX...', '..XXXXXXX..', '.XX.XXX.XX.', '.XXXXXXXXX.', '..XXXXXXX..', '..X.X.X.X..', '..X.X.X.X..', '.X..X.X..X.'
  ]],
  beetle: [[
    '....XXX....', '..XXXXXXX..', '.XXX.X.XXX.', 'XXXXXXXXXXX', 'X.XXXXXXX.X', '..XX...XX..', '.X.......X.', 'X.........X'
  ], [
    '....XXX....', '..XXXXXXX..', '.XXX.X.XXX.', 'XXXXXXXXXXX', 'X.XXXXXXX.X', '..XX...XX..', '..X.....X..', '..XX...XX..'
  ]],
  eye: [[
    'X..X...X..X', '.X.XXXXX.X.', '..XXXXXXX..', '.XX..X..XX.', '.XX.XXX.XX.', '..XXXXXXX..', '...X.X.X...', '..X.....X..'
  ], [
    '.X.X...X.X.', '...XXXXX...', '..XXXXXXX..', '.XX..X..XX.', '.XX.XXX.XX.', '..XXXXXXX..', '...X.X.X...', '...X...X...'
  ]]
};
const ROWS = [{ k: 'eye', pts: 30, col: '#ff5edb' }, { k: 'jelly', pts: 20, col: '#5ee7ff' }, { k: 'jelly', pts: 20, col: '#5ee7ff' }, { k: 'beetle', pts: 10, col: '#7dff6a' }, { k: 'beetle', pts: 10, col: '#7dff6a' }];
const PX = 3, AW = 11 * PX, AH = 8 * PX, COLS = 9, SX = 44, SY = 38;
let state = 'title', score, lives, wave, player, shots, bombs, aliens, fleet, bunkers, ufo, ufoT, parts, frame, stars, bannerT, extraGiven, pops = [];
stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.3, v: Math.random() * 14 + 4 }));
parts = [];

function newGame() { score = 0; lives = A.easy ? 5 : 3; wave = 1; extraGiven = false; A.setScore(0); buildBunkers(); startWave(); state = 'play'; }
function startWave() {
  player = { x: W / 2, y: 596, cool: 0, dead: 0, inv: 1.2 }; shots = []; bombs = []; parts = []; ufo = null; ufoT = A.rand(14, 24); frame = 0;
  aliens = [];
  for (let r = 0; r < 5; r++) for (let c = 0; c < COLS; c++) aliens.push({ r, c, alive: true, ...ROWS[r] });
  fleet = { x: 44, y: 96 + Math.min(wave - 1, 5) * 14, dir: 1, t: 0 };
  bannerT = 1.8;
}
function buildBunkers() {
  bunkers = [];
  const shape = ['..XXXXXXXX..', '.XXXXXXXXXX.', 'XXXXXXXXXXXX', 'XXXXXXXXXXXX', 'XXXX....XXXX', 'XXX......XXX'];
  for (let i = 0; i < 4; i++) { const bx = 52 + i * 112; shape.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === 'X') bunkers.push({ x: bx + x * 6, y: 512 + y * 6, hp: 3 }); })); }
}
const alive = () => aliens.filter(a => a.alive);
const apos = a => ({ x: fleet.x + a.c * SX, y: fleet.y + a.r * SY });
function stepInterval() { const n = alive().length; return 0.03 + 0.6 * (n / 45) / (1 + (wave - 1) * 0.12); }
function boom(x, y, c, n = 14) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = A.rand(40, 200); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: A.rand(0.3, 0.8), c }); } }
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play' }); }
A.onPress(c => { if (c === 'KeyP' || c === 'Escape') pause(); });
A.onHide(pause);
const MARCH = [98, 92, 86, 82];

function update(dt) {
  stars.forEach(s => { s.y += s.v * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } });
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; }); parts = parts.filter(p => p.t > 0);
  pops.forEach(p => p.t -= dt); pops = pops.filter(p => p.t > 0);
  if (state !== 'play') return;
  if (bannerT > 0) bannerT -= dt;
  // player
  if (player.dead > 0) { player.dead -= dt; if (player.dead <= 0) { if (lives <= 0) return gameOver(); player.inv = 2; } }
  else {
    player.inv = Math.max(0, player.inv - dt);
    const d = (A.held('ArrowRight', 'KeyD') ? 1 : 0) - (A.held('ArrowLeft', 'KeyA') ? 1 : 0);
    player.x = A.clamp(player.x + d * 260 * dt, 24, W - 24);
    player.cool -= dt;
    if (A.held('Space', 'KeyJ', 'ArrowUp') && player.cool <= 0 && shots.length < 2) { shots.push({ x: player.x, y: player.y - 16 }); player.cool = 0.32; A.tone(1200, 0.08, 'square', 0.03, 0, 400); }
  }
  shots.forEach(s => s.y -= 560 * dt);
  // fleet march
  fleet.t += dt;
  if (fleet.t >= stepInterval()) {
    fleet.t = 0; frame ^= 1; A.tone(MARCH[(fleet.n = ((fleet.n || 0) + 1) % 4)], 0.07, 'square', 0.05);
    const L = alive(); const xs = L.map(a => apos(a).x);
    const minX = Math.min(...xs), maxX = Math.max(...xs) + AW;
    if ((fleet.dir > 0 && maxX + 10 > W - 8) || (fleet.dir < 0 && minX - 10 < 8)) { fleet.y += 16; fleet.dir *= -1; }
    else fleet.x += 10 * fleet.dir;
  }
  // alien fire
  const L = alive();
  const fireRate = 0.7 + wave * 0.18;
  if (L.length && Math.random() < fireRate * dt && player.dead <= 0) {
    const cols = {}; L.forEach(a => { if (!cols[a.c] || a.r > cols[a.c].r) cols[a.c] = a; });
    const shooters = Object.values(cols); let s = A.pick(shooters);
    if (Math.random() < 0.45) s = shooters.reduce((b, a) => Math.abs(apos(a).x - player.x) < Math.abs(apos(b).x - player.x) ? a : b);
    const p = apos(s); bombs.push({ x: p.x + AW / 2, y: p.y + AH, v: 190 + wave * 14, w: Math.random() < 0.3 });
  }
  bombs.forEach(b => b.y += b.v * dt);
  // ufo
  ufoT -= dt;
  if (!ufo && ufoT <= 0) { const d = Math.random() < 0.5 ? 1 : -1; ufo = { x: d > 0 ? -30 : W + 30, d, pts: A.pick([50, 100, 150, 300]) }; }
  if (ufo) { ufo.x += ufo.d * 110 * dt; ufo.humT = (ufo.humT || 0) - dt; if (ufo.humT <= 0) { ufo.humT = 0.36; A.tone(440, 0.18, 'sine', 0.02); } if (ufo.x < -40 || ufo.x > W + 40) { ufo = null; ufoT = A.rand(16, 26); } }
  // collisions: shots
  for (const s of shots) {
    if (s.y < 40) { s.dead = true; continue; }
    for (const a of L) { const p = apos(a); if (s.x > p.x && s.x < p.x + AW && s.y > p.y && s.y < p.y + AH) { a.alive = false; s.dead = true; score += a.pts; boom(p.x + AW / 2, p.y + AH / 2, a.col); A.noise(0.12, 0.05);
      A.burst(p.x + AW / 2, p.y + AH / 2, { n: 10, kind: 'debris', colors: [a.col, shade(a.col, -0.4)], speed: 150, life: 0.6, size: 3, gravity: 200 }); A.pop(p.x + AW / 2, p.y, a.pts, a.col); A.shake(1.5, 0.08); break; } }
    if (!s.dead && ufo && Math.abs(s.x - ufo.x) < 22 && Math.abs(s.y - 66) < 10) { score += ufo.pts; boom(ufo.x, 66, '#ffd23d', 26); s.dead = true; A.ring(ufo.x, 66, '#ffd23d', 70); A.flash('#ffd23d', 0.18); A.shake(5, 0.25); flashPts(ufo.x, ufo.pts); A.badge('saucer'); ufo = null; ufoT = A.rand(16, 26); A.jingle([880, 660, 880, 1320], 0.06); }
    if (!s.dead) for (const b of bunkers) if (b.hp > 0 && s.x > b.x - 1 && s.x < b.x + 7 && s.y > b.y && s.y < b.y + 6) { b.hp = 0; s.dead = true; A.burst(b.x + 3, b.y, { n: 3, kind: 'debris', color: '#3db14f', speed: 80, life: 0.5, size: 2.5 }); break; }
    if (!s.dead) for (const b of bombs) if (Math.abs(b.x - s.x) < 6 && Math.abs(b.y - s.y) < 10) { b.dead = true; s.dead = true; boom(s.x, s.y, '#fff', 5); score += 5; }
  }
  for (const b of bombs) {
    if (b.dead) continue;
    if (b.y > H) { b.dead = true; continue; }
    for (const k of bunkers) if (k.hp > 0 && b.x > k.x - 2 && b.x < k.x + 8 && b.y > k.y && b.y < k.y + 6) { k.hp--; b.dead = true; A.burst(k.x + 3, k.y + 6, { n: 3, kind: 'debris', color: '#3db14f', speed: 80, life: 0.5, size: 2.5 }); break; }
    if (!b.dead && player.dead <= 0 && player.inv <= 0 && Math.abs(b.x - player.x) < 18 && b.y > player.y - 10 && b.y < player.y + 12) { b.dead = true; hitPlayer(); }
  }
  shots = shots.filter(s => !s.dead); bombs = bombs.filter(b => !b.dead);
  // aliens erode bunkers / reach bottom
  for (const a of L) { const p = apos(a);
    if (p.y + AH > 506) bunkers.forEach(k => { if (k.hp > 0 && k.x + 6 > p.x && k.x < p.x + AW && k.y < p.y + AH && k.y + 6 > p.y) k.hp = 0; });
    if (player.dead <= 0 && p.y + AH >= player.y - 12) { lives = 0; player.dead = 1.2; boom(player.x, player.y, '#5ee7ff', 30); A.noise(0.8, 0.1); return; }
  }
  if (!extraGiven && score >= 5000) { extraGiven = true; lives++; A.jingle([660, 880, 1320], 0.08); }
  A.setScore(score);
  if (!alive().length) { A.badge('wave'); wave++; if (wave >= 5) A.badge('w5'); score += 200; A.jingle([523, 659, 784, 1047], 0.1); startWave(); }
}
function flashPts(x, p) { pops.push({ x, t: 1.2, p }); }
function hitPlayer() {
  lives--; player.dead = 1.6; boom(player.x, player.y, '#5ee7ff', 30); A.noise(0.6, 0.1); A.tone(160, 0.6, 'sawtooth', 0.05, 0, 40); bombs = [];
  A.burst(player.x, player.y, { n: 14, kind: 'debris', colors: ['#5ee7ff', '#c0c6d0', '#2a4a6a'], speed: 220, life: 1, angle: -Math.PI / 2, spread: 2.4 });
  A.ring(player.x, player.y, '#5ee7ff', 70); A.flash('#ff4f6d', 0.22); A.shake(10, 0.45); A.hitstop(0.1);
}
function gameOver() { state = 'over'; const rec = A.submit(score); A.overlay({ title: 'EARTH FALLS', big: `SCORE ${score} · WAVE ${wave}`, sub: rec ? 'New high score!' : `Best: ${A.best()}`, btn: 'Play again', onGo: newGame }); }

/* ---------- art ---------- */
/** Lighten (k > 0) or darken (k < 0) a #rgb / #rrggbb colour. */
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
// Each alien frame, pre-drawn once per colour: a dark outline round every pixel, then pixels lit from the top
// (lighter top rows, darker bottom rows), with a glint on the top-left pixel of each run.
const spriteCache = new Map();
function spriteCanvas(name, f, col) {
  const key = name + f + col; if (spriteCache.has(key)) return spriteCache.get(key);
  const rows = SPR[name][f], c = document.createElement('canvas'); c.width = AW + PX * 2; c.height = AH + PX * 2; const x = c.getContext('2d');
  const on = (r, k) => rows[r] && rows[r][k] === 'X';
  x.fillStyle = '#0a0612';
  for (let r = 0; r < 8; r++) for (let k = 0; k < 11; k++) if (on(r, k)) x.fillRect(k * PX, r * PX, PX * 3, PX * 3);
  for (let r = 0; r < 8; r++) for (let k = 0; k < 11; k++) if (on(r, k)) {
    x.fillStyle = shade(col, r < 2 ? 0.35 : r > 5 ? -0.35 : 0); x.fillRect(PX + k * PX, PX + r * PX, PX, PX);
    if (!on(r - 1, k)) { x.fillStyle = shade(col, 0.65); x.fillRect(PX + k * PX, PX + r * PX, PX, 1); }
  }
  spriteCache.set(key, c); return c;
}
function sprite(name, f, x, y, c) { ctx.drawImage(spriteCanvas(name, f, c), x - PX, y - PX); }
/** The player's cannon: an outlined, shaded hull with a turret, a glass dome and engine lights. */
function ship(x, y) {
  const hull = [[0, -15], [6, -5], [19, 2], [19, 11], [-19, 11], [-19, 2], [-6, -5]];
  ctx.fillStyle = '#0a0612'; ctx.beginPath(); hull.forEach(([px, py], i) => { const X = x + px * 1.12, Y = y + py * 1.12 + 0.5; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath(); ctx.fill();
  const g = ctx.createLinearGradient(0, y - 15, 0, y + 11); g.addColorStop(0, '#c8f8ff'); g.addColorStop(0.45, '#5ee7ff'); g.addColorStop(1, '#1f5a78');
  ctx.shadowColor = '#5ee7ff'; ctx.shadowBlur = 10; ctx.fillStyle = g; ctx.beginPath(); hull.forEach(([px, py], i) => i ? ctx.lineTo(x + px, y + py) : ctx.moveTo(x + px, y + py)); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#1f5a78'; ctx.fillRect(x - 19, y + 7, 38, 4);
  ctx.fillStyle = '#0a1a2a'; ctx.beginPath(); ctx.ellipse(x, y - 3, 4, 4, 0, 0, 6.29); ctx.fill(); ctx.fillStyle = 'rgba(200,240,255,.9)'; ctx.fillRect(x - 2, y - 5, 2, 2);
  ctx.fillStyle = Math.floor(performance.now() / 200) % 2 ? '#ff4f6d' : '#ffd23d'; ctx.fillRect(x - 16, y + 3, 3, 2); ctx.fillRect(x + 13, y + 3, 3, 2);
}
// the backdrop, drawn once: a nebula and an alien planet's curved horizon at the bottom
const backdrop = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.fillStyle = '#04030c'; x.fillRect(0, 0, W, H);
  const neb = (cx, cy, r, col) => { const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H); };
  neb(110, 200, 220, 'rgba(255,94,219,.08)'); neb(380, 120, 180, 'rgba(94,231,255,.07)'); neb(260, 420, 200, 'rgba(125,255,106,.04)');
  const py = H + 900, g = x.createRadialGradient(W / 2, py, 900, W / 2, py, 990); g.addColorStop(0, '#1a3a2a'); g.addColorStop(0.92, '#2a5a3a'); g.addColorStop(1, 'rgba(125,255,106,.0)');
  x.fillStyle = g; x.beginPath(); x.arc(W / 2, py, 990, 0, 6.29); x.fill();
  x.strokeStyle = 'rgba(125,255,106,.55)'; x.lineWidth = 2; x.beginPath(); x.arc(W / 2, py, 960, Math.PI * 1.35, Math.PI * 1.65); x.stroke();
  x.fillStyle = 'rgba(10,30,20,.6)'; for (let i = 0; i < 14; i++) { x.beginPath(); x.ellipse(30 + i * 34, 612 + (i % 3) * 6, 10 + (i % 4) * 4, 3, 0, 0, 6.29); x.fill(); } // craters
  return c;
})();
/** The bonus saucer: a gold disc with a glass dome and chasing lights. */
function drawUfo(u, t) {
  const x = u.x, y = 66;
  ctx.shadowColor = '#ffd23d'; ctx.shadowBlur = 16; ctx.fillStyle = '#0a0612'; ctx.beginPath(); ctx.ellipse(x, y + 2, 25, 9, 0, 0, 6.29); ctx.fill(); ctx.shadowBlur = 0;
  const g = ctx.createLinearGradient(0, y - 5, 0, y + 9); g.addColorStop(0, '#fff0a8'); g.addColorStop(0.5, '#ffd23d'); g.addColorStop(1, '#8a6a10');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y + 2, 23, 7, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#0a0612'; ctx.beginPath(); ctx.ellipse(x, y - 2, 11, 9, 0, Math.PI, 0); ctx.fill();
  const dg = ctx.createRadialGradient(x - 3, y - 7, 1, x, y - 4, 10); dg.addColorStop(0, '#e8fcff'); dg.addColorStop(1, 'rgba(94,231,255,.55)'); ctx.fillStyle = dg; ctx.beginPath(); ctx.ellipse(x, y - 2, 9.5, 7.5, 0, Math.PI, 0); ctx.fill();
  for (let i = 0; i < 6; i++) { ctx.fillStyle = (i + Math.floor(t / 90)) % 6 === 0 ? '#fff' : '#ff8a3d'; ctx.beginPath(); ctx.arc(x - 17 + i * 6.8, y + 4, 1.7, 0, 6.29); ctx.fill(); }
}
function draw(t) {
  ctx.drawImage(backdrop, 0, 0);
  stars.forEach(s => { ctx.fillStyle = `rgba(200,220,255,${0.25 + s.s / 3 + Math.sin(t / 300 + s.x) * 0.15})`; ctx.fillRect(s.x, s.y, s.s, s.s); });
  if (state === 'title' || !aliens) {
    const f = Math.floor(t / 500) % 2;
    ['eye', 'jelly', 'beetle'].forEach((k, i) => { sprite(k, f, 120, 190 + i * 70, ROWS[[0, 1, 3][i]].col); ctx.fillStyle = '#f4effd'; ctx.font = '16px Silkscreen, monospace'; ctx.textAlign = 'left'; ctx.fillText(`= ${[30, 20, 10][i]} PTS`, 180, 210 + i * 70); });
    return;
  }
  ctx.font = '14px Silkscreen, monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#0a0612'; ctx.fillText('WAVE ' + wave, 13, 27); ctx.fillStyle = '#f4effd'; ctx.fillText('WAVE ' + wave, 12, 26);
  for (let i = 0; i < Math.max(0, lives - (player.dead > 0 ? 0 : 1)); i++) { ctx.save(); ctx.translate(W - 26 - i * 34, 22); ctx.scale(0.6, 0.6); ship(0, 0); ctx.restore(); }
  for (const a of aliens) if (a.alive) { const p = apos(a); sprite(a.k, frame, p.x, p.y, a.col); }
  // shields: outlined green blocks, lighter on top, darker as they wear down
  for (const k of bunkers) if (k.hp > 0) { ctx.fillStyle = '#0a0612'; ctx.fillRect(k.x - 1, k.y - 1, 8, 8); }
  for (const k of bunkers) if (k.hp > 0) { const c = ['', '#2c7a3a', '#3db14f', '#5bea6f'][k.hp]; ctx.fillStyle = c; ctx.fillRect(k.x, k.y, 6, 6); ctx.fillStyle = shade(c, 0.35); ctx.fillRect(k.x, k.y, 6, 1); }
  if (ufo) drawUfo(ufo, t);
  // lasers and bombs
  ctx.shadowColor = '#5ee7ff'; ctx.shadowBlur = 10; shots.forEach(s => { ctx.fillStyle = '#5ee7ff'; ctx.fillRect(s.x - 2.5, s.y - 10, 5, 15); ctx.fillStyle = '#fff'; ctx.fillRect(s.x - 1, s.y - 9, 2, 13); }); ctx.shadowBlur = 0;
  bombs.forEach(b => { const c = b.w ? '#ff5edb' : '#ffb03d', z = Math.floor(b.y / 6) % 2 ? 2 : -2; ctx.shadowColor = c; ctx.shadowBlur = 8; ctx.fillStyle = c; ctx.fillRect(b.x - 2 + (b.w ? z : 0), b.y - 7, 4, 5); ctx.fillRect(b.x - 2 - (b.w ? z : 0), b.y - 2, 4, 5); ctx.fillStyle = '#fff'; ctx.fillRect(b.x - 0.5, b.y - 5, 1, 7); ctx.shadowBlur = 0; });
  if (player.dead <= 0 && !(player.inv > 0 && Math.floor(t / 100) % 2)) ship(player.x, player.y);
  parts.forEach(p => { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }); ctx.globalAlpha = 1;
  pops.forEach(p => { ctx.font = '14px Silkscreen, monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#0a0612'; ctx.fillText(p.p, p.x + 1, 71); ctx.fillStyle = '#ffd23d'; ctx.fillText(p.p, p.x, 70); });
  if (bannerT > 0) { ctx.globalAlpha = Math.min(1, bannerT); ctx.font = '30px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#0a0612'; ctx.fillText('WAVE ' + wave, W / 2 + 2, 442); ctx.shadowColor = '#5ee7ff'; ctx.shadowBlur = 16; ctx.fillStyle = '#5ee7ff'; ctx.fillText('WAVE ' + wave, W / 2, 440); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
}
A.loop(update, draw);
/* Attract demo: fire away under the nearest alien, stepping aside from bombs. */
A.attract({
  start: newGame,
  stop: () => { state = 'title'; },
  bot: () => {
    if (state !== 'play' || !player || player.dead > 0) return [];
    const keys = ['Space'], live = aliens.filter(a => a.alive);
    const threat = bombs.find(b => b.y > player.y - 140 && b.y < player.y && Math.abs(b.x - player.x) < 22);
    let tx = player.x;
    if (threat) tx = player.x + (threat.x > player.x ? -60 : 60);
    else if (live.length) { const t = live.reduce((a, c) => Math.abs(apos(c).x - player.x) < Math.abs(apos(a).x - player.x) ? c : a); tx = apos(t).x + AW / 2; }
    if (Math.abs(tx - player.x) > 6) keys.push(tx > player.x ? 'ArrowRight' : 'ArrowLeft');
    return keys;
  }
});
A.overlay({ title: 'STAR SIEGE', sub: 'The fleet is marching down. Shoot them before they land. Hide behind your shields, and tag the gold saucer for bonus points.', btn: 'Start', scores: true, onGo: newGame });
})();
</script>
