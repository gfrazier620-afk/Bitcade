<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Depth Charge</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preload" href="../../shared/fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="../../shared/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="depth-charge" data-pad="0:Space 1:KeyK 2:KeyC 3:KeyC" style="--game:#22c8e0">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>DEPTH CHARGE</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="dp"><button class="u" data-k="ArrowUp" aria-label="Up">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button><button class="d" data-k="ArrowDown" aria-label="Down">▼</button></div>
    <div class="ab"><button class="sm" data-k="KeyC">PING</button><button class="sm" data-k="KeyK">CHARGE</button><button data-k="Space">FIRE</button></div>
  </div>
  <p class="help">arrows or WASD steer · hold <kbd>Space</kbd>/<kbd>J</kbd> for torpedoes · <kbd>K</kbd>/<kbd>X</kbd> drop a depth charge · <kbd>C</kbd>/<kbd>Shift</kbd> sonar ping (lights up the dark) · <kbd>P</kbd> pause · gamepad: d-pad, A fire, B charge, X ping</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
/*
 * Depth Charge: a little yellow submarine, the Minnow, against the Iron Tide navy. The sea scrolls by; steer anywhere
 * on screen. Torpedoes go forward (hold to keep firing), depth charges sink below you, and a sonar ping lights up the
 * dark for a moment. Every stage is deeper and darker: the shallows, the kelp forest, the trench, the abyss (where
 * your headlight and the ping are all you've got), and the sunken fortress. Air runs down; grab the bubbles. Supply
 * pods carry torpedo upgrades (T), a shield (S) and air (A). Each stage ends with a boss: the Iron Whale, the
 * Mecha-Angler (its lure is the only light down there) and the fortress's guns and core. Then it starts again, harder.
 */
const A = Arcade, cv = document.getElementById('cv');
const W = 640, H = 400, ctx = A.canvas(cv, W, H), OUT = '#0a0612';
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function paint(x, list) {
  x.fillStyle = OUT; for (const q of list) x.fillRect(q[0] - 2, q[1] - 2, q[2] + 4, q[3] + 4);
  for (const [px, py, w, h, c] of list) { x.fillStyle = c; x.fillRect(px, py, w, h); if (w > 3 && h > 3) { x.fillStyle = shade(c, 0.3); x.fillRect(px, py, w, Math.max(1, h * 0.25)); x.fillStyle = shade(c, -0.3); x.fillRect(px, py + h - Math.max(1, h * 0.25), w, Math.max(1, h * 0.25)); } }
}

/* ---------- the stages ---------- */
const ZONES = [
  { name: 'THE SHALLOWS', top: ['#3aa8e0', '#1a5a9a'], rock: '#c8a868', dark: 0, surface: true, boss: 'whale' },
  { name: 'KELP FOREST', top: ['#1a7a8a', '#0a3a5a'], rock: '#6a8a5a', dark: 0.3, surface: true, kelp: true, boss: 'whale' },
  { name: 'THE TRENCH', top: ['#0a3050', '#04101e'], rock: '#4a5a6a', dark: 0.62, cave: true, boss: 'angler' },
  { name: 'THE ABYSS', top: ['#04121e', '#010409'], rock: '#3a3a5a', dark: 0.86, cave: true, glow: true, boss: 'angler' },
  { name: 'SUNKEN FORTRESS', top: ['#0a2030', '#040a12'], rock: '#5a5060', dark: 0.7, cave: true, boss: 'fort' }
];
const LEN = 70; // seconds of sea before the boss
let state = 'title', stage = 1, zone = ZONES[0], score = 0, lives = 3, sub = null, cam = 0, speed = 46, clock = 0, boss = null, lost = false, missed = false;
let shots = [], foes = [], items = [], bubbles = [], pings = [], lights = [], seed = 1, msg = '', msgT = 0, bg = null, darkCv = null;
const say = (t, s = 2) => { msg = t; msgT = s; };
const add = (n, x, y, c = '#ffd23d') => { score += n; A.setScore(score); if (x !== undefined) A.pop(x, y, '+' + n, c); };
const lvl = () => 1 + (stage - 1) * 0.18; // difficulty creeps up every stage
// the sea floor and the cave roof, as heights along the world
function noise(x, k) { return Math.sin(x * 0.011 + k) * 0.5 + Math.sin(x * 0.027 + k * 2.3) * 0.3 + Math.sin(x * 0.063 + k * 5.1) * 0.2; }
const floorY = x => H - 46 - (noise(x, seed) + 1) * (zone.cave ? 34 : 26);
const roofY = x => zone.cave ? 26 + (noise(x, seed + 9) + 1) * 30 : 30;

function drawBg() {
  bg = document.createElement('canvas'); bg.width = W; bg.height = H; const b = bg.getContext('2d'), z = zone, r = A.seeded('depth:bg:' + z.name);
  const g = b.createLinearGradient(0, 0, 0, H); g.addColorStop(0, z.top[0]); g.addColorStop(1, z.top[1]); b.fillStyle = g; b.fillRect(0, 0, W, H);
  if (z.surface) { for (let k = 0; k < 7; k++) { b.fillStyle = 'rgba(255,255,255,.07)'; b.beginPath(); b.moveTo(60 + k * 90, 0); b.lineTo(20 + k * 90, H); b.lineTo(70 + k * 90, H); b.lineTo(90 + k * 90, 0); b.fill(); } }
  b.fillStyle = 'rgba(255,255,255,.12)'; for (let k = 0; k < 50; k++) b.fillRect(Math.floor(r() * W), Math.floor(r() * H), 1, 1);
  darkCv = document.createElement('canvas'); darkCv.width = W; darkCv.height = H;
}

/* ---------- the sub ---------- */
function newSub() { return { x: 110, y: 190, vx: 0, vy: 0, tor: sub ? Math.max(1, sub.tor - 1) : 1, shield: 0, air: 100, cool: 0, charge: 0, ping: 0, inv: 2, dead: 0, prop: 0 }; }
const keys = { L: ['ArrowLeft', 'KeyA'], R: ['ArrowRight', 'KeyD'], U: ['ArrowUp', 'KeyW'], D: ['ArrowDown', 'KeyS'], F: ['Space', 'KeyJ', 'KeyZ'], C: ['KeyK', 'KeyX'], P: ['KeyC', 'ShiftLeft', 'ShiftRight'] };
function torpedo() {
  const s = sub; s.cool = 0.22; A.tone(330, 0.06, 'triangle', 0.03, 0, 160);
  const spread = s.tor >= 3 ? [-0.16, 0, 0.16] : s.tor === 2 ? [-0.07, 0.07] : [0];
  for (const a of spread) shots.push({ k: 'tor', x: s.x + 26, y: s.y + 4 + a * 40, vx: 360 * Math.cos(a), vy: 360 * Math.sin(a), mine: true, dmg: 1, t: 2 });
}
function charge() { const s = sub; if (s.charge > 0 || s.dead) return; s.charge = 0.7; shots.push({ k: 'chg', x: s.x, y: s.y + 14, vx: 30, vy: 40, g: 160, mine: true, dmg: 4, t: 3 }); A.tone(160, 0.1, 'square', 0.03); }
function ping() { const s = sub; if (s.ping > 0 || s.dead) return; s.ping = 3.5; pings.push({ x: s.x, y: s.y, r: 10, t: 0 }); A.tone(1500, 0.5, 'sine', 0.04, 0, 1400); A.tone(1500, 0.3, 'sine', 0.015, 0.45, 1300); }
function hurt(why) {
  const s = sub; if (s.inv > 0 || s.dead || state !== 'play') return;
  if (s.shield > 0) { s.shield = 0; s.inv = 1; A.sfx('hurt'); A.ring(s.x, s.y, '#5ee7ff', 40); return; }
  s.dead = 1.6; lives--; missed = true; A.sfx('boom'); A.shake(8, 0.5); A.flash('#ff8a3d', 0.15); A.hitstop(0.08);
  A.burst(s.x, s.y, { n: 30, colors: ['#ffd23d', '#ff8a3d', '#fff'], speed: 200, life: 0.7 }); lights.push({ x: s.x, y: s.y, r: 140, t: 0.6 });
  say(why || 'SUNK!', 1.4);
  if (lives <= 0) setTimeout(gameOver, 1500);
}

/* ---------- the navy ---------- */
const FOES = {
  minisub: { hp: 2, pts: 150, r: 14 }, mine: { hp: 1, pts: 50, r: 10 }, diver: { hp: 1, pts: 100, r: 10 }, eel: { hp: 2, pts: 200, r: 12 },
  jelly: { hp: 2, pts: 150, r: 12 }, ship: { hp: 6, pts: 500, r: 26 }, turret: { hp: 3, pts: 250, r: 12 }, pod: { hp: 1, pts: 50, r: 12 }
};
const POOL = [
  ['minisub', 'mine', 'diver', 'diver', 'ship', 'pod'],
  ['minisub', 'mine', 'diver', 'eel', 'ship', 'turret', 'pod'],
  ['minisub', 'mine', 'eel', 'eel', 'jelly', 'turret', 'pod'],
  ['minisub', 'eel', 'jelly', 'jelly', 'mine', 'pod'],
  ['minisub', 'mine', 'turret', 'turret', 'eel', 'jelly', 'pod']
];
function addFoe(k) {
  const x = W + 30, fy = floorY(cam + x), ry = roofY(cam + x);
  const y = k === 'ship' ? 24 : k === 'turret' ? fy - 8 : k === 'mine' ? ry + 40 + Math.random() * (fy - ry - 80) : ry + 30 + Math.random() * (fy - ry - 60);
  if (k === 'ship' && !zone.surface) return;
  foes.push({ k, ...FOES[k], hp: Math.ceil(FOES[k].hp * (k === 'pod' ? 1 : Math.min(2, lvl()))), x, y, y0: y, t: Math.random() * 6, shoot: 1.5 + Math.random() * 2, hit: 0, dead: false, anchor: k === 'mine' ? fy : 0 });
}
function enemyShot(x, y, vx, vy, c = '#ff6a5a', k = 'bolt') { shots.push({ k, x, y, vx, vy, mine: false, t: 5, c }); }
function aimShot(x, y, sp, c) { const d = Math.hypot(sub.x - x, sub.y - y) || 1; enemyShot(x, y, (sub.x - x) / d * sp, (sub.y - y) / d * sp, c); }
function kill(e) {
  e.dead = true; add(e.pts, e.x, e.y - 10);
  A.burst(e.x, e.y, { n: e.k === 'ship' ? 30 : 14, colors: ['#ffd23d', '#ff8a3d', '#bfe8ff'], speed: 160, life: 0.5 }); lights.push({ x: e.x, y: e.y, r: 90, t: 0.4 });
  A.sfx(e.k === 'pod' ? 'select' : 'boom');
  if (e.k === 'ship' || e.k === 'turret') A.shake(4, 0.2);
  if (e.k === 'mine') { A.ring(e.x, e.y, '#ff8a3d', 50); if (Math.hypot(e.x - sub.x, e.y - sub.y) < 38) hurt('CAUGHT IN THE BLAST'); }
  if (e.k === 'pod') items.push({ k: ['T', 'S', 'A', 'T'][Math.floor(Math.random() * 4)], x: e.x, y: e.y, t: 8 });
  else if (Math.random() < 0.08) items.push({ k: 'A', x: e.x, y: e.y, t: 8 });
}

/* ---------- bosses ---------- */
function makeBoss() {
  const hp = Math.round(({ whale: 40, angler: 55, fort: 30 })[zone.boss] * lvl());
  if (zone.boss === 'whale') return { k: 'whale', x: W + 120, y: 200, tx: 500, hp, max: hp, t: 0, shoot: 2, mine: 4, hit: 0 };
  if (zone.boss === 'angler') return { k: 'angler', x: W + 120, y: 200, tx: 480, hp, max: hp, t: 0, lunge: 0, cool: 4, shoot: 2.5, hit: 0, open: 0 };
  return { k: 'fort', x: W + 60, tx: 560, hp, max: hp, t: 0, guns: [{ y: 90, hp: 12 }, { y: 200, hp: 12 }, { y: 310, hp: 12 }].map(g => ({ ...g, hp: Math.round(g.hp * lvl()), shoot: 1 + Math.random() * 2, hit: 0 })), hit: 0 };
}
function bossBoxes() {
  const b = boss; if (!b || b.dying) return [];
  if (b.k === 'whale') return [{ x: b.x - 70, y: b.y - 26, w: 140, h: 52, part: 'hull' }];
  if (b.k === 'angler') return [{ x: b.x - 60, y: b.y - 40, w: 120, h: 80, part: 'body' }];
  const out = b.guns.filter(g => g.hp > 0).map((g, i) => ({ x: b.x - 40, y: g.y - 16, w: 40, h: 32, part: 'gun', g }));
  if (!out.length) out.push({ x: b.x - 30, y: 170, w: 50, h: 60, part: 'core' });
  return out;
}
function hitBoss(box, dmg, x, y) {
  const b = boss; b.hit = 0.1; A.tone(200, 0.05, 'square', 0.03); A.burst(x, y, { n: 6, colors: ['#ffd23d', '#fff'], speed: 120, life: 0.3 });
  if (box.part === 'gun') { box.g.hp -= dmg; box.g.hit = 0.1; add(20); if (box.g.hp <= 0) { add(1500, x, y); A.sfx('boom'); A.shake(6, 0.3); A.burst(x, y, { n: 24, colors: ['#ffd23d', '#ff8a3d'], speed: 180, life: 0.6 }); lights.push({ x, y, r: 110, t: 0.5 }); if (b.guns.every(g => g.hp <= 0)) say('THE CORE IS OPEN!', 1.6); } return; }
  b.hp -= dmg * (box.part === 'body' && b.open > 0 ? 2 : 1); add(20);
  if (b.hp > 0) return;
  b.dying = 2.5; add(10000, b.x, b.y - 40, '#ffd23d'); A.flash('#fff', 0.3); A.shake(12, 1.2); A.noise(1.4, 0.1); say(`${{ whale: 'THE IRON WHALE', angler: 'THE MECHA-ANGLER', fort: 'THE FORTRESS' }[b.k]} IS DOWN!`, 2.4);
  if (b.k === 'angler') A.badge('angler');
  for (let k = 0; k < 9; k++) setTimeout(() => { if (!boss) return; const px = (b.k === 'fort' ? b.x - 20 : b.x) + (Math.random() - 0.5) * 120, py = (b.k === 'fort' ? 200 : b.y) + (Math.random() - 0.5) * 100; A.burst(px, py, { n: 20, colors: ['#ffd23d', '#ff8a3d', '#fff'], speed: 200, life: 0.6 }); lights.push({ x: px, y: py, r: 120, t: 0.5 }); }, k * 220);
}
function updBoss(dt) {
  const b = boss; b.t += dt; b.hit -= dt;
  if (b.dying) { b.dying -= dt; b.y = (b.y || 200) + dt * 30; if (b.dying <= 0) { boss = null; stageClear(); } return; }
  if (b.x > b.tx) b.x -= 60 * dt;
  if (b.k === 'whale') {
    b.y = 200 + Math.sin(b.t * 0.7) * 90;
    if ((b.shoot -= dt) <= 0) { b.shoot = 2.2 / lvl(); for (const a of [-0.25, 0, 0.25]) enemyShot(b.x - 70, b.y, -180 * Math.cos(a), 180 * Math.sin(a), '#ff6a5a', 'tor'); A.tone(260, 0.1, 'triangle', 0.03); }
    if ((b.mine -= dt) <= 0) { b.mine = 4; foes.push({ k: 'mine', ...FOES.mine, x: b.x - 30, y: b.y + 30, y0: b.y + 30, t: 0, shoot: 99, hit: 0, dead: false, anchor: 0, drift: true }); }
  } else if (b.k === 'angler') {
    b.open -= dt;
    if (b.lunge > 0) { b.lunge -= dt; b.x -= 280 * dt; b.y += (sub.y - b.y) * dt * 2; if (b.lunge <= 0) b.back = true; }
    else if (b.back) { b.x += 160 * dt; if (b.x >= b.tx) { b.back = false; b.x = b.tx; } }
    else { b.y += (sub.y - b.y) * dt * 0.8; b.y = A.clamp(b.y, 90, 310); if ((b.cool -= dt) <= 0) { b.cool = 5 / lvl(); b.lunge = 1.2; b.open = 2.2; A.tone(120, 0.6, 'sawtooth', 0.04, 0, 60); } if ((b.shoot -= dt) <= 0) { b.shoot = 2 / lvl(); aimShot(b.x - 60, b.y, 170, '#c8ff5a'); aimShot(b.x - 60, b.y - 10, 140, '#c8ff5a'); } }
    if (!sub.dead && Math.abs(sub.x - (b.x - 40)) < 50 && Math.abs(sub.y - b.y) < 40) hurt('SWALLOWED!');
  } else {
    for (const g of b.guns) { if (g.hp <= 0) continue; g.hit -= dt; if ((g.shoot -= dt) <= 0) { g.shoot = 1.8 / lvl() + Math.random(); aimShot(b.x - 40, g.y, 190); A.tone(500, 0.04, 'square', 0.02); } }
    if (b.guns.every(g => g.hp <= 0) && Math.random() < dt * 1.5) { for (let k = 0; k < 6; k++) { const a = Math.PI * (0.6 + k * 0.16); enemyShot(b.x - 20, 200, Math.cos(a) * 140, Math.sin(a) * 140, '#ff8a3d'); } }
  }
}

/* ---------- the game ---------- */
function newStage() {
  zone = ZONES[(stage - 1) % ZONES.length]; seed = stage * 3.7; drawBg();
  cam = 0; clock = 0; boss = null; shots = []; foes = []; items = []; pings = []; lights = []; missed = false;
  speed = 46 + Math.min(30, (stage - 1) * 4);
  sub = newSub(); sub.inv = 2;
  say(`STAGE ${stage} · ${zone.name}`, 2.4); A.jingle([392, 523, 659, 784], 0.08, 'triangle');
  if (stage === 4) A.badge('abyss');
}
function newGame() { stage = 1; score = 0; lives = A.easy ? 5 : 3; A.setScore(0); lost = false; sub = null; newStage(); state = 'play'; }
function stageClear() {
  const bonus = 3000 * stage; add(bonus); say(`STAGE CLEAR! +${bonus}`, 2.4); A.jingle([523, 659, 784, 1047, 1319], 0.09, 'triangle');
  if (!missed) A.badge('nomiss');
  state = 'between'; setTimeout(() => { if (state !== 'between') return; stage++; const t = sub.tor; newStage(); sub.tor = t; state = 'play'; }, 2600);
}
function gameOver() {
  if (lost) return; lost = true; state = 'over';
  const rec = A.submit(score);
  A.overlay({ title: 'GAME OVER', big: `SCORE ${score.toLocaleString()} · STAGE ${stage}`, sub: `${zone.name}${rec ? ' · New high score!' : ''}`, btn: 'Dive again', onGo: newGame });
}
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play' }); }
A.onHide(pause);
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();
  if (state !== 'play' || !sub || sub.dead) return;
  if (keys.C.includes(c)) charge();
  if (keys.P.includes(c)) ping();
});

function update(dt) {
  if (msgT > 0) msgT -= dt;
  if (state !== 'play') return;
  const s = sub;
  clock += dt; if (!boss) cam += speed * dt;
  if (clock > LEN && !boss) { boss = makeBoss(); say('BOSS!', 1.6); A.jingle([196, 185, 175, 165], 0.18, 'sawtooth'); }
  // the sub
  s.inv -= dt; s.cool -= dt; s.charge -= dt; s.ping -= dt; s.prop += dt;
  if (s.dead) { s.dead -= dt; if (s.dead <= 0 && lives > 0) { const t = s.tor; sub = newSub(); sub.tor = Math.max(1, t - 1); sub.inv = 2.5; } }
  else {
    const mx = (A.held(...keys.R) ? 1 : 0) - (A.held(...keys.L) ? 1 : 0), my = (A.held(...keys.D) ? 1 : 0) - (A.held(...keys.U) ? 1 : 0);
    s.vx += (mx * 260 - s.vx) * Math.min(1, dt * 6); s.vy += (my * 220 - s.vy) * Math.min(1, dt * 6);
    s.x = A.clamp(s.x + s.vx * dt, 30, W - 40); s.y = A.clamp(s.y + s.vy * dt, 40, H - 20);
    if (A.held(...keys.F) && s.cool <= 0) torpedo();
    s.air -= dt * (1.3 + stage * 0.08);
    if (s.air <= 0) { s.air = 0; hurt('OUT OF AIR!'); }
    if (Math.random() < dt * 3) bubbles.push({ x: s.x - 26, y: s.y, t: 1.5 });
    // the rocks
    const fy = floorY(cam + s.x), ry = roofY(cam + s.x);
    if (s.y + 12 > fy || (zone.cave && s.y - 12 < ry)) hurt('CRASHED INTO THE ROCKS');
    if (zone.surface && s.y < 44) s.y = 44;
  }
  // the navy shows up
  if (!boss) {
    const pool = POOL[(stage - 1) % POOL.length], rate = (stage === 1 ? 0.6 : 0.85) * lvl();
    if (Math.random() < dt * rate) addFoe(pool[Math.floor(Math.random() * pool.length)]);
    if (Math.random() < dt * 0.25) items.push({ k: 'bubble', x: W + 10, y: roofY(cam + W) + 40 + Math.random() * (floorY(cam + W) - roofY(cam + W) - 80), t: 20 });
  }
  for (const e of foes) {
    if (e.dead) continue; e.t += dt; e.hit -= dt;
    const dx = speed * dt;
    if (e.k === 'minisub') { e.x -= dx + 50 * dt; e.y = e.y0 + Math.sin(e.t) * 20; if ((e.shoot -= dt) <= 0) { e.shoot = 2.6 / lvl(); enemyShot(e.x - 16, e.y, -200, 0, '#ff6a5a', 'tor'); } }
    else if (e.k === 'mine') { e.x -= e.drift ? dx + 40 * dt : dx; e.y = e.y0 + Math.sin(e.t * 1.5) * 6; }
    else if (e.k === 'diver') { e.x -= dx + 30 * dt; e.y += Math.sin(e.t * 2) * 0.6; if ((e.shoot -= dt) <= 0 && e.x < W - 40) { e.shoot = 3 / lvl(); aimShot(e.x - 8, e.y, 160, '#c8c8d8'); } }
    else if (e.k === 'eel') { e.x -= dx + 110 * dt; e.y = e.y0 + Math.sin(e.t * 4) * 34; }
    else if (e.k === 'jelly') { e.x -= dx + 10 * dt; e.y = e.y0 + Math.sin(e.t * 0.9) * 50; }
    else if (e.k === 'ship') { e.x -= dx + 20 * dt; if ((e.shoot -= dt) <= 0 && e.x < W) { e.shoot = 2.4 / lvl(); shots.push({ k: 'drop', x: e.x, y: e.y + 16, vx: -speed, vy: 60, mine: false, t: 6, c: '#3a3a4a' }); } }
    else if (e.k === 'turret') { e.x -= dx; e.y = floorY(cam + e.x) - 8; if ((e.shoot -= dt) <= 0 && e.x < W - 20) { e.shoot = 2.2 / lvl(); aimShot(e.x, e.y - 12, 170); } }

    const threat = shots.find(b => !b.mine && soon(b.x, b.y, b.vx, b.vy)) || foes.find(e => !e.dead && e.k !== 'pod' && e.x > s.x && soon(e.x, e.y, -speed - (e.k === 'eel' ? 110 : 50), 0) && (e.k === 'mine' || e.k === 'jelly' || e.k === 'eel'));
    if (threat) ty = s.y + (threat.y > s.y ? -70 : 70);
    ty = A.clamp(ty, (zone.cave ? ry : 44) + 26, fy - 26); botY += (ty - botY) * 0.2;
    if (botY < s.y - 6) out.push('ArrowUp'); else if (botY > s.y + 6) out.push('ArrowDown');
    const tx = boss ? 150 : 130; if (s.x < tx - 10) out.push('ArrowRight'); else if (s.x > tx + 10) out.push('ArrowLeft');
    out.push('Space');
    if (foes.some(e => !e.dead && e.y > s.y + 20 && Math.abs(e.x - s.x - 30) < 40)) out.push('!KeyK');
    if (zone.dark > 0.4 && s.ping <= 0) out.push('!KeyC');
    return out;
  }
});
zone = ZONES[0]; seed = 1; drawBg();
A.overlay({ title: 'DEPTH CHARGE', sub: 'Steer the Minnow through the deep. Torpedoes forward, depth charges below, and a sonar ping to light up the dark. Watch your air, and grab the bubbles.', btn: 'Dive', scores: true, onGo: newGame });
})();
