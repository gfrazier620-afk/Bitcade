<!doctype html>

<link rel="preload" href="../../shared/fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="../../shared/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin>

<body data-game="dungeon-delve" style="--game:#5ad870">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>DUNGEON DELVE</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>

  <div class="pad">
    <div class="dp"><button class="u" data-k="ArrowUp" aria-label="Up">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button><button class="d" data-k="ArrowDown" aria-label="Down">▼</button></div>

  </div>
  <p class="help"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or WASD walk · <kbd>Space</kbd> or <kbd>J</kbd> swing the sword · <kbd>P</kbd> pause · gamepad: A swings</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script src="../../shared/story.js"></script>
<script>
(() => {
/*
 * Dungeon Delve: Pip-Pip the young knight goes down through dungeon floors. Each floor is a 4×4 maze of rooms;
 * walking into a room full of monsters seals its doors until they're beaten. Find the chest with the big key, open
 * the skull door and beat the guardian to reach the stairs down. Hearts, gems, slimes, bats, skeletons and fire imps;
 * every fifth floor the guardian is Morrowgast the lich. Story mode (shared/story.js): The Five Depths, five fixed
 * floors with upgrades bought with gems, then HARD and a five-guardian Boss Rush.
 */
const A = Arcade, cv = document.getElementById('cv');
const T = 32, RC = 15, RR = 11, HUD = 34, W = RC * T, H = RR * T + HUD, ctx = A.canvas(cv, W, H), OUT = '#0a0612', G = 4;
function shade(hex, k) {

  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function paint(x, list) {
  x.fillStyle = OUT; for (const q of list) x.fillRect(q[0] - 1.5, q[1] - 1.5, q[2] + 3, q[3] + 3);
  for (const [px, py, w, h, c] of list) { x.fillStyle = c; x.fillRect(px, py, w, h); if (w > 3 && h > 3) { x.fillStyle = shade(c, 0.3); x.fillRect(px, py, w, 1.5); x.fillStyle = shade(c, -0.3); x.fillRect(px, py + h - 1.5, w, 1.5); } }
}
const THEMES = [{ floor: '#4a4058', wall: '#2a2238', moss: '#3a6a3a' }, { floor: '#4a3a30', wall: '#2a1e18', moss: '#7a5a2a' }, { floor: '#30404a', wall: '#182630', moss: '#3a7a8a' },
  { floor: '#4a2c26', wall: '#2a1410', moss: '#a8481a' }, { floor: '#2c2644', wall: '#150f26', moss: '#7a3ac8' }];
const theme = () => THEMES[(floorN - 1) % THEMES.length];

/* ---------- a floor: a maze of 4×4 rooms (a spanning tree plus a couple of loops), the boss far from the start ---------- */
let floorN = 1, rooms = [], cur = null, rnd = Math.random;
function makeFloor() {
  rnd = A.seeded('dungeon-delve:' + (S && S.run ? 'story:' : '') + floorN);
  rooms = []; for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) rooms.push({ i, j, doors: { n: 0, s: 0, e: 0, w: 0 }, seen: false, clear: false, foes: [], items: [], tiles: null, kind: 'room' });
  const at = (i, j) => rooms[j * G + i], start = at(Math.floor(rnd() * G), G - 1), stack = [start], seen = new Set([start]);
  const D = { n: [0, -1, 's'], s: [0, 1, 'n'], e: [1, 0, 'w'], w: [-1, 0, 'e'] };
  while (stack.length) {
    const r = stack[stack.length - 1], opts = Object.entries(D).map(([d, [di, dj, back]]) => [d, at(r.i + di, r.j + dj), back]).filter(([, n]) => n && !seen.has(n));
    if (!opts.length) { stack.pop(); continue; }
    const [d, n, back] = opts[Math.floor(rnd() * opts.length)]; r.doors[d] = 1; n.doors[back] = 1; seen.add(n); stack.push(n);
  }
  for (let k = 0; k < 2; k++) { const r = rooms[Math.floor(rnd() * rooms.length)], d = Object.keys(D)[Math.floor(rnd() * 4)], [di, dj, back] = D[d], n = at(r.i + di, r.j + dj); if (n) { r.doors[d] = 1; n.doors[back] = 1; } }
  // the farthest room is the guardian's; the big key goes in the farthest dead end from both
  const dist = from => { const m = new Map([[from, 0]]), q = [from]; while (q.length) { const r = q.shift(); for (const [d, [di, dj]] of Object.entries(D)) if (r.doors[d]) { const n = at(r.i + di, r.j + dj); if (!m.has(n)) { m.set(n, m.get(r) + 1); q.push(n); } } } return m; };
  const d0 = dist(start); const boss = [...d0.entries()].sort((a, b) => b[1] - a[1])[0][0]; boss.kind = 'boss';
  const dB = dist(boss), keyRoom = rooms.filter(r => r !== start && r !== boss).sort((a, b) => (d0.get(b) + dB.get(b) * 0.5) - (d0.get(a) + dB.get(a) * 0.5))[0]; keyRoom.kind = 'key';
  start.kind = 'start';
  // lock the doors into the guardian's room
  for (const [d, [di, dj, back]] of Object.entries(D)) if (boss.doors[d]) { at(boss.i + di, boss.j + dj).doors[back] = 2; boss.doors[d] = 2; }

}
/** A room's tiles: walls round the edge with doorways, and some blocks or pillars inside. */
function layout(r) {
  const t = Array.from({ length: RR }, (_, y) => Array.from({ length: RC }, (_, x) => (x === 0 || y === 0 || x === RC - 1 || y === RR - 1) ? 1 : 0));
  const mx = (RC - 1) / 2, my = (RR - 1) / 2;
  if (r.doors.n) t[0][mx] = t[0][mx - 1] = t[0][mx + 1] = 0; if (r.doors.s) t[RR - 1][mx] = t[RR - 1][mx - 1] = t[RR - 1][mx + 1] = 0;
  if (r.doors.w) t[my][0] = t[my - 1][0] = t[my + 1][0] = 0; if (r.doors.e) t[my][RC - 1] = t[my - 1][RC - 1] = t[my + 1][RC - 1] = 0;
  if (r.kind === 'start' || r.kind === 'boss') return t;
  const k = Math.floor(rnd() * 5);
  if (k === 0) for (const [x, y] of [[3, 3], [11, 3], [3, 7], [11, 7]]) t[y][x] = 2;
  if (k === 1) for (let x = 4; x <= 10; x++) if (x !== 7) { t[3][x] = 2; t[7][x] = 2; }
  if (k === 2) for (const [x, y] of [[4, 4], [5, 4], [4, 5], [10, 4], [9, 4], [10, 5], [4, 6], [10, 6], [5, 6], [9, 6]]) t[y][x] = 2;
  if (k === 3) for (let y = 3; y <= 7; y += 2) for (let x = 3; x <= 11; x += 4) t[y][x] = 2;
  return t;
}
const solid = (r, x, y) => { const tx = Math.floor(x / T), ty = Math.floor(y / T); if (tx < 0 || ty < 0 || tx >= RC || ty >= RR) return false; return r.tiles[ty][tx] > 0; };
const doorShut = (r, x, y) => { if (!r.sealed) { // the guardian's doors stay locked without the big key
    const tx = Math.floor(x / T), ty = Math.floor(y / T), mx = (RC - 1) / 2, my = (RR - 1) / 2;
    const which = ty <= 0 ? 'n' : ty >= RR - 1 ? 's' : tx <= 0 ? 'w' : tx >= RC - 1 ? 'e' : null;
    return which && r.doors[which] === 2 && !bigKey; }
  const tx = Math.floor(x / T), ty = Math.floor(y / T); return tx <= 0 || ty <= 0 || tx >= RC - 1 || ty >= RR - 1; };
function populate(r) {
  if (r.populated) return; r.populated = true;
  const lv = floorN - 1;
  if (r.kind === 'start') return;
  if (r.kind === 'boss') { r.foes.push(foe(rush ? RUSH[rushI][0] : floorN % 5 === 0 ? 'lich' : 'king', 7.5 * T, 4 * T)); return; }
  const n = 2 + Math.floor(rnd() * 3) + Math.min(3, lv);
  for (let i = 0; i < n; i++) {
    let x, y, k = 0; do { x = (2 + rnd() * (RC - 4)) * T; y = (2 + rnd() * (RR - 4)) * T; } while ((solid(r, x, y) || Math.hypot(x - me.x, y - me.y) < 120) && k++ < 30);
    const roll = rnd(), kind = lv >= 3 && roll < 0.18 ? 'imp' : lv >= 1 && roll < 0.38 ? 'skel' : roll < 0.66 ? 'slime' : 'bat';
    r.foes.push(foe(kind, x, y));
  }
  if (r.kind === 'key') r.items.push({ kind: 'chest', x: 7.5 * T, y: 5.5 * T, open: false });
}
function foe(kind, x, y) {
  const lv = floorN - 1, hp = Math.round({ slime: 2, bat: 1, skel: 4, imp: 2, king: 18 + lv * 6, lich: 30 + lv * 4 }[kind] * (hardK > 1 ? 1.5 : 1));
  return { kind, x, y, hp, max: hp, vx: 0, vy: 0, t: rnd() * 3, hit: 0, kb: 0, dead: 0, r: kind === 'king' ? 28 : kind === 'lich' ? 16 : 11, jump: 0, fire: 1 + rnd() * 2, tp: 2.5, vis: 1 };
}

/* ---------- the hero ---------- */
const me = { x: 0, y: 0, face: 'up', walk: 0, hp: 6, max: 6, swing: 0, inv: 0, kbx: 0, kby: 0 };
let state = 'title', score = 0, gems = 0, bigKey = false, trans = null, pops = [], stairs = null, msg = '', msgT = 0, demoT = 0, shots = [];
// story runs: hardK speeds monsters up (and gives them more health); rush is the Boss Rush, five guardians in a row
let S = null, hardK = 1, rush = false, rushI = 0, rushT = 0, rushNext = 0;
const RUSH = [['king', 1], ['king', 3], ['lich', 3], ['king', 5], ['lich', 6]];
const up = id => S ? S.lv(id) : 0;
const say = (t, s = 2) => { msg = t; msgT = s; };
function enter(r, fromSide) {
  cur = r; r.seen = true; populate(r);
  const live = r.foes.some(f => !f.dead);
  r.sealed = live && r.kind !== 'start';
  if (r.sealed) { A.tone(160, 0.25, 'square', 0.04, 0, 90); say(r.kind === 'boss' ? 'THE GUARDIAN!' : 'THE DOORS SLAM SHUT!', 1.4); }
}
function newFloor() {
  const start = makeFloor(); bigKey = false; stairs = null; shots = [];
  me.x = 7.5 * T; me.y = 8 * T; me.face = 'up'; enter(start); A.jingle([392, 494, 587, 784], 0.1);
  if (S.run && S.run.mode === 'story') { S.reach(floorN - 1); say(`DEPTH ${floorN} · ${S.stageName(floorN - 1).toUpperCase()}`, 2.6); } else say(`FLOOR ${floorN}`, 2);
  if (floorN >= 3) A.badge('floor3');
}
function reset() { score = 0; gems = 0; me.max = me.hp = (A.easy ? 10 : 6) + up('heart') * 2; me.inv = 0; me.kbx = me.kby = 0; A.setScore(0); state = 'play'; }
function newGame() { S.run = null; hardK = 1; rush = false; floorN = 1; reset(); newFloor(); }
/** A story run (from shared/story.js): a depth of The Five Depths, or the Boss Rush. */
function storyGame(run) {
  hardK = run.hard ? 1.25 : 1; rush = run.mode === 'rush'; reset();
  if (rush) { rushI = 0; rushT = 0; rushRoom(); return; }
  floorN = run.stage + 1; newFloor();
}
function rushRoom() {
  floorN = RUSH[rushI][1]; bigKey = false; stairs = null; shots = [];
  const r = { i: 1, j: 1, doors: { n: 0, s: 0, e: 0, w: 0 }, seen: true, clear: false, foes: [], items: [], kind: 'boss' }; r.tiles = layout(r); rooms = [r];
  me.x = 7.5 * T; me.y = 8.5 * T; me.face = 'up'; enter(r); say(`GUARDIAN ${rushI + 1} OF ${RUSH.length}`, 2);
}
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play', alt: S.quit() }); }
A.onPress(c => { if (c === 'KeyP' || c === 'Escape') return pause(); if ((c === 'Space' || c === 'KeyJ' || c === 'KeyZ') && state === 'play' && me.swing <= 0 && !trans) { me.swing = 0.22; A.tone(700, 0.06, 'triangle', 0.03, 0, 300); } });
A.onHide(pause);
const add = (n, x, y, c = '#ffd23d') => { score += n; A.setScore(score); if (x !== undefined) A.pop(x, y, '+' + n, c); };
const FACE = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function swordBox() { const [dx, dy] = FACE[me.face], l = up('reach'); return { x: me.x + dx * (22 + l * 4), y: me.y + dy * (22 + l * 4), r: 20 + l * 6 }; }
function hurtMe(n, fx, fy) {
  if (me.inv > 0) return; me.hp -= n; me.inv = 1; const d = Math.hypot(me.x - fx, me.y - fy) || 1; me.kbx = (me.x - fx) / d * 260; me.kby = (me.y - fy) / d * 260;
  A.shake(5, 0.2); A.sfx('hurt'); A.flash('#ff4f6d', 0.15);
  if (me.hp <= 0) { me.hp = 0; state = 'over'; setTimeout(gameOver, 900); }
}
function gameOver() {
  if (S.run && rush) return S.modeEnd(0, { title: 'FALLEN', big: `GUARDIAN ${rushI + 1} OF ${RUSH.length}` });
  if (S.run) return S.fail({ title: 'FALLEN', big: `DEPTH ${floorN} · ${S.stageName(floorN - 1).toUpperCase()}`, sub: `${gems} GEMS FOUND THIS RUN` });
  const rec = A.submit(score); A.overlay({ title: 'FALLEN', big: `SCORE ${score.toLocaleString()} · FLOOR ${floorN}`, sub: `${gems} GEMS${rec ? ' · New high score!' : ''}`, btn: 'Delve again', onGo: newGame }); }
function move(o, dx, dy, rad) {
  const inDoor = (x, y) => [[-rad, -rad], [rad, -rad], [-rad, rad], [rad, rad]].some(([ox, oy]) => doorShut(cur, x + ox, y + oy));
  const stuck = o === me && inDoor(o.x, o.y);
  const ok = (x, y) => ![[-rad, -rad], [rad, -rad], [-rad, rad], [rad, rad]].some(([ox, oy]) => solid(cur, x + ox, y + oy)) && !(o === me && !stuck && inDoor(x, y));
  if (ok(o.x + dx, o.y)) o.x += dx; if (ok(o.x, o.y + dy)) o.y += dy;
}
function update(dt) {
  if (msgT > 0) msgT -= dt;
  for (const p of pops) p.t -= dt; pops = pops.filter(p => p.t > 0);
  if (state !== 'play') return;
  if (rush) { rushT += dt; if (rushNext > 0 && (rushNext -= dt) <= 0) { rushI++; if (rushI >= RUSH.length) { state = 'over'; A.jingle([523, 659, 784, 1047, 1319, 1568], 0.1, 'square'); return S.modeEnd(rushT * 1000, { title: 'BOSS RUSH CLEAR!', big: `${(rushT).toFixed(2)} SECONDS` }); } me.hp = Math.min(me.max, me.hp + 2); rushRoom(); } }
  if (trans) { trans.t += dt * 2.6; if (trans.t >= 1) { const [di, dj] = trans.d; me.x = trans.nx; me.y = trans.ny; enter(rooms[(cur.j + dj) * G + cur.i + di]); trans = null; } return; }
  // walking
  let dx = (A.held('ArrowRight', 'KeyD') ? 1 : 0) - (A.held('ArrowLeft', 'KeyA') ? 1 : 0), dy = (A.held('ArrowDown', 'KeyS') ? 1 : 0) - (A.held('ArrowUp', 'KeyW') ? 1 : 0);
  if (dx || dy) { if (me.swing <= 0) me.face = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); const l = Math.hypot(dx, dy); dx /= l; dy /= l; me.walk += dt * 10; }

  if (off) { trans = { d: off, t: 0, nx: off[0] ? (off[0] > 0 ? T + 16 : W - T - 16) : me.x, ny: off[1] ? (off[1] > 0 ? T + 16 : RR * T - T - 16) : me.y }; return; }

      f.hp -= 1 + up('blade'); f.hit = 0.25; const d = Math.hypot(f.x - me.x, f.y - me.y) || 1; if (f.kind !== 'king' && f.kind !== 'lich') { f.vx = (f.x - me.x) / d * 240; f.vy = (f.y - me.y) / d * 240; f.kb = 0.15; }
      A.tone(300, 0.06, 'square', 0.04); A.burst(f.x, f.y, { n: 6, color: '#fff', speed: 120, life: 0.25 }); A.hitstop(0.04);

    if (f.dead) continue; const dt = fdt; f.t += dt; if (f.hit > 0) f.hit -= dt;
    if (f.kb > 0) { f.kb -= dt; move(f, f.vx * dt, f.vy * dt, f.r * 0.8); continue; }
    const tx = me.x - f.x, ty = me.y - f.y, d = Math.hypot(tx, ty) || 1;
    if (f.kind === 'slime') { const hop = (f.t % 1.2) < 0.5; if (hop) move(f, tx / d * (55 + lv * 8) * dt, ty / d * (55 + lv * 8) * dt, 9); }
    if (f.kind === 'bat') { f.vx += (Math.cos(f.t * 2.3) * 120 + tx / d * 40) * dt; f.vy += (Math.sin(f.t * 1.9) * 120 + ty / d * 40) * dt; f.vx *= 0.98; f.vy *= 0.98; f.x = Math.max(T * 1.2, Math.min(W - T * 1.2, f.x + f.vx * dt)); f.y = Math.max(T * 1.2, Math.min(RR * T - T * 1.2, f.y + f.vy * dt)); }
    if (f.kind === 'skel') move(f, tx / d * (60 + lv * 6) * dt, ty / d * (60 + lv * 6) * dt, 10);
    if (f.kind === 'imp') { // keeps its distance and spits fire
      const want = d > 150 ? 1 : d < 100 ? -1 : 0; f.vx += (tx / d * want * 140 + Math.cos(f.t * 2.6) * 90) * dt; f.vy += (ty / d * want * 140 + Math.sin(f.t * 2.1) * 90) * dt; f.vx *= 0.94; f.vy *= 0.94;
      move(f, f.vx * dt, f.vy * dt, 9);
      if ((f.fire -= dt) <= 0) { f.fire = 2.2 - lv * 0.08; shoot(f.x, f.y, Math.atan2(ty, tx), 150, 'fire'); A.tone(260, 0.1, 'sawtooth', 0.025, 0, 120); }
    }
    if (f.kind === 'lich') { // Morrowgast: fades out, reappears somewhere else, throws rings of bolts and raises skeletons
      f.tp -= dt;
      if (f.tp <= 0 && f.vis > 0) f.vis = Math.max(0, f.vis - dt * 3);
      if (f.vis === 0) {
        let x, y, k = 0; do { x = (2.5 + Math.random() * (RC - 5)) * T; y = (2.5 + Math.random() * (RR - 5)) * T; } while ((solid(cur, x, y) || Math.hypot(x - me.x, y - me.y) < 150) && k++ < 40);
        f.x = x; f.y = y; f.vis = 0.01; f.tp = Math.max(2, 3.4 - lv * 0.12); A.tone(900, 0.2, 'sine', 0.03, 0, 200);
        if (f.hp < f.max * 0.5 && cur.foes.filter(o => !o.dead).length < 5) { cur.foes.push(foe('skel', f.x - 40, f.y + 20)); A.burst(f.x - 40, f.y + 20, { n: 14, color: '#b86bff', speed: 90, life: 0.5, kind: 'smoke' }); }
      }
      if (f.vis > 0 && f.vis < 1) f.vis = Math.min(1, f.vis + dt * 2.5);
      if (f.vis >= 1 && (f.fire -= dt) <= 0) {
        f.fire = 1.5; const n = f.hp < f.max * 0.5 ? 12 : 8, a0 = f.t;
        if (Math.floor(f.t) % 2) for (let i = 0; i < n; i++) shoot(f.x, f.y - 10, a0 + i / n * 6.283, 105, 'bolt');
        else for (const o of [-0.25, 0, 0.25]) shoot(f.x, f.y - 10, Math.atan2(ty, tx) + o, 165, 'bolt');
        A.tone(520, 0.14, 'square', 0.03, 0, 260); A.ring(f.x, f.y - 10, '#b86bff', 30);
      }
    }
    if (f.kind === 'king') {
      f.jumpT = (f.jumpT || 2) - dt;

function stepToward(tx, ty) {
