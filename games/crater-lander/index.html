<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crater Lander</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body data-game="crater-lander" data-pad="1:ArrowUp 7:ArrowUp" style="--game:#9fb4ff">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>CRATER LANDER</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="ab"><button data-k="ArrowLeft" aria-label="Rotate left">⟲</button><button data-k="ArrowRight" aria-label="Rotate right">⟳</button></div>
    <div class="ab"><button data-k="ArrowUp">THRUST</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>→</kbd> tilt · <kbd>↑</kbd> or <kbd>Space</kbd> thrust · <kbd>P</kbd> pause</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const W = 640, H = 480, ctx = A.canvas(cv, W, H);
const SAFE_VY = 45, SAFE_VX = 30, SAFE_A = 0.26; // landing limits: px/s and radians
let state = 'title', ship, ground = [], pads = [], parts = [], stars, score, lives, level, fuel, tank, phaseT = 0, msg = '', msgT = 0, burnT = 0;
stars = Array.from({ length: 80 }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.7, s: Math.random() < 0.15 ? 2 : 1 }));
const gravity = () => 26 * (1 + (level - 1) * 0.08);

/* terrain: a rough ridge line with flat pads; narrower pads pay more */
function makeTerrain() {
  pads = [];
  const specs = level >= 4 ? [[46, 3], [32, 5]] : [[72, 2], [46, 3], [32, 5]];
  for (const [w, m] of specs) for (let tries = 0; tries < 60; tries++) {
    const x0 = A.rand(24, W - 24 - w);
    if (pads.every(p => x0 > p.x1 + 40 || x0 + w < p.x0 - 40)) { pads.push({ x0, x1: x0 + w, m, y: A.rand(H * 0.55, H - 40) }); break; }
  }
  const pts = []; let y = A.rand(H * 0.6, H - 50);
  for (let x = 0; x <= W; x += 16) { y = A.clamp(y + A.rand(-30, 30), H * 0.42, H - 22); pts.push({ x, y }); }
  ground = pts.filter(p => pads.every(pd => p.x < pd.x0 - 6 || p.x > pd.x1 + 6));
  pads.forEach(p => ground.push({ x: p.x0, y: p.y }, { x: p.x1, y: p.y }));
  ground.sort((a, b) => a.x - b.x);
}
function groundY(x) {
  for (let i = 1; i < ground.length; i++) {
    const a = ground[i - 1], b = ground[i];
    if (x <= b.x) return a.y + (b.y - a.y) * (x - a.x) / ((b.x - a.x) || 1);
  }
  return ground[ground.length - 1].y;
}
level = 1; makeTerrain(); // scenery for the title screen
function newGame() { score = 0; lives = A.easy ? 5 : 3; level = 1; A.setScore(0); parts = []; startLevel(true); }
function startLevel(fresh) {
  if (fresh) makeTerrain();
  tank = Math.max(50, 100 - (level - 1) * 6); fuel = tank;
  ship = { x: A.rand(90, W - 90), y: 50, vx: A.rand(-40, 40), vy: 0, a: 0, thrust: false };
  state = 'play'; say(fresh ? `LEVEL ${level}` : 'TRY AGAIN');
}
function say(t) { msg = t; msgT = 1.6; }
function pause() { if (state !== 'play') return; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = 'play' }); }
A.onPress(c => { if (c === 'KeyP' || c === 'Escape') pause(); });
A.onHide(pause);

function boom(x, y, n, c) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = A.rand(30, 200); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: A.rand(0.5, 1.4), c }); } }
const feet = () => [-1, 1].map(s => ({ x: ship.x + Math.cos(ship.a) * s * 9 - Math.sin(ship.a) * 11, y: ship.y + Math.sin(ship.a) * s * 9 + Math.cos(ship.a) * 11 }));
function touchdown() {
  const f = feet(), pad = pads.find(p => f.every(q => q.x >= p.x0 && q.x <= p.x1));
  const soft = Math.abs(ship.vy) <= SAFE_VY && Math.abs(ship.vx) <= SAFE_VX && Math.abs(ship.a) <= SAFE_A;
  if (pad && soft) {
    const gentle = Math.abs(ship.vy) < 20, pts = pad.m * 100 + Math.round(fuel) * 3 + (gentle ? 100 : 0);
    score += pts; A.setScore(score); ship.y = pad.y - 11; ship.a = 0; ship.vx = ship.vy = 0; ship.thrust = false;
    A.badge('land'); if (gentle) A.badge('feather'); if (pad.m === 5) A.badge('x5');
    state = 'landed'; phaseT = 2.4; say(`${gentle ? 'FEATHER TOUCH' : 'LANDED'} ×${pad.m} +${pts}`);
    A.burst(ship.x, pad.y, { n: 18, kind: 'smoke', color: '#b8b0d0', speed: 90, life: 0.9, size: 7 }); A.ring(ship.x, pad.y, '#ffd23d', 50); A.shake(2, 0.15);
    A.jingle([523, 659, 784, 1047], 0.09);
  } else {
    lives--; state = 'crashed'; phaseT = 2; boom(ship.x, ship.y, 50, '#ffb03d'); boom(ship.x, ship.y, 20, '#9fb4ff');
    A.burst(ship.x, ship.y, { n: 14, kind: 'debris', colors: ['#e0b040', '#c0c6d0', '#5a5e70'], speed: 220, angle: -Math.PI / 2, spread: 2.4, life: 1.2 });
    A.burst(ship.x, ship.y, { n: 8, kind: 'smoke', color: '#6a6078', speed: 50, life: 1.6, size: 10 }); A.ring(ship.x, ship.y, '#ffb03d', 70);
    A.flash('#ffb03d', 0.25); A.shake(12, 0.5); A.hitstop(0.1);
    A.noise(0.9, 0.12); A.tone(160, 0.6, 'sawtooth', 0.05, 0, 40);
    say(!pad ? 'MISSED THE PAD' : Math.abs(ship.a) > SAFE_A ? 'TOO TILTED' : 'TOO FAST');
  }
}
function gameOver() {
  state = 'over'; const rec = A.submit(score);
  A.overlay({ title: 'MISSION OVER', big: `SCORE ${score} · LEVEL ${level}`, sub: rec ? 'New high score!' : `Best: ${A.best()}`, btn: 'Fly again', onGo: newGame });
}

A.loop(dt => {
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.t -= dt; }); parts = parts.filter(p => p.t > 0);
  if (msgT > 0) msgT -= dt;
  if (state === 'landed') { phaseT -= dt; if (phaseT <= 0) { level++; startLevel(true); } return; }
  if (state === 'crashed') { phaseT -= dt; if (phaseT <= 0) { if (lives <= 0) return gameOver(); startLevel(false); } return; }
  if (state !== 'play') return;
  const rot = (A.held('ArrowRight', 'KeyD') ? 1 : 0) - (A.held('ArrowLeft', 'KeyA') ? 1 : 0);
  ship.a = A.clamp(ship.a + rot * 2.6 * dt, -Math.PI / 2, Math.PI / 2);
  ship.thrust = fuel > 0 && A.held('ArrowUp', 'KeyW', 'Space');
  if (ship.thrust) {
    ship.vx += Math.sin(ship.a) * 75 * dt; ship.vy -= Math.cos(ship.a) * 75 * dt; fuel = Math.max(0, fuel - 10 * dt);
    if (Math.random() < 0.7) parts.push({ x: ship.x - Math.sin(ship.a) * 14, y: ship.y + Math.cos(ship.a) * 14, vx: -Math.sin(ship.a + A.rand(-0.3, 0.3)) * 120, vy: Math.cos(ship.a + A.rand(-0.3, 0.3)) * 120, t: 0.3, c: '#ffb03d' });
    burnT -= dt; if (burnT <= 0) { burnT = 0.08; A.noise(0.09, 0.025); const gy = groundY(ship.x); if (gy - ship.y < 70 && Math.abs(ship.a) < 0.6) A.burst(ship.x, gy, { n: 2, kind: 'smoke', color: '#b8b0d0', speed: 120, angle: Math.random() < 0.5 ? Math.PI : 0, spread: 0.6, life: 0.6, size: 5 }); }
  }
  ship.vy += gravity() * dt; ship.x += ship.vx * dt; ship.y += ship.vy * dt;
  if (ship.x < 12 || ship.x > W - 12) { ship.x = A.clamp(ship.x, 12, W - 12); ship.vx = 0; }
  if (ship.y < 14) { ship.y = 14; ship.vy = Math.max(0, ship.vy); }
  if (feet().some(f => f.y >= groundY(f.x)) || ship.y + 4 >= groundY(ship.x)) touchdown();
  if (fuel <= 0 && msgT <= 0 && state === 'play') say('OUT OF FUEL');
}, t => {
  ctx.drawImage(sky, 0, 0);
  stars.forEach(s => { ctx.globalAlpha = 0.45 + Math.sin(t / 400 + s.x) * 0.2; ctx.fillStyle = '#dce4ff'; ctx.fillRect(s.x, s.y, s.s, s.s); }); ctx.globalAlpha = 1;
  drawTerrain();
  pads.forEach(p => drawPad(p, t));
  parts.forEach(p => { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }); ctx.globalAlpha = 1;
  const s = ship || { x: W / 2 + Math.sin(t / 1400) * 160, y: 150 + Math.sin(t / 900) * 20, a: Math.sin(t / 1400) * 0.3, thrust: Math.floor(t / 400) % 3 === 0 };
  if (state !== 'crashed' && state !== 'over') drawShip(s, t);
  if (ship) drawHUD(t);
  if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT * 2); ctx.font = '24px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#0a0612'; ctx.fillText(msg, W / 2 + 2, 152); ctx.shadowColor = '#9fb4ff'; ctx.shadowBlur = 14; ctx.fillStyle = '#c8d4ff'; ctx.fillText(msg, W / 2, 150); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
});

/* ---------- art ---------- */
/** Lighten (k > 0) or darken (k < 0) a #rgb / #rrggbb colour. */
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
// the sky, drawn once: black space, a blue planet rising with cloud bands, and a far mountain range
const sky = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#02020a'); g.addColorStop(1, '#0e0c22'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  const px = 540, py = 80, pr = 34;
  const halo = x.createRadialGradient(px, py, pr, px, py, pr * 2); halo.addColorStop(0, 'rgba(120,180,255,.25)'); halo.addColorStop(1, 'rgba(120,180,255,0)'); x.fillStyle = halo; x.fillRect(px - pr * 2, py - pr * 2, pr * 4, pr * 4);
  const pg = x.createRadialGradient(px - 12, py - 12, 4, px, py, pr); pg.addColorStop(0, '#9adcff'); pg.addColorStop(0.5, '#2a7acc'); pg.addColorStop(1, '#0a2a5a');
  x.fillStyle = pg; x.beginPath(); x.arc(px, py, pr, 0, 6.29); x.fill();
  x.save(); x.beginPath(); x.arc(px, py, pr, 0, 6.29); x.clip();
  x.fillStyle = 'rgba(80,190,110,.75)'; [[-14, -6, 12, 7], [8, 8, 10, 6], [-4, 16, 8, 4]].forEach(([dx, dy, w, h]) => { x.beginPath(); x.ellipse(px + dx, py + dy, w, h, 0.4, 0, 6.29); x.fill(); });
  x.fillStyle = 'rgba(255,255,255,.6)'; [[-18, -16, 10, 2.5, 0.2], [6, -20, 8, 2, -0.1], [-6, 2, 12, 2.5, 0.15], [12, 18, 9, 2, -0.2], [-20, 14, 6, 2, 0.1]].forEach(([dx, dy, w, h, r]) => { x.beginPath(); x.ellipse(px + dx, py + dy, w, h, r, 0, 6.29); x.fill(); });
  x.fillStyle = 'rgba(0,0,10,.55)'; x.beginPath(); x.arc(px + 18, py + 12, pr, 0, 6.29); x.fill(); // night side
  x.restore();
  x.fillStyle = '#100e24'; x.beginPath(); x.moveTo(0, H); for (let i = 0; i <= W; i += 10) x.lineTo(i, H - 150 - Math.abs(Math.sin(i * 0.012 + 1)) * 60 - Math.sin(i * 0.05) * 10); x.lineTo(W, H); x.fill();
  return c;
})();
/** The terrain: rock shaded from a lit rim down into shadow, with darker strata following the surface. */
function drawTerrain() {
  const path = (dy) => { ctx.beginPath(); ctx.moveTo(0, H); ground.forEach(p => ctx.lineTo(p.x, p.y + dy)); ctx.lineTo(W, H); ctx.closePath(); };
  const g = ctx.createLinearGradient(0, H * 0.45, 0, H); g.addColorStop(0, '#3a3858'); g.addColorStop(1, '#14122a');
  path(0); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; for (const dy of [10, 22, 38]) { path(dy); ctx.stroke(); }
  ctx.beginPath(); ground.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.strokeStyle = '#0a0612'; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = '#b8c4ff'; ctx.lineWidth = 2; ctx.stroke();
}
/** A landing pad: an outlined metal deck on legs, hazard stripes, blinking beacons and its multiplier sign. */
function drawPad(p, t) {
  const w = p.x1 - p.x0, lit = Math.floor(t / 300) % 2;
  ctx.fillStyle = '#0a0612'; ctx.fillRect(p.x0 + 4, p.y, 4, 16); ctx.fillRect(p.x1 - 8, p.y, 4, 16);
  ctx.fillStyle = '#6a6e80'; ctx.fillRect(p.x0 + 5, p.y + 2, 2, 14); ctx.fillRect(p.x1 - 7, p.y + 2, 2, 14);
  ctx.fillStyle = '#0a0612'; ctx.fillRect(p.x0 - 1, p.y - 3, w + 2, 7);
  const g = ctx.createLinearGradient(0, p.y - 2, 0, p.y + 3); g.addColorStop(0, '#e8ecf4'); g.addColorStop(1, '#6a6e80'); ctx.fillStyle = g; ctx.fillRect(p.x0, p.y - 2, w, 5);
  ctx.fillStyle = '#ffd23d'; for (let i = p.x0 + 2; i < p.x1 - 4; i += 10) ctx.fillRect(i, p.y - 2, 4, 2);
  for (const bx of [p.x0, p.x1]) { ctx.fillStyle = lit ? '#ff4f6d' : '#5a1a2a'; ctx.shadowColor = '#ff4f6d'; ctx.shadowBlur = lit ? 8 : 0; ctx.fillRect(bx - 2, p.y - 6, 3, 3); ctx.shadowBlur = 0; }
  ctx.font = '12px Silkscreen, monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#0a0612'; ctx.fillText('×' + p.m, (p.x0 + p.x1) / 2 + 1, p.y + 19); ctx.fillStyle = lit ? '#ffd23d' : '#ffe98a'; ctx.fillText('×' + p.m, (p.x0 + p.x1) / 2, p.y + 18);
}
/** The lander: an outlined gold-foil descent stage, a silver cabin with a lit window, legs with footpads, and a flame. */
function drawShip(s, t) {
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a);
  if (s.thrust) { const f = 10 + Math.random() * 10, g = ctx.createLinearGradient(0, 7, 0, 8 + f); g.addColorStop(0, '#fff6c2'); g.addColorStop(0.4, '#ffb03d'); g.addColorStop(1, 'rgba(255,79,109,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-5, 7); ctx.lineTo(0, 8 + f); ctx.lineTo(5, 7); ctx.fill(); }
  // legs
  ctx.strokeStyle = '#0a0612'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-6, 4); ctx.lineTo(-10, 11); ctx.moveTo(6, 4); ctx.lineTo(10, 11); ctx.stroke();
  ctx.strokeStyle = '#c0c6d0'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#0a0612'; ctx.fillRect(-14, 10, 8, 3); ctx.fillRect(6, 10, 8, 3); ctx.fillStyle = '#c0c6d0'; ctx.fillRect(-13, 10, 6, 2); ctx.fillRect(7, 10, 6, 2);
  // descent stage: gold foil
  ctx.fillStyle = '#0a0612'; ctx.fillRect(-10, -2, 20, 10);
  const gg = ctx.createLinearGradient(0, -1, 0, 7); gg.addColorStop(0, '#ffe08a'); gg.addColorStop(0.5, '#d8a030'); gg.addColorStop(1, '#8a5a10');
  ctx.fillStyle = gg; ctx.fillRect(-9, -1, 18, 8); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-7, 1, 3, 4); ctx.fillRect(2, 2, 2, 3);
  // ascent cabin
  ctx.fillStyle = '#0a0612'; ctx.beginPath(); ctx.arc(0, -4, 8.5, Math.PI, 0); ctx.lineTo(8.5, -1); ctx.lineTo(-8.5, -1); ctx.fill();
  const cg = ctx.createLinearGradient(0, -12, 0, -1); cg.addColorStop(0, '#ffffff'); cg.addColorStop(1, '#8a90a8');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, -4, 7, Math.PI, 0); ctx.lineTo(7, -2); ctx.lineTo(-7, -2); ctx.fill();
  ctx.fillStyle = '#0a1a2a'; ctx.fillRect(-3, -8, 6, 4); ctx.fillStyle = '#9fb4ff'; ctx.fillRect(-2, -7, 4, 2);
  ctx.fillStyle = Math.floor(t / 400) % 2 ? '#ff4f6d' : '#3dff8f'; ctx.fillRect(-1, -13, 2, 2);
  ctx.restore();
}
function drawHUD(t) {
  ctx.font = '12px Silkscreen, monospace'; ctx.textAlign = 'left';
  const row = (label, val, ok, y) => { ctx.fillStyle = '#a39bc4'; ctx.fillText(label, 12, y); ctx.fillStyle = ok ? '#3dff8f' : '#ff4f6d'; ctx.fillText(val, 86, y); };
  ctx.fillStyle = '#a39bc4'; ctx.fillText('FUEL', 12, 22);
  ctx.fillStyle = '#2a2148'; ctx.fillRect(86, 13, 100, 10);
  ctx.fillStyle = fuel < tank * 0.2 ? (Math.floor(t / 200) % 2 ? '#ff4f6d' : '#7a2020') : '#9fb4ff'; ctx.fillRect(86, 13, 100 * fuel / 100, 10);
  ctx.strokeStyle = 'rgba(159,180,255,.4)'; ctx.lineWidth = 1; ctx.strokeRect(86.5, 13.5, tank, 9);
  row('ALT', String(Math.max(0, Math.round((groundY(ship.x) - ship.y - 11) / 2))), true, 40);
  row('H-SPD', String(Math.round(ship.vx / 2)), Math.abs(ship.vx) <= SAFE_VX, 56);
  row('V-SPD', String(Math.round(ship.vy / 2)), ship.vy <= SAFE_VY, 72);
  row('TILT', Math.round(ship.a * 57.3) + '°', Math.abs(ship.a) <= SAFE_A, 88);
  ctx.textAlign = 'right'; ctx.fillStyle = '#f4effd'; ctx.fillText('LEVEL ' + level, W - 12, 22);
  for (let i = 0; i < lives; i++) { ctx.strokeStyle = '#9fb4ff'; ctx.beginPath(); ctx.arc(W - 20 - i * 20, 40, 5, Math.PI, 0); ctx.lineTo(W - 14 - i * 20, 46); ctx.lineTo(W - 26 - i * 20, 46); ctx.closePath(); ctx.stroke(); }
}
/* Attract demo: drift over the nearest pad clear of the hills, then come straight down, gently. */
A.attract({
  start: newGame,
  stop: () => { state = 'title'; },
  bot: () => {
    if (state !== 'play' || !ship || !pads.length) return [];
    const pad = pads.reduce((a, p) => Math.abs((p.x0 + p.x1) / 2 - ship.x) < Math.abs((a.x0 + a.x1) / 2 - ship.x) ? p : a);
    const dx = (pad.x0 + pad.x1) / 2 - ship.x, over = Math.abs(dx) < (pad.x1 - pad.x0) / 2 - 8;
    const h = (over ? pad.y : Math.min(...[-40, 0, 40, ship.vx].map(o => groundY(A.clamp(ship.x + o, 0, W - 1))))) - ship.y;
    const vxT = over ? 0 : A.clamp(dx * 0.35, -55, 55);
    const aT = over && h < 50 ? 0 : A.clamp((vxT - ship.vx) * 0.025, -0.6, 0.6);
    const vyT = over ? A.clamp(h * 0.3, 14, 48) : h < 110 ? -25 : 30;
    const keys = [];
    if (ship.a < aT - 0.04) keys.push('ArrowRight'); else if (ship.a > aT + 0.04) keys.push('ArrowLeft');
    if (ship.vy > vyT) keys.push('ArrowUp');
    return keys;
  }
});
A.overlay({ title: 'CRATER LANDER', sub: 'Touch down on a lit pad. Keep the HUD green: slow, upright, and level. Narrow pads pay more, and leftover fuel adds a bonus.', btn: 'Start', scores: true, onGo: newGame });
})();
</script>
</body>
</html>
