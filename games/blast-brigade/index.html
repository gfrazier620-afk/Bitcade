<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blast Brigade</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0f0c1f">
<link rel="icon" type="image/png" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preload" href="../../shared/fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="../../shared/fonts/silkscreen-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../../shared/fonts.css">

</head>
<body data-game="blast-brigade" data-pad="0:Space 2:KeyX 1:KeyC 3:KeyC" style="--game:#ff8a3d">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>BLAST BRIGADE</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <div class="pad">
    <div class="dp"><button class="u" data-k="ArrowUp" aria-label="Aim up">▲</button><button class="l" data-k="ArrowLeft" aria-label="Left">◀</button><button class="r" data-k="ArrowRight" aria-label="Right">▶</button><button class="d" data-k="ArrowDown" aria-label="Crouch">▼</button></div>
    <div class="ab"><button class="sm" data-k="KeyC">BOMB</button><button data-k="Space">JUMP</button><button data-k="KeyX">FIRE</button></div>
  </div>
  <p class="help"><kbd>←</kbd><kbd>→</kbd> run · <kbd>↑</kbd> aim up · <kbd>↓</kbd> crouch · <kbd>Space</kbd> or <kbd>Z</kbd> jump · <kbd>X</kbd> or <kbd>J</kbd> fire (hold) · <kbd>C</kbd> or <kbd>K</kbd> grenade · <kbd>P</kbd> pause</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script src="../../shared/story.js"></script>
<script>
(() => {
/*
 * Blast Brigade: run and gun to the right through five fronts (desert, jungle, ruined city, arctic, the iron fortress),
 * each ending in a heavy tank, and the fortress in the Iron Colossus, a walking gun platform. Shoot the troopers,
 * jetpack troopers, turrets and gunships, free the tied-up hostages (each one drops a new weapon: H heavy gun,
 * S spread, R rockets) and lob grenades. One hit costs a life. Stages repeat harder after the fifth.
 * Story mode (shared/story.js): Operation Iron Dawn, the five fronts with upgrades bought with medals, then HARD and Survival.
 */
const A = Arcade, cv = document.getElementById('cv');
const W = 480, H = 270, GY = 226, ctx = A.canvas(cv, W, H), OUT = '#0a0612';
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
/** Boxes [x, y, w, h, colour]: an outline pass, then fills lit from above. */
function paint(x, list) {
  x.fillStyle = OUT; for (const q of list) x.fillRect(q[0] - 1, q[1] - 1, q[2] + 2, q[3] + 2);
  for (const [px, py, w, h, c] of list) { x.fillStyle = c; x.fillRect(px, py, w, h); if (w > 2 && h > 2) { x.fillStyle = shade(c, 0.3); x.fillRect(px, py, w, 1); x.fillStyle = shade(c, -0.3); x.fillRect(px, py + h - 1, w, 1); } }
}
const sprite = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };
const WEAPONS = { P: { name: 'PISTOL', rate: 0.2, ammo: Infinity, col: '#fff6c2' }, H: { name: 'HEAVY GUN', rate: 0.075, ammo: 160, col: '#ffd23d' }, S: { name: 'SPREAD', rate: 0.22, ammo: 50, col: '#ff4fd1' }, R: { name: 'ROCKETS', rate: 0.42, ammo: 24, col: '#ff8a3d' } };

/* ---------- three fronts: sky, a far layer and a near layer, drawn once each ---------- */
const FRONTS = [
  { name: 'DESERT FRONT', sky: ['#f0a050', '#ffe0a0'], far: '#c8805a', near: '#a86a3a', ground: '#d8a868', dirt: '#a87a48', kind: 'desert' },
  { name: 'JUNGLE FRONT', sky: ['#5aa0a0', '#d0f0c0'], far: '#3a7a5a', near: '#2a5a3a', ground: '#5a8a3a', dirt: '#4a3a24', kind: 'jungle' },
  { name: 'CITY FRONT', sky: ['#3a2a4a', '#c87a6a'], far: '#4a3a50', near: '#2a2234', ground: '#6a6a72', dirt: '#3a3a42', kind: 'city' },
  { name: 'ARCTIC FRONT', sky: ['#7aa0cc', '#e8f4ff'], far: '#a8bcd8', near: '#dde8f4', ground: '#eef4fa', dirt: '#b8c8da', kind: 'arctic' },
  { name: 'IRON FORTRESS', sky: ['#1a0a18', '#9a3428'], far: '#2a1a26', near: '#3a2c38', ground: '#55555f', dirt: '#2a2a32', kind: 'fortress' }
];
FRONTS.forEach((f, fi) => {
  let s = 7 + fi * 13; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  f.sky_ = sprite(W, H, x => { const g = x.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, f.sky[0]); g.addColorStop(1, f.sky[1]); x.fillStyle = g; x.fillRect(0, 0, W, H);
    if (f.kind === 'desert') { const sg = x.createRadialGradient(370, 60, 6, 370, 60, 70); sg.addColorStop(0, 'rgba(255,255,230,1)'); sg.addColorStop(0.25, 'rgba(255,240,180,.8)'); sg.addColorStop(1, 'rgba(255,220,150,0)'); x.fillStyle = sg; x.fillRect(290, -20, 160, 160); }
    if (f.kind === 'city') for (let i = 0; i < 6; i++) { x.fillStyle = 'rgba(40,20,30,.35)'; x.beginPath(); x.ellipse(r() * W, 40 + r() * 80, 60, 14, 0, 0, 6.29); x.fill(); } });
  f.farL = sprite(W * 2, H, x => {
    x.fillStyle = f.far;
    if (f.kind === 'fortress') { for (let bx = 0; bx < W * 2;) { const bw = 30 + r() * 40, bh = 60 + r() * 80; x.fillStyle = f.far; x.fillRect(bx, GY - 40 - bh, bw, bh + 40); for (let k = 0; k < bw; k += 8) x.fillRect(bx + k, GY - 46 - bh, 5, 6); x.fillStyle = 'rgba(255,90,40,.55)'; if (r() < 0.7) x.fillRect(bx + bw / 2 - 2, GY - 20 - bh, 4, 7); bx += bw + 20 + r() * 30; } }
    else if (f.kind === 'city') { for (let bx = 0; bx < W * 2;) { const bw = 20 + r() * 40, bh = 50 + r() * 90; x.fillRect(bx, GY - 40 - bh, bw, bh + 40); if (r() < 0.5) { x.fillStyle = shade(f.far, -0.2); x.beginPath(); x.moveTo(bx + bw * 0.3, GY - 40 - bh); x.lineTo(bx + bw * 0.6, GY - 50 - bh); x.lineTo(bx + bw, GY - 40 - bh); x.fill(); x.fillStyle = f.far; } bx += bw + 4; } }
    else { x.beginPath(); x.moveTo(0, H); for (let i = 0; i <= W * 2; i += 8) x.lineTo(i, GY - 60 - Math.abs(Math.sin(i * 0.008 + fi)) * 60 - Math.sin(i * 0.03) * 6); x.lineTo(W * 2, H); x.fill();
      if (f.kind === 'arctic') { x.fillStyle = '#ffffff'; for (let i = 0; i <= W * 2; i += 4) { const y = GY - 60 - Math.abs(Math.sin(i * 0.008 + fi)) * 60 - Math.sin(i * 0.03) * 6; if (y < GY - 95) x.fillRect(i, y, 4, (GY - 95 - y) * 0.6 + 3); } } }
  });
  f.nearL = sprite(W * 2, H, x => {
    x.fillStyle = f.near;
    if (f.kind === 'desert') { x.beginPath(); x.moveTo(0, H); for (let i = 0; i <= W * 2; i += 8) x.lineTo(i, GY - 14 - Math.abs(Math.sin(i * 0.012)) * 24); x.lineTo(W * 2, H); x.fill(); for (let i = 0; i < 6; i++) { const cx = r() * W * 2; x.fillStyle = '#3a6a3a'; x.fillRect(cx, GY - 46, 6, 34); x.fillRect(cx - 7, GY - 38, 7, 4); x.fillRect(cx - 7, GY - 44, 3, 8); x.fillRect(cx + 6, GY - 34, 6, 4); x.fillRect(cx + 9, GY - 42, 3, 10); } }
    if (f.kind === 'jungle') for (let i = 0; i < 16; i++) { const tx = r() * W * 2, th = 60 + r() * 60; x.fillStyle = '#3a2a1a'; x.fillRect(tx, GY - th, 6, th); for (const [c, k] of [['#1f4a2a', 1], ['#2f6a3a', 0.7]]) { x.fillStyle = c; for (let k2 = 0; k2 < 5; k2++) { x.beginPath(); x.ellipse(tx + 3 + Math.cos(k2 * 1.3) * 18 * k, GY - th + Math.sin(k2 * 1.3) * 6, 22 * k, 8 * k, k2 * 0.6, 0, 6.29); x.fill(); } } }
    if (f.kind === 'arctic') { x.beginPath(); x.moveTo(0, H); for (let i = 0; i <= W * 2; i += 8) x.lineTo(i, GY - 10 - Math.abs(Math.sin(i * 0.01)) * 18); x.lineTo(W * 2, H); x.fill();
      for (let i = 0; i < 14; i++) { const tx = r() * W * 2, th = 40 + r() * 40; x.fillStyle = '#4a3a2a'; x.fillRect(tx - 2, GY - 14, 4, 12); for (let k = 0; k < 3; k++) { const y = GY - 12 - k * th / 3.4, wdt = (3 - k) * th / 7; x.fillStyle = '#1f4a3a'; x.beginPath(); x.moveTo(tx, y - th / 3); x.lineTo(tx + wdt, y); x.lineTo(tx - wdt, y); x.fill(); x.fillStyle = '#ffffff'; x.beginPath(); x.moveTo(tx, y - th / 3); x.lineTo(tx + wdt * 0.4, y - th / 5); x.lineTo(tx - wdt * 0.4, y - th / 5); x.fill(); } } }
    if (f.kind === 'fortress') for (let bx = 0; bx < W * 2;) { const bw = 70 + r() * 60, bh = 40 + r() * 40; x.fillStyle = f.near; x.fillRect(bx, GY - bh, bw, bh); for (let k = 0; k < bw; k += 12) x.fillRect(bx + k, GY - bh - 7, 7, 7); x.fillStyle = 'rgba(0,0,0,.3)'; for (let wy = GY - bh + 10; wy < GY; wy += 10) x.fillRect(bx, wy, bw, 1); x.fillStyle = '#ff5a3d'; x.fillRect(bx + bw / 2 - 2, GY - bh + 8, 4, 4); bx += bw + 30 + r() * 40; }
    if (f.kind === 'city') for (let bx = 0; bx < W * 2;) { const bw = 40 + r() * 50, bh = 30 + r() * 60; x.fillStyle = f.near; x.fillRect(bx, GY - bh, bw, bh); x.fillStyle = '#1a1420'; for (let wy = GY - bh + 6; wy < GY - 8; wy += 12) for (let wx = bx + 5; wx < bx + bw - 6; wx += 10) x.fillRect(wx, wy, 5, 6); x.fillStyle = 'rgba(255,140,60,.6)'; if (r() < 0.6) x.fillRect(bx + 5 + Math.floor(r() * 3) * 10, GY - bh + 6, 5, 6); x.fillStyle = f.near; x.beginPath(); x.moveTo(bx + bw - 12, GY - bh); x.lineTo(bx + bw, GY - bh + 14); x.lineTo(bx + bw, GY - bh); x.fill(); bx += bw + 14 + r() * 20; }
  });
  f.groundT = sprite(64, H - GY, x => { x.fillStyle = f.ground; x.fillRect(0, 0, 64, H - GY); x.fillStyle = shade(f.ground, 0.2); x.fillRect(0, 0, 64, 3); x.fillStyle = OUT; x.fillRect(0, 0, 64, 1); x.fillStyle = f.dirt; for (let i = 0; i < 20; i++) x.fillRect(r() * 64, 6 + r() * (H - GY - 6), 3, 2); if (f.kind === 'jungle') { x.fillStyle = '#3a7a2a'; for (let i = 0; i < 8; i++) x.fillRect(r() * 64, 0, 2, 4); } if (f.kind === 'city') { x.fillStyle = 'rgba(255,255,255,.25)'; x.fillRect(10, 18, 20, 2); } if (f.kind === 'fortress') { x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(31, 0, 1, H - GY); x.fillStyle = '#8a8ea0'; [[4, 8], [58, 8], [4, 30], [58, 30]].forEach(([a, b]) => x.fillRect(a, b, 2, 2)); } });
});

/* ---------- people: the hero (red bandana, blue vest) and the troopers (olive, round helmets) ---------- */
function soldier(x, px, py, o) {
  const { face = 1, run = 0, crouch = false, up = false, enemy = false, dead = 0, hit = 0 } = o;
  const skin = '#f0c090', top = enemy ? '#6a7a3a' : '#3d6aff', legs = enemy ? '#4a5a2a' : '#4a3a2a';
  x.save(); x.translate(Math.round(px), Math.round(py)); x.scale(face, 1);
  if (dead) { x.rotate(-Math.min(1.4, dead * 4)); x.globalAlpha = Math.max(0, 1 - Math.max(0, dead - 0.5) * 2); }
  const step = Math.sin(run), h = crouch ? 6 : 0;
  // legs
  if (crouch) paint(x, [[-6, -8, 6, 8, legs], [0, -6, 7, 6, shade(legs, -0.1)]]);
  else paint(x, [[-5 + step * 3, -11, 4, 11, legs], [1 - step * 3, -11, 4, 11, shade(legs, -0.12)]]);
  x.fillStyle = OUT; x.fillRect(-6 + (crouch ? 0 : step * 3), -2, 6, 3); x.fillRect(1 - (crouch ? -1 : step * 3), -2, 6, 3);
  // body, head, helmet or bandana
  paint(x, [[-5, -22 + h, 10, 12, top], [-4, -31 + h, 9, 9, skin]]);
  if (!enemy) { paint(x, [[-3, -20 + h, 6, 8, '#2a4ad8']]); x.fillStyle = '#c8203a'; x.fillRect(-5, -31 + h, 11, 3); x.fillRect(-8, -30 + h + Math.sin(run * 2) * 1, 4, 2); }
  else { paint(x, [[-6, -34 + h, 12, 5, '#5a6a2a']]); x.fillStyle = shade('#5a6a2a', -0.3); x.fillRect(-6, -30 + h, 12, 1); }
  x.fillStyle = OUT; x.fillRect(2, -28 + h, 2, 2);
  // arm and gun: forward, or straight up
  if (up) { paint(x, [[0, -40 + h, 4, 18, '#3a3a48'], [-1, -24 + h, 5, 6, skin]]); }
  else { paint(x, [[1, -21 + h, 13, 4, '#3a3a48'], [0, -19 + h, 5, 4, skin]]); x.fillStyle = '#8a8ea0'; x.fillRect(4, -21 + h, 8, 1); }
  if (hit > 0) { x.globalCompositeOperation = 'lighter'; x.fillStyle = `rgba(255,255,255,${hit * 4})`; x.fillRect(-7, -36 + h, 22, 36 - h); x.globalCompositeOperation = 'source-over'; }
  x.restore();
}
function hostage(x, px, py, freed, t) {
  x.save(); x.translate(Math.round(px), Math.round(py));
  if (!freed) { // tied to a post, bearded, waving for help
    paint(x, [[-1, -34, 3, 34, '#7a5a3a'], [-6, -22, 12, 12, '#d8c8a0'], [-5, -31, 10, 9, '#f0c090'], [-5, -11, 10, 11, '#8a7a5a']]);
    x.fillStyle = '#8a5a2a'; x.fillRect(-5, -26, 10, 4); x.fillStyle = '#5a3a1a'; x.fillRect(-6, -18, 12, 2); x.fillRect(-6, -14, 12, 2);
    x.fillStyle = OUT; x.fillRect(-2, -28, 1, 1); x.fillRect(2, -28, 1, 1);
    x.font = '8px Bungee, sans-serif'; x.textAlign = 'center'; x.fillStyle = '#ffd23d'; x.fillText('HELP!', 0, -40 + Math.sin(t / 200) * 2);
  } else { // saluting
    paint(x, [[-5, -11, 4, 11, '#8a7a5a'], [1, -11, 4, 11, '#8a7a5a'], [-6, -22, 12, 12, '#d8c8a0'], [-5, -31, 10, 9, '#f0c090'], [3, -32, 3, 10, '#d8c8a0']]);
    x.fillStyle = '#8a5a2a'; x.fillRect(-5, -26, 10, 4); x.fillStyle = OUT; x.fillRect(1, -29, 1, 1);
  }
  x.restore();
}
function drawTurret(x, e, t) {
  const X = Math.round(e.x), Y = GY;
  paint(x, [[X - 18, Y - 12, 36, 12, '#c8b080'], [X - 14, Y - 18, 28, 7, '#b8a070']]);
  x.fillStyle = 'rgba(0,0,0,.2)'; for (let i = 0; i < 4; i++) x.fillRect(X - 16 + i * 9, Y - 12, 1, 12);
  x.save(); x.translate(X, Y - 22); x.rotate(e.aim || Math.PI);
  paint(x, [[0, -3, 20, 6, '#4a4e5a']]); x.restore();
  paint(x, [[X - 8, Y - 28, 16, 10, e.hit > 0 ? '#ffffff' : '#5a6a3a']]);
}
function drawHeli(x, e, t) {
  const X = Math.round(e.x), Y = Math.round(e.y), blade = Math.sin(t / 30) * 34;
  x.fillStyle = OUT; x.fillRect(X - 36, Y - 18, 72, 3); x.fillStyle = 'rgba(200,200,210,.7)'; x.fillRect(X - Math.abs(blade), Y - 17, Math.abs(blade) * 2, 1);
  paint(x, [[X - 22, Y - 12, 36, 18, e.hit > 0 ? '#ffffff' : '#5a6a3a'], [X + 12, Y - 8, 30, 6, '#4a5a2a'], [X + 38, Y - 14, 4, 14, '#4a5a2a'], [X - 2, Y - 16, 4, 4, '#3a3a48']]);
  x.fillStyle = '#5ee7ff'; x.fillRect(X - 20, Y - 9, 10, 7); x.fillStyle = 'rgba(255,255,255,.5)'; x.fillRect(X - 19, Y - 8, 3, 2);
  x.fillStyle = OUT; x.fillRect(X - 18, Y + 6, 28, 2); x.fillRect(X - 14, Y + 3, 2, 4); x.fillRect(X + 4, Y + 3, 2, 4);
  x.fillStyle = '#ffd23d'; x.fillRect(X - 6, Y - 4, 8, 2);
}
/** The Iron Colossus: a walking gun platform with missile pods, the last guard of the fortress. */
function drawColossus(x, e, t) {
  const X = Math.round(e.x), hurt = e.hit > 0, body = hurt ? '#ffffff' : e.hp < e.max / 2 ? '#7a5a4a' : '#5a6a78', step = e.walk || 0, lift = e.stomp > 0 ? Math.sin(Math.min(1, e.stomp) * Math.PI) * 14 : 0;
  // legs: two thick legs with knees, lifting in turn
  for (const [k, ph] of [[-1, 0], [1, Math.PI]]) {
    const lx = X + k * 26 + Math.sin(step + ph) * 8, up = Math.max(0, Math.sin(step + ph)) * 6 + (k < 0 ? lift : 0);
    paint(x, [[lx - 8, GY - 58 - up, 16, 30, shade(body, -0.15)], [lx - 10, GY - 30 - up, 20, 26, shade(body, -0.05)], [lx - 14, GY - 6 - up, 28, 6, '#3a3a48']]);
    x.fillStyle = OUT; x.beginPath(); x.arc(lx, GY - 30 - up, 6, 0, 6.29); x.fill(); x.fillStyle = '#8a8ea0'; x.beginPath(); x.arc(lx, GY - 30 - up, 4, 0, 6.29); x.fill();
  }
  const by = GY - 112 - lift * 0.5 + Math.abs(Math.sin(step)) * 3;
  paint(x, [[X - 48, by, 96, 50, body], [X - 40, by + 48, 80, 10, shade(body, -0.25)], [X - 56, by - 14, 30, 22, shade(body, 0.1)], [X + 26, by - 14, 30, 22, shade(body, 0.1)]]);
  x.fillStyle = 'rgba(0,0,0,.25)'; for (let i = 0; i < 5; i++) x.fillRect(X - 42 + i * 20, by + 6, 2, 38);
  for (const px of [X - 52, X + 30]) for (let i = 0; i < 3; i++) { x.fillStyle = OUT; x.fillRect(px + i * 8, by - 12, 6, 6); x.fillStyle = e.pods > 0 ? '#ff5a3d' : '#2a2a32'; x.fillRect(px + 1 + i * 8, by - 11, 4, 4); }
  // the eye, glowing, and the cannon arm
  const eg = x.createRadialGradient(X - 10, by + 20, 1, X - 10, by + 20, 16); eg.addColorStop(0, '#ffe0a0'); eg.addColorStop(0.4, '#ff3a22'); eg.addColorStop(1, 'rgba(255,58,34,0)'); x.fillStyle = eg; x.fillRect(X - 26, by + 4, 32, 32);
  paint(x, [[X - 18, by + 16, 18, 8, '#ff3a22']]);
  x.save(); x.translate(X - 40, by + 34); x.rotate(e.gun || 0); paint(x, [[-50, -6, 54, 12, '#3a3a48'], [-56, -8, 8, 16, '#2a2a32']]); x.restore();
  x.fillStyle = '#ffd23d'; x.font = '11px Bungee, sans-serif'; x.textAlign = 'center'; x.fillText('★', X + 20, by + 34);
  if (e.hp < e.max / 2) for (let i = 0; i < 3; i++) { const k = ((t / 600 + i / 3) % 1); x.fillStyle = `rgba(60,50,50,${0.5 * (1 - k)})`; x.beginPath(); x.arc(X + 30 + i * 6, by - 18 - k * 34, 5 + k * 9, 0, 6.29); x.fill(); }
}
function drawJet(x, e, t) {
  const X = Math.round(e.x), Y = Math.round(e.y);
  const fl = 6 + Math.sin(t / 30) * 3; x.fillStyle = '#ff8a3d'; x.beginPath(); x.moveTo(X - 9, Y - 12); x.lineTo(X - 6, Y - 12 + fl + 6); x.lineTo(X - 3, Y - 12); x.fill(); x.fillStyle = '#ffe14d'; x.fillRect(X - 7, Y - 12, 2, fl);
  paint(x, [[X - 11, Y - 26, 7, 14, '#4a4e5a']]);
  soldier(x, X, Y, { face: e.face, run: 0, enemy: true, dead: e.dead, hit: e.hit });
}
function drawTank(x, e, t) {
  const X = Math.round(e.x), Y = GY, hurt = e.hit > 0, body = hurt ? '#ffffff' : e.hp < e.max / 2 ? '#7a6a3a' : '#6a7a3a';
  // treads, rolling
  paint(x, [[X - 52, Y - 18, 104, 18, '#2a2a32']]);
  for (let i = 0; i < 7; i++) { x.fillStyle = OUT; x.beginPath(); x.arc(X - 42 + i * 14, Y - 8, 6, 0, 6.29); x.fill(); x.fillStyle = '#5a5e70'; x.beginPath(); x.arc(X - 42 + i * 14, Y - 8, 4.5, 0, 6.29); x.fill(); x.fillStyle = OUT; const a = t / 100 * (e.vx || 0) / 30 + i; x.fillRect(X - 42 + i * 14 + Math.cos(a) * 3 - 1, Y - 8 + Math.sin(a) * 3 - 1, 2, 2); }
  paint(x, [[X - 48, Y - 34, 96, 18, body], [X - 26, Y - 52, 44, 20, shade(body, 0.08)]]);

      { const a = Math.atan2(me.y - 20 - (GY - 78), me.x - (f.x - 40)); f.gun = Math.max(-0.7, Math.min(0.5, a > 0 ? a - Math.PI : a + Math.PI)); } // the barrel points left
      if (!enter) {
        if ((f.fireT -= dt) <= 0) { f.fireT = mad ? 1.2 : 1.9; bad.push({ x: f.x - 40 - Math.cos(f.gun) * 54, y: GY - 78 - Math.sin(f.gun) * 54, vx: -Math.cos(f.gun) * 210, vy: -Math.sin(f.gun) * 210, big: true }); A.tone(110, 0.2, 'sawtooth', 0.05, 0, 60); }
        if ((f.podT -= dt) <= 0) { f.podT = mad ? 3.2 : 4.6; f.pods = 1; for (let i = 0; i < (mad ? 5 : 3); i++) setTimeout(() => { if (!f.dead && state === 'play') { nades.push({ x: me.x + A.rand(-60, 60), y: -10, vx: 0, vy: 80, mine: false, t: 0, missile: true }); A.tone(900, 0.1, 'square', 0.02, 0, 300); } }, 300 + i * 260); setTimeout(() => { f.pods = 0; }, 1200); }
        if ((f.stompT -= dt) <= 0 && !f.stomp) { f.stompT = mad ? 2.6 : 3.8; f.stomp = 0.001; }
      }
      if (!me.dead && me.inv <= 0 && Math.abs(me.x - f.x) < 55 && me.y > GY - 120) die();
    } else if (f.kind === 'tank') {
      const enter = f.x > cam + W - 70; f.x += (enter ? -60 : f.vx) * dt; if (!enter && (f.x < cam + W * 0.55 || f.x > cam + W - 60)) f.vx = -f.vx;
      f.gun = Math.max(-0.6, Math.min(0.25, Math.atan2(me.y - 20 - (f.y - 44), (f.x - 26) - me.x) * -1 * 0.5));
      f.fireT -= dt; if (f.fireT <= 0 && !enter) { f.fireT = f.hp < f.max / 2 ? 1.4 : 2.2; nades.push({ x: f.x - 70, y: f.y - 48, vx: -A.rand(140, 260), vy: -A.rand(160, 260), mine: false, t: 0 }); A.tone(90, 0.3, 'sawtooth', 0.06, 0, 50); A.shake(3, 0.2); }
      f.mgT -= dt; if (f.mgT <= 0 && !enter) { f.mgT = 3; for (let i = 0; i < 5; i++) setTimeout(() => { if (!f.dead) bad.push({ x: f.x - 30, y: f.y - 26, vx: -200, vy: 0 }); }, i * 120); }
      if (!me.dead && me.inv <= 0 && Math.abs(me.x - f.x) < 50 && me.y > f.y - 50) die();
    }
  }
  foes = foes.filter(f => !(f.dead > 1) && f.x > cam - 80);
  // the colossus's shockwaves roll along the ground: jump them
  for (const wv of waves) { wv.x += wv.dir * 230 * dt; if (!me.dead && me.inv <= 0 && me.ground && Math.abs(wv.x - me.x) < 9) die(); }
  waves = waves.filter(wv => wv.x > cam - 30 && wv.x < cam + W + 30);
  for (const b of bad) { b.x += b.vx * dt; b.y += b.vy * dt; if (!me.dead && me.inv <= 0 && Math.abs(b.x - me.x) < (b.big ? 11 : 7) && b.y > me.y - (me.crouch ? 16 : 32) && b.y < me.y) { b.dead = true; die(); } if (b.x < cam - 20 || b.x > cam + W + 20 || b.y > H || b.y < -20) b.dead = true; }
  bad = bad.filter(b => !b.dead);
  crates = crates.filter(c => c.hp > 0 && c.x > cam - 40); plats = plats.filter(p => p.x + p.w > cam - 40);
}

/* ---------- drawing ---------- */
function render(t) {
  const f = front();
  ctx.drawImage(f.sky_, 0, 0);

  ctx.drawImage(f.farL, fo, 0, W, H, 0, 0, W, H); if (fo > W) ctx.drawImage(f.farL, 0, 0);
  ctx.drawImage(f.nearL, no, 0, W, H, 0, 0, W, H);
  const go = cam % 64; for (let x = -go; x < W; x += 64) ctx.drawImage(f.groundT, x, GY);
  ctx.save(); ctx.translate(-Math.round(cam), 0);
  for (const p of plats) { paint(ctx, [[p.x, p.y, p.w, 8, f.kind === 'city' ? '#8a8ea0' : '#c8b080']]); ctx.fillStyle = 'rgba(0,0,0,.25)'; for (let i = p.x + 4; i < p.x + p.w; i += 12) ctx.fillRect(i, p.y + 1, 1, 7); ctx.fillStyle = OUT; ctx.fillRect(p.x + 6, p.y + 8, 3, GY - p.y - 8); ctx.fillRect(p.x + p.w - 9, p.y + 8, 3, GY - p.y - 8); }
  for (const c of crates) { paint(ctx, [[c.x, c.y, 22, 22, '#b8803a']]); ctx.strokeStyle = '#6a4a20'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(c.x + 2, c.y + 2); ctx.lineTo(c.x + 20, c.y + 20); ctx.moveTo(c.x + 20, c.y + 2); ctx.lineTo(c.x + 2, c.y + 20); ctx.stroke(); }
  for (const h of hostages) if (!h.freed || h.t < 3) hostage(ctx, h.freed ? h.x + h.t * 60 : h.x, GY, h.freed, t);
  for (const d of drops) { paint(ctx, [[d.x - 9, d.y - 9, 18, 18, d.g === 'B' ? '#5a6a3a' : '#c8203a']]); ctx.fillStyle = '#fff'; ctx.font = '10px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(d.g === 'B' ? '●' : d.g, d.x, d.y + 1); }
  for (const e of foes) {
    if (e.kind === 'grunt') soldier(ctx, e.x, e.y, { face: e.face, run: e.run, enemy: true, dead: e.dead, hit: e.hit });
    else if (e.kind === 'jet') { if (!(e.dead > 0.6)) drawJet(ctx, e, t); }
    else if (!e.dead) (e.kind === 'turret' ? drawTurret : e.kind === 'heli' ? drawHeli : e.kind === 'colossus' ? drawColossus : drawTank)(ctx, e, t);
  }
  if (state !== 'title' && !(me.inv > 0 && !me.dead && Math.floor(t / 80) % 2)) soldier(ctx, me.x, me.y, { face: me.face, run: me.run, crouch: me.crouch, up: me.up && !me.crouch, dead: me.dead });
  for (const s of shots) { if (s.kind === 'R') { paint(ctx, [[s.x - 5, s.y - 2, 10, 4, '#c0c6d0']]); ctx.fillStyle = '#ff8a3d'; ctx.fillRect(s.x - (s.vx > 0 ? 9 : -5), s.y - 1, 4, 2); } else { ctx.fillStyle = WEAPONS[s.kind].col; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 6; ctx.fillRect(s.x - 3, s.y - 1, Math.abs(s.vy) > Math.abs(s.vx) ? 2 : 7, Math.abs(s.vy) > Math.abs(s.vx) ? 7 : 2); ctx.shadowBlur = 0; } }
  for (const b of bad) { if (b.big) { ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, 6.29); ctx.fill(); ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, 6.29); ctx.fill(); ctx.fillStyle = '#ffe14d'; ctx.fillRect(b.x - 2, b.y - 2, 2, 2); continue; } ctx.fillStyle = '#ff4f6d'; ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, 6.29); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(b.x - 1, b.y - 1, 1, 1); }
  for (const wv of waves) { const g = ctx.createLinearGradient(0, GY - 16, 0, GY); g.addColorStop(0, 'rgba(255,210,61,0)'); g.addColorStop(1, 'rgba(255,140,60,.9)'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(wv.x - 12, GY); ctx.quadraticCurveTo(wv.x, GY - 22, wv.x + 12, GY); ctx.fill(); ctx.fillStyle = '#fff6c2'; ctx.fillRect(wv.x - 2, GY - 9, 4, 3); }
  for (const n of nades) { if (n.missile) { ctx.fillStyle = 'rgba(255,79,109,.35)'; ctx.fillRect(n.x - 1, n.y, 2, GY - n.y); paint(ctx, [[n.x - 2, n.y - 8, 4, 10, '#c0c6d0']]); ctx.fillStyle = '#ff8a3d'; ctx.fillRect(n.x - 1, n.y - 13, 2, 5); continue; } ctx.fillStyle = OUT; ctx.beginPath(); ctx.arc(n.x, n.y, 4, 0, 6.29); ctx.fill(); ctx.fillStyle = n.mine ? '#5a6a3a' : '#3a3a48'; ctx.beginPath(); ctx.arc(n.x, n.y, 3, 0, 6.29); ctx.fill(); if (Math.floor(t / 80) % 2) { ctx.fillStyle = '#ff4f6d'; ctx.fillRect(n.x - 1, n.y - 5, 2, 2); } }
  for (const b of booms) { const k = b.t / 0.4, r = b.r * (0.4 + k * 0.8); const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r); g.addColorStop(0, `rgba(255,255,220,${1 - k})`); g.addColorStop(0.4, `rgba(255,210,61,${1 - k})`); g.addColorStop(1, 'rgba(255,90,40,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 6.29); ctx.fill(); }
  ctx.restore();
  // HUD
  if (state !== 'title') {
    ctx.fillStyle = 'rgba(10,6,18,.6)'; ctx.fillRect(0, 0, W, 18);
    ctx.font = '9px Silkscreen, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (let i = 0; i < lives; i++) { ctx.fillStyle = '#c8203a'; ctx.fillRect(8 + i * 10, 6, 7, 3); ctx.fillStyle = '#f0c090'; ctx.fillRect(8 + i * 10, 9, 7, 5); }
    ctx.fillStyle = WEAPONS[me.gun].col; ctx.fillText(`${WEAPONS[me.gun].name}${me.gun !== 'P' ? ' ' + me.ammo : ''}`, 70, 9);
    ctx.fillStyle = '#c8d0a0'; ctx.fillText(`● ${me.bombs}`, 190, 9); ctx.fillStyle = '#ffd23d'; ctx.fillText(`HOSTAGES ${freed}`, 240, 9);
    if (me.armor > 0) { ctx.fillStyle = '#5ee7ff'; ctx.fillText('◆ ARMOR'.slice(0, 1).repeat(me.armor) + ' ARMOR', 322, 9); }
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(surv ? `SURVIVAL ${Math.floor(survT)}s · ${kills}` : S && S.run ? `FRONT ${stage + 1}/5${hard ? ' HARD' : ''}` : `STAGE ${stage + 1 + round * NF}`, W - 8, 9);
    const boss = foes.find(e => (e.kind === 'tank' || e.kind === 'colossus') && !e.dead); if (boss) { ctx.fillStyle = OUT; ctx.fillRect(W / 2 - 81, 24, 162, 8); ctx.fillStyle = '#ff4f6d'; ctx.fillRect(W / 2 - 80, 25, 160 * boss.hp / boss.max, 6); }
  }
  if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT * 2); ctx.font = '18px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = OUT; ctx.fillText(msg, W / 2 + 2, 72); ctx.fillStyle = '#ffd23d'; ctx.fillText(msg, W / 2, 70); ctx.globalAlpha = 1; }
}
A.loop(dt => { if (state === 'title') { cam += dt * 30; return; } update(dt); }, render);

/* Attract demo: push right, fire, aim up at gunships, jump crates and bullets, lob a grenade at turrets. */
let botJ = 0;
A.attract({
  start: newGame,
  stop: () => { state = 'title'; foes = []; shots = []; bad = []; nades = []; drops = []; waves = []; },
  bot: dt => {
    if (state !== 'play' || me.dead) return [];
    const keys = ['KeyX'], heli = foes.some(f => (f.kind === 'heli' || f.kind === 'jet') && !f.dead && Math.abs(f.x - me.x) < 60), tank = foes.some(f => (f.kind === 'tank' || f.kind === 'colossus') && !f.dead);
    if (heli) keys.push('ArrowUp'); else if (!tank || me.x < cam + 120) keys.push('ArrowRight');
    const danger = bad.some(b => Math.abs(b.x - me.x) < 70 && Math.sign(b.vx) === Math.sign(me.x - b.x)) || waves.some(wv => Math.abs(wv.x - me.x) < 40 && Math.sign(wv.dir) === Math.sign(me.x - wv.x)), wall = crates.some(c => c.x - me.x > 0 && c.x - me.x < 30);
    if ((danger || wall) && me.ground && (botJ -= dt) <= 0) { botJ = 0.6; keys.push('!Space'); }
    if (foes.some(f => (f.kind === 'turret' || f.kind === 'tank') && !f.dead && Math.abs(f.x - me.x) < 170) && Math.random() < dt * 0.8) keys.push('!KeyC');
    return keys;
  }
});
S = Story({
  title: 'OPERATION IRON DAWN', coin: 'MEDALS', coinColor: '#ffd23d',
  stages: [
    { name: 'Desert Front', sub: 'The brigade lands at dawn. Troopers dug in among the dunes, and a heavy tank on the road.' },
    { name: 'Jungle Front', sub: 'Gunships over the canopy and prisoners tied up in the camps.' },
    { name: 'City Front', sub: 'Street by street through the ruined city. Watch the rooftops.' },
    { name: 'Arctic Front', sub: 'Jetpack troopers drop out of the snow clouds. Keep moving or freeze.' },
    { name: 'Iron Fortress', sub: 'The fortress of General Grimbolt, and the walking gun he calls the Iron Colossus.' }],
  upgrades: [
    { id: 'armor', name: 'Body Armor', desc: 'Shrug off one hit every life.', cost: [70, 170] },
    { id: 'lives', name: 'Extra Life', desc: 'Start with one more life.', cost: [50, 120] },
    { id: 'nades', name: 'Grenade Belt', desc: 'Three more grenades to start.', cost: [30, 70] },
    { id: 'ammo', name: 'Ammo Packs', desc: '40% more ammo in every weapon.', cost: [40, 90] },
    { id: 'kit', name: 'Field Kit', desc: 'Start every front with the heavy gun.', cost: [120] }],

  cast: [['THE SERGEANT', 'ROOK RIVERA'], ['THE GENERAL', 'GRIMBOLT'], ['THE WALKER', 'THE IRON COLOSSUS']],
  play: storyGame,
  stop: () => { state = 'title'; S.run = null; surv = false; foes = []; shots = []; bad = []; nades = []; drops = []; waves = []; }
});
buildStage(); state = 'title';
S.title({ title: 'BLAST BRIGADE', sub: 'Run and gun through five fronts. Free the tied-up hostages for new weapons: H heavy gun, S spread, R rockets. Lob grenades at turrets and the heavy tank at the end of each stage. One hit costs a life.', btn: 'Start', scores: true, onGo: newGame });
