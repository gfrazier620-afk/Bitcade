<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="manifest" href="../../manifest.json">

<link rel="icon" type="image/png" href="../../icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&family=Silkscreen&display=swap">

</head>
<body data-game="sky-shield" data-pad="2:KeyZ 1:KeyC 3:KeyX" style="--game:#ffe14d">
<header class="bar"><a class="back" href="../../">◀ BITCADE</a><h1>SKY SHIELD</h1>
  <div class="sc"><span>SCORE<b id="score">0</b></span><span>BEST<b id="best">0</b></span></div>
  <button class="mute" id="mute">SOUND ON</button></header>
<main class="stage">
  <div class="screen"><canvas id="cv"></canvas><div class="overlay" id="ov"></div></div>
  <p class="help">Aim with the mouse and click to fire · or <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> aim, <kbd>Space</kbd> fire from the nearest base, <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd> pick a base · <kbd>P</kbd> pause · tap to fire on phones</p>
</main>
<script src="../../shared/chip.js"></script>
<script src="../../shared/badges.js"></script>
<script src="../../shared/arcade.js"></script>
<script>
(() => {
const A = Arcade, cv = document.getElementById('cv');
const W = 640, H = 480, GROUND = 440, ctx = A.canvas(cv, W, H);
const BASE_X = [48, 320, 592], CITY_X = [120, 180, 240, 400, 460, 520];
let state = 'title', score = 0, wave = 0, bases = [], cities = [], foes = [], shots = [], blasts = [], toSpawn = 0, spawnT = 0, phaseT = 0, msg = '', msgT = 0, nextCity = 10000;
const cross = { x: W / 2, y: H / 2 };
const mult = () => Math.min(6, 1 + Math.floor((wave - 1) / 2));

function newGame() {
  score = 0; wave = 0; nextCity = 10000; A.setScore(0);
  cities = CITY_X.map(x => ({ x, alive: true })); bases = BASE_X.map(x => ({ x, alive: true, ammo: 10 }));
  nextWave();
}
function nextWave() {
  wave++; if (wave >= 5) A.badge('w5'); foes = []; shots = []; blasts = [];
  bases.forEach(b => { b.alive = true; b.ammo = 10; });
  toSpawn = 10 + wave * 2; spawnT = 1.5; state = 'play'; say(`WAVE ${wave} · ×${mult()} POINTS`);
  A.jingle([392, 523, 659, 784], 0.08);
}
function say(t) { msg = t; msgT = 2; }
function pause() { if (state !== 'play' && state !== 'tally') return; const prev = state; state = 'paused'; A.overlay({ title: 'PAUSED', btn: 'Resume', onGo: () => state = prev }); }

/* firing: from a chosen base, or the nearest one that still has ammo */
function fire(x, y, which) {
  if (state !== 'play') return;
  y = Math.min(y, GROUND - 24);
  let b = which != null ? bases[which] : null;
  if (!b || !b.alive || !b.ammo) b = bases.filter(k => k.alive && k.ammo > 0).sort((p, q) => Math.abs(p.x - x) - Math.abs(q.x - x))[0];
  if (!b) { A.tone(120, 0.05); return; }
  b.ammo--; const sx = b.x, sy = GROUND - 14, d = Math.hypot(x - sx, y - sy);
  shots.push({ sx, sy, x: sx, y: sy, tx: x, ty: y, vx: (x - sx) / d * 560, vy: (y - sy) / d * 560 });
  A.tone(900, 0.08, 'square', 0.03, 0, 1500);
}
A.onPress(c => {
  if (c === 'KeyP' || c === 'Escape') return pause();
  if (c === 'Space') fire(cross.x, cross.y);
  if (c === 'KeyZ') fire(cross.x, cross.y, 0);
  if (c === 'KeyX') fire(cross.x, cross.y, 1);
  if (c === 'KeyC') fire(cross.x, cross.y, 2);
});
A.onHide(pause);
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') Object.assign(cross, A.pointer(cv, e)); });
cv.addEventListener('pointerdown', e => { A.unlock(); const p = A.pointer(cv, e); Object.assign(cross, p); fire(p.x, p.y); });

function targets() { return [...cities.filter(c => c.alive), ...bases.filter(b => b.alive)]; }
/** Fire a missile at a random city or base. Some split into several at splitY (fragments never split again). */
function launch(x, y, fragment) {
  const t = A.pick(targets()) || { x: A.rand(40, W - 40) }, sp = 26 + wave * 5 + A.rand(0, 10), d = Math.hypot(t.x - x, GROUND - y);
  const split = !fragment && wave >= 3 && Math.random() < 0.18 + wave * 0.02;
  foes.push({ ox: x, oy: y, x, y, vx: (t.x - x) / d * sp, vy: (GROUND - y) / d * sp, split, splitY: 140 + A.rnd(100) });
}
function blast(x, y, r, chain) {
  blasts.push({ x, y, t: 0, r, chain, seed: Math.random() * 6 }); A.noise(chain ? 0.2 : 0.35, chain ? 0.04 : 0.06);
  A.ring(x, y, chain ? '#ff8a3d' : '#fff6c2', r * 1.3); A.burst(x, y, { n: chain ? 8 : 14, colors: ['#fff6c2', '#ffe14d', '#ff8a3d'], speed: r * 5, life: 0.5 });
  if (!chain) A.shake(2, 0.12);
}
function hitGround(f) {
  blast(f.x, GROUND - 4, 26, true);
  A.shake(5, 0.3); A.burst(f.x, GROUND - 4, { n: 10, kind: 'debris', colors: ['#6b4a2a', '#3a2a1a', '#ff8a3d'], speed: 220, angle: -Math.PI / 2, spread: 1.8, life: 0.9 });
  A.burst(f.x, GROUND - 6, { n: 5, kind: 'smoke', color: '#4a3a4a', speed: 30, life: 1.4 });
  for (const c of cities) if (c.alive && Math.abs(c.x - f.x) < 22) { c.alive = false; A.tone(90, 0.6, 'sawtooth', 0.06, 0, 40); A.shake(12, 0.5); A.flash('#ff4f6d', 0.2); A.hitstop(0.08); A.burst(c.x, GROUND - 14, { n: 18, kind: 'debris', colors: ['#4f7bff', '#2a3a7a', '#ffe98a'], speed: 260, angle: -Math.PI / 2, spread: 2.2, life: 1 }); }
  for (const b of bases) if (b.alive && Math.abs(b.x - f.x) < 24) { b.alive = false; b.ammo = 0; }
}
function endWave() {
  state = 'tally'; phaseT = 2.6;
  const m = mult(), ammo = bases.reduce((s, b) => s + (b.alive ? b.ammo : 0), 0), alive = cities.filter(c => c.alive).length;
  const bonus = (ammo * 5 + alive * 100) * m; score += bonus;
  if (alive === 6) A.badge('wave');
  let rebuilt = '';
  while (score >= nextCity) { nextCity += 10000; const c = cities.find(k => !k.alive); if (c) { c.alive = true; rebuilt = ' · CITY REBUILT'; A.badge('rebuild'); } }
  A.setScore(score); say(`BONUS +${bonus}${rebuilt}`); A.jingle([523, 659, 784, 1047, 1319], 0.09);
}
function gameOver() {
  state = 'over'; const rec = A.submit(score);
  A.overlay({ title: 'THE END', big: `SCORE ${score} · WAVE ${wave}`, sub: rec ? 'New high score!' : `Best: ${A.best()}`, btn: 'Defend again', onGo: newGame });
}

A.loop(dt => {
  if (msgT > 0) msgT -= dt;
  blasts.forEach(b => b.t += dt); blasts = blasts.filter(b => b.t < 1.2);
  if (state === 'tally') { phaseT -= dt; if (phaseT <= 0) nextWave(); return; }
  if (state === 'falling') { phaseT -= dt; if (phaseT <= 0) gameOver(); return; }
  if (state !== 'play') return;
  const ax = (A.held('ArrowRight', 'KeyD') ? 1 : 0) - (A.held('ArrowLeft', 'KeyA') ? 1 : 0), ay = (A.held('ArrowDown', 'KeyS') ? 1 : 0) - (A.held('ArrowUp', 'KeyW') ? 1 : 0);
  cross.x = A.clamp(cross.x + ax * 380 * dt, 6, W - 6); cross.y = A.clamp(cross.y + ay * 380 * dt, 6, GROUND - 24);
  // spawning
  spawnT -= dt;
  if (toSpawn > 0 && spawnT <= 0) { const n = Math.min(toSpawn, 1 + A.rnd(Math.min(4, 1 + wave / 2))); for (let i = 0; i < n; i++) launch(A.rand(20, W - 20), -4); toSpawn -= n; spawnT = Math.max(0.9, 3.2 - wave * 0.18) * A.rand(0.6, 1.3); }
  // interceptors fly to their mark, then burst
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    if ((s.tx - s.x) * s.vx + (s.ty - s.y) * s.vy <= 0) { s.done = true; blast(s.tx, s.ty, 40, false); }
  }
  shots = shots.filter(s => !s.done);
  // incoming
  for (const f of foes) {
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.split && f.y > f.splitY) { f.dead = true; for (let i = 0; i < 2 + (wave > 6 ? 1 : 0); i++) launch(f.x, f.y, true); continue; }
    for (const b of blasts) {
      const r = blastR(b);
      if (r > 2 && Math.hypot(f.x - b.x, f.y - b.y) < r) { f.dead = true; score += 25 * mult(); blast(f.x, f.y, 20, true); A.pop(f.x, f.y - 14, 25 * mult(), '#ffe14d'); break; }
    }
    if (!f.dead && f.y >= GROUND - 4) { f.dead = true; hitGround(f); }
  }
  foes = foes.filter(f => !f.dead);
  A.setScore(score);
  if (!cities.some(c => c.alive)) { state = 'falling'; phaseT = 2; say('THE LAST CITY FELL'); return; }
  if (!toSpawn && !foes.length && !shots.length && !blasts.some(b => !b.chain && b.t < 0.9)) endWave();
}, t => {
  ctx.drawImage(sky, 0, 0);
  // the aurora drifts
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < 3; i++) {
    const c = ['#3dff8f', '#5ee7ff', '#b48cff'][i];
    ctx.beginPath(); for (let x = -20; x <= W + 20; x += 24) { const y = 90 + i * 26 + Math.sin(x / 110 + t / 2000 + i * 1.7) * 26; x < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.strokeStyle = c; ctx.globalAlpha = 0.07 + Math.sin(t / 1700 + i) * 0.03; ctx.lineWidth = 34; ctx.stroke(); ctx.globalAlpha = 0.12; ctx.lineWidth = 10; ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
  for (let i = 0; i < 5; i++) { const cx = ((i * 157 + t / (60 + i * 15)) % (W + 240)) - 120, cy = 60 + (i * 53) % 150, k = 0.8 + (i % 3) * 0.3;
    ctx.fillStyle = 'rgba(60,40,90,.55)'; for (const [dx, dy, r] of [[0, 0, 20], [22, -7, 24], [46, 0, 18], [20, 6, 20]]) { ctx.beginPath(); ctx.arc(cx + dx * k, cy + dy * k, r * k, 0, 6.29); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,230,200,.10)'; ctx.beginPath(); ctx.arc(cx + 22 * k, cy - 12 * k, 16 * k, 0, 6.29); ctx.fill(); }
  ctx.globalCompositeOperation = 'lighter';
  for (const [i, bx] of BASE_X.entries()) { const a = -Math.PI / 2 + Math.sin(t / (2600 + i * 400) + i * 2) * 0.6, L = 520; ctx.fillStyle = 'rgba(200,220,255,.05)'; ctx.beginPath(); ctx.moveTo(bx, GROUND - 20); ctx.lineTo(bx + Math.cos(a - 0.05) * L, GROUND - 20 + Math.sin(a - 0.05) * L); ctx.lineTo(bx + Math.cos(a + 0.05) * L, GROUND - 20 + Math.sin(a + 0.05) * L); ctx.fill(); }
  for (const b of blasts) { const r = blastR(b); if (r <= 0) continue; const lg = ctx.createRadialGradient(b.x, b.y, r, b.x, b.y, r * 4); lg.addColorStop(0, 'rgba(255,170,90,.18)'); lg.addColorStop(1, 'rgba(255,170,90,0)'); ctx.fillStyle = lg; ctx.fillRect(b.x - r * 4, b.y - r * 4, r * 8, r * 8); }
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(land, 0, 0);
  for (let i = 0; i < 6; i++) { const dir = i % 2 ? 1 : -1, k = ((t / (5200 + i * 700) + i / 6) % 1), cx = dir > 0 ? k * W : W - k * W, cy = GROUND + 17 + (dir > 0 ? 0 : 4); ctx.fillStyle = dir > 0 ? '#fff6c2' : '#ff4f6d'; ctx.fillRect(cx, cy, 3, 2); ctx.fillStyle = dir > 0 ? 'rgba(255,246,194,.25)' : 'rgba(255,79,109,.2)'; ctx.fillRect(cx + (dir > 0 ? 3 : -8), cy, 8, 2); }
  const cs = cities.length ? cities : CITY_X.map(x => ({ x, alive: true })), bs = bases.length ? bases : BASE_X.map(x => ({ x, alive: true, ammo: 10 }));
  cs.forEach(c => drawCity(c, t));
  bs.forEach(b => drawBase(b, t));
  // incoming: a trail that fades back toward where it came from, and a flickering warhead
  for (const f of foes) {
    const g = ctx.createLinearGradient(f.ox, f.oy, f.x, f.y); g.addColorStop(0, 'rgba(255,79,109,0)'); g.addColorStop(1, 'rgba(255,79,109,.9)');
    ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(f.ox, f.oy); ctx.lineTo(f.x, f.y); ctx.stroke();
    const len = Math.hypot(f.x - f.ox, f.y - f.oy); for (let k = 0; k < 6; k++) { const d = ((k * 18 + t / 30) % 110), u = d / Math.max(1, len); if (u > 1) continue; const px = f.x - (f.x - f.ox) * u, py = f.y - (f.y - f.oy) * u; ctx.fillStyle = `rgba(170,150,170,${0.28 * (1 - d / 110)})`; ctx.beginPath(); ctx.arc(px + Math.sin(k + t / 300) * 2, py, 2 + d / 22, 0, 6.29); ctx.fill(); }
    ctx.shadowColor = '#ff4f6d'; ctx.shadowBlur = 12; ctx.fillStyle = Math.floor(t / 60) % 2 ? '#fff' : '#ffd0d8'; ctx.beginPath(); ctx.arc(f.x, f.y, 2.6, 0, 6.29); ctx.fill(); ctx.shadowBlur = 0;
  }
  if (state === 'title') { // attract: a few missiles drifting down
    for (let i = 0; i < 5; i++) { const k = ((t / 6000 + i / 5) % 1), x0 = 80 + i * 120, x1 = CITY_X[i], x = x0 + (x1 - x0) * k, y = GROUND * k;
      const g = ctx.createLinearGradient(x0, 0, x, y); g.addColorStop(0, 'rgba(255,79,109,0)'); g.addColorStop(1, 'rgba(255,79,109,.9)');
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x, y); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 6.29); ctx.fill(); }
  }
  // interceptors: a cyan streak with a bright head, aimed at a pulsing marker
  for (const sh of shots) {
    const g = ctx.createLinearGradient(sh.sx, sh.sy, sh.x, sh.y); g.addColorStop(0, 'rgba(94,231,255,0)'); g.addColorStop(1, 'rgba(94,231,255,.95)');
    ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sh.sx, sh.sy); ctx.lineTo(sh.x, sh.y); ctx.stroke();
    ctx.shadowColor = '#5ee7ff'; ctx.shadowBlur = 10; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sh.x, sh.y, 2.4, 0, 6.29); ctx.fill(); ctx.shadowBlur = 0;
    const m = 4 + Math.sin(t / 60) * 1.5; ctx.strokeStyle = '#5ee7ff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sh.tx - m, sh.ty - m); ctx.lineTo(sh.tx + m, sh.ty + m); ctx.moveTo(sh.tx + m, sh.ty - m); ctx.lineTo(sh.tx - m, sh.ty + m); ctx.stroke();
  }
  blasts.forEach(b => drawBlast(b, t));
  if (state === 'play' || state === 'paused') drawCross(t);
  if (wave) { ctx.font = '13px Silkscreen, monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#0a0612'; ctx.fillText(`WAVE ${wave}  ×${mult()}`, 13, 23); ctx.fillStyle = '#f4effd'; ctx.fillText(`WAVE ${wave}  ×${mult()}`, 12, 22); }
  if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT * 2); ctx.font = '24px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#0a0612'; ctx.fillText(msg, W / 2 + 2, 192); ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = 14; ctx.fillStyle = '#ffe14d'; ctx.fillText(msg, W / 2, 190); ctx.shadowBlur = 0; ctx.globalAlpha = 1; }
});
/* blast radius over its life: grow, hold, shrink */
function blastR(b) { const r = b.r; return b.t < 0.45 ? r * b.t / 0.45 : b.t < 0.75 ? r : b.t < 1.2 ? r * (1 - (b.t - 0.75) / 0.45) : 0; }

/* ---------- art ---------- */
/** Lighten (k > 0) or darken (k < 0) a #rgb / #rrggbb colour. */
function shade(hex, k) {
  let h = hex.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join('');
  const n = parseInt(h, 16), f = c => Math.round(k > 0 ? c + (255 - c) * k : c * (1 + k));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
// the night sky (stars, a moon) and the land (two mountain ranges, rocky ground with a lit horizon), drawn once
const sky = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, GROUND); g.addColorStop(0, '#04020c'); g.addColorStop(0.6, '#140a2a'); g.addColorStop(1, '#3a1638'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 140; i++) { const y = r() * GROUND * 0.8; x.fillStyle = `rgba(255,255,255,${0.2 + r() * 0.7 * (1 - y / GROUND)})`; x.fillRect(r() * W, y, r() < 0.1 ? 2 : 1, r() < 0.1 ? 2 : 1); }
  const mx = 540, my = 70;
  const mg = x.createRadialGradient(mx, my, 10, mx, my, 70); mg.addColorStop(0, 'rgba(255,220,180,.25)'); mg.addColorStop(1, 'rgba(255,220,180,0)'); x.fillStyle = mg; x.fillRect(mx - 70, my - 70, 140, 140);
  const m2 = x.createRadialGradient(mx - 8, my - 8, 4, mx, my, 26); m2.addColorStop(0, '#fff4e0'); m2.addColorStop(1, '#d8b890'); x.fillStyle = m2; x.beginPath(); x.arc(mx, my, 26, 0, 6.29); x.fill();
  x.fillStyle = 'rgba(160,120,90,.35)'; [[-8, -6, 6], [9, 4, 5], [-3, 10, 3], [6, -12, 3]].forEach(([dx, dy, rr]) => { x.beginPath(); x.arc(mx + dx, my + dy, rr, 0, 6.29); x.fill(); });
  return c;
})();
const land = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const ridge = (base, amp, f, col, seed) => { x.fillStyle = col; x.beginPath(); x.moveTo(0, GROUND); for (let i = 0; i <= W; i += 8) x.lineTo(i, base - Math.abs(Math.sin(i * f + seed)) * amp - Math.sin(i * f * 3.1 + seed * 2) * amp * 0.25); x.lineTo(W, GROUND); x.fill(); };
  ridge(GROUND - 40, 70, 0.009, '#1e1034', 1);
  // the metropolis on the horizon: a band of towers with lit windows, hazy with distance
  let q = 21; const rq = () => (q = (q * 16807) % 2147483647) / 2147483647;
  for (let bx = 0; bx < W; ) { const bw = 8 + rq() * 18, bh = 18 + rq() * 54 * (0.5 + 0.5 * Math.sin(bx / 90)), by = GROUND - 22 - bh;
    x.fillStyle = '#1a0e30'; x.fillRect(bx, by, bw, bh + 22); if (rq() < 0.3) { x.fillRect(bx + bw / 2 - 1, by - 10, 2, 10); }
    for (let wy = by + 3; wy < GROUND - 22; wy += 4) for (let wx = bx + 2; wx < bx + bw - 2; wx += 3) if (rq() < 0.3) { x.fillStyle = rq() < 0.8 ? 'rgba(255,220,140,.55)' : 'rgba(94,231,255,.5)'; x.fillRect(wx, wy, 1, 1.5); }
    bx += bw + rq() * 3; }
  const haze = x.createLinearGradient(0, GROUND - 100, 0, GROUND); haze.addColorStop(0, 'rgba(58,22,56,0)'); haze.addColorStop(1, 'rgba(90,40,80,.55)'); x.fillStyle = haze; x.fillRect(0, GROUND - 100, W, 100);
  ridge(GROUND - 14, 36, 0.017, '#140a24', 3);
  const g = x.createLinearGradient(0, GROUND, 0, H); g.addColorStop(0, '#4a3020'); g.addColorStop(1, '#1a0f0a'); x.fillStyle = g; x.fillRect(0, GROUND, W, H - GROUND);
  let s = 5; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 90; i++) { x.fillStyle = r() < 0.5 ? '#2a1a10' : '#6b4a2a'; x.fillRect(r() * W, GROUND + 4 + r() * (H - GROUND - 6), 3 + r() * 4, 2); }
  x.shadowColor = '#ffe14d'; x.shadowBlur = 8; x.fillStyle = '#ffe14d'; x.fillRect(0, GROUND, W, 2); x.shadowBlur = 0;
  x.fillStyle = '#1a1018'; x.fillRect(0, GROUND + 14, W, 10); x.fillStyle = 'rgba(255,225,77,.35)'; for (let i = 0; i < W; i += 22) x.fillRect(i, GROUND + 18, 10, 1.5); // the highway
  return c;
})();
/** A city: a cluster of outlined towers, lit on the left and shaded on the right, with twinkling windows and a red beacon. */
const TOWERS = [[-17, 14, 22], [-5, 11, 32], [5, 13, 24], [-11, 7, 14], [11, 8, 16]];
// each city its own skyline: [dx, width, height, roof] (roof: 0 flat, 1 spire, 2 dome, 3 antenna, 4 stepped)
const SKYLINES = [
  [[-19, 12, 26, 0], [-8, 12, 44, 1], [4, 11, 30, 2], [-14, 7, 16, 0], [13, 8, 20, 3]],
  [[-18, 10, 30, 4], [-7, 14, 38, 3], [7, 12, 26, 0], [-12, 6, 14, 0], [17, 6, 18, 0]],
  [[-17, 13, 20, 2], [-4, 10, 48, 1], [6, 12, 34, 4], [-12, 7, 12, 0], [14, 7, 22, 3]],
